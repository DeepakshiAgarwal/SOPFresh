 CSP / technician assigned.\n5. Technician refused / customer missed slot → confirm slot date has passed; capture reason given by technician / customer's availability in the ticket.\n6. Check Kapture for an existing open Installation Delay ticket – do not create a duplicate; share the existing TAT instead.\n7. If customer wants to cancel → guide cancellation from App (see CS request cancellation).", "queriesHi": ["Booking kiye 3 din ho gaye, abhi tak koi net lagane nahi aaya.", "Aaj ka slot tha, technician aaya hi nahi – ab kab aayega?", "Technician ne confirm kiya tha phir bhi nahi aaya.", "App mein 'technical team will connect' dikh raha hai, 24 ghante se zyada ho gaye.", "Technician aaya aur net lagane se mana karke chala gaya.", "Technician aaya tha par main ghar par nahi tha, dobara bhej do."], "queriesEn": ["It has been 3 days since booking, nobody has come to set up the net yet.", "My slot was today but the technician never came – when will he come?", "The technician confirmed, but still did not come.", "The App shows 'technical team will connect' and it has been more than 24 hours.", "The technician came and refused to do the set-up.", "The technician came but I was not at home, please send him again."], "resolutionPath": "Step 1: Service L2 picks the ticket from Booking Queue. → Step 2: Checks booking stage, slot & CSP details on Wiom Hub. → Step 3: Talks to the CSP – gets reason for delay / refusal and a firm (re)schedule date. → Step 4: Follows up with CSP till the set-up is done (if CSP cannot install, Ask the reason). → Step 5: Updates ticket remarks; closes ticket once set-up is completed (or customer cancels).", "pathLabel": "L2 Resolution Path", "infoRetrieved": ["Wiom Hub – Connection overview: Installation journey stage (Request / Install Pending), Booking date & booking age, Slot date & time, CSP name, Technician details", "Wiom Hub – Customer Info: Customer Name, Mobile Number, Address", "Kapture (CRM) – Ticket creation & old ticket history (check for existing open ticket)", "Ameyo – Call disposition", "Open ticket Comments"], "questions": [], "ameyoDisposition": "• Ticket raised – Connection State REQUESTED / PENDING_INSTALL and booking > 48 hrs (no slot) or slot passed\n→ Disposition: Installation Delay", "kaptureTicket": "Yes\n\nPrimary → Lead → Booking Status → Installation Delay", "pitchScript": "[A] No CSP has accepted the lead yet / one CSP declined and others not responding\nAapki booking hamare system mein aa gayi hai. Is stage mein hum aapke area mein ghar ka net set up karne ki taiyaari kar rahe hain. Kabhi-kabhi area mein availability ki wajah se thoda samay lag sakta hai. Aksar is process mein 2–3 din lag jaate hain. Filhaal aapko kuch karne ki zarurat nahi hai. Koi bhi update aapko app ke through mil jaayega.\n\nSecond response: Agar aap intezaar nahi karna chahte, toh aap app ke through apni booking kabhi bhi cancel kar sakte hain. Aapki poori booking fee refund kar di jaayegi.", "l2Scripts": "CSP call (nudge):\n Namaste sir, main Wiom se ___ baat kar raha/rahi hoon. Aapke paas ek installation lead pending hai – customer ___, address ___. Customer intezaar kar rahe hain. Kripya bataiye aap kab tak technician assign karke set up kar denge?\n Sir, yeh lead aapke paas 6 ghante ke liye hai. Agar 6 ghante mein technician assign nahi hua toh lead aapke yahan se hat jaayegi.\n\n If CSP cannot install:\n Koi baat nahi sir, kripya iska reason bata dijiye aur apne App se yeh lead cancel kar dijiye, taaki koi doosra CSP customer ka set up kar sake."}, {"subCategory": "CX Request Cancellation", "definition": "Customer has changed their mind and wants to cancel the booking (clear exit-intent, NOT because of delay), before the net set-up / slot.", "tagEligible": "• Customer explicitly says they want to cancel – decision changed / don't need the net now\n• Net set-up not yet completed (generally before slot)\n• Customer can cancel at any stage from App – full booking fee refund (even if cancelled 2 hrs after booking)", "tagNonEligible": "", "callType": "Request", "tat": "Immediate (FCR on call)\nRefund credit: 3–5 working days", "fcr": "FCR", "queue": "Booking Queue", "ownership": "Status agent (FCR – closed on call)", "callObjective": "1. Acknowledge – Show empathy for the decision.\n\n2. Understand Reason – Check if the reason is a delay / system issue that can be addressed.\n\n3. Guide – Help customer cancel the booking from the Wiom App on call.\n\n4. Inform Refund – Full booking fee refund in 3–5 working days.\n\n5. Create FCR ticket (resolved on call).", "inboundPitch": "Status - Booking", "troubleshoot": "1. Confirm customer intent is to cancel (not only a delay complaint).\n2. Check on Wiom Hub that set-up is not completed.\n3. Check booking fee amount paid.\n4. Guide customer step-by-step to cancel from the App while on call.\n5. If App cancellation fails / option not visible → tag App Issue.\n6. Inform refund TAT of 3–5 working days.", "queriesHi": ["Mujhe booking cancel karni hai.", "Mujhe ab net nahi lagwana, mera plan change ho gaya hai.", "Technician assign ho gaya hai, phir bhi cancel kar sakta hoon kya?", "Cancel karne par mere paise wapas milenge?"], "queriesEn": ["I want to cancel my booking.", "I don't want the net set-up anymore, my plans have changed.", "A technician has been assigned, can I still cancel?", "Will I get my money back if I cancel?"], "resolutionPath": "Step 1: N/A – FCR. Ticket is created and closed on call by the Status agent; no L2 action required.", "pathLabel": "L2 Resolution Path", "infoRetrieved": ["Wiom Hub – Connection overview: Installation journey stage, Booking date, Slot status", "Wiom Hub – Plan & Billing: Booking fee paid", "Wiom App (customer side) – Booking cancellation option", "Kapture (CRM) – FCR ticket creation & old ticket history", "Ameyo – Call disposition", "Open ticket Comments"], "questions": [], "ameyoDisposition": "• Customer changed mind and wants to cancel (not due to delay) – FCR ticket\n→ Disposition: CX Request cancellation", "kaptureTicket": "Yes – FCR (ticket created & closed on call)\n\nPrimary → Lead → Booking Status → CX Request cancellation", "pitchScript": "[A] Customer wants to cancel\nHumein afsos hai ki aap apni booking cancel karna chahte hain. Aap app ke through apni booking kabhi bhi cancel kar sakte hain. Aapki poori booking fee refund 3-5 din mein process kar diya jaayega.", "l2Scripts": ""}, {"subCategory": "Incomplete Installation", "definition": "Technician visited but did half the work and did not make the service active. Examples:\n• Net box fixed but wire not laid\n• Wire laid but net box not fixed\n• Both net box & wire done but service not activated", "tagEligible": "• Net box fixed, wire not laid\n• Wire laid, net box not fixed\n• Net box & wire both done, but service not active\n• Customer confirms technician left the work incomplete", "tagNonEligible": "", "callType": "Complaint", "tat": "24–48 hrs", "fcr": "Non - FCR", "queue": "Booking Queue", "ownership": "Service L2 (Social Media Escalation team – in-house)", "callObjective": "1. Acknowledge & Apologize for the incomplete set-up.\n\n2. Capture Details – What exactly is pending (net box / wire / activation), visit date & technician.\n\n3. Raise Ticket – Improper installation.\n\n4. Reassure – Share TAT; updates on App.", "inboundPitch": "Status - Booking", "troubleshoot": "1. Ask customer what exactly is pending:\n   – Net box fixed but wire not laid\n   – Wire laid but net box not fixed\n   – Both done but service not active\n2. Check Wiom Hub – stage still Install Pending / service not active.\n3. Check visit date & technician details.\n4. Mention exactly what is pending in the ticket and raise.", "queriesHi": ["Technician aaya tha, net box laga diya par taar nahi lagaya.", "Taar laga ke chala gaya, net box nahi lagaya.", "Net box aur taar dono lag gaye par net chalu nahi kiya.", "Aadha kaam karke chala gaya, bola kal aayega, abhi tak nahi aaya."], "queriesEn": ["The technician came and fixed the net box but did not lay the wire.", "He laid the wire and left without fixing the net box.", "Both the net box and wire are done but the internet was not activated.", "He left the work half done, said he would come tomorrow and has not come yet."], "resolutionPath": "Step 1: Service L2 works LIVE 10 AM – 7 PM (tickets before 10 AM / after 7 PM taken on priority next morning). Pick the ticket from Booking Queue and check Installation Journey on Wiom Hub → Step 2: Call the CSP / technician and find the reason for the partial installation (e.g. no device / net box with technician, lead removed from CSP’s side after visit) → Step 3: Valid reason / system issue (e.g. CSP says lead got removed though he visited): verify on system and coordinate with the internal department to fix it → Step 4a: Get the lead re-assigned to the same CSP to complete the set-up → Step 4b: Ask the CSP to cancel the lead from his App so another CSP / technician can take it → Step 5: Inform the customer: ‘We are arranging another technician; as soon as one is available your net will be started.’ → Step 6: Follow up till set-up is complete / lead is with a new CSP; update remarks and close the ticket", "pathLabel": "L2 Resolution Path", "infoRetrieved": ["Wiom Hub – Connection overview: Installation journey stage (Request / Install Pending), Booking date & booking age, Slot date & time, CSP name, Technician details", "Wiom Hub – Customer Info: Customer Name, Mobile Number, Address", "Kapture (CRM) – Ticket creation & old ticket history (check for existing open ticket)", "Ameyo – Call disposition", "Open ticket Comments"], "questions": [], "ameyoDisposition": "• Technician visited, set-up left incomplete (net box / wire / activation pending)\n→ Disposition: Incomplete Installation", "kaptureTicket": "Yes\n\nPrimary → Lead → Others → Improper installation", "pitchScript": "Humein khed hai ki technician ke aane ke baad bhi aapka ghar ka net set up poora nahi ho paaya. Is asuvidha ke liye hum maafi chahte hain. Maine aapki shikayat darj kar li hai. Hamari team CSP se baat karke 24–48 ghante ke andar aapka set up poora karwayegi. Filhaal aapko kuch karne ki zarurat nahi hai.", "l2Scripts": "CSP / technician call:\n Namaste sir, main Wiom se ___ baat kar raha/rahi hoon. Customer ___ (address ___) ke yahan set up adhoora reh gaya hai – net box / taar / activation pending hai. Kripya bataiye kis wajah se set up poora nahi hua aur aap kab tak ise poora kar denge?\n\n If CSP cannot complete:\n Koi baat nahi sir, kripya apne App se yeh lead cancel kar dijiye taaki koi doosra CSP set up poora kar sake.\n\n Customer update:\n Sir/Ma'am, hum aapke liye doosra technician arrange kare ki koshish kr rahe hai. Jaise hi technician milta hai, aapka ghar ka net set up poora karke chalu kiya jayega."}, {"subCategory": "Refund Related", "definition": "A. Customer wants to cancel the booking because of delay and asks for refund – ticket created & closed on call (FCR).\nB. Customer has cancelled from App but refund not received:\n   – Less than 5 working days → NO ticket, ask to wait.\n   – 5 working days passed, refund not received → ticket (Non-FCR).\nC. Booking cancelled by Wiom system (DEACTIVATED) – refund comes automatically, max 14 days from booking:\n   – System cancelled within 7 days of booking → refund by 7th day from booking\n   – System cancelled after 7 days → refund by 14th day from booking\n   (e.g. cancelled on day 3 → refund by day 7; cancelled on day 10 → refund in next 4 days, by day 14)", "tagEligible": "• Customer wants to cancel because of delay → guide App cancellation, full refund (Ticket – FCR)\n• Customer cancelled from App, 5 working days passed, refund not received → Ticket – Non-FCR\n• System cancelled, refund due date (day 7 / day 14 from booking) passed, refund not received → Ticket – Non-FCR", "tagNonEligible": "", "callType": "Request (A) / Complaint (B)", "tat": "Customer cancelled: 3–5 working days\nSystem cancelled: by day 7 (if cancelled within 7 days) / by day 14 from booking (max)\nTicket (after due date): 24–48 hrs", "fcr": "A – FCR (cancel due to delay)\nB / C – FCR, no ticket (within refund timeline)\nB / C – Non - FCR (refund timeline passed, refund not received)", "queue": "Booking Queue", "ownership": "A – Status agent (FCR)\nB – Service L2 (Social Media Escalation team – in-house)", "callObjective": "1. Acknowledge & Empathize.\n\n2. Identify scenario – wants to cancel due to delay (A) OR already cancelled & refund not received (B).\n\n3. A – Guide App cancellation, inform full refund in 3–5 working days, create FCR ticket.\n\n4. B – Check cancellation date. Less than 5 working days → ask to wait, no ticket. 5 working days passed → collect payment details & raise Non-FCR ticket.\n\n5. Reassure Ownership.", "inboundPitch": "Status - Booking", "troubleshoot": "1. Check Connection State & who cancelled: customer (PENDING_DEACTIVATION / App cancel) or system (DEACTIVATED).\n2. A – wants to cancel now → guide App cancellation; if App cancel fails → App Issue.\n3. B – customer cancelled → count working days from cancellation; < 5 → ask to wait; ≥ 5 → raise ticket.\n4. C – system cancelled → check cancellation day from booking: within 7 days → refund by day 7; after 7 days → refund by day 14. Due date not passed → share timeline; passed → raise ticket.\n5. Before raising ticket → check refund status, collect transaction ID / UTR / screenshot.", "queriesHi": ["Bahut time lag raha hai, booking cancel karke paise wapas karo.", "Maine kal booking cancel ki thi, refund kab aayega?", "Cancel kiye 1 hafta ho gaya, abhi tak paise nahi aaye."], "queriesEn": ["It is taking too long, cancel my booking and refund my money.", "I cancelled my booking yesterday, when will I get the refund?", "It has been a week since I cancelled, I haven't received the money yet."], "resolutionPath": "Step 1: A – N/A (FCR, closed on call by Status agent) → Step 2: B / C – refund not received after timeline: Service L2 picks the ticket from Booking Queue → Step 3: Checks the refund status in the backend payment access (available with L2 team) → Step 4: Fetches the refund reference – UTR / ARN number → Step 5: Shares the UTR / ARN with the call centre so they can inform the customer, OR informs the customer directly → Step 6: Customer is asked to check the credit with their bank using the UTR / ARN; update remarks and close the ticket", "pathLabel": "L2 Resolution Path", "infoRetrieved": ["Wiom Hub – Installation Journey → Connection overview → Connection State:", "REQUESTED – lead circulating among CSPs (ticket allowed)", "PENDING_INSTALL – CSP accepted, set-up pending (ticket allowed)", "ACTIVE – installation completed", "DEACTIVATED – installation could not be completed", "PENDING_DEACTIVATION – cancelled by customer after technician assigned", "Wiom Hub – Booking date, Cancellation date, Booking fee paid, Refund status / transaction", "Kapture (CRM) – Ticket creation & old ticket history", "Ameyo – Call disposition", "Open ticket Comments"], "questions": [], "ameyoDisposition": "• Wants to cancel because of delay – FCR ticket\n→ Disposition: Refund Due to Delay", "kaptureTicket": "Yes – A (FCR, closed on call)\nNo – B / C, within refund timeline\nYes – B / C, refund timeline passed (Non-FCR, open in Booking Queue)\n\nPrimary → Lead → Booking Status → Refund related", "pitchScript": "[A] Wants to cancel because of delay\nSamajh aa raha hai ki delay ki wajah se aap cancel karna chahte hain. Agar aap intezaar nahi karna chahte, toh aap app ke through apni booking kabhi bhi cancel kar sakte hain. Aapki poori booking fee ka refund 3–5 working din mein process kar diya jaayega.\n\n[B1] Cancelled, less than 5 working days (NO ticket)\nAapki booking cancel ho chuki hai. Booking fee ka refund 3–5 working din mein aapke account mein aa jaata hai. Kripya 5 working din tak intezaar karein. Filhaal aapko kuch karne ki zarurat nahi hai.\n\n[B2] Cancelled, 5 working days passed, refund not received (Ticket)\nHumein khed hai ki 5 working din ke baad bhi aapka refund nahi aaya. Maine aapki request darj kar li hai. Hamari team ise check karke 24–48 ghante ke andar aapka Update karegi.", "l2Scripts": "Customer update:\n Sir/Ma'am, aapka booking fee ka refund hamari taraf se process ho chuka hai. Aapka refund reference number (UTR / ARN) ___ hai. Aap is number ke saath apne bank se refund ka status check kar sakte hain."}, {"subCategory": "CSP Misbehaviour", "definition": "Customer complains about the technician who came for the set-up. Ticket is created in 3 scenarios:\n1. Took extra cash – technician asked / took extra money to do the set-up.\n2. Rude behaviour / threats – technician behaved rudely, used wrong / abusive language (Zero Tolerance).\n3. Trying to install non-Wiom connection – technician did not install Wiom and offered his own / personal connection instead.", "tagEligible": "• Technician asked for or took extra money (cash / UPI) for the set-up → Took Extra cash\n• Technician was rude, used wrong / abusive language → Rude Behaviour/threats\n• Technician did not install Wiom and offered his own / personal connection → Try to install non-Wiom Connection\n• Technician refused to install AND misbehaved / asked for extra money", "tagNonEligible": "", "callType": "Complaint", "tat": "24–48 hrs", "fcr": "Non - FCR", "queue": "PX Queue", "ownership": "PFT (CSP Follow-up Team)", "callObjective": "1. Listen carefully & show extra empathy.\n\n2. Capture Details – Date, time, technician name, what exactly happened, amount & mode (cash/UPI) if extra charges.\n\n3. Educate – Wiom has no extra charges; all payments only through Wiom App.\n\n4. Raise Ticket under the correct sub-folder.\n\n5. Reassure – Complaint taken seriously, action within 24–48 hrs.", "inboundPitch": "Status - Booking", "troubleshoot": "1. Listen with patience, confirm the complaint.\n2. Capture date, time, technician / CSP name.\n3. Extra cash – ask amount, mode (cash / UPI) and reason given; collect proof (screenshot / receipt).\n4. Rude / threats – capture exact incident; ensure customer safety.\n5. Non-Wiom connection – capture what the technician offered.\n6. Raise ticket under the correct sub-folder.", "queriesHi": ["Technician net lagane ke liye alag se 500 rupaye maang raha hai.", "Technician ne badtameezi se baat ki, gaali-galoch kiya.", "Technician bol raha hai Wiom chhodo, mera apna connection lagwa lo."], "queriesEn": ["The technician is asking for ₹500/200/100, etc., extra to do the setup.", "The technician spoke rudely and used abusive language.", "The technician is saying leave Wiom and take my own connection instead."], "resolutionPath": "Step 1: Ticket goes to PX Queue → Step 2: PFT team takes action as per the defined tag (Took Extra cash / Rude Behaviour/threats / Try to install non-Wiom Connection), as per PFT team’s SOP", "pathLabel": "L2 Resolution Path", "infoRetrieved": ["Wiom Hub – Connection overview: CSP name, Technician details, Visit / slot date", "Wiom Hub – Customer Info: Customer Name, Mobile Number, Address", "Kapture (CRM) – Ticket creation & old ticket history", "Ameyo – Call disposition", "Open ticket Comments"], "questions": [], "ameyoDisposition": "• Took extra cash / Rude behaviour / Trying to install non-Wiom connection\n→ Disposition: Partner Misbehaviour", "kaptureTicket": "Yes (goes to PX Queue)\n\nPrimary → Existing Customer → Partner Misbehaviour →\n• Took Extra cash\n• Rude Behaviour/threats\n• Try to install non-Wiom Connection", "pitchScript": "[A] Took extra cash\nHumein khed hai ki aapse extra paise maange gaye. Wiom mein net lagane ke liye tay charges ke alawa koi extra paisa nahi liya jaata, aur saare payment sirf Wiom App se hote hain. Kripya technician ko koi extra paisa na dein. Maine aapki shikayat darj kar li hai. Hamari team 24–48 ghante ke andar is par action legi.\n\n[B] Rude behaviour/threats\nHumein bahut khed hai ki aapko aisa anubhav hua. Wiom mein is tarah ka vyavhaar bilkul sweekar nahi hai. Maine aapki shikayat darj kar li hai. Hamari team 24–48 ghante ke andar is par sakht action legi.\n\n[C] Trying to install non-Wiom connection\nHumein yeh batane ke liye dhanyavaad. Wiom ke technician ka kaam sirf Wiom ka ghar ka net lagana hai – aapko kisi aur ka net lene ki zarurat nahi hai. Maine aapki shikayat darj kar li hai. Hamari team 24–48 ghante ke andar is par action legi.", "l2Scripts": ""}, {"subCategory": "Installation Timeline Inquiry", "definition": "Customer needs clarification about the booking process, installation timeline, pricing, recharge options, or other general enquiries that require no further action and can be resolved with an explanation.", "tagEligible": "Customer's installation is not yet due and they are asking about the expected date/time.", "tagNonEligible": "Customer's installation date has already passed without service (route to Installation Delay).", "callType": "Query", "tat": "On-call Resolution", "fcr": "FCR", "queue": "—", "ownership": "Inbound (FCR)", "callObjective": "1. Acknowledge Inquiry - Confirm the customer wants a status update.\n\n2. Share Known Status - Slot, technician assignment and ETA from Wiom Hub, if available.\n\n3. Set Tracking Expectation - Direct the customer to the app for real-time updates.", "inboundPitch": "Status - Booking", "troubleshoot": "1. Check Wiom Hub Booking & Slot details for confirmed slot/technician.\n2. Share available ETA with the customer.", "queriesHi": ["Mera connection kitnay bajay install hoga aaj?", "Installation ki expected date kya hai?", "Mera WiFi chalu hone mein kitna time lagega?", "Booking ke baad engineer kab aayega?", "Same-day installation hota hai kya?", "Weekend mein installation ho sakta hai?", "Installation timing choose kar sakte hain?", "Delay ho gaya toh kya karna hoga?", "Status kya hai mere installation ka?", "Kitne din lagenge?"], "queriesEn": ["When will my connection be installed today?", "Can you tell me the expected installation date?", "How long will it take to activate my WiFi?", "When will the engineer visit after the booking?", "Is same-day installation available?", "Can the installation be done on weekends?", "Can I choose the installation time?", "What should I do if there is a delay?"], "resolutionPath": "Step 1: Acknowledge inquiry → Step 2: Explain: 'Booking ke baad saari updates App par hi dikhti hain' → Step 3: If 'Technical team will connect' status showing: 'Iska matlab hamari team kaam kar rahi hai — exact timing ka nahi bata sakte, App par update aata rahega' → Step 4: Guide customer to check App regularly for next step updates → Step 5: Reassure: 'Is stage par aapko kuch alag karne ki zaroorat nahi'", "infoRetrieved": ["Booking Amount", "Booking Date", "Customer Status (Installed Customer / Active Customer)", "Customer name", "Customer Registered number", "Ping Details (If any)", "Installation Slot", "Booking Status (Installed/Pending/Cancelled),", "Booking Cancelled By, Booking", "Cancellation Date-Time.", "LCO ID/CSP ID , Slot", "Technician Assigned", "Booking Fee Refund Date &time", "Booking Fee amount", "Any open Ticket on Kapture in last 48 hrs", "Connection Status (Installation Journey)", "Current State (Installation Journey)", "Open ticket Comments"], "questions": [], "kaptureTicket": "No – status disposition with no Kapture ticket", "ameyoDisposition": "Installation Timeline Inquiry"}, {"subCategory": "Installation Expediting Request", "definition": "Customer wants faster set-up before the slot date (intent = speed up, not status).", "tagEligible": "Customer explicitly requests that their installation be done sooner than the currently assigned slot.", "tagNonEligible": "Customer is simply asking for the standard installation timeline with no urgency stated (route to Installation Timeline Inquiry).", "callType": "Request", "tat": "On-call Resolution", "fcr": "FCR", "queue": "—", "ownership": "Inbound (FCR)", "callObjective": "1. Acknowledge Urgency & Empathize - Recognize the customer's need.\n\n2. Log the Request - Note the priority request against the booking.\n\n3. Set Honest Expectation - Confirm earliest available slot; avoid overpromising.", "inboundPitch": "Status - Booking", "troubleshoot": "1. Check Wiom Hub for current slot / CSP assignment.\n2. No Kapture ticket – resolve on call (FCR).", "queriesHi": ["Kya aap mera installation jaldi karwa sakte hain?", "Mujhe internet urgent chahiye, kya aaj hi installation ho sakta hai?", "Please mere installation request ko priority dijiye.", "Aaj hi laga do", "Please prioritize my request"], "queriesEn": ["Can you speed up my installation?", "I need the connection urgently. Can someone install it today?", "Please prioritize my installation request."], "resolutionPath": "Step 1: Acknowledge urgency & empathize → Step 2: Check App status → Step 3: Explain: 'Yeh deri Wiom mein note ho gayi hai' → Step 4: If engineer called but missed: 'Wiom App mein engineer ka number dekh sakte hain aur unhe directly call karke status check kar sakte hain' → Step 5: Reassure: 'Is stage par aapko kuch alag karne ki zaroorat nahi hai'", "infoRetrieved": ["Booking Amount", "Booking Date & Time", "Customer Status (Installed Customer / Active Customer/Pending etc)", "Customer name", "Customer Registered number", "Ping Details (If any) = Null", "Booking Status (Installed/Pending/Cancelled),", "Booking Cancelled By", "9 Booking Cancellation Date-Time.", "LCO ID/CSP ID", "Booking Fee Refund Date &time", "Booking Fee amount", "Booking Fee Refund Status", "Any open Ticket on Kapture in last 48 hrs", "Customer Address", "Technician Assigned", "Technician Assignement Date", "Open ticket Comments"], "questions": [], "kaptureTicket": "No – status disposition with no Kapture ticket", "ameyoDisposition": "Installation Expediting Request"}, {"subCategory": "App Issue", "definition": "Customer is unable to complete or schedule a booking because the Wiom app is crashing or showing an error.", "tagEligible": "Customer reports the app crashing, erroring, or freezing specifically while trying to complete/schedule a booking.", "tagNonEligible": "Customer's app issue is unrelated to booking, e.g. general app not opening pre-booking (route to Sales - App Issues).", "callType": "Complaint", "tat": "24 hrs", "fcr": "Non - FCR", "queue": "L2 service team", "ownership": "Service L2 team", "callObjective": "1. Acknowledge & Empathize - Recognize the customer feels stuck mid-booking.\n\n2. Troubleshoot & Capture Details - Guide basic app fixes; collect screenshot if needed.\n\n3. Reassure Ownership - Offer an alternate booking path and log the issue.", "inboundPitch": "Booking Related", "troubleshoot": "1. Ask customer to fully close and reopen the app.\n2. If still blank, Long-press app → App Info → Clear Data & Clear Cache (Android; on iPhone delete the app and reinstall it from App Store).\n3. If issue persists, uninstall and reinstall the app.\n4. If unresolved, request screenshot on 8880322222 and log via Slack Bug Front form.", "queriesHi": ["Main app se booking complete nahi kar pa raha hoon.", "Installation schedule karte waqt app mein error aa raha hai.", "Booking karte time app baar-baar band ho raha hai."], "queriesEn": ["I'm unable to complete the booking on the app.", "The app is showing an error while scheduling installation.", "The application keeps crashing when I try to book."], "resolutionPath": "Step 1: Ask customer what exactly is not visible or not working → Step 2: Guide: 'App ek baar poori tarah band karke dobara khol kar dekhein' → Step 3: If still blank: Long-press Wiom app > App Info > Clear Data & Clear Cache (Android; on iPhone delete the app and reinstall it from App Store) → Step 4: If issue persists: Uninstall and reinstall app → Step 5: If still not resolved: request screenshot on 8880322222, fill Slack Bug Front form → Step 6: CX TL/Supervisor  updates resolution; CC Agent calls customer to close issue", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent", "Any previous whatsapp Ticket with screenshot", "Customer Name", "Booking Details", "Customer Registered number", "Open ticket Comments"], "questions": []}]}], "scriptTabs": [{"name": "Sales", "title": "CATEGORY: Sales", "subtitle": "Pre-sales scripts from the Sales script sheet (12 Oct, version 17 Nov 2026), with the customer question, Ameyo disposition and main points for each.", "items": [{"type": "banner", "text": "COMMON OPENING — applies to every sub-category in this tab"}, {"type": "step", "step": "1. Call Greeting", "subCategory": "", "hindi": "नमस्ते! WIOM में call करने के लिए धन्यवाद। मैं [Name] बात कर रहा/रही हूँ। मैं आपकी क्या सहायता कर सकता/सकती हूँ?\n\n(ग्राहक को पूरी बात बताने दें, बीच-बीच में \"जी\", \"बिल्कुल\", \"मैं समझ रहा/रही हूँ\" से acknowledge करें)", "backend": "—"}, {"type": "step", "step": "2. Understand Requirement", "subCategory": "", "hindi": "\"Customer Name\", बताइए आप WIOM के बारे में क्या जानना चाहेंगे — product, serviceability, pricing या booking process?", "backend": "ग्राहक नया prospect है या मौजूदा WIOM user है, यह Wiom Hub/Kapture में mobile number से check करें।"}, {"type": "banner", "text": "SUB-CATEGORY: Product Explanation"}, {"type": "step", "step": "3. Yeh Recharge- wala ghar ka net kya hai", "subCategory": "What is Wiom / Recharge-wala ghar ka net", "hindi": "Customer: Yeh Recharge- wala ghar ka net kya hai?\n\nWiom ek recharge-wala ghar ka net hai — poora ghar ek hi net se chalta hai: TV, mobile laptop wagehra sab saath-saath. Isse aap jitne din chahiye utne din recharge karke chala sakte hain. 1 din, 7 din, 14 din ya jitna bhi.", "backend": "Disposition: Product Explanation\nSub-category: What is Wiom / Recharge-wala ghar ka net\nMain points:\n- recharge flexibility explained\n- home net for the entire family explained"}, {"type": "step", "step": "4. Yeh mobile recharge jaisa ho gaya hai kya", "subCategory": "What is Wiom / Recharge-wala ghar ka net", "hindi": "Customer: Yeh mobile recharge jaisa ho gaya hai kya?\n\nSir, Wiom mein ghar ka net recharge karne ka tareeka mobile recharge jaisa hai.\nLekin farq yeh hai ki ek hi service se poora ghar chal sakta hai—8-12 mobile, TV aur laptop sab ek saath.\n\nAap jitni zarurat ho utna use kar sakte ho, aur apni convenience ke hisaab se 1 din, 7 din ya 14 din ka recharge choose kar sakte ho.", "backend": "Disposition: Product Explanation\nSub-category: What is Wiom / Recharge-wala ghar ka net\nMain points:\n- comparison to mobile in way of working\n- usage difference explained (home net for everyone)\n- flexibility model explained"}, {"type": "step", "step": "5. How it is different (recharge vs monthly)", "subCategory": "How it is different (recharge vs monthly)", "hindi": "सर, WIOM में घर का नेट recharge करने का तरीका mobile recharge जैसा ही है। लेकिन फ़र्क़ यह है कि एक ही service से पूरा घर चल सकता है — 8 से 12 mobile, TV और laptop सब एक साथ। आप जितनी ज़रूरत हो उतना इस्तेमाल कर सकते हैं, और अपनी सुविधा के हिसाब से 1 दिन, 7 दिन या 14 दिन का recharge चुन सकते हैं।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. Dynamic Recharge plan prices ( pick current plans or offers from backend system)"}, {"type": "banner", "text": "SUB-CATEGORY: Serviceability / Area Check"}, {"type": "step", "step": "6. Area serviceable check", "subCategory": "Area serviceable check", "hindi": "मैं आपकी सहायता करता/करती हूँ यह जानने में कि WIOM आपके पते पर उपलब्ध है या नहीं। कृपया WIOM app Play Store (Android) या App Store (iPhone) से download करें और उसमें अपना पता/location डालें — app तुरंत बता देगा कि service उपलब्ध है या नहीं। अगर उपलब्ध हो, तो आप वहीं से booking भी शुरू कर सकते हैं।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. Servicability check basis - Customer location if customer has already entered details"}, {"type": "step", "step": "7. App mein mera area non-serviceable dikh raha hai, kyun", "subCategory": "Non-serviceable area", "hindi": "Customer: App mein mera area non-serviceable dikh raha hai, kyun?\n\nWiom ka net aapke area mein milta hai ya nahi, yeh app par hi dikh jaata hai.\nAgar abhi dikh raha hai ki Wiom aapke ilake mein uplabdh nahi hai, toh iska matlab hai ki aapke bataye pate par abhi Wiom aaya nahi hai. Jaise hi availability hogi, app mein update dikh jaayega.", "backend": "Disposition: Serviceability / Area Check\nSub-category: Non-serviceable area"}, {"type": "banner", "text": "SUB-CATEGORY: Recharge & Pricing"}, {"type": "step", "step": "8. Purana wala available nahi hai kya", "subCategory": "Recharge Options / Price", "hindi": "Customer: Purana wala available nahi hai kya? Purana wala lagana hai. Purana plan wapas kab aayega?\n\nPehle ka offer abhi nahi hai, Wiom recharge wala ghar ka net hi available hai.\nApp mein jo recharge options dikhte hain, wahi uplabdh options hote hain.", "backend": "Disposition: Recharge & Pricing\nSub-category: Recharge Options / Price"}, {"type": "step", "step": "9. My pamphlet shows a ₹500 monthly plan, so why is the…", "subCategory": "Recharge Options / Price", "hindi": "Customer: My pamphlet shows a ₹500 monthly plan, so why is the recharge amount different now?/Why am I unable to see the 50 Mbps or 100 Mbps recharge option in the app?\n\nPamphlet mein dikhaya gaya pehle ka offer ka ho sakta hai. Filhaal Wiom Recharge wala Ghar Ka Net available hai, aur app mein jo recharge options dikhte hain wahi uplabdh hain. Latest recharge options ki jaankari aapko app mein mil jayegi.", "backend": "Disposition: Recharge & Pricing\nSub-category: Recharge Options / Price"}, {"type": "step", "step": "10. Roz ka recharge matlab kya", "subCategory": "Recharge Duration", "hindi": "Customer: Roz ka recharge matlab kya?\n\nJitne din ka recharge karte hain, utne din ghar ka net chalta hai. Recharge khatam hone par net ruk jaata hai. Dobara recharge karte hi net fir chalu ho jaata hai.", "backend": "Disposition: Recharge & Pricing\nSub-category: Recharge Duration"}, {"type": "step", "step": "11. Mahine ka kitna padega", "subCategory": "Recharge Options / Price", "hindi": "Customer: Mahine ka kitna padega?\n\nWiom mein mahine ka fixed price nahi hota. Aap din ke hisaab se recharge kar sakte ho—jitne din chaho utna. Aap mahine mein 28 din ka istemaal karna chahte ho, toh recharge ₹550 ka padta hai. Baaki options aap App mein dekh sakte ho.", "backend": "Disposition: Recharge & Pricing\nSub-category: Recharge Options / Price\nMain points:\n- flexibility reinforced\n- exact mentioned"}, {"type": "step", "step": "12. Plan kitne ka hai", "subCategory": "Recharge Options / Price", "hindi": "Customer: Plan kitne ka hai?\n\nFixed amount nahi hota — jitne din chahiye utna recharge. Jaise agar aap mahine mein ek din use karte ho toh ₹23, 7 din karte ho toh ₹155, 28 din karte ho toh ₹550. Aur bhi options hai jaise 2 din, 14 din, 56 din aur 84 din - Kya aapko kisi particular recharge ke baare mein aur jaankari chahiye?", "backend": "Disposition: Recharge & Pricing\nSub-category: Recharge Options / Price\nMain points:\n- flexibility reinforced\n- exact mentioned"}, {"type": "step", "step": "13. Booking se pehle recharge dekh sakte hain", "subCategory": "Recharge Options / Price", "hindi": "Customer: Booking se pehle recharge dekh sakte hain?\n\nJi... . Booking amount pay karne se pehle App mein 'Recharge ke vikalp' par recharge options dekh sakte hain.", "backend": "Disposition: Recharge & Pricing\nSub-category: Recharge Options / Price"}, {"type": "step", "step": "14. Monthly fixed plan nahi hai kya", "subCategory": "Recharge Options / Price", "hindi": "Customer: Monthly fixed plan nahi hai kya?\n\nKoi fixed recharge nahi hota. Wiom mein aap jitne din chaho utna recharge choose kar sakte ho. 28 din ka option bhi hota hai jo ₹550 ka padta hai. Baaki saare options app mein mil jaate hain.", "backend": "Disposition: Recharge & Pricing\nSub-category: Recharge Options / Price\nMain points:\n- flexibility reinforced\n- exact mentioned"}, {"type": "banner", "text": "SUB-CATEGORY: Booking Process & Charges"}, {"type": "step", "step": "15. Wiom ka WiFi lagwana tha.. kuch bata sakte hai/ Wiom ka…", "subCategory": "How to book / process?", "hindi": "Customer: Wiom ka WiFi lagwana tha.. kuch bata sakte hai/ Wiom ka WiFi lagwana tha.. kya karna hoga?\n\nBilkul, aapki sahayta ki jayegi.\nWiom ghar ka net hai jisme aap apni zarurat ke hisaab se 1 din, 7 din, 28 din jitna aap chaho utne din ka recharge choose kar sakte ho.\n\nBooking ke liye aap Wiom App Play Store ya App Store se download karke apna location check kar sakte hai aur booking kar sakte hai. Details app mein mil jaayengi.\n\nAgar aap abhi karna chahein, toh main aapki booking mein sahayta kar sakta/sakti hu.", "backend": "Disposition: Booking Process / Charges\nSub-category: How to book / process?\nMain points:\n- Explanation of Wiom\n- App download\n- Offer to help"}, {"type": "step", "step": "16. Abhi decide nahi karna, baad mein dekh lenge", "subCategory": "Deferred", "hindi": "Customer: Abhi decide nahi karna, baad mein dekh lenge?\n\nBilkul.\nAap jab chahein, App par jaakar decide kar sakte hain.", "backend": "Disposition: Booking Process & Charges\nSub-category: Deferred"}, {"type": "step", "step": "17. Mujhe ek aur Wiom connection chahiye", "subCategory": "How to book / process?", "hindi": "Customer: Mujhe ek aur Wiom connection chahiye/Can I book a new connection from same mobile?\n\nAgar aapko ek aur booking karni hai,\ntoh Wiom App download karke ek naya mobile number add karna hoga.\nHar number par ek hi service book hoti hai.", "backend": "Disposition: Booking Process & Charges\nSub-category: How to book / process?"}, {"type": "step", "step": "18. Wiom mein connection kitne ka lagta hai", "subCategory": "Booking fee & Security deposit", "hindi": "Customer: Wiom mein connection kitne ka lagta hai?\n\nWiom ghar ka net shuru karne ke liye shuruaat mein ₹25 tak ka payment karna hota hai. Aapke area aur applicable offer ke hisaab se aage ka payment aur booking process app mein booking ke dauraan dikh jaayega.\n\nNet lagne ke baad aap apni zarurat ke hisaab se jitne din chahein, utne din ka recharge karke net chala sakte hain.\n\nKripya app mein dikh rahi jaankaari ko hi sahi maane.\n\n(Agar customer security deposit ke baare mein poochta hai)\n\nKuch offers mein NetBox ke liye refundable security deposit bhi shamil hoti hai. Agar security deposit applicable hogi, toh service band karne aur NetBox return karne par woh waapas mil jaati hai.", "backend": "Disposition: Booking Process & Charges\nSub-category: Booking fee & Security deposit\nMain points:\n- booking charges\n- security charges\n- refundable\n- then recharge"}, {"type": "step", "step": "19. App download karna zaroori hai", "subCategory": "How to book / process?", "hindi": "Customer: App download karna zaroori hai?\n\nHaan. Recharge wala ghar ka net App ke through hi book aur manage hota hai.\nSaari jankari App mein hi dikhti hai.", "backend": "Disposition: Booking Process & Charges\nSub-category: How to book / process?"}, {"type": "step", "step": "20. Booking fee kyu hai", "subCategory": "Booking fee & Security deposit", "hindi": "Customer: Booking fee kyu hai?\n\nBooking fee isliye hoti hai kyunki ismein engineer ka home visit confirm hota hai. Agar kisi bhi karan se net nahi lag pata toh yeh waapis ki jaati hai.", "backend": "Disposition: Booking Process & Charges\nSub-category: Booking fee & Security deposit"}, {"type": "step", "step": "21. Kya booking fee refundable hai", "subCategory": "Booking fee & Security deposit", "hindi": "Customer: Kya booking fee refundable hai?\n\nHaan, agar kisi bhi wajah se engineer nahi aa paate hai, toh aapki booking fee refund ho jaata hai.", "backend": "Disposition: Booking Process & Charges\nSub-category: Booking fee & Security deposit"}, {"type": "step", "step": "22. Net lagane ke paise hain", "subCategory": "Booking fee & Security deposit", "hindi": "Customer: Net lagane ke paise hain?/Dono alag kyun hain?/250 kyun dene hote hain?/Kab waapis milte hai?/Agar mujhe pasand nahi aaya toh?/Kab milenge? Kaise milenge?/Aaj hi poore 400 dene padenge?\n\nWiom ek recharge-wala ghar ka net hai. Service shuru karne ke liye pehla recharge karna hota hai. Wiom mein alag-alag offers ho sakte hain. Aapke liye jo offer applicable hai, uske hisaab se refundable security deposit aur baaki payment app mein booking ke dauraan dikh jaayenge. Kripya app mein diye gayi jaankaari ko hi sahi maane.\n\n(if customer talks about security deposit)\n\nAgar aapke offer mein ₹250 ki refundable security deposit shamil hogi, toh service band karne aur NetBox return karne par woh poori tarah waapas mil jaati hai.", "backend": "Disposition: Booking Process & Charges\nSub-category: Booking fee & Security deposit\nMain points:\n- first recharge\n- different offers"}, {"type": "step", "step": "23. Cash de sakte hain", "subCategory": "Payment Options", "hindi": "Customer: Cash de sakte hain?\n\nWiom ka net sirf Wiom App se recharge hota hai, cash ka option nahi hota.\nAgar aapke paas UPI ya card nahi hai, toh aap kisi dost, parivaar ke member ya paas ki dukaan se Wiom App ka QR scan karva kar recharge kara sakte hain.", "backend": "Disposition: Booking Process & Charges\nSub-category: Payment Options"}, {"type": "step", "step": "24. Recharge kitne-kitne din ka krwa saktei hai", "subCategory": "Recharge Options / Price", "hindi": "Customer: Recharge kitne-kitne din ka krwa saktei hai\n\nJi, Wiom mein koi fixed recharge nahi hai. Aap apni zarurat ke hisaab se jitne din ka recharge karwana chahein, utne din ka recharge choose kar sakte hain.\n\nHamare Recharge options hain:\n1 din – ₹23\n2 din – ₹45\n7 din – ₹155\n14 din – ₹305\n28 din – ₹550\n56 din - ₹1,050\n84 din - ₹1,480", "backend": "Disposition: Booking Process & Charges"}, {"type": "step", "step": "25. Mismatch Between App & Field Communication", "subCategory": "Booking fee & Security deposit", "hindi": "Wiom ek recharge-wala ghar ka net hai. Service shuru karne ke liye aapko apna pehla recharge karna hota hai aur NetBox ke liye refundable security deposit deni hoti hai\n\nSecurity deposit service band karne aur NetBox return karne par waapas mil jaati hai.\n\nAage ke payment aur set up se judi saari jaankari app mein dikh jaayegi. Kripya app mein diye gayi information ko hi sahi maane - kabhi-kabhi Wiom ke taraf se kuch offers hote hai jo hamaari ground team ko turant pata nahi hote.", "backend": "Disposition: Booking Process & Charges"}, {"type": "banner", "text": "SUB-CATEGORY: Installation Timeline Enquiry"}, {"type": "step", "step": "26. Kitne din mein recharge wala ghar ka net lag jaata hai", "subCategory": "Setup timeline (pre-booking info)", "hindi": "Customer: Kitne din mein recharge wala ghar ka net lag jaata hai?\n\nAam taur par 2-3 din mein net lag jaata hai. Booking ke baad aap App par khud din dekh sakte ho.", "backend": "Disposition: Installation Timeline Enquiry\nSub-category: Setup timeline (pre-booking info)"}, {"type": "step", "step": "27. Booking ke baad kya hai", "subCategory": "Setup timeline (pre-booking info)", "hindi": "Customer: Booking ke baad kya hai?\n\nBooking complete hone ke baad hamare engineer aapke ghar net set up karne aayenge. Net set up hone ke baad aap apni zarurat ke hisaab se jitne din chahein utne din ka recharge karke net chala sakte hain - jaise 1 din, 7 din, 14 din.\n\n(If customer says they can see 14 days free internet)\nJi sir, agar aapko 14 din ka net free mil raha hai, toh yeh Wiom ke taraf se aapke liye offer hai. Aap 14 din net istemaal karne ke baad, jitne din chahe utne ka recharge kar sakte hai.", "backend": "Disposition: Installation Timeline Enquiry\nSub-category: Setup timeline (pre-booking info)"}, {"type": "banner", "text": "SUB-CATEGORY: Other"}, {"type": "step", "step": "28. OTT bundle milega kya", "subCategory": "Misc not in above (iPhone, OTT, old plan)", "hindi": "Customer: OTT bundle milega kya?\n\nNahi, Wiom recharge-wala ghar ka net mein OTT bundle available nahi hai.", "backend": "Disposition: Other\nSub-category: Misc not in above (iPhone, OTT, old plan)"}, {"type": "step", "step": "29. iPhone ke liye app hai kya", "subCategory": "Misc not in above (iPhone, OTT, old plan)", "hindi": "Customer: iPhone ke liye app hai kya?\n\nJi, Wiom recharge-wala ghar ka net iPhone ke liye uplabdh hai. Aap App Store se download kar sakte hai", "backend": "Disposition: Other\nSub-category: Misc not in above (iPhone, OTT, old plan)"}, {"type": "banner", "text": "SUB-CATEGORY: Speed, Range & Devices"}, {"type": "step", "step": "30. Speed kitni aati hai", "subCategory": "Speed", "hindi": "Customer: Speed kitni aati hai?\n\nSpeed aam taur par 80-100 mbps tak aati hai. Yeh poore ghar ke use ke liye bana hai jisme 8-12 mobile, TV, laptop sab saath chalta hai.", "backend": "Disposition: Speed, Range & Devices\nSub-category: Speed\nMain points:\n- exact mentioned\n- home usage reinforced"}, {"type": "step", "step": "31. 50 mbps wala chahiye", "subCategory": "Speed", "hindi": "Customer: 50 mbps wala chahiye\n\nWiom mein recharge days ke hisaab se hota hai, speed ke hisaab se nahi. Aam taur par 80-100 mbps ki speed aati hai.", "backend": "Disposition: Speed, Range & Devices\nSub-category: Speed\nMain points:\n- flexibility mentioned\n- plan denied"}, {"type": "step", "step": "32. Netflix / YouTube / Office ka kaam ho jaayega", "subCategory": "Devices / usage", "hindi": "Customer: Netflix / YouTube / Office ka kaam ho jaayega?\n\nHaan, recharge wala ghar ka net roz ke kaam ke liye banaaya gaya hai —\nvideo dekhna, office ka kaam,\naur ghar ke sab logon ka saath-saath use.", "backend": "Disposition: Speed, Range & Devices\nSub-category: Devices / usage"}, {"type": "step", "step": "33. Poora ghar chalega kya", "subCategory": "Range / Coverage", "hindi": "Customer: Poora ghar chalega kya?\n\nRecharge wala ghar ka net poore ghar ke liye design hota hai — TV, mobile, laptop sab chalte hai.", "backend": "Disposition: Speed, Range & Devices\nSub-category: Range / Coverage"}, {"type": "step", "step": "34. Mujhe kitna range milega", "subCategory": "Range / Coverage", "hindi": "Customer: Mujhe kitna range milega?\n\nRange aapke area aur setup par depend karta hai. Set-up ke time engineer check karke range bata dete hain.", "backend": "Disposition: Speed, Range & Devices\nSub-category: Range / Coverage"}, {"type": "step", "step": "35. Ek saath kitne log chala sakte hain", "subCategory": "Devices / usage", "hindi": "Customer: Ek saath kitne log chala sakte hain?\n\nAam ghar ke liye banaaya gaya hai —\njahan 8–12 mobile, TV aur laptop\nek saath use hote hain.", "backend": "Disposition: Speed, Range & Devices\nSub-category: Devices / usage"}, {"type": "banner", "text": "SUB-CATEGORY: App Issues"}, {"type": "step", "step": "36. App not loading / blank (log page+issue)", "subCategory": "App not loading / blank (log page+issue)", "hindi": "मुझे खेद है कि आपको app में दिक्कत आ रही है। कृपया एक बार app को पूरी तरह बंद करके दोबारा खोलें। अगर फिर भी screen खाली दिख रही है, तो WIOM app को long-press करें → App Info → Clear Data और Clear Cache करें (iPhone पर app को delete करके App Store से दोबारा install करें)। समस्या बनी रहने पर app को uninstall करके दोबारा install करें। अगर login या OTP नहीं आ रहा है, तो कृपया screenshot 8880322222 पर भेज दें।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. Any previous whatsapp Ticket with screenshot \n3. Any ticket raised within 48 hrs on kapture \n4. Customer Name \n5. Customer Registered Mobile"}, {"type": "banner", "text": "SUB-CATEGORY: Booking Interest (Warm Lead)"}, {"type": "step", "step": "37. Wants help to book / interested", "subCategory": "Wants help to book / interested", "hindi": "बहुत अच्छा! मैं आपकी पूरी booking process में मदद करता/करती हूँ। सबसे पहले, app में अपना पता check करते हैं कि service उपलब्ध है या नहीं। अगर उपलब्ध है, तो पहला recharge और (अगर लागू हो तो) refundable security deposit की जानकारी app में booking के दौरान दिख जाएगी — exact amount आपके area के offer पर निर्भर करता है। WIOM app खोलिए, अपना location डालिए और booking कर लीजिए — किसी भी सवाल के लिए मैं यहीं हूँ।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. Customer Name \n3. Customer Registered Mobile"}, {"type": "banner", "text": "Notes in Ameyo (Sales calls)"}, {"type": "step", "step": "Notes in Ameyo — format", "subCategory": "Notes in Ameyo", "hindi": "Interested:\nDate:-\nOn-call conversion:\nNot interested:", "backend": "Interested: Record whether the customer wants to book a connection and is eligible to do so. If the customer’s area is not serviceable, mark this as NO.\n\nDate: Enter the date the customer decided to book the connection.\n\nOn-call conversion: Enter Yes or No. If the question is forbidden or not applicable, enter N/A.\n\nNot interested: If the customer isn’t interested, record their reason. If they don’t share a reason, enter Reason not shared. If the customer is interested, enter N/A."}, {"type": "banner", "text": "COMMON CLOSING — applies to every sub-category in this tab"}, {"type": "step", "step": "Offer Further Help", "subCategory": "", "hindi": "क्या मैं आपकी और कोई सहायता कर सकता/सकती हूँ, \"Customer Name\"?", "backend": "—"}, {"type": "step", "step": "Call Closure", "subCategory": "", "hindi": "आपका feedback हमारे लिए बहुत महत्वपूर्ण है। इसके लिए मैं आपकी call IVR पर transfer कर रहा/रही हूँ। कृपया 1 से 5 के बीच rating दें, जिसमें 5 सबसे बेहतर है। WIOM को call करने के लिए धन्यवाद। आपका दिन शुभ हो।", "backend": "—"}]}, {"name": "Status - Booking", "title": "CATEGORY: Status/Booking", "subtitle": "Booking and status scripts from the Status Queue script sheet (7 Oct, after the refund rule change) and the Status to L2 Installation SOP.", "items": [{"type": "banner", "text": "COMMON OPENING — applies to every sub-category in this tab"}, {"type": "step", "step": "1. Call Greeting", "subCategory": "", "hindi": "नमस्कार, call करने के लिए धन्यवाद। WIOM से मैं [Name] बात कर रहा/रही हूँ। मैं आपकी कैसे सहायता कर सकता/सकती हूँ?\n\n(customer को पूरी समस्या बताने दें, समय-समय पर \"जी\", \"ठीक है\", \"मैं समझ रहा/रही हूँ\" से acknowledge करें)", "backend": "—"}, {"type": "step", "step": "2. Apology & Acknowledgement", "subCategory": "", "hindi": "आपको हुई असुविधा के लिए हमें खेद है। मैं आपकी समस्या को पूरी तरह से हल कराने में आपकी पूरी मदद करूँगा/करूँगी।", "backend": "—"}, {"type": "step", "step": "3. Booking Verification", "subCategory": "", "hindi": "मैं आपकी booking details check कर रहा/रही हूँ। क्या आप कृपया अपना registered mobile number  बता सकते हैं?", "backend": "Wiom Hub में mobile number से booking details search करें।"}, {"type": "banner", "text": "SUB-CATEGORY: Installation Delay"}, {"type": "step", "step": "4. No CSP has accepted the lead yet / One CSP declined and subsequent CSPs are not responding", "subCategory": "Installation Delay", "hindi": "Aapki booking hamare system mein aa gayi hai. Is stage mein hum aapke area mein ghar ka net set up karne ki taiyaari kar rahe hain. Kabhi-kabhi area mein availability ki wajah se thoda samay lag sakta hai. Aksar is process mein 24–48 ghante lag jaate hain. Filhaal aapko kuch karne ki zarurat nahi hai. Koi bhi update aapko app ke through mil jaayega.\n\nSecond response: Agar aap intezaar nahi karna chahte, toh aap app ke through apni booking kabhi bhi cancel kar sakte hain. Aapki poori booking fee refund kar di jaayegi.", "backend": "Disposition: Installation Delay\nTicket only if Connection State is REQUESTED / PENDING_INSTALL and booking > 48 hrs (no slot) or slot passed\nCheck Kapture for an existing open Installation Delay ticket – do not create a duplicate; share the existing TAT"}, {"type": "step", "step": "5. Failure (Slot Breach) – Slot confirmed but installation didn't happen / Technician refused", "subCategory": "Installation Delay", "hindi": "Humein khed hai ki aapke liye jo visit schedule ki gayi thi, us din ghar ka net set up complete nahi ho paaya. Is asuvidha ke liye hum maafi chahte hain. Hum aapke liye dobara visit arrange kar rahe hain. Aksar is process mein 12–24 ghante lag jaate hain. Filhaal aapko kuch karne ki zarurat nahi hai. Naye slot ki jaankaari aapko app mein mil jaayegi. Agar aap intezaar nahi karna chahte, toh aap app ke through apni booking kabhi bhi cancel kar sakte hain. Aapki poori booking fee refund kar di jaayegi.", "backend": "Disposition: Installation Delay\nTicket only if Connection State is REQUESTED / PENDING_INSTALL and booking > 48 hrs (no slot) or slot passed\nCheck Kapture for an existing open Installation Delay ticket – do not create a duplicate; share the existing TAT"}, {"type": "step", "step": "6. Failure – Technician confirmed but is not picking up / reaching out", "subCategory": "Installation Delay", "hindi": "Humein khed hai ki technician abhi tak aapse sampark nahi kar paaye hain. Ho sakta hai ki woh is samay kisi aur set up mein vyast hon. Aam taur par technician din ke ant tak aapse sampark kar lete hain. Agar aapke slot se pehle technician aapse contact na karein, toh kripya humein batayein. Hum aapki sahayta karenge.\n\nSecond response: Agar aap intezaar nahi karna chahte, toh aap app ke through apni booking kabhi bhi cancel kar sakte hain. Aapki poori booking fee refund kar di jaayegi.", "backend": "—"}, {"type": "step", "step": "7. Failure (Slot Breach) – Technician confirmed but did not arrive", "subCategory": "Installation Delay", "hindi": "Humein khed hai ki technician ke confirm karne ke baad bhi ghar ka net set up nahi ho paaya. Is asuvidha ke liye hum maafi chahte hain. Hum aapke liye dobara visit arrange kar rahe hain. Aksar is process mein 12–24 ghante lag jaate hain. Filhaal aapko kuch karne ki zarurat nahi hai. Is dauraan ke updates aapko app ke through mil jaayenge. Agar aap intezaar nahi karna chahte, toh aap app ke through apni booking kabhi bhi cancel kar sakte hain. Aapki poori booking fee refund kar di jaayegi.", "backend": "Disposition: Installation Delay\nTicket only if Connection State is REQUESTED / PENDING_INSTALL and booking > 48 hrs (no slot) or slot passed\nCheck Kapture for an existing open Installation Delay ticket – do not create a duplicate; share the existing TAT"}, {"type": "step", "step": "8. Repeated delays and booking age >48 hours (no active slot)", "subCategory": "Installation Delay", "hindi": "Humein khed hai ki aapko itna intezaar karna pada. Hum samajhte hain ki yeh woh anubhav nahi hai jiski aapne ummeed ki thi. Kuch kaaranon ki wajah se humein aapke area mein ghar ka net set up karne mein ummeed se zyada samay lag raha hai. Hum poori koshish kar rahe hain ki agle 1–2 dinon ke andar aapka set up ho jaaye. Agar aap aur intezaar nahi karna chahte, toh aap app ke through apni booking cancel kar sakte hain. Aapki poori booking fee refund kar di jaayegi.", "backend": "Disposition: Installation Delay\nTicket only if Connection State is REQUESTED / PENDING_INSTALL and booking > 48 hrs (no slot) or slot passed\nCheck Kapture for an existing open Installation Delay ticket – do not create a duplicate; share the existing TAT"}, {"type": "step", "step": "9. Technician visited but I wasn't there (slot breached)", "subCategory": "Installation Delay", "hindi": "Koi baat nahi. Agar technician ke aane ke samay aap ghar par nahi the, toh hum aapke liye dobara visit arrange kar rahe hain. Aksar is process mein 12–24 ghante lag jaate hain. Filhaal aapko kuch karne ki zarurat nahi hai. Naye slot ki jaankaari aapko app mein mil jaayegi.\n\nSecond response: Agar aap booking continue nahi karna chahte, toh aap app ke through ise kabhi bhi cancel kar sakte hain. Aapki poori booking fee refund kar di jaayegi.", "backend": "Disposition: Installation Delay\nTicket only if Connection State is REQUESTED / PENDING_INSTALL and booking > 48 hrs (no slot) or slot passed\nCheck Kapture for an existing open Installation Delay ticket – do not create a duplicate; share the existing TAT"}, {"type": "step", "step": "10. Missed technician phone", "subCategory": "Installation Delay", "hindi": "Agar technician ka call miss ho gaya hai, toh chinta ki baat nahi hai. Aap app mein technician ka number dekhkar unhe ek baar wapas call karne ki koshish karein. Aam taur par technician dobara bhi sampark karte hain. Kripya apna phone paas rakhein aur anjaan number se aane wali calls ka bhi jawab dein. Agar din ke ant tak technician ka call ya message na aaye, toh kripya humein batayein. Hum aapki sahayta karenge.", "backend": "—"}, {"type": "banner", "text": "SUB-CATEGORY: CX Request Cancellation"}, {"type": "step", "step": "11. Customer wants to cancel (<48 hours, booking fee <₹100)", "subCategory": "CX Request Cancellation", "hindi": "Humein afsos hai ki aap apni booking cancel karna chahte hain. Aap app ke through apni booking kabhi bhi cancel kar sakte hain. Aapki poori booking fee refund kar di jaayegi.", "backend": "Disposition: CX Request cancellation\nFCR ticket – created and closed on call\nGuide the customer to cancel from the App"}, {"type": "step", "step": "12. Customer wants to cancel, has active slot confirmed/tech assigned", "subCategory": "CX Request Cancellation", "hindi": "Humein afsos hai ki aap apni booking cancel karna chahte hain. Aap app ke through apni booking kabhi bhi cancel kar sakte hain. Aapki poori booking fee refund kar di jaayegi.", "backend": "Disposition: CX Request cancellation\nFCR ticket – created and closed on call\nGuide the customer to cancel from the App"}, {"type": "step", "step": "13. Customer wants to cancel (booking fee >₹100; refund allowed if slot not confirmed)", "subCategory": "CX Request Cancellation", "hindi": "Humein afsos hai ki aap apni booking cancel karna chahte hain. Aap app ke through apni booking kabhi bhi cancel kar sakte hain. Aapki poori booking fee refund 3-5 din mein process kar diya jaayega.", "backend": "Disposition: CX Request cancellation\nFCR ticket – created and closed on call\nGuide the customer to cancel from the App"}, {"type": "banner", "text": "SUB-CATEGORY: Incomplete Installation"}, {"type": "step", "step": "14. Incomplete installation", "subCategory": "Incomplete Installation", "hindi": "Humein khed hai ki technician ke aane ke baad bhi aapka ghar ka net set up poora nahi ho paaya. Is asuvidha ke liye hum maafi chahte hain. Maine aapki shikayat darj kar li hai. Hamari team CSP se baat karke 24–48 ghante ke andar aapka set up poora karwayegi. Filhaal aapko kuch karne ki zarurat nahi hai.", "backend": "Disposition: Incomplete Installation\nNon-FCR ticket in Booking Queue\nMention exactly what is pending (net box / wire / activation)"}, {"type": "banner", "text": "SUB-CATEGORY: Refund Related"}, {"type": "step", "step": "15. A. Wants to cancel because of delay", "subCategory": "Refund Related", "hindi": "Samajh aa raha hai ki delay ki wajah se aap cancel karna chahte hain. Agar aap intezaar nahi karna chahte, toh aap app ke through apni booking kabhi bhi cancel kar sakte hain. Aapki poori booking fee ka refund 3–5 working din mein process kar diya jaayega.", "backend": "Disposition: Refund Due to Delay\nFCR ticket"}, {"type": "step", "step": "16. B1. Cancelled, less than 5 working days (no ticket)", "subCategory": "Refund Related", "hindi": "Aapki booking cancel ho chuki hai. Booking fee ka refund 3–5 working din mein aapke account mein aa jaata hai. Kripya 5 working din tak intezaar karein. Filhaal aapko kuch karne ki zarurat nahi hai.", "backend": "No ticket – ask the customer to wait"}, {"type": "step", "step": "17. B2. Cancelled, 5 working days passed, refund not received", "subCategory": "Refund Related", "hindi": "Humein khed hai ki 5 working din ke baad bhi aapka refund nahi aaya. Maine aapki request darj kar li hai. Hamari team ise check karke 24–48 ghante ke andar aapka Update karegi.", "backend": "Non-FCR ticket in Booking Queue\nBefore raising: check refund status, collect transaction ID / UTR / screenshot"}, {"type": "banner", "text": "SUB-CATEGORY: CSP Misbehaviour"}, {"type": "step", "step": "18. A. Took extra cash", "subCategory": "CSP Misbehaviour", "hindi": "Humein khed hai ki aapse extra paise maange gaye. Wiom mein net lagane ke liye tay charges ke alawa koi extra paisa nahi liya jaata, aur saare payment sirf Wiom App se hote hain. Kripya technician ko koi extra paisa na dein. Maine aapki shikayat darj kar li hai. Hamari team 24–48 ghante ke andar is par action legi.", "backend": "Disposition: Partner Misbehaviour\nKapture: Primary → Existing Customer → Partner Misbehaviour → Took Extra cash\nPX Queue"}, {"type": "step", "step": "19. B. Rude behaviour / threats", "subCategory": "CSP Misbehaviour", "hindi": "Humein bahut khed hai ki aapko aisa anubhav hua. Wiom mein is tarah ka vyavhaar bilkul sweekar nahi hai. Maine aapki shikayat darj kar li hai. Hamari team 24–48 ghante ke andar is par sakht action legi.", "backend": "Disposition: Partner Misbehaviour\nKapture: Primary → Existing Customer → Partner Misbehaviour → Rude Behaviour/threats\nPX Queue"}, {"type": "step", "step": "20. C. Trying to install non-Wiom connection", "subCategory": "CSP Misbehaviour", "hindi": "Humein yeh batane ke liye dhanyavaad. Wiom ke technician ka kaam sirf Wiom ka ghar ka net lagana hai – aapko kisi aur ka net lene ki zarurat nahi hai. Maine aapki shikayat darj kar li hai. Hamari team 24–48 ghante ke andar is par action legi.", "backend": "Disposition: Partner Misbehaviour\nKapture: Primary → Existing Customer → Partner Misbehaviour → Try to install non-Wiom Connection\nPX Queue"}, {"type": "banner", "text": "SUB-CATEGORY: Installation Timeline Inquiry / Expediting Request (no Kapture ticket)"}, {"type": "step", "step": "21. Installation Timeline Inquiry", "subCategory": "Installation Timeline Inquiry", "hindi": "Booking के बाद installation की सारी updates आपको WIOM app पर ही मिलती रहेंगी। अगर status में \"Technical team will connect\" दिख रहा है, तो इसका मतलब है हमारी team इस पर काम कर रही है — exact timing नहीं बता सकता/सकती, लेकिन app पर update आता रहेगा।", "backend": "1- Booking Amount \n2. Booking Date \n3- Customer Status (Installed Customer / Active Customer)\n4. Customer name\n5. Customer Registered number \n6. Ping Details (If any) \n7. Installation Slot \n8. Booking Status (Installed/Pending/Cancelled), \n9. Booking Cancelled By, Booking \n10. Cancellation Date-Time.\n11. LCO ID/CSP ID , Slot \n12. Technician Assigned \n13. Booking Fee Refund Date &time \n14. Booking Fee amount\n15. Any open Ticket on Kapture in last 48 hrs  \n16. Connection Status (Installation Journey) \n17. Current State (Installation Journey)"}, {"type": "step", "step": "22. Installation Expediting Request", "subCategory": "Installation Expediting Request", "hindi": "आपकी urgency समझ आ रही है। अगर WIOM app में engineer का number दिख रहा है, तो आप उन्हें सीधे call करके status पूछ भी सकते हैं। मैं आपकी priority request log कर रहा/रही हूँ, आपको app पर अगला update मिल जाएगा।", "backend": "1- Booking Amount \n2. Booking Date & Time \n3- Customer Status (Installed Customer / Active Customer/Pending etc)\n4. Customer name\n5. Customer Registered number \n6. Ping Details (If any) = Null \n7. Booking Status (Installed/Pending/Cancelled), \n8. Booking Cancelled By\n9 Booking Cancellation Date-Time.\n11. LCO ID/CSP ID \n12. Booking Fee Refund Date &time \n13. Booking Fee amount\n14. Booking Fee Refund Status \n15. Any open Ticket on Kapture in last 48 hrs\n16.Customer Address \n17. Technician Assigned \n28. Technician Assignement Date"}, {"type": "banner", "text": "SUB-CATEGORY: App Issue"}, {"type": "step", "step": "23. App Issue", "subCategory": "App Issue", "hindi": "मुझे खेद है कि booking करते समय आपको app में दिक्कत आ रही है। कृपया एक बार app को पूरी तरह बंद करके दोबारा खोलें। अगर फिर भी error आ रहा है, तो WIOM app को long-press करें → App Info → Clear Data और Clear Cache करें (iPhone पर app को delete करके App Store से दोबारा install करें)। समस्या बनी रहने पर screenshot 8880322222 पर भेज दें।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. Any previous whatsapp Ticket with screenshot \n3. Customer Name \n4. Booking Details \n5. Customer Registered number"}, {"type": "banner", "text": "L2 Scripts — Service L2 (calls to CSP / technician and customer updates)"}, {"type": "step", "step": "L2. CSP call (nudge) — Installation Delay", "subCategory": "Installation Delay", "hindi": "CSP call (nudge):\n Namaste sir, main Wiom se ___ baat kar raha/rahi hoon. Aapke paas ek installation lead pending hai – customer ___, address ___. Customer intezaar kar rahe hain. Kripya bataiye aap kab tak technician assign karke set up kar denge?\n Sir, yeh lead aapke paas 6 ghante ke liye hai. Agar 6 ghante mein technician assign nahi hua toh lead aapke yahan se hat jaayegi.\n\n If CSP cannot install:\n Koi baat nahi sir, kripya iska reason bata dijiye aur apne App se yeh lead cancel kar dijiye, taaki koi doosra CSP customer ka set up kar sake.", "backend": "Service L2"}, {"type": "step", "step": "L2. CSP / technician call — Incomplete Installation", "subCategory": "Incomplete Installation", "hindi": "CSP / technician call:\n Namaste sir, main Wiom se ___ baat kar raha/rahi hoon. Customer ___ (address ___) ke yahan set up adhoora reh gaya hai – net box / taar / activation pending hai. Kripya bataiye kis wajah se set up poora nahi hua aur aap kab tak ise poora kar denge?\n\n If CSP cannot complete:\n Koi baat nahi sir, kripya apne App se yeh lead cancel kar dijiye taaki koi doosra CSP set up poora kar sake.\n\n Customer update:\n Sir/Ma'am, hum aapke liye doosra technician arrange kare ki koshish kr rahe hai. Jaise hi technician milta hai, aapka ghar ka net set up poora karke chalu kiya jayega.", "backend": "Service L2"}, {"type": "step", "step": "L2. Customer update — Refund", "subCategory": "Refund Related", "hindi": "Customer update:\n Sir/Ma'am, aapka booking fee ka refund hamari taraf se process ho chuka hai. Aapka refund reference number (UTR / ARN) ___ hai. Aap is number ke saath apne bank se refund ka status check kar sakte hain.", "backend": "Service L2"}, {"type": "banner", "text": "COMMON CLOSING — applies to every sub-category in this tab"}, {"type": "step", "step": "Offer Further Help", "subCategory": "", "hindi": "क्या मैं आपकी और कोई सहायता कर सकता/सकती हूँ, \"Customer Name\"?", "backend": "—"}, {"type": "step", "step": "Call Closure", "subCategory": "", "hindi": "आपका feedback हमारे लिए बहुत महत्वपूर्ण है। इसके लिए मैं आपकी call IVR पर transfer कर रहा/रही हूँ। कृपया 1 से 5 के बीच rating दें, जिसमें 5 सबसे बेहतर है। WIOM को call करने के लिए धन्यवाद। आपका दिन शुभ हो।", "backend": "—"}]}, {"name": "Internet Issues", "title": "CATEGORY: Internet Issues", "subtitle": "Covers all connectivity/quality complaints. Ask what the customer is experiencing first, then route to the matching sub-category below. Mandatory: whenever you create a ticket in Kapture for any Internet Issues sub-category, mention the Ping delay in the ticket notes.", "items": [{"type": "banner", "text": "COMMON OPENING — applies to every sub-category in this tab"}, {"type": "step", "step": "1. Call Greeting", "subCategory": "", "hindi": "नमस्कार, call करने के लिए धन्यवाद। WIOM से मैं [Name] बात कर रहा/रही हूँ। मैं आपकी कैसे सहायता कर सकता/सकती हूँ?\n\n(customer को पूरी समस्या बताने दें, समय-समय पर \"जी\", \"ठीक है\", \"मैं समझ रहा/रही हूँ\" से acknowledge करें)", "backend": "—"}, {"type": "step", "step": "2. Apology & Acknowledgement", "subCategory": "", "hindi": "आपको हुई असुविधा के लिए humein khed hai। मैं आपकी समस्या को पूरी तरह से हल कराने में आपकी मदद करूँगा/करूँगी।", "backend": "—"}, {"type": "step", "step": "3. Customer Verification (Registered)", "subCategory": "", "hindi": "मैं आपके details check कर रहा/रही हूँ। मैं देख पा रहा/रही हूँ कि यह Recharge Wala Ghar Ka Net \"Customer Name\" के नाम पर registered है। क्या मैं उन्हीं से बात कर रहा/रही हूँ?", "backend": "Agent Wiom Hub में registered number या device ID से ग्राहक विवरण check करेगा।\nपहले Kapture में open ticket check करें — same issue का ticket हो तो उस sub-category की \"Repeat Call\" script follow करें (troubleshooting दोबारा नहीं)"}, {"type": "step", "step": "3.1 Customer Verification (Not Registered)", "subCategory": "", "hindi": "आप जिस number से call कर रहे हैं, उससे मैं details check नहीं कर पा रहा/रही हूँ। क्या आप कृपया अपना registered number या device ID बता सकते हैं?", "backend": "—"}, {"type": "step", "step": "3.1.1 Verification After Details Received", "subCategory": "", "hindi": "जानकारी देने के लिए धन्यवाद। मैं आपके Ghar Ka Net की जानकारी check कर रहा/रही हूँ। यह Recharge Wala Ghar Ka Net \"Customer Name\" के नाम पर registered है। क्या मैं \"Customer Name\" से ही बात कर रहा/रही हूँ?\n\n(Female → First Name + जी, Male → Last Name + जी)", "backend": "Wiom Hub में details check करना।"}, {"type": "banner", "text": "SUB-CATEGORY: Internet Supply Down"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Internet Supply Down", "hindi": "मैं समझ सकता/सकती हूँ \"[Customer Name]\" कि आपका नेट काम नहीं कर रहा है।", "backend": "Ping delay check करें + Recharge validity देखें\nTicket के top title में outage ticket दिखे तो troubleshooting न करें — Outage script (step 10) follow करें"}, {"type": "step", "step": "5. Troubleshooting Intro", "subCategory": "Internet Supply Down", "hindi": "क्या मैं आपसे कुछ जानकारी ले सकता/सकती हूँ?", "backend": "Troubleshooting शुरू करें"}, {"type": "step", "step": "5.1 Restart Check", "subCategory": "Internet Supply Down", "hindi": "क्या आपने Net Box को restart किया है?\n\nIf No: कोई बात नहीं। कृपया Net Box को power switch से बंद करें और 30 seconds बाद चालू करें। मैं call पर ही बना/बनी हुई हूँ।", "backend": "—"}, {"type": "step", "step": "5.2 Device Type Check (If Required)", "subCategory": "Internet Supply Down", "hindi": "क्या आपके घर पर एक Net Box है या दो Net Box लगे हैं?", "backend": "—"}, {"type": "step", "step": "5.3 Router Light Check", "subCategory": "Internet Supply Down", "hindi": "क्या आपके Net Box में लाल light जल रही है?", "backend": "—"}, {"type": "step", "step": "5.4 CRM Additional Information (Mandatory before Ticket Creation)", "subCategory": "Internet Supply Down", "hindi": "Ticket create करने से पहले Kapture में यह जानकारी confirm करें (Internet Supply Down Additional Information):\n• Net box pe red light on hai kya? *\n• Netbox restart kiya? *", "backend": "Kapture ticket form → \"Internet Supply Down Additional Information\" के तीनों mandatory (*) dropdown fields भरें, तभी ticket save होगा।"}, {"type": "step", "step": "6. If Internet NOT Working After Restart", "subCategory": "Internet Supply Down", "hindi": "आपके सहयोग के लिए धन्यवाद। Hum ne आपकी शिकायत दर्ज कर lee hai।\n\nकृपया हमें 24 घंटे तक का समय दें। सामान्यतः हमारी team 24 घंटे में समस्या का समाधान कर देती है।\n\nअगर आप समाधान से संतुष्ट नहीं हैं तो apne Wiom App se ticket को reopen कर सकते हैं।", "backend": "Kapture में Ticket Create करें (Open रखें) — TAT: 24 घंटे\nKapture ticket notes में Ping delay mention करना mandatory है।"}, {"type": "step", "step": "7. If Internet Works After Restart (On-Call Resolve)", "subCategory": "Internet Supply Down", "hindi": "जानकारी के लिए धन्यवाद।\n\nक्या मैं आपकी ticket On-Call Resolve कर दूँ?", "backend": "Kapture में \"On Call Resolve\" + Ameyo portal update"}, {"type": "step", "step": "8. Downtime Compensation (if customer asks)", "subCategory": "Internet Supply Down", "hindi": "(समस्या ठीक हो चुकी है) \"Customer Name\", आपको हुई असुविधा के लिए मैं क्षमा चाहता/चाहती हूँ। आपका net (outage duration) तक बंद रहा था, और इस downtime के बदले आपकी recharge validity बढ़ा दी गई है। आपकी नई expiry date और time (new expiry date & time) है। यह details आपको WIOM app पर भी भेजी गई हैं।\n\n(समस्या अभी चल रही है) \"Customer Name\", हमारी team आपकी समस्या पर काम कर रही है। समस्या पूरी तरह ठीक होने के बाद downtime के बदले compensation दिया जाएगा।", "backend": "Wiom Hub › Plan & Billing में extension details check करें\nCustomer Chat में भेजा गया message देखें\nTicket notes update करें"}, {"type": "step", "step": "9. Repeat Call — Ticket Already Exists", "subCategory": "Internet Supply Down", "hindi": "(Ticket TAT के अंदर है) \"Customer Name\", मैं देख पा रहा/रही हूँ कि आपकी इस समस्या का ticket पहले से बना हुआ है। हमारी team इस पर काम कर रही है, कृपया (remaining TAT) तक का समय दें।\n\n(TAT cross हो चुका है) \"Customer Name\", हमें खेद है कि दिए गए समय में आपकी समस्या हल नहीं हो पाई। हमारी team इस पर काम कर रही है। मैं इसे priority पर हमारी team के पास भेज रहा/रही हूँ।\n\n(Compensation) समस्या पूरी तरह ठीक होने के बाद downtime के बदले compensation दिया जाएगा।", "backend": "Troubleshooting दोबारा न करें\nKapture में same issue का ticket और उसके comments check करें\nनया ticket न बनाएँ — existing ticket में notes update करें\nCompensation: Wiom Hub › Plan & Billing check करें"}, {"type": "banner", "text": "Internet Supply Down — Outage (ticket title shows outage ticket; no troubleshooting)"}, {"type": "step", "step": "10. Outage Pitch", "subCategory": "Internet Supply Down", "hindi": "आपके area में तकनीकी समस्या के कारण net line में खराबी आ गई है, जिससे net सेवा प्रभावित हो रही है। हमारी team ने इस पर काम करना शुरू कर दिया है, और इसे सुलझाने में छह से आठ घंटे लग सकते हैं। समस्या पूरी तरह ठीक होने के बाद downtime के बदले compensation दिया जाएगा। धन्यवाद।", "backend": "Ticket के top title में outage ticket check करें\nTroubleshooting न करें\nTAT: 6–8 घंटे\nCompensation के बारे में बताएं"}, {"type": "step", "step": "11. Outage Repeat Call — Within TAT", "subCategory": "Internet Supply Down", "hindi": "\"Customer Name\", मैं देख पा रहा/रही हूँ कि आपके area की इस तकनीकी समस्या का ticket पहले से बना हुआ है। हमारी team इस पर काम कर रही है, कृपया (remaining TAT) तक का समय दें। समस्या पूरी तरह ठीक होने के बाद downtime के बदले compensation दिया जाएगा। धन्यवाद।", "backend": "Troubleshooting न करें\nTicket के comments check करें\nExisting ticket में notes update करें"}, {"type": "step", "step": "12. Outage Repeat Call — Outside TAT", "subCategory": "Internet Supply Down", "hindi": "\"Customer Name\", हमें खेद है कि दिए गए समय में आपकी समस्या हल नहीं हो पाई। आपके area की तकनीकी समस्या पर हमारी team काम कर रही है। मैं इसे priority पर हमारी team के पास भेज रहा/रही हूँ। समस्या पूरी तरह ठीक होने के बाद downtime के बदले compensation दिया जाएगा। धन्यवाद।", "backend": "Troubleshooting न करें\nTicket के comments check करें\nExisting ticket में notes update करें"}, {"type": "banner", "text": "SUB-CATEGORY: Recharge Done but Internet Not Working"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Recharge Done but Internet Not Working", "hindi": "मैं समझ सकता/सकती हूँ \"[Customer Name]\" कि आपका नेट काम नहीं कर रहा है।", "backend": "Agent portal में check करें कि recharge amount receive हुआ है या नहीं।"}, {"type": "step", "step": "5. Troubleshooting Intro", "subCategory": "Recharge Done but Internet Not Working", "hindi": "क्या मैं आपसे कुछ जानकारी ले सकता/सकती हूँ?", "backend": "—"}, {"type": "step", "step": "Q1. Restarted Net Box?", "subCategory": "Recharge Done but Internet Not Working", "hindi": "क्या आपने Net Box को restart किया है?", "backend": "—"}, {"type": "step", "step": "If CX says NO", "subCategory": "Recharge Done but Internet Not Working", "hindi": "कोई बात नहीं \"Customer Name\", कृपया अपने Net Box को power switch से बंद करें और 30 seconds बाद फिर से चालू करें। मैं call पर ही आपके साथ हूँ।", "backend": "—"}, {"type": "step", "step": "CRM Additional Information (Mandatory before Ticket Creation)", "subCategory": "Recharge Done but Internet Not Working", "hindi": "Ticket create करने से पहले Kapture में यह जानकारी confirm करें (RDNI Additional Information):\n• Netbox restart kiya? *\n• Comment (कोई अतिरिक्त जानकारी हो तो लिखें)", "backend": "Kapture ticket form → \"RDNI Additional Information\" में mandatory (*) dropdown भरें + Comment (optional) डालें।"}, {"type": "step", "step": "If Net Still Not Working", "subCategory": "Recharge Done but Internet Not Working", "hindi": "आपकी शिकायत WIOM expert team को भेज दी गई है। आप इसे WIOM app में भी देख सकते हैं। कृपया हमें शाम 9 बजे तक का समय दें। हमारी team आपकी समस्या का समाधान कर देगी। यदि आप समाधान से संतुष्ट नहीं हैं तो ticket को reopen कर सकते हैं।", "backend": "Kapture में ticket creation — TAT: उसी दिन शाम 9 बजे तक\nKapture ticket notes में Ping delay mention करना mandatory है।"}, {"type": "step", "step": "If Net Starts Working", "subCategory": "Recharge Done but Internet Not Working", "hindi": "आपका नेट अब चालू हो चुका है। क्या मैं आपकी ticket को On Call Resolve mark कर दूँ?", "backend": "Agent Kapture और Ameyo दोनों में \"On Call Resolve\" mark करेगा।"}, {"type": "step", "step": "8. Downtime Compensation (if customer asks)", "subCategory": "Recharge Done but Internet Not Working", "hindi": "(समस्या ठीक हो चुकी है) \"Customer Name\", आपको हुई असुविधा के लिए मैं क्षमा चाहता/चाहती हूँ। आपका net (outage duration) तक बंद रहा था, और इस downtime के बदले आपकी recharge validity बढ़ा दी गई है। आपकी नई expiry date और time (new expiry date & time) है। यह details आपको WIOM app पर भी भेजी गई हैं।\n\n(समस्या अभी चल रही है) \"Customer Name\", हमारी team आपकी समस्या पर काम कर रही है। समस्या पूरी तरह ठीक होने के बाद downtime के बदले compensation दिया जाएगा।", "backend": "Wiom Hub › Plan & Billing में extension details check करें\nCustomer Chat में भेजा गया message देखें\nTicket notes update करें"}, {"type": "step", "step": "9. Repeat Call — Ticket Already Exists", "subCategory": "Recharge Done but Internet Not Working", "hindi": "(Ticket TAT के अंदर है) \"Customer Name\", मैं देख पा रहा/रही हूँ कि आपकी इस समस्या का ticket पहले से बना हुआ है। हमारी team इस पर काम कर रही है, कृपया (remaining TAT) तक का समय दें।\n\n(TAT cross हो चुका है) \"Customer Name\", हमें खेद है कि दिए गए समय में आपकी समस्या हल नहीं हो पाई। हमारी team इस पर काम कर रही है। मैं इसे priority पर हमारी team के पास भेज रहा/रही हूँ।\n\n(Compensation) समस्या पूरी तरह ठीक होने के बाद downtime के बदले compensation दिया जाएगा।", "backend": "Troubleshooting दोबारा न करें\nKapture में same issue का ticket और उसके comments check करें\nनया ticket न बनाएँ — existing ticket में notes update करें\nCompensation: Wiom Hub › Plan & Billing check करें"}, {"type": "banner", "text": "SUB-CATEGORY: Frequent Disconnection"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Frequent Disconnection", "hindi": "मैं समझ सकता/सकती हूँ \"[Customer Name]\" कि आपका नेट काम नहीं कर रहा है।", "backend": "Agent portal में check करें कि recharge amount receive हुआ है या नहीं।"}, {"type": "step", "step": "5. Troubleshooting Intro", "subCategory": "Frequent Disconnection", "hindi": "क्या मैं आपसे कुछ जानकारी ले सकता/सकती हूँ?", "backend": "—"}, {"type": "step", "step": "Q1. Restarted Net Box?", "subCategory": "Frequent Disconnection", "hindi": "क्या आपने Net Box को restart किया है?", "backend": "—"}, {"type": "step", "step": "If CX says NO", "subCategory": "Frequent Disconnection", "hindi": "कोई बात नहीं \"Customer Name\", कृपया अपने Net Box को power switch से बंद करें और 30 seconds बाद दुबारा चालू करें। मैं call पर ही आपके साथ हूँ।", "backend": "—"}, {"type": "step", "step": "5.1 Troubleshooting Questions", "subCategory": "Frequent Disconnection", "hindi": "1. क्या आप Net Box के पास से नेट चला रहे हैं या दूर से?\n2. क्या आपके और Net Box के बीच कोई बड़ी दीवार है?\n3. आपको किस काम/app का इस्तेमाल करते समय नेट में दिक्कत हो रही है? (Options दें)\n4. आप किस signal से जुड़े हैं—2.4G या 5G? (NOT TO BE ASKED IN BAND STEERING = ON CUSTOMERS)", "backend": "—"}, {"type": "step", "step": "Ticket Confirmation", "subCategory": "Frequent Disconnection", "hindi": "आपके सहयोग के लिए धन्यवाद \"Customer Name\"। आपकी शिकायत WIOM expert team को भेज दी गई है। आप अपनी शिकायत WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें। Team आपकी समस्या का समाधान 24 घंटे में कर देगी। यदि आप समाधान से संतुष्ट नहीं हैं, तो ticket को reopen कर सकते हैं।", "backend": "Kapture ticket creation — TAT: 24 घंटे\nKapture ticket notes में Ping delay mention करना mandatory है।"}, {"type": "step", "ste
