<title>Wiom CX Console — Tagging &amp; Call Script Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ink: #12181f;
    --ink-dim: #5b6472;
    --ink-faint: #8991a1;
    --paper: #f4f5f8;
    --surface: #ffffff;
    --surface-raised: #ffffff;
    --line: #e2e5ea;
    --line-strong: #cdd2db;
    --brand: #1d3aae;
    --brand-ink: #ffffff;
    --brand-soft: #eaeefb;
    --brand-soft-line: #c8d2f4;
    --good: #157a4f;
    --good-soft: #e6f4ee;
    --warn: #9a5b00;
    --warn-soft: #fbeedc;
    --bad: #b3271a;
    --bad-soft: #fbe9e6;
    --info: #1f5f9e;
    --info-soft: #e8f1fa;
    --plum: #6a3fa0;
    --plum-soft: #f0e9f7;
    --subcat-bg: #ffc000;
    --subcat-ink: #3d2f00;
    --subcat-line: #d1a000;
    --shadow: 0 1px 2px rgba(20, 25, 35, 0.04), 0 8px 24px -12px rgba(20, 25, 35, 0.16);
    --radius: 10px;
    --font-ui: -apple-system, "Segoe UI", "Noto Sans", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Roboto Mono", monospace;
    --font-hi: "Noto Sans Devanagari", "Nirmala UI", "Kohinoor Devanagari", "Mangal", var(--font-ui);
  }

  :root[data-theme="dark"] {
    --ink: #e7eaf0;
    --ink-dim: #9aa4b6;
    --ink-faint: #6c7688;
    --paper: #0b0f16;
    --surface: #121926;
    --surface-raised: #16202f;
    --line: #232e3f;
    --line-strong: #33415a;
    --brand: #7b95ff;
    --brand-ink: #0b0f16;
    --brand-soft: #1a2340;
    --brand-soft-line: #33427a;
    --good: #4fd095;
    --good-soft: #10291f;
    --warn: #f0b64c;
    --warn-soft: #2e230d;
    --bad: #f28b7d;
    --bad-soft: #331815;
    --info: #7cc0f5;
    --info-soft: #0f2436;
    --plum: #c9a6f0;
    --plum-soft: #241a34;
    --subcat-bg: #a97600;
    --subcat-ink: #fff3d6;
    --subcat-line: #d1a000;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e7eaf0;
      --ink-dim: #9aa4b6;
      --ink-faint: #6c7688;
      --paper: #0b0f16;
      --surface: #121926;
      --surface-raised: #16202f;
      --line: #232e3f;
      --line-strong: #33415a;
      --brand: #7b95ff;
      --brand-ink: #0b0f16;
      --brand-soft: #1a2340;
      --brand-soft-line: #33427a;
      --good: #4fd095;
      --good-soft: #10291f;
      --warn: #f0b64c;
      --warn-soft: #2e230d;
      --bad: #f28b7d;
      --bad-soft: #331815;
      --info: #7cc0f5;
      --info-soft: #0f2436;
      --plum: #c9a6f0;
      --plum-soft: #241a34;
      --subcat-bg: #a97600;
      --subcat-ink: #fff3d6;
      --subcat-line: #d1a000;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--brand-soft-line); }
  a { color: var(--brand); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ---------- Shell layout ---------- */
  #shell {
    display: grid;
    grid-template-columns: 264px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "topbar topbar"
      "nav main";
    height: 100vh;
  }
  @media (max-width: 860px) {
    #shell {
      grid-template-columns: 1fr;
      grid-template-areas:
        "topbar"
        "main";
    }
    #nav { display: none; position: fixed; inset: 56px 0 0 0; z-index: 40; }
    #nav.open { display: block; }
  }

  /* ---------- Top bar ---------- */
  #topbar {
    grid-area: topbar;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: relative;
    z-index: 30;
  }
  #brandmark {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 700;
    font-size: 14.5px;
    white-space: nowrap;
    color: var(--ink);
    flex-shrink: 0;
  }
  #brandmark .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
    flex-shrink: 0;
  }
  #menuToggle {
    display: none;
    background: none; border: 1px solid var(--line); border-radius: 8px;
    width: 34px; height: 34px; cursor: pointer; color: var(--ink);
    align-items: center; justify-content: center;
  }
  @media (max-width: 860px) { #menuToggle { display: inline-flex; } }

  #searchWrap { position: relative; flex: 1; max-width: 560px; }
  #globalSearch {
    width: 100%;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    padding: 0 34px 0 34px;
    font-size: 13.5px;
  }
  #searchWrap svg.icon-search {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--ink-faint); pointer-events: none;
  }
  #searchClear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--ink-faint); cursor: pointer;
    width: 24px; height: 24px; border-radius: 6px; display: none;
    align-items: center; justify-content: center;
  }
  #searchClear.show { display: inline-flex; }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .iconbtn {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    width: 34px; height: 34px; cursor: pointer; color: var(--ink-dim);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .iconbtn:hover { color: var(--ink); border-color: var(--line-strong); }

  /* ---------- Nav rail ---------- */
  #nav {
    grid-area: nav;
    background: var(--surface);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 14px 10px 24px;
  }
  .nav-section-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 14px 10px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 8px 10px; border-radius: 8px;
    color: var(--ink-dim);
    font-size: 13.3px;
    line-height: 1.3;
  }
  .nav-item:hover { background: var(--paper); color: var(--ink); }
  .nav-item.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .nav-item .label { flex: 1; }
  .nav-item .count {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint);
    background: var(--paper); border-radius: 5px; padding: 1px 6px;
  }
  .nav-item.active .count { color: var(--brand); background: var(--surface); }
  .nav-divider { height: 1px; background: var(--line); margin: 10px 4px; }

  /* ---------- Main ---------- */
  #main { grid-area: main; overflow-y: auto; }
  #mainInner { max-width: 980px; margin: 0 auto; padding: 28px 24px 80px; }

  .page-head { margin-bottom: 20px; }
  .page-head h1 {
    font-size: 22px; margin: 4px 0 6px; text-wrap: balance; letter-spacing: -0.01em;
  }
  .page-head p.desc { color: var(--ink-dim); margin: 0; max-width: 68ch; }
  .page-head .filterbar {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px;
  }
  .chip-filter {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim);
    border-radius: 999px; padding: 5px 11px; cursor: pointer;
  }
  .chip-filter.active { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

  /* ---------- Tagging cards ---------- */
  .row-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 10px; overflow: hidden;
  }
  .row-card > summary {
    list-style: none; cursor: pointer; padding: 13px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .row-card > summary::-webkit-details-marker { display: none; }
  .row-card .chev {
    color: var(--ink-faint); flex-shrink: 0; transition: transform 0.15s ease;
  }
  .row-card[open] .chev { transform: rotate(90deg); }
  .row-card .subcat-name { font-weight: 600; font-size: 14.5px; flex: 1 1 240px; min-width: 0; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.02em;
    padding: 3px 8px; border-radius: 6px; white-space: nowrap; font-weight: 600;
  }
  .badge.b-good { background: var(--good-soft); color: var(--good); }
  .badge.b-warn { background: var(--warn-soft); color: var(--warn); }
  .badge.b-bad { background: var(--bad-soft); color: var(--bad); }
  .badge.b-info { background: var(--info-soft); color: var(--info); }
  .badge.b-plum { background: var(--plum-soft); color: var(--plum); }
  .badge.b-neutral { background: var(--paper); color: var(--ink-dim); border: 1px solid var(--line); }

  .row-body { padding: 4px 16px 18px; border-top: 1px solid var(--line); }
  .field-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; margin-top: 14px;
  }
  @media (max-width: 640px) { .field-grid { grid-template-columns: 1fr; } }
  .field-grid.full { grid-template-columns: 1fr; }
  .field {
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  .field .flabel {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 5px;
  }
  .field .fvalue { white-space: pre-line; color: var(--ink); }
  .field.eligible .fvalue { color: var(--good); }
  .field.noneligible .fvalue { color: var(--bad); }
  .field ul.clean { margin: 0; padding-left: 18px; }
  .field ul.clean li { margin-bottom: 3px; }

  .resolution-path { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
  .rp-step {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px;
  }
  .rp-step .rp-n {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--brand);
    background: var(--brand-soft); border-radius: 6px; width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }

  .lang-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .lang-pair { grid-template-columns: 1fr; } }
  .lang-pair .field .fvalue { font-family: var(--font-hi); }
  .lang-pair .field.en .fvalue { font-family: var(--font-ui); font-style: italic; color: var(--ink-dim); }

  .pitch-link {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; color: var(--brand); text-decoration: none; margin-top: 3px;
  }
  .pitch-link:hover { text-decoration: underline; }

  /* ---------- Script view ---------- */
  .script-banner {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--ink-dim); background: var(--surface); border: 1px dashed var(--line-strong);
    border-radius: 8px; padding: 8px 12px; margin: 22px 0 12px;
  }
  .script-banner:first-of-type { margin-top: 4px; }
  .script-banner.subcat {
    color: var(--subcat-ink); background: var(--subcat-bg); border: 1px solid var(--subcat-line);
    font-weight: 700; font-size: 11.5px;
  }
  .script-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
  }
  .script-card .sc-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px;
  }
  .script-card .sc-step { font-weight: 700; font-size: 13.5px; }
  .script-card .sc-sub { font-size: 11.5px; color: var(--ink-faint); }
  .script-card .sc-hindi {
    font-family: var(--font-hi); font-size: 15px; line-height: 1.75; white-space: pre-wrap; color: var(--ink);
  }
  .script-card .sc-backend {
    margin-top: 11px; padding-top: 10px; border-top: 1px dashed var(--line);
    font-size: 12.5px; color: var(--ink-dim); white-space: pre-wrap;
  }
  .script-card .sc-backend .flabel {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 3px;
  }
  .copybtn {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-dim);
    border-radius: 6px; padding: 4px 9px; font-size: 11px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
  }
  .copybtn:hover { color: var(--ink); border-color: var(--line-strong); }
  .copybtn.copied { color: var(--good); border-color: var(--good); }

  /* ---------- Policy view ---------- */
  .compliance-banner {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 22px; color: var(--ink);
  }
  .compliance-banner svg { color: var(--warn); flex-shrink: 0; margin-top: 2px; }
  .compliance-banner strong { color: var(--warn); }
  .policy-section { margin-bottom: 22px; }
  .policy-section h2 {
    font-size: 13px; margin: 0 0 10px; padding: 6px 12px;
    background: var(--brand-soft); color: var(--brand); border-radius: 7px; display: inline-block;
  }
  .policy-rule {
    display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line);
  }
  .policy-rule:first-of-type { border-top: none; }
  .policy-rule .pr-mark {
    width: 6px; height: 6px; border-radius: 50%; background: var(--brand);
    margin-top: 8px; flex-shrink: 0;
  }
  .policy-rule .pr-text { flex: 1; }
  .policy-examples {
    margin-top: 8px; padding: 8px 12px; background: var(--paper); border: 1px solid var(--line);
    border-radius: 8px; font-size: 12.5px; color: var(--ink-dim);
  }
  .policy-examples .pe-label {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 5px;
  }
  .policy-examples ul { margin: 0; padding-left: 18px; }
  .policy-examples li { margin-bottom: 3px; }

  /* ---------- Wiom Net SOP ---------- */
  .source-link-row {
    display: flex; justify-content: flex-end; margin: -6px 0 16px;
  }
  .source-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim);
    text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
  }
  .source-link:hover { color: var(--brand); border-color: var(--brand); }

  .flow-timeline { display: flex; flex-direction: column; gap: 8px; margin-bottom: 26px; }
  .flow-step {
    display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .flow-step .fs-code {
    font-family: var(--font-mono); font-weight: 700; font-size: 13px;
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--brand-soft); color: var(--brand);
  }
  .flow-step.decision .fs-code { background: var(--warn-soft); color: var(--warn); }
  .flow-step.success .fs-code { background: var(--good-soft); color: var(--good); }
  .flow-step .fs-title { font-weight: 600; margin-bottom: 3px; }
  .flow-step .fs-body { white-space: pre-line; color: var(--ink-dim); font-size: 13px; }
  .flow-step.decision { border-style: dashed; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 22px; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.8px; background: var(--surface); }
  table.data-table th {
    text-align: left; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--ink-faint); background: var(--paper); padding: 9px 12px; border-bottom: 1px solid var(--line);
    white-space: nowrap; position: sticky; top: 0;
  }
  table.data-table td {
    padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink);
  }
  table.data-table tr:last-child td { border-bottom: none; }
  table.data-table tbody tr:hover { background: var(--paper); }
  table.data-table td.num { font-family: var(--font-mono); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  table.data-table td.emphasis { color: var(--brand); font-weight: 600; }
  .chain-list { margin: 0; padding-left: 16px; color: var(--ink-dim); font-size: 12px; }
  .chain-list li { margin-bottom: 2px; }

  .tag-chip-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
  .tag-chip {
    font-family: var(--font-mono); font-size: 11px; background: var(--brand-soft); color: var(--brand);
    border-radius: 999px; padding: 5px 11px;
  }

  .flow-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 720px) { .flow-columns { grid-template-columns: 1fr; } }
  .flow-columns .field { align-self: start; }

  /* ---------- Home / overview ---------- */
  .home-hero {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 26px 28px; margin-bottom: 26px;
  }
  .home-hero h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -0.01em; }
  .home-hero p { margin: 0; color: var(--ink-dim); max-width: 64ch; }
  .stat-row { display: flex; gap: 22px; margin-top: 18px; flex-wrap: wrap; }
  .stat { }
  .stat .num { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--brand); }
  .stat .lbl { font-size: 11.5px; color: var(--ink-faint); }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .home-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 15px; cursor: pointer; text-align: left;
  }
  .home-card:hover { border-color: var(--brand); }
  .home-card .hc-kicker { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); }
  .home-card .hc-title { font-weight: 600; margin-top: 4px; font-size: 14.5px; }
  .home-card .hc-meta { margin-top: 6px; font-size: 12px; color: var(--ink-dim); }

  /* ---------- Search results ---------- */
  .result-item {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
  }
  .result-item:hover { border-color: var(--brand); }
  .result-item .ri-path { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .result-item .ri-title { font-weight: 600; margin-top: 3px; }
  .result-item .ri-snippet { margin-top: 4px; font-size: 12.5px; color: var(--ink-dim); }
  mark { background: var(--warn-soft); color: var(--ink); border-radius: 3px; padding: 0 2px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-faint); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div id="shell">
  <header id="topbar">
    <button id="menuToggle" aria-label="Toggle navigation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

<script id="portalData" type="application/json">{"generatedFrom": "SOP - Final (updated v18).xlsx", "categories": [{"name": "Internet Issues", "rows": [{"subCategory": "Internet Supply Down", "definition": "Customer is unable to access the internet because the service is completely unavailable at their location.( LOS is red in net box)", "tagEligible": "• Customer's plan should be active \n• Ping delay should be greater than 5 minutes \n• Internet is completely down (no intermittent connectivity) LOS is showing red in net box", "tagNonEligible": "• Plan is not active \n• Issue is only slow speed \n• Ping delay is less than 6 minutes", "callType": "Complaint", "tat": "24 hrs", "fcr": "Non - FCR (FCR Posible in some of the cases by restarting net box )", "queue": "CSP", "ownership": "CSP follow up team", "callObjective": "1. Acknowledge & Empathize - Show understanding of the issue and build trust.\n\n2. Troubleshoot, Educate & Capture Details - Perform first-level checks, guide the customer, and collect accurate info for ticket.\n\n3.Reassure Ownership - Explain next steps and timelines clearly, ensuring the case is tracked.", "inboundPitch": "Internet Issues", "troubleshoot": "1. Restart the modem/net box.\n2. Check the LOS (Loss of Signal) status on the net box – ensure it is not red.\n3. While creating the ticket in Kapture, mention the Ping delay in the ticket notes (mandatory).", "queriesHi": ["Internet bilkul band hai, koi signal nahi aa raha - kab tak theek hoga?", "Subah se net nahi chal raha, supplier ne bola area mein supply down hai - aap kab fix karoge?", "Mera poora ghar ka internet gaya hai, modem bhi restart kiya but kuch nahi hua, jaldi theek karo"], "queriesEn": ["My internet is completely down and there is no signal. When will it be fixed?", "The internet has not been working since morning. The supplier said there is an outage in the area. When will you fix it?", "The internet for my entire house is down. I have already restarted the modem, but nothing happened. Fix it quickly."], "resolutionPath": "Step 1: Acknowledge & empathize with the customer → Step 2: Restart the modem/net box → Step 3: Check LOS (Loss of Signal) status on net box – ensure it is NOT red → Step 4: If issue persists, raise a complaint ticket with Partner queue and mention the Ping delay in the Kapture ticket notes (mandatory) → Step 5: Communicate 24-hour TAT to customer → Step 6: Partner follow-up team to check ping status and resolve", "infoRetrieved": ["Within 48hr Closed Kapture Ticket", "Plan Status", "Plan Expiry Date and Last Paid on", "Ping Delay > 5mins (mention in Kapture ticket notes – Mandatory)", "RX power", "Customer Name", "Partner Name", "Device ID", "Partner Zone", "Customer Mobile Number", "Address", "Outage Check", "LCO ID/CSP ID", "Open ticket Comments"], "questions": []}, {"subCategory": "Recharge done but internet not working", "definition": "Customer has paid for their plan, and it has been created in our system, ping delay greater than the recharge time, the customer still cannot use the internet.", "tagEligible": "• Recharge is successfully done / plan created in Wiom Hub \n• Ping delay is greater than recharge activation time \n• Internet does not come up even once after recharge", "tagNonEligible": "• Recharge time is greater than ping time \n• Internet comes up even after recharge and down again", "callType": "Complaint", "tat": "24 hrs", "fcr": "Non - FCR (FCR Posible in some of the cases by restarting net box )", "queue": "CSP", "ownership": "CSP follow up team", "callObjective": "", "inboundPitch": "Internet Issues", "troubleshoot": "1.Verify payment/recharge in the system and check if the payment time exceeds the ping delay.\n2.Restart the modem/net box.\n3. Check the LOS (Loss of Signal) status on the net box – ensure it is not red.\n4. While creating the ticket in Kapture, mention the Ping delay in the ticket notes (mandatory).", "queriesHi": ["Maine abhi recharge kiya hai, lekin internet ab bhi nahi chal raha, kya problem hai?", "Payment ho gayi hai mere account se, App pe bhi show ho raha hai but internet nahi aa raha hai - kab chalu hoga?", "Recharge karte hi net chalna chahiye tha na, 2 ghante ho gaye hain abhi tak nahi aaya"], "queriesEn": ["I have already recharged, but the internet is still not working. What is the problem?", "The payment has been deducted and is visible in the app, but the internet is still not working. When will it be activated?", "The internet should have started immediately after the recharge, right? It has been two hours and it is still not active."], "resolutionPath": "Step 1: Verify payment/recharge in Wiom Hub → Step 2: Check if payment time exceeds ping delay → Step 3: Restart the modem/net box → Step 4: Check LOS (Loss of Signal) status on net box – ensure it is NOT red → Step 5: If issue persists, raise complaint ticket with Partner queue and mention the Ping delay in the Kapture ticket notes (mandatory) → Step 6: Communicate 24-hour TAT to customer", "infoRetrieved": ["Within 48hr Closed Kapture Ticket", "Plan Status", "Plan Expiry Date", "Last Paid on", "Price + GST", "ISP recharge history", "Ping Delay > 5mins (mention in Kapture ticket notes – Mandatory)", "RX power", "Customer Name", "Partner Name", "Device ID", "Partner Zone", "Customer Mobile Number", "Address", "Outage Status", "LCO ID/CSP ID", "Bills Paid on", "Ping Delay Date & time > Recharge Date Time", "Network Diagnostics (Data Usage =", "Open ticket Comments"], "questions": []}, {"subCategory": "Frequent Disconnection", "definition": "Internet connection keeps dropping intermittently during use; customer says ‘ruk ruk ke chal raha hai", "tagEligible": "• Internet connects and disconnects repeatedly \n• Ping is intermittent, not fully down \n• Issue occurs multiple times in a day", "tagNonEligible": "• Internet is completely down (tag Internet Supply Down) \n• Only slow speed without disconnection \n• One-time drop due to power/net box restart", "callType": "Complaint", "tat": "24 hrs", "fcr": "Non - FCR", "queue": "CSP", "ownership": "CSP follow up team", "callObjective": "", "inboundPitch": "Internet Issues", "troubleshoot": "1.Restart the modem/net box.\n2. Educate the customer about 2.4 GHz and 5 GHz networks and guide them on which band to use for better performance.\n3.Explain how distance, interference, and obstacles can affect Wi-Fi performance, and suggest the optimal band.\n4.Check optical power in the system to identify any issues affecting connectivity.\n5. While creating the ticket in Kapture, mention the Ping delay in the ticket notes (mandatory).", "queriesHi": ["Net baar baar bund ho jaata hai - 10-15 minute mein drop hota hai, bahut problem ho rahi hai kaam mein", "Raat ko internet aata hai din ko chala jaata hai, aisa kyun ho raha hai?", "Internet itni baar aata jaata hai ki koi kaam nahi kar pa raha - please technician bhejo ek baar"], "queriesEn": ["The internet keeps disconnecting every 10-15 minutes, and it's causing a lot of problems with my work.", "The internet works at night but goes down during the day. Why is this happening?", "The connection drops so frequently that I can't get any work done. Please send an engineer to check it."], "resolutionPath": "Step 1: Restart the modem/net box → Step 2: Educate customer about 2.4 GHz vs 5 GHz bands and guide on optimal band → Step 3: Explain how distance, interference, and obstacles affect Wi-Fi → Step 4: Check optical power in Wiom Hub to identify connectivity issues → Step 5: Raise complaint ticket with Partner queue if unresolved, and mention the Ping delay in the Kapture ticket notes (mandatory) → Step 6: Communicate 24-hour TAT", "infoRetrieved": ["Within 48hr Closed Kapture  Ticket", "Plan Status", "Plan Expiry Date and Last Paid on", "Ping Delay (mention in Kapture ticket notes – Mandatory)", "RX power", "2.4 GHz Connected Devices", "5 GHz Connected Devices", "Band Steering", "Fluctuation Usage in Current Cycle & for those days", "Customer Name", "Partner Name", "Device ID", "Partner Zone", "Customer Mobile Number", "Address", "Outage Status", "LCO ID/CSP ID", "18 Flappin or Session count", "Plan Start date", "Open ticket Comments"], "questions": []}, {"subCategory": "Slow Speed/Range Issues", "definition": "Internet is available, but the speed or Wi-Fi range is below the expected or promised level.", "tagEligible": "• Internet is working, however the customer is consistently complaining about slow speed \n• Wi-Fi range is weak in certain areas of the home", "tagNonEligible": "• Internet is fully down (route to Internet Supply Down) \n• Frequent disconnections are happening (route to Frequent Disconnection)", "callType": "Complaint", "tat": "On-call Resolution if live speed ≥80 Mbps (OCR); if <80 Mbps (or customer disputes an ≥80 Mbps reading with Ookla proof), 24 hrs after Partner/PFT ticket is raised", "fcr": "FCR if real-time speed ≥80 Mbps (OCR) · Non-FCR if real-time speed <80 Mbps, or ≥80 Mbps but customer shares a screenshot/confirms on call an Ookla reading <80 Mbps (mention customer-claimed speed in ticket notes)", "queue": "CSP / PFT", "ownership": "CSP follow up team", "callObjective": "1. Acknowledge & Empathize - Show understanding of the issue and build trust.\n\n2. Test, Educate & Document - Run a live speed test via Wiom Hub, educate the customer on distance/interference/band placement, and document the actual live speed, date, and time in the ticket.\n\n3. Reassure Ownership - Explain next steps and the 24-hour TAT clearly if escalated to Partner/PFT, ensuring the case is tracked.", "inboundPitch": "Internet Issues", "troubleshoot": "1. Restart the modem/NetBox.\n2. Check optical power in Wiom Hub to identify connectivity issues.\n3. Run a Live Speed Test in Wiom Hub - press the Run button only ONCE to avoid inconsistent readings (test takes ~1-2 min, up to 3-4 min in some cases; a completed result stays valid for 6 hours).\n4. If speed ≥80 Mbps: treat as OCR - educate the customer on distance/interference/band placement and resolve on call.\n5. If speed <80 Mbps (or ≥80 Mbps but customer disputes with an Ookla screenshot/on-call confirmation <80 Mbps): raise a ticket for Partner/PFT intervention.\n6. Document the actual live speed, date, and time of the test in the ticket, and mention the Ping delay in the Kapture ticket notes (mandatory).\n7. Confirm with the customer whether the issue is still being experienced before resolving/closing the case.", "queriesHi": ["Speed bahut slow aa rahi hai, plan mein 100 Mbps hai but 20-30 Mbps bhi nahi milta", "Netbox ke paas speed theek hai but doosre kamre mein bilkul nahi aata - kyu?", "Raat ko speed acchi hoti hai din mein ekdum gir jaati hai - ye kyun hota hai?", "Upar floor tak Wi-Fi nahi pahunch raha / ek room se dusre room mein range nahi hai", "Speed test mein speed normal aane ke baad bhi buffering ho rahi hai", "Jab bhi recharge khatam hone wala hota hai, speed apne aap kam ho jaati hai"], "queriesEn": ["Speed is very slow, my plan is 100 Mbps but I'm not even getting 20-30 Mbps", "Speed is fine near the netbox but doesn't reach the other room at all - why?", "Speed is good at night but drops sharply during the day - why does this happen?", "Wi-Fi doesn't reach the floor above / doesn't reach from one room to another", "Buffering happens even after the speed test looks normal", "Speed automatically drops whenever the recharge is about to expire"], "resolutionPath": "Step 1: Acknowledge & empathize with the customer → Step 2: Restart the modem/NetBox → Step 3: Check optical power in Wiom Hub → Step 4: Run a Live Speed Test in Wiom Hub (press Run once; result valid for 6 hours) → Step 5: If speed ≥80 Mbps, treat as OCR - educate the customer on distance/interference/band placement and resolve on call → Step 6: If speed <80 Mbps (or customer disputes an ≥80 Mbps reading with Ookla proof), raise a ticket for Partner/PFT intervention with the live speed, date, time and Ping delay recorded in the Kapture ticket notes (Ping delay is mandatory) → Step 7: Confirm with the customer whether the issue is still being experienced before closing", "infoRetrieved": ["Live Speed in Wiom Hub (Mandatory)", "Information about better Wi-Fi usage given (Yes/No) (Mandatory)", "CS Claimed Current Speed from Ookla (Non-Mandatory)", "Ping Delay (mention in Kapture ticket notes – Mandatory)", "Open ticket Comments"], "questions": ["Customer Mobile Number", "Live speed test reading from Wiom Hub", "Is the customer's Wi-Fi Band Steering ON or OFF (determines which explanation script to use)", "Which room/floor, or how far from the NetBox, is the issue occurring"]}, {"subCategory": "Optical Power Out of Range", "definition": "Customer is facing slow speed and frequent disconnections. System shows optical power out of range: -8 to -25", "tagEligible": "• Optical power reading is less than -25 or more than -8 \n• Customer reports speed fluctuation or disconnection \n• Issue confirmed in system", "tagNonEligible": "• Optical power is within range \n\n• Temporary speed issue without optical alert", "callType": "Complaint", "tat": "24 hrs", "fcr": "Non - FCR", "queue": "CSP", "ownership": "CSP follow up team", "callObjective": "", "inboundPitch": "Internet Issues", "troubleshoot": "In all such cases, optical power should always be checked first.\n1. Customer is unable to use the internet despite ping up \n2. Customer is facing slow internet speed.\n3..Customer is experiencing frequent disconnections.\n\nNote: while creating the ticket in Kapture, mention the Ping delay in the ticket notes (mandatory).", "queriesHi": ["Device pe red light aa rahi hai, koi bol raha hai optical power out of range hai - matlab?", "Green light ki jagah red blink ho rahi hai - internet totally dead ho gayi hai"], "queriesEn": ["Device is showing red light, and I was told the optical power is out of range. What does that mean?", "The modem's light is blinking red instead of green, and my internet is completely down."], "resolut fying that a shifting request can be raised when they are ready to move.\n\n2. Advise the customer to call back at the time of shifting so the request can be processed.\n\n3. Create a ticket for shifting inquiry and close by marking it as resolved.", "queriesHi": ["Shifting ke baare mein puchna tha - kya process hai aur kitna time lagta hai?", "Doosri jagah shift karna chahta hoon, kya same plan chal sakta hai naye ghar mein?", "Shifting ka charge kitna hoga aur security deposit transfer hoti hai kya?"], "queriesEn": ["I would like to know about the connection shifting process. How does it work, and how long does it take?", "I want to move to a different location. Can I continue using the same plan at my new home?", "What are the charges for shifting, and will my security deposit be transferred as well?"], "resolutionPath": "Step 1: Understand purpose of call – confirm customer is only enquiring, not ready to shift → Step 2: Provide relevant shifting information and explain the process → Step 3: Advise customer to call back when ready to initiate shifting → Step 4: Create a ticket for shifting inquiry → Step 5: Close ticket marking as resolved on-call", "infoRetrieved": ["Within48hr closed kapture ticket", "Plan Status", "Plan Expiry Date and Last Paid on", "Ping Delay", "RX power", "Customer Name", "Partner Name", "Device ID", "Partner Zone", "Customer Mobile Number", "Customer Address VS New address", "Check coordinates for new address", "Feasibility check (same partner within 200m) - Map Tool: https://web-production-27094.up.railway.app/", "LCO ID/CSP ID", "Open ticket Comments"], "questions": []}, {"subCategory": "Shifting Request | Shift Within My Home", "definition": "Customer wants to move the connection to another location within the same premises (e.g., room-to-room, within the same flat, or within a shop)", "tagEligible": "• New location is within the same flat / shop / unit \n• No change in building or address \n• Same partner infrastructure will be used", "tagNonEligible": "• Movement to another building or block \n• Change in address or society \n• Partner change is required", "callType": "Request", "tat": "Within 3 days", "fcr": "Non - FCR", "queue": "CSP", "ownership": "CSP follow up team", "callObjective": "", "inboundPitch": "Shifting", "troubleshoot": "Confirm whether the customer intends to shift within the same premises. If yes, share the applicable shifting TAT and payment details, capture the customer’s preferred shifting date, and create a shifting ticket accordingly.", "queriesHi": ["Router ek room mein hai, use doosre kamre mein shift karna hai - technician aayega?", "Wire fitting change karni hai ghar ke andar, kya charge lagega is kaam mein?", "ONT device ko move karna hai, khud kar sakte hain ya engineer zaroorat hai?"], "queriesEn": ["The router is currently installed in one room, and I want it shifted to another room. Will a technician be required?", "I need to change the internal wiring in my house. Will there be any charges for this?", "I want to relocate the ONT device. Can I do it myself, or do I need an engineer?"], "resolutionPath": "Step 1: Confirm customer wants to shift within same premises (room-to-room, same flat/shop) → Step 2: Share applicable shifting TAT (2–3 days) and payment details (if applicable) → Step 3: Capture customer's preferred shifting date → Step 4: Create shifting ticket with partner queue → Step 5: Partner to schedule visit and execute shifting → Step 6: Team verifies if shifting completed otherwise reopen the ticket", "infoRetrieved": ["Within48hr closed kapture ticket", "Plan Status", "Plan Expiry Date and Last Paid on", "Ping Delay", "RX power", "Customer Name", "Partner Name", "Device ID", "Partner Zone", "Customer Mobile Number", "Current Address", "Map Tool: https://web-production-27094.up.railway.app/", "LCO ID/CSP ID", "Open ticket Comments"], "questions": []}, {"subCategory": "Shifting Request | Shift to New Address", "definition": "Customer wants to move the connection to a location , the same partner has connection within 200m.", "tagEligible": "• New address is outside current premises \n• Distance is within feasible range (≤200m) as per shifting portal ( https://web-production-27094.up.railway.app/)\n• Same partner serviceable at new location", "tagNonEligible": "• Distance is more than 200m \n• Partner is not available at new location \n• Customer is only enquiring, not confirming shift", "callType": "Request", "tat": "Within 3 days", "fcr": "Non - FCR", "queue": "CSP", "ownership": "CSP follow up team", "callObjective": "", "inboundPitch": "Shifting", "troubleshoot": "1.Collect the correct shifting address from the customer.\n2.Obtain the coordinates using a reliable map.\n3.Check feasibility in the system: if any connection is within 200m for the same partner, shifting is possible. Inform the customer about the TAT and charges, and create a ticket with the shifting date.", "queriesHi": ["Main shift ho raha hoon naye ghar mein, kya Wiom connection wahan le ja sakta hoon?", "New address pe shifting chahiye, procedure kya hai aur extra charge lagega kya?", "Naye location pe service available hai kya - please check karo mera naya address"], "queriesEn": ["I am moving to a new house. Can I transfer my Wiom connection there?", "I need to shift my connection to a new address. What is the process, and are there any additional charges?", "Is Wiom service available at my new location? Please check my new address."], "resolutionPath": "Step 1: Collect correct shifting address from customer → Step 2: Obtain coordinates using a reliable map → Step 3: Check feasibility in Wiom Hub – if same partner has connection within 200m, shifting is possible → Step 4: Inform customer about TAT (3–5 days)→ Step 5: Create shifting ticket with confirmed shifting date → Step 6: Partner team to execute shifting", "infoRetrieved": ["Within48hr closed kapture ticket", "Plan Status", "Plan Expiry Date and Last Paid on", "Ping Delay", "RX power", "Customer Name", "Partner Name", "Device ID", "Partner Zone", "Customer Mobile Number", "Current Address", "Check coordinates for new address", "Feasibility check (same partner within 200m) - Map Tool: https://web-production-27094.up.railway.app/", "LCO/CSP ID", "Open ticket Comments"], "questions": []}, {"subCategory": "Shifting Request | Shift to New Address (Service Available)", "definition": "There is a different Wiom partner in a 200m range of the customer's new address, but not the same partner", "tagEligible": "• New address is outside current premises \n• Distance is within feasible range (≤200m) as per shifting portal ( https://web-production-27094.up.railway.app/)\n• Same partner serviceable at new location", "tagNonEligible": "Same partner is serviceable", "callType": "Request", "tat": "On-call Resolution", "fcr": "FCR", "queue": "CC Queue", "ownership": "NA", "callObjective": "", "inboundPitch": "Shifting", "troubleshoot": "1.Collect the correct shifting address from the customer.\n2.Obtain the coordinates using a reliable map.\n3.Check feasibility in the system: if a different partner is available, guide them to book a new connection at the new address, and initiate a refund of the remaining plan amount as per policy.", "queriesHi": ["Naye address pe Wiom available hai, shifting confirm karo aur date de do installation ki", "New location pe service hai - same connection port karna hai, process start karo", "Shifting approved ho gayi kya? Technician kab aayega naye ghar pe?"], "queriesEn": ["Wiom service is available at my new address. Please confirm the shifting request and provide an installation date.", "Service is available at my new location. I want to transfer my existing connection there. Please initiate the process.", "Has my shifting request been approved? When will the technician visit my new address?"], "resolutionPath": "Step 1: Collect correct shifting address from customer → Step 2: Obtain coordinates using a reliable map → Step 3: Check fe es were also disrupted. I would like some compensation.", "I have raised this issue multiple times, but it still hasn't been resolved. I would like a discount or coupon.", "Can I get extra validity or compensation due to the service issue?", "The coupon amount I received is too less. Can I get a better one?"], "resolutionPath": "Step 1: Acknowledge & empathize with the customer → Step 2: Check CRM for all previously raised tickets and service history → Step 3: Identify reason for coupon request (service disruption, speed issue, etc.) → Step 4: Check if coupon already exists in app → Guide customer to check app → Step 5: If no coupon exists and issue is valid – calculate compensation at ₹23/affected day → Update Coupon Sheet → TL issues coupon via Wiom Hub → Step 6: If request not valid, inform customer that manual coupon issuance is not permitted without valid service issue", "infoRetrieved": ["Within48hr closed kapture ticket and check  whatsapp screenshot collection", "Plan Status", "Plan Expiry Date and Last Paid on", "PayG status", "PayG Migrated", "Bills and Transaction (Transaction ID, Time, Amount, Refund Status, Payment Mode, Status, Gateway, Purpose)", "Q24", "Coupons given & history", "Open ticket Comments"], "questions": []}, {"subCategory": "Autopay issue", "definition": "Issues with automatic payments not processing correctly (double payment, deduction after net box removal, enable/disable issues).", "tagEligible": "• Autopay charged incorrectly or twice • Deduction happened after net box removal or disconnection • Customer unable to enable/disable autopay", "tagNonEligible": "• Manual payment issues • App payment failure (tag Unable to Pay via App) • Autopay working as expected", "callType": "Complaint", "tat": "On Call resolved/ Also depend on cx Scenario which will be 24 hrs resolution", "fcr": "FCR", "queue": "CC Queue", "ownership": "L2 service team", "callObjective": "", "inboundPitch": "Payment Issues", "troubleshoot": "", "queriesHi": ["Autopay ion nahi mila - refund ya disconnect chahiye"], "queriesEn": ["The service has become very poor, and I keep facing issues. I want to disconnect my connection.", "I am paying so much, but the service quality is extremely poor. Engineers visit, but the problem never gets resolved. What should I do?", "I have been facing the same issue for the past month, and there has been no permanent solution. I would like a refund or disconnection."], "resolutionPath": "Step 1: Listen & empathize with the customer's frustration → Step 2: Perform basic troubleshooting (restart net box, check LOS, check device load, 2.4/5 GHz band) → Step 3: Check CRM for recent complaints or open issues → Step 4: Offer resolution support: raise complaint ticket → Step 5: Make retention attempt – ask to apply discount coupon if available in account → Step 6: Guide customer to generate ticket through app → Step 7: Communicate TAT on call", "infoRetrieved": ["Within 48hr Closed Kapture Ticket", "Plan Status", "Plan Expiry Date and Last Paid on", "PayG", "Customer Name", "Partner Name", "Device ID", "Partner Zone", "Customer Mobile Number", "Address", "Ping Delay", "RX power", "LCO ID/CSP ID", "Current Usage (Internet not working on which days)", "Net-Box Return – Active Requests: List of active return tickets with Ticket ID and Active count badge", "Net-Box Return – Net-Box Refund Details: Eligible Refund Amount, Net-Box Pickup Charges, Late Fee Charges (with +Waive Fee), Total Refund (Expected), UPI Added? (Yes/No with Send UPI Reminder), Refund Status (Not started/In progress/Done)", "Net-Box Return – Ticket & Collection Status: Ticket Status (RESOLVED/SEND TO WIOM/etc.), Ticket Created At, Partner Collected Net-Box (Yes/No), Partner Collection Date", "Open ticket Comments"], "questions": []}, {"subCategory": "Other reasons", "definition": "Customer wants to disconnect due to reasons other than service issues.", "tagEligible": "• Reason is personal or external (shifting, no need, cost, temporary use) g in the ticket.\n\nReassure Ownership → Communicate next steps, TAT and assure the team will call for this.", "queriesHi": ["Service itni kharab thi pichle mahine ki ki refund chahiye mujhe us period ka", "Kaafi din internet nahi chala, us time ka paisa wapas milna chahiye - refund process karo", "SLA ke hisaab se downtime bahut zyada raha, compensation ya refund ka kya policy hai?"], "queriesEn": ["The service was extremely poor last month, and I would like a refund for that period.", "My internet was unavailable for several days. I believe I should receive a refund for the downtime. Please process it.", "The downtime exceeded the SLA limits. What is your policy regarding compensation or refunds?"], "resolutionPath": "Step 1: Listen & empathize with customer → Step 2: Check CRM for service downtime, complaint history, recent technical issues → Step 3: Validate if customer's issue was genuine and unresolved → Step 4: Offer coupon/retention to customer (L2 team attempt) → Step 5: If customer agrees to retention, cancel refund request → Step 6: If customer does not agree, fill out Refund Form → CX TL/Supervisor initiates refund within 1 hour → Step 7: Inform customer refund will be processed within 5–7 working days", "infoRetrieved": ["Within48hr closed kapture ticket", "Chat Section (Customer App)", "Plan Status", "Plan Expiry Date", "Last Paid on", "Billing", "Transaction details (ID, Time, Amount, Refund Status, Payment Mode, Status, Payment  Gateway, Purpose of the transactions )", "Customer Name", "Partner Name", "Device ID", "Partner Zone", "Customer Mobile Number", "Address", "LCO ID /CSP ID", "Ping Delay", "Internet not working on which days", "Open ticket Comments"], "questions": []}, {"subCategory": "Double payment", "definition": "Customer paid twice and requests refund for extra payment.", "tagEligible": "• Two successful payments are visible in system • Payments are for same account / plan / period • Customer requests refund of excess amount", "tagNonEli
