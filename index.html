": ["Mein installation ka liya itna wait nahi kar sakta, mujhe refund chahiye.", "Mera connection time par install nahi hua, paise wapas kaise milenge?", "Installation delay ki wajah se mera refund process kar dijiye."], "queriesEn": ["I can't wait so long for installation, please process my refund.", "My connection wasn't installed on time. How can I get my money back?", "Please process my refund since the installation is delayed."], "resolutionPath": "Step 1: Acknowledge & empathize with the delay → Step 2: Check booking fee and elapsed time in Wiom Hub → Step 3a (fee <₹100, <48 hrs): 'Filhaal aapki booking ko 48 ghante se kam samay hua hai aur hum set up ki prakriya mein hain. Is samay cancel karne par refund nahi diya jaata. Agar hum 48 ghanton ke andar set up nahi kar paate, toh aapke charges refund kar diye jaayenge' → Step 3b (fee >₹100): 'Aap app ke through apni booking cancel kar sakte hain. Agar aapne koi charges jama kiye hain, toh unka refund 3-5 din mein process kar diya jaayega' → Step 4: Log the customer's decision (wait or cancel)", "infoRetrieved": ["Booking Amount", "Booking Date", "Customer Status (Installed Customer / Active Customer/Pending etc)", "Customer name", "Customer Registered number", "Ping Details (If any) = Null", "Booking Status (Pending),", "Booking Cancelled By = Null", "9 Booking Cancellation Date-Time = Null", "Partner LCO ID/CSP ID", "Booking Fee Refund Date &time = Null", "Booking Fee amount", "Any open Ticket on Kapture in last 48 hrs", "Connection Status", "Current State ( Isntallation Journey)"], "questions": []}, {"subCategory": "Installation Expediting Request", "definition": "Customer wants their installation prioritized/expedited due to urgency.", "tagEligible": "Customer explicitly requests that their installation be done sooner than the currently assigned slot.", "tagNonEligible": "Customer is simply asking for the standard installation timeline with no urgency stated (route to Installation Timeline Inquiry).", "callType": "Request", "tat": "24 hrs", "fcr": "Non - FCR", "queue": "Booking Ops Team", "ownership": "Booking Ops Team", "callObjective": "1. Acknowledge Urgency & Empathize - Recognize the customer's need.\n\n2. Log the Request - Note the priority request against the booking.\n\n3. Set Honest Expectation - Confirm earliest available slot; avoid overpromising.", "inboundPitch": "Booking Related", "troubleshoot": "1. Check Wiom Hub for current slot/partner assignment.\n2. Log a complaint/priority ticket for installation delay.\n3. If engineer is unresponsive, log as a system/escalation issue.", "queriesHi": ["Kya aap mera installation jaldi karwa sakte hain?", "Mujhe internet urgent chahiye, kya aaj hi installation ho sakta hai?", "Please mere installation request ko priority dijiye."], "queriesEn": ["Can you speed up my installation?", "I need the connection urgently. Can someone install it today?", "Please prioritize my installation request."], "resolutionPath": "Step 1: Acknowledge urgency & empathize → Step 2: Check App status and log the request → Step 3: Explain: 'Yeh deri Wiom mein note ho gayi hai' → Step 4: If engineer called but missed: 'Wiom App mein engineer ka number dekh sakte hain aur unhe directly call karke status check kar sakte hain' → Step 5: If engineer refused to connect: 'Yeh system issue maana jaata hai — main isko log kar raha/rahi hoon, aapko App par next update milega' → Step 6: Reassure: 'Is stage par aapko kuch alag karne ki zaroorat nahi hai'", "infoRetrieved": ["Booking Amount", "Booking Date & Time", "Customer Status (Installed Customer / Active Customer/Pending etc)", "Customer name", "Customer Registered number", "Ping Details (If any) = Null", "Booking Status (Installed/Pending/Cancelled),", "Booking Cancelled By", "9 Booking Cancellation Date-Time.", "Partner LCO ID/CSP ID", "Booking Fee Refund Date &time", "Booking Fee amount", "Booking Fee Refund Status", "Any open Ticket on Kapture in last 48 hrs", "Customer Address", "Technician Assigned", "Technician Assignement Date"], "questions": []}, {"subCategory": "Cx Request Cancellation", "definition": "Customer wants to cancel their booking and receive a refund of the amount paid, where no technician/slot has been confirmed yet for this booking. (If a slot/technician IS already confirmed, see 'Cx Cancellation - Active Slot Confirmed (No Refund)' instead.)", "tagEligible": "Customer explicitly asks to cancel their booking, whether due to delay, change of mind, or booked by mistake.", "tagNonEligible": "A technician/slot is already confirmed for this booking (route to 'Cx Cancellation - Active Slot Confirmed (No Refund)'), or customer wants to cancel an already-active/installed connection (route to Remove Connection - Talk to Customer).", "callType": "Request", "tat": "No refund if <48 hrs with booking fee <₹100 and no active slot (refund available after 48 hrs if setup still fails); refund within 3-5 days if booking fee >₹100 and no slot yet confirmed", "fcr": "Non - FCR", "queue": "Booking Ops Team", "ownership": "Booking Ops Team", "callObjective": "1. Acknowledge & Empathize - Understand the reason for cancellation.\n\n2. Check Fee, Booking Age & Slot Status - Confirm no technician/slot has been assigned yet.\n\n3. Confirm Outcome - No refund yet (fee <₹100, <48 hrs) vs. refund in 3-5 days (fee >₹100).", "inboundPitch": "Booking Related", "troubleshoot": "1. Confirm booking status, booking fee amount, booking age, and slot/technician assignment status in Wiom Hub.\n2. If a slot/technician IS already confirmed, redirect to the 'Cx Cancellation - Active Slot Confirmed' flow instead.\n3. If no active slot: fee <₹100 and <48 hrs → log cancellation, no refund unless 48-hr SLA is later breached. Fee >₹100 → log cancellation and initiate refund, 3-5 day timeline.", "queriesHi": ["Maine galti se booking kar di thi, use cancel kar dijiye.", "Meri booking cancel kar dijiye.", "Ab mujhe yeh connection nahi chahiye, mera request cancel kar dijiye."], "queriesEn": ["I booked the installation by mistake. Please cancel it.", "Please cancel my booking.", "I don't need the connection anymore. Cancel my request."], "resolutionPath": "Step 1: Acknowledge & empathize with the reason for cancellation → Step 2: Check booking fee amount and booking age in Wiom Hub → Step 3a (fee <₹100, <48 hrs): 'Humein afsos hai ki aap booking cancel karna chahte hain. Filhaal 48 ghante se kam samay hua hai aur hum set up ki prakriya mein hain, isliye is samay refund nahi diya jaata. Agar hum 48 ghanton ke andar set up nahi kar paate, toh aapke charges refund kar diye jaayenge' → Step 3b (fee >₹100): 'Aap app ke through apni booking cancel kar sakte hain. Agar aapne koi charges jama kiye hain, toh unka refund 3-5 din mein process kar diya jaayega' → Step 4: Log the cancellation request", "infoRetrieved": ["Booking Fee amount x", "Booking Fee Date & Time", "Customer Name", "Customer Registered number", "Partner LCO ID/CSP", "Current State", "Connection State", "Booking Status", "Booking Cancelled by (Incase it is cancelled Already)", "Booking amount Refundable (If time has exceeded)", "Booking Fee Refund Status", "any open Ticket on Kapture in last 48 hrs"], "questions": []}, {"subCategory": "Cx Cancellation - Active Slot Confirmed (No Refund)", "definition": "Customer wants to cancel their booking after a technician/slot has already been confirmed for installation - at this stage, cancellation does not carry a refund regardless of booking fee amount.", "tagEligible": "Customer requests cancellation and Wiom Hub shows an active confirmed slot/technician assignment for this booking.", "tagNonEligible": "No slot/technician has been confirmed yet (route to Cx Request Cancellation).", "callType": "Request", "tat": "On-call Resolution", "fcr": "FCR", "queue": "Booking Ops Team", "ownership": "Booking Ops Team", "callObjective": "1. Acknowledge & Empathize - Understand the reason for cancellation.\n\n2. Explain the Stage - Since a technician/slot is already committed, cancellation at this point does not carry a refund.\n\n3. Confirm & Log - Process the cancellation only if the customer still wants to proceed.", "inboundPitch": "Booking Related", "troubleshoot": "1. Confirm active slot/technician assignment in Wiom Hub.\n2. Log cancellation request in Kapture with no-refund status.", "queriesHi": ["Mera technician assign ho chuka hai, phir bhi cancel karna hai."], "queriesEn": ["My technician is already assigned, but I still want to cancel."], "resolutionPath": "Step 1: Acknowledge & empathize with the reason for cancellation → Step 2: Explain: 'Filhaal aapki booking ke liye agla step tay ho chuka hai. Agar is stage par booking cancel ki jaati hai, toh agar aapne koi charges jama kiye hain, unka refund nahi diya jaata' → Step 3: Confirm whether the customer still wants to proceed with cancellation → Step 4: Log the cancellation accordingly", "infoRetrieved": ["Partner & Slot Confirmation Status", "Open ticket Comments"], "questions": []}, {"subCategory": "Repeated Delay Escalation (>48 hrs)", "definition": "Customer has faced multiple delays and their booking is now more than 48 hours old with no active slot confirmed - requires a stronger acknowledgment and a firm resolution commitment or the option to cancel.", "tagEligible": "Booking is >48 hours old with repeated missed commitments, no installation yet, and no active slot currently confirmed.", "tagNonEligible": "Booking is within its first 48 hours (route to Installation Delay or Partner Assignment Pending).", "callType": "Complaint", "tat": "Resolution targeted within 1-2 days; refund offered if customer chooses to cancel", "fcr": "Non - FCR", "queue": "Booking Ops Team", "ownership": "Booking Ops Team", "callObjective": "1. Acknowledge & Deeply Empathize - Recognize this has gone beyond a normal delay.\n\n2. Own the Failure - Do not deflect; confirm Wiom is working to resolve it.\n\n3. Offer a Clear Choice - Continue waiting (with a committed 1-2 day resolution push) or cancel with a full refund.", "inboundPitch": "Booking Related", "troubleshoot": "1. Confirm booking age and delay history in Wiom Hub.\n2. Escalate internally as a priority case for area installation.\n3. If customer opts to cancel, log cancellation and confirm refund.", "queriesHi": ["Bahut zyada wait ho gaya hai, ab kab tak hoga?", "Baar-baar delay ho raha hai, ab main kya karu?"], "queriesEn": ["I've waited a very long time, when will this happen?", "This keeps getting delayed repeatedly, what should I do now?"], "resolutionPath": "Step 1: Acknowledge & deeply empathize: 'Hum samajhte hain yeh woh anubhav nahi hai jiski aapne ummeed ki thi' → Step 2: Own the delay: 'Kuch kaaranon ki wajah se humein aapke area mein set up karne mein ummeed se zyada samay lag raha hai' → Step 3: Commit: 'Hum poori koshish kar rahe hain ki agle 1-2 dinon ke andar aapka set up ho jaaye' → Step 4: Offer choice: 'Agar aap aur intezaar nahi karna chahte, toh aap app ya customer support ke through booking cancel kar sakte hain aur jama kiye gaye charges refund kar diye jaayenge'", "infoRetrieved": ["Booking Amount", "Booking Date & Time", "Customer Status (Installed Customer / Active Customer/Pending etc)", "Customer name", "Customer Registered number", "Ping Details (If any) = Null", "Booking Status (Installed/Pending/Cancelled),", "Booking Cancelled By", "9 Booking Cancellation Date-Time.", "Partner LCO ID/CSP ID", "Booking Fee Refund Date &time", "Booking Fee amount", "Booking Fee Refund Status", "Any open Ticket on Kapture in last 48 hrs", "Customer Address", "Technician Assigned", "Technician Assignement Date"], "questions": []}, {"subCategory": "App Issue", "definition": "Customer is unable to complete or schedule a booking because the Wiom app is crashing or showing an error.", "tagEligible": "Customer reports the app crashing, erroring, or freezing specifically while trying to complete/schedule a booking.", "tagNonEligible": "Customer's app issue is unrelated to booking, e.g. general app not opening pre-booking (route to Sales - App Issues).", "callType": "Complaint", "tat": "24 hrs", "fcr": "Non - FCR", "queue": "L2 service team", "ownership": "Service L2 team", "callObjective": "1. Acknowledge & Empathize - Recognize the customer feels stuck mid-booking.\n\n2. Troubleshoot & Capture Details - Guide basic app fixes; collect screenshot if needed.\n\n3. Reassure Ownership - Offer an alternate booking path and log the issue.", "inboundPitch": "Booking Related", "troubleshoot": "1. Ask customer to fully close and reopen the app.\n2. If still blank, Long-press app → App Info → Clear Data & Clear Cache.\n3. If issue persists, uninstall and reinstall the app.\n4. If unresolved, request screenshot on 8880322222 and log via Slack Bug Front form.", "queriesHi": ["Main app se booking complete nahi kar pa raha hoon.", "Installation schedule karte waqt app mein error aa raha hai.", "Booking karte time app baar-baar band ho raha hai."], "queriesEn": ["I'm unable to complete the booking on the app.", "The app is showing an error while scheduling installation.", "The application keeps crashing when I try to book."], "resolutionPath": "Step 1: Ask customer what exactly is not visible or not working → Step 2: Guide: 'App ek baar poori tarah band karke dobara khol kar dekhein' → Step 3: If still blank: Long-press Wiom app → App Info → Clear Data & Clear Cache → Step 4: If issue persists: Uninstall and reinstall app → Step 5: If still not resolved: request screenshot on 8880322222, fill Slack Bug Front form → Step 6: CX TL/Supervisor  updates resolution; CC Agent calls customer to close issue", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent", "Any previous whatsapp Ticket with screenshot", "Customer Name", "Booking Details", "Customer Registered number"], "questions": []}, {"subCategory": "Installation Slot Missed by CS - Reassignment", "definition": "A technician did not arrive for a scheduled installation slot, and the customer needs a new slot assigned.", "tagEligible": "Customer confirms a technician was a no-show for a confirmed installation slot.", "tagNonEligible": "Installation has not yet reached its scheduled slot time (route to Installation Timeline Inquiry).", "callType": "Complaint", "tat": "12-24 hrs for reassignment; escalate/offer cancellation if unresolved beyond 48 hrs", "fcr": "Non - FCR", "queue": "Booking Ops Team", "ownership": "Booking Ops Team", "callObjective": "1. Acknowledge & Sincerely Apologize - Own that the confirmed technician did not arrive.\n\n2. Reassure & Set Expectation - Reassignment typically happens within 12-24 hrs; new slot will appear in the app.\n\n3. Escalate at 48 hrs (if no active slot) - Offer cancellation via the app with full refund of charges paid.", "inboundPitch": "Booking Related", "troubleshoot": "1. Confirm no-show in Wiom Hub Partner & Slot details.\n2. Log a complaint ticket for installation delay / reassignment.\n3. Trigger reassignment of technician within 12-24 hrs.\n4. If booking age exceeds 48 hrs, flag for Repeated Delay Escalation path.", "queriesHi": ["Technician diye gaye time par installation ke liye nahi aaya.", "Mera installation appointment miss ho gaya, kisi aur ko bhej dijiye.", "Main poora din wait karta raha, lekin koi visit nahi hua."], "queriesEn": ["The technician didn't come during the scheduled slot.", "My installation appointment was missed. Please assign someone else.", "I waited all day, but nobody came for the installation."], "resolutionPath": "Step 1: Acknowledge & sincerely apologize that the confirmed technician did not arrive → Step 2: Reassure: 'Hum aapke liye dobara visit arrange kar rahe hain, aksar is process mein 12-24 ghante lag jaate hain' → Step 3: Confirm no action needed: 'Filhaal aapko kuch karne ki zarurat nahi hai, updates app ke through mil jaayenge' → Step 4 (if >48 hrs): 'Agar aap aur intezaar nahi karna chahte, toh aap app ya customer support ke through apni booking cancel bhi kar sakte hain. Agar aapne koi charges jama kiye hain, toh unka refund process kar diya jaayega'", "infoRetrieved": ["Booking Date", "Booking Amount", "Slot confirmed by Customer", "Customer Name", "Customer Number", "LCO ID/CSP ID", "Partner Slot Confirmation", "Technician Assigned", "Open ticket on Kapture in last 48 hrs"], "questions": []}, {"subCategory": "Technician Visit Missed by Customer", "definition": "The technician arrived for the scheduled visit but the customer was not present at home, so installation could not be completed.", "tagEligible": "Customer confirms they were not home when the technician arrived for a confirmed slot.", "tagNonEligible": "Technician did not show up at all (route to Installation Delay / Installation Slot Missed by CS - Reassignment).", "callType": "Request", "tat": "12-24 hrs to re-arrange the visit", "fcr": "Non - FCR", "queue": "Booking Ops Team", "ownership": "Booking Ops Team", "callObjective": "1. Reassure - No blame, this happens; keep the tone light and helpful.\n\n2. Re-arrange - Confirm a new visit will be arranged, typically within 12-24 hrs.\n\n3. Set Expectation - New slot details will appear in the app.", "inboundPitch": "Booking Related", "troubleshoot": "1. Log the missed visit (customer absence) in Wiom Hub/Kapture.\n2. Trigger reassignment of a new visit slot within 12-24 hrs.", "queriesHi": ["Technician aaya tha lekin main ghar par nahi tha, ab kya hoga?"], "queriesEn": ["The technician came but I wasn't home, what happens now?"], "resolutionPath": "Step 1: Reassure: 'Koi baat nahi. Agar technician ke aane ke samay aap ghar par nahi the, toh chinta ki baat nahi hai' → Step 2: Reassign: 'Hum aapke liye dobara visit arrange kar rahe hain, aksar is process mein 12-24 ghante lag jaate hain' → Step 3: Confirm: 'Filhaal aapko kuch karne ki zarurat nahi hai, naye slot ki jaankaari aapko App mein dikh jayegi'", "infoRetrieved": ["Partner & Slot Details", "Open ticket Comments"], "questions": []}, {"subCategory": "Missed Technician Phone Call", "definition": "Customer missed a call from the assigned technician and wants to know what to do next.", "tagEligible": "Customer reports missing a call from the technician and asks how to reconnect.", "tagNonEligible": "Technician has not attempted to call at all (route to Technician Unresponsive Pre-Visit).", "callType": "Query", "tat": "On-call Resolution; escalate if no contact by end of day", "fcr": "FCR", "queue": "Booking Ops Team", "ownership": "Booking Ops Team", "callObjective": "1. Reassure - No cause for concern.\n\n2. Guide - Ask the customer to call the technician back using the number in the app.\n\n3. Set a Checkpoint - Escalate if no contact happens by end of day.", "inboundPitch": "Booking Related", "troubleshoot": "1. Point customer to technician contact number visible in the app if needed.\n2. If no contact by end of day, escalate for follow-up.", "queriesHi": ["Technician ka call miss ho gaya, ab kya karu?"], "queriesEn": ["I missed a call from the technician, what should I do?"], "resolutionPath": "Step 1: Reassure: 'Agar technician ka call miss ho gaya hai, toh chinta ki baat nahi hai' → Step 2: Guide: 'Aap app mein technician ka number dekh sakte hain aur unhe ek baar wapas call karne ki koshish karein' → Step 3: Advise: 'Kripya apna phone paas rakhein aur anjaan number se aane wali calls ka bhi jawab dein' → Step 4: Set checkpoint: 'Agar din ke ant tak technician ka call ya message na aaye, toh kripya humein batayein, hum aapki sahayta karenge'", "infoRetrieved": ["Partner & Slot Details (Technician Contact Number)", "Open ticket Comments"], "questions": []}, {"subCategory": "Partner Misbehaviour", "definition": "Customer reports that the installation technician/partner behaved rudely, unprofessionally, or inappropriately during a visit.", "tagEligible": "Customer reports specific rude, threatening, or unprofessional conduct by the technician/partner during or around installation.", "tagNonEligible": "Customer's complaint is about installation delay or quality, with no conduct/behaviour issue involved (route to relevant Installation category).", "callType": "Complaint", "tat": "24 hrs", "fcr": "Non - FCR", "queue": "PX team", "ownership": "PX team", "callObjective": "1. Acknowledge & Empathize - Take the complaint seriously; do not minimize.\n\n2. Capture Incident Details - Date, time, what happened, in the customer's words.\n\n3. Log & Escalate - Raise for formal investigation and confirm the customer will hear back.", "inboundPitch": "Booking Related", "troubleshoot": "1. Capture incident details (date, time, description).\n2. Log complaint ticket under Partner Misbehaviour in Kapture.\n3. Escalate to PX team for investigation.\n4. Confirm acknowledgment timeline with the customer.", "queriesHi": ["Technician ke baat karne ka tareeka theek nahi tha", "Technician ne visit ke dauran badtameezi ki.", "Technician ne visit ke dauran bahut rude behaviour kiya."], "queriesEn": ["The technician was not polite during the interaction.", "The technician behaved inappropriately during the visit.", "Technician was unprofessional during the visit."], "resolutionPath": "Step 1: Acknowledge & empathize with the complaint → Step 2: Capture incident details: date, time, what happened → Step 3: Log complaint and escalate → Step4: Reassure: 'Yeh issue Wiom mein note ho gayi hai'", "infoRetrieved": ["Booking Date", "Booking Amount", "Connection State", "Current Statue", "LCO ID", "Customer Name", "Customer Registered Number", "Device ID", "Installation Date & Time", "SD Amount", "Booking Cancelled by : Partner", "ticket in last 48 hrs  on Kapture"], "questions": []}, {"subCategory": "Incomplete Installation", "definition": "A technician started installation but left without completing it, and the connection is not working despite being marked as installed.", "tagEligible": "Netbox/router is installed but internet is not working, and the customer confirms setup was left incomplete.", "tagNonEligible": "Installation is fully complete and the issue is a standard post-installation connectivity issue (route to Internet Issues).", "callType": "Complaint", "tat": "No refund before 48 hrs if booking fee <₹100 (auto-eligible after); refund anytime within 3-5 days if booking fee >₹100", "fcr": "Non - FCR", "queue": "Booking Ops Team", "ownership": "Booking Ops Team", "callObjective": "1. Acknowledge & Empathize - Recognize the setup was left unfinished.\n\n2. Verify Status - Confirm in the app/Wiom Hub that installation is marked but internet is not working.\n\n3. Check Fee & Booking Age - Same refund/cancellation rule applies as other delay scenarios: no refund before 48 hrs if booking fee <₹100, refund anytime (3-5 days) if booking fee >₹100.", "inboundPitch": "Booking Related", "troubleshoot": "1. Check Wiom Hub booking status - confirm marked 'Installed' vs actual connectivity.\n2. Log complaint ticket under Incomplete Installation.\n3. Escalate to partner follow-up team for a return visit.\n4. If customer requests cancellation, apply the booking-fee/48-hr refund rule.", "queriesHi": ["Netbox lag gaya hai lekin internet chal nahi raha.", "Mera WiFi setup abhi bhi adhura hai.", "Installation shuru toh hua tha, lekin abhi tak complete nahi hua."], "queriesEn": ["The netbox has been installed, but the internet is still not working", "My WiFi setup is only partially done.", "Installation started but it hasn't been finished yet."], "resolutionPath": "Step 1: Acknowledge & empathize → Step 2: Check App status — confirm installation is marked but internet not working → Step 3: Log as incomplete installation issue → Step 4: Reassure: 'Yeh Wiom mein note ho gayi hai — aapko App par next update milega' → Step 5: If customer wants to cancel, apply the same booking-fee/48-hr refund rule as other delay scenarios", "infoRetrieved": ["Booking Date", "Booking Amount", "Connection State", "Current Statue", "LCO ID", "C ustomer Name", "Customer Registered Number", "Device ID", "Installation Date & Time", "SD Amount", "Booking Cancelled by : Partner", "ticket in last 48 hrs  on Kapture", "Current Ping Status", "Installation Date", "Installation Amount paid", "Booking address"], "questions": []}]}], "scriptTabs": [{"name": "Sales", "title": "CATEGORY: Sales", "subtitle": "Covers pre-sales queries from prospective customers - product understanding, serviceability, pricing, booking process, and speed/coverage expectations. Scripts updated per the Jul/Aug experiment revision - charges are offer/area-dependent, so do not quote fixed amounts on call; always direct the customer to the app.", "items": [{"type": "banner", "text": "COMMON OPENING — applies to every sub-category in this tab"}, {"type": "step", "step": "1. Call Greeting", "subCategory": "", "hindi": "नमस्ते! WIOM में call करने के लिए धन्यवाद। मैं [Name] बात कर रहा/रही हूँ। मैं आपकी क्या सहायता कर सकता/सकती हूँ?\n\n(ग्राहक को पूरी बात बताने दें, बीच-बीच में \"जी\", \"बिल्कुल\", \"मैं समझ रहा/रही हूँ\" से acknowledge करें)", "backend": "—"}, {"type": "step", "step": "2. Understand Requirement", "subCategory": "", "hindi": "\"Customer Name\", बताइए आप WIOM के बारे में क्या जानना चाहेंगे — product, serviceability, pricing या booking process?", "backend": "ग्राहक नया prospect है या मौजूदा WIOM user है, यह Wiom Hub/Kapture में mobile number से check करें।"}, {"type": "banner", "text": "SUB-CATEGORY: Product Explanation"}, {"type": "step", "step": "3. What is Wiom / Recharge-wala ghar ka net", "subCategory": "What is Wiom / Recharge-wala ghar ka net", "hindi": "WIOM एक recharge-wala घर का नेट है — पूरा घर एक ही नेट से चलता है: TV, mobile, laptop वगैरह सब साथ-साथ। आप जितने दिन चाहें उतने दिन का recharge करके चला सकते हैं — 1 दिन, 7 दिन, 14 दिन या जितना भी आपको चाहिए।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. This is not an existing customer"}, {"type": "step", "step": "4. How it is different (recharge vs monthly)", "subCategory": "How it is different (recharge vs monthly)", "hindi": "सर, WIOM में घर का नेट recharge करने का तरीका mobile recharge जैसा ही है। लेकिन फ़र्क़ यह है कि एक ही service से पूरा घर चल सकता है — 8 से 12 mobile, TV और laptop सब एक साथ। आप जितनी ज़रूरत हो उतना इस्तेमाल कर सकते हैं, और अपनी सुविधा के हिसाब से 1 दिन, 7 दिन या 14 दिन का recharge चुन सकते हैं।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. Dynamic Recharge plan prices ( pick current plans or offers from backend system)"}, {"type": "banner", "text": "SUB-CATEGORY: Serviceability / Area Check"}, {"type": "step", "step": "5. Area serviceable check", "subCategory": "Area serviceable check", "hindi": "मैं आपकी सहायता करता/करती हूँ यह जानने में कि WIOM आपके पते पर उपलब्ध है या नहीं। कृपया WIOM app Play Store से download करें और उसमें अपना पता/location डालें — app तुरंत बता देगा कि service उपलब्ध है या नहीं। अगर उपलब्ध हो, तो आप वहीं से booking भी शुरू कर सकते हैं।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. Servicability check basis - Customer location if customer has already entered details"}, {"type": "step", "step": "6. Non-serviceable area", "subCategory": "Non-serviceable area", "hindi": "WIOM का नेट आपके area में मिलता है या नहीं, यह app पर ही दिख जाता है। अगर अभी दिख रहा है कि WIOM आपके इलाके में उपलब्ध नहीं है, तो इसका मतलब है कि आपके बताए पते पर अभी WIOM आया नहीं है। जैसे ही availability होगी, app में update दिख जाएगा।", "backend": "ग्राहक का पता/pincode note करें और demand waitlist में दर्ज करें (Customer Chat Tool)।"}, {"type": "banner", "text": "SUB-CATEGORY: Recharge & Pricing"}, {"type": "step", "step": "7. Recharge Options / Price", "subCategory": "Recharge Options / Price", "hindi": "Fixed amount नहीं होता — जितने दिन चाहिए उतना recharge। एक दिन का recharge ₹23 से होता है, और ऐसे ही कई option हैं जो आपको app में दिखते हैं। अगर आप monthly लेना चाहते हैं, तो 28 दिन का recharge भी होता है जो ₹565 का पड़ता है। बाकी option आप app में देख सकते हैं। Booking amount पे करने से पहले भी app में \"recharge के विकल्प\" पर जाकर recharge option देख सकते हैं।", "backend": "App के 'Recharge ke Vikalp' section में मौजूदा plans दिखाएं।"}, {"type": "step", "step": "8. Recharge Duration", "subCategory": "Recharge Duration", "hindi": "जितने दिन का recharge करते हैं, उतने दिन घर का नेट चलता है। Recharge खत्म होने पर नेट रुक जाता है। दोबारा recharge करते ही नेट फिर चालू हो जाता है।", "backend": "कुछ नहीं — पूरी तरह मौखिक जानकारी।"}, {"type": "banner", "text": "SUB-CATEGORY: Booking Process & Charges"}, {"type": "step", "step": "9. How to book / process?", "subCategory": "How to book / process?", "hindi": "बिल्कुल, आपकी सहायता की जाएगी। WIOM घर का नेट है जिसमें आप अपनी ज़रूरत के हिसाब से 1 दिन, 7 दिन, 28 दिन — जितना आप चाहें उतने दिन का recharge चुन सकते हो। Booking के लिए आप WIOM app Play Store से download करके अपना location check कर सकते हैं और booking कर सकते हैं। पूरी details app में मिल जाएंगी।\n\n(दूसरे connection के लिए) अगर आपको एक और booking करनी है, तो WIOM app download करके एक नया mobile number add करना होगा — हर number पर एक ही service book होती है।\n\n(app ज़रूरी है) हाँ, recharge वाला घर का नेट app के through ही book और manage होता है। सारी जानकारी app में ही दिखती है।", "backend": "Customer Chat Tool में address डालकर serviceability confirm करें, फिर app में guided booking flow बताएं।"}, {"type": "step", "step": "10. Deferred", "subCategory": "Deferred", "hindi": "बिल्कुल। आप जब चाहें, app पर जाकर decide कर सकते हैं।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. Servicability check basis - Customer location if customer has already entered details"}, {"type": "step", "step": "11. Booking fee (Rs.100) & Security deposit (Rs.300)", "subCategory": "Booking fee (Rs.100) & Security deposit (Rs.300)", "hindi": "(charges क्या हैं) WIOM एक घर का नेट है जिसमें आप अपनी ज़रूरत के हिसाब से जितने दिन चाहें उतने दिन का recharge कर सकते हैं। Service शुरू करने के लिए पहला recharge करना होता है। WIOM में अलग-अलग offer हो सकते हैं — आपके लिए जो offer वैध होगा, उसके हिसाब से payment और booking process app में booking के दौरान दिख जाएगा। कुछ offers में payment में NetBox के लिए refundable security deposit भी शामिल होती है, जो service बंद करने और NetBox वापस करने पर पूरी तरह वापस मिल जाती है। कृपया app में दिख रही जानकारी को ही सही मानें।\n\n(booking fee क्यों है) booking fee इसलिए होती है क्योंकि इसमें engineer का home visit confirm होता है। अगर किसी भी कारण से नेट नहीं लग पाता तो यह वापस की जाती है।\n\n(refundable है क्या) हाँ, अगर किसी भी वजह से engineer नहीं आ पाते हैं, तो आपकी booking fee refund हो जाता है।\n\n(process साफ़ नहीं बता रहे) recharge option और booking का process कुछ इलाकों में demand और availability के हिसाब से अलग हो सकता है। WIOM का घर का नेट शुरू करने के लिए पहला recharge और NetBox के लिए refundable security deposit से जुड़े payment लागू हो सकते हैं। आपके area के लिए जो latest booking steps हैं, वो आपको app में दिख जाएंगे।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. Booking Fee (If visible to customer)\n3. SD(If visible to customer)"}, {"type": "step", "step": "12. Payment Options", "subCategory": "Payment Options", "hindi": "WIOM का नेट सिर्फ WIOM app से recharge होता है, cash का option नहीं होता। अगर आपके पास UPI या card नहीं है, तो आप किसी दोस्त, परिवार के member या पास की दुकान से WIOM app का QR scan करवाकर recharge करा सकते हैं।", "backend": "कुछ नहीं — पूरी तरह मौखिक जानकारी।"}, {"type": "banner", "text": "SUB-CATEGORY: Installation Timeline Enquiry"}, {"type": "step", "step": "13. Setup timeline (pre-booking info)", "subCategory": "Setup timeline (pre-booking info)", "hindi": "आम तौर पर 2-3 दिन में नेट लग जाता है। Booking के बाद आप app पर खुद दिन देख सकते हो।\n\n(booking के बाद क्या होता है) booking complete होने के बाद हमारे engineer आपके घर नेट set up करने आएंगे। Set up complete होते ही WIOM की तरफ से आपको कुछ दिन का free घर का नेट मिलेगा (मौजूदा scheme के हिसाब से दिनों की संख्या तय होती है, exact जानकारी app में दिख जाएगी)। उसके बाद आप अपनी ज़रूरत के हिसाब से जितने दिन चाहें उतने दिन का recharge करके नेट चला सकते हैं।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\nIf visible to customer & our system (Free internet Days)"}, {"type": "banner", "text": "SUB-CATEGORY: Other"}, {"type": "step", "step": "14. Misc not in above (iPhone, OTT, old plan)", "subCategory": "Misc not in above (iPhone, OTT, old plan)", "hindi": "(OTT bundle) नहीं, WIOM recharge-wala घर का नेट में OTT bundle उपलब्ध नहीं है।\n\n(iPhone) WIOM की app अभी iPhone के लिए उपलब्ध नहीं है। आप किसी family member से Android phone लेकर app download कर सकते हैं।\n\n(पुराना plan) पहले का offer अभी उपलब्ध नहीं है, WIOM recharge वाला घर का नेट ही उपलब्ध है। App में जो recharge option दिखते हैं, वही उपलब्ध option होते हैं।", "backend": "—"}, {"type": "banner", "text": "SUB-CATEGORY: Speed, Range & Devices"}, {"type": "step", "step": "15. Speed", "subCategory": "Speed", "hindi": "Speed आम तौर पर 80-100 Mbps तक आती है। यह पूरे घर के इस्तेमाल के लिए बना है जिसमें 8-12 mobile, TV, laptop सब साथ चलता है। WIOM में recharge days के हिसाब से होता है, speed के हिसाब से नहीं।", "backend": "कुछ नहीं — पूरी तरह मौखिक जानकारी।"}, {"type": "step", "step": "16. Range / Coverage", "subCategory": "Range / Coverage", "hindi": "Recharge वाला घर का नेट पूरे घर के लिए design होता है — TV, mobile, laptop सब चलते हैं। Range आपके area और setup पर निर्भर करती है। Installation के समय engineer check करके range बता देते हैं।", "backend": "कुछ नहीं — installation engineer द्वारा site पर confirm किया जाएगा।"}, {"type": "step", "step": "17. Devices / usage", "subCategory": "Devices / usage", "hindi": "हाँ, recharge वाला घर का नेट रोज़ के काम के लिए बनाया गया है — video देखना (Netflix/YouTube), office का काम, और घर के सभी लोगों का साथ-साथ इस्तेमाल। यह आम घर के लिए बनाया गया है जहाँ 8-12 mobile, TV और laptop एक साथ इस्तेमाल होते हैं।", "backend": "कुछ नहीं — पूरी तरह मौखिक जानकारी।"}, {"type": "banner", "text": "SUB-CATEGORY: App Issues"}, {"type": "step", "step": "18. App not loading / blank (log page+issue)", "subCategory": "App not loading / blank (log page+issue)", "hindi": "मुझे खेद है कि आपको app में दिक्कत आ रही है। कृपया एक बार app को पूरी तरह बंद करके दोबारा खोलें। अगर फिर भी screen खाली दिख रही है, तो WIOM app को long-press करें → App Info → Clear Data और Clear Cache करें। समस्या बनी रहने पर app को uninstall करके दोबारा install करें। अगर login या OTP नहीं आ रहा है, तो कृपया screenshot 8880322222 पर भेज दें।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. Any previous whatsapp Ticket with screenshot \n3. Any ticket raised within 48 hrs on kapture \n4. Customer Name \n5. Customer Registered Mobile"}, {"type": "banner", "text": "SUB-CATEGORY: Booking Interest (Warm Lead)"}, {"type": "step", "step": "19. Wants help to book / interested", "subCategory": "Wants help to book / interested", "hindi": "बहुत अच्छा! मैं आपकी पूरी booking process में मदद करता/करती हूँ। सबसे पहले, app में अपना पता check करते हैं कि service उपलब्ध है या नहीं। अगर उपलब्ध है, तो पहला recharge और (अगर लागू हो तो) refundable security deposit की जानकारी app में booking के दौरान दिख जाएगी — exact amount आपके area के offer पर निर्भर करता है। WIOM app खोलिए, अपना location डालिए और booking कर लीजिए — किसी भी सवाल के लिए मैं यहीं हूँ।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. Customer Name \n3. Customer Registered Mobile"}, {"type": "banner", "text": "COMMON CLOSING — applies to every sub-category in this tab"}, {"type": "step", "step": "Offer Further Help", "subCategory": "", "hindi": "क्या मैं आपकी और कोई सहायता कर सकता/सकती हूँ, \"Customer Name\"?", "backend": "—"}, {"type": "step", "step": "Call Closure", "subCategory": "", "hindi": "आपका feedback हमारे लिए बहुत महत्वपूर्ण है। मैं आपकी call IVR पर transfer कर रहा/रही हूँ। कृपया 1 से 5 के बीच rating दें, जिसमें 5 सर्वोत्तम है। WIOM को call करने के लिए धन्यवाद। आपका दिन शुभ हो।", "backend": "—"}]}, {"name": "Status - Booking", "title": "CATEGORY: Status/Booking", "subtitle": "Covers queries and complaints from customers who have already booked/paid for installation. Failure-scenario scripts below are verbatim from the revised SLA framework: 24-48 hrs for partner assignment, 12-24 hrs for re-visit arrangement, cancellation via the app only, and a refund policy driven by booking-fee amount, booking age, AND whether a technician/slot is already confirmed (confirmed slot = no refund on cancellation).", "items": [{"type": "banner", "text": "COMMON OPENING — applies to every sub-category in this tab"}, {"type": "step", "step": "1. Call Greeting", "subCategory": "", "hindi": "नमस्कार, call करने के लिए धन्यवाद। WIOM से मैं [Name] बात कर रहा/रही हूँ। मैं आपकी कैसे सहायता कर सकता/सकती हूँ?\n\n(customer को पूरी समस्या बताने दें, समय-समय पर \"जी\", \"ठीक है\", \"मैं समझ रहा/रही हूँ\" से acknowledge करें)", "backend": "—"}, {"type": "step", "step": "2. Apology & Acknowledgement", "subCategory": "", "hindi": "आपको हुई असुविधा के लिए हमें खेद है। मैं आपकी समस्या को पूरी तरह से हल कराने में आपकी पूरी मदद करूँगा/करूँगी।", "backend": "—"}, {"type": "step", "step": "3. Booking Verification", "subCategory": "", "hindi": "मैं आपकी booking details check कर रहा/रही हूँ। क्या आप कृपया अपना registered mobile number  बता सकते हैं?", "backend": "Wiom Hub में mobile number से booking details search करें।"}, {"type": "banner", "text": "SUB-CATEGORY: Booking Related — Failure & Delay Scenarios (revised SLA)"}, {"type": "step", "step": "4. Partner Assignment Pending", "subCategory": "Partner Assignment Pending", "hindi": "आपकी booking हमारे system में आ गई है। इस stage में हम आपके area में घर का नेट set up की तैयारी कर रहे हैं। कभी-कभी area में set up की availability की वजह से थोड़ा समय लग सकता है। अक्सर इस process में 24-48 घंटे लग जाते हैं। फिलहाल आपको कुछ करने की ज़रूरत नहीं है। इस दौरान अगर कोई update होता है, तो वो आपको app के through मिल जाएगा।\n\n(दूसरा response) और अगर किसी भी वजह से आपका घर का नेट set up नहीं हो पाता है, तो आपके जमा किए गए charges refund कर दिए जाएंगे।", "backend": "1.Booking /Partner Assignment Status\nOpen ticket Comments\n2. Current State\n3. Connection State \n4. Installation Date = No Date \n5. Booking Date \n6. Customer Slot confirmed \n7. Technician Assigned\n8. Any prior Ticket on Kapture which is within 48 hrs \n9. Customer Name"}, {"type": "step", "step": "5. Installation Delay (Slot Breach / Technician Refused)", "subCategory": "Installation Delay (Slot Breach / Technician Refused)", "hindi": "हमें खेद है कि आपके लिए जो visit schedule की गई थी, उस दिन घर का नेट set up complete नहीं हो पाया। इस असुविधा के लिए हम माफ़ी चाहते हैं। हम आपके लिए दोबारा visit arrange कर रहे हैं। अक्सर इस process में 12-24 घंटे लग जाते हैं। फिलहाल आपको कुछ करने की ज़रूरत नहीं है। नए slot की जानकारी आपको आपके App में दिख जाएगी।\n\n(दूसरा response, अगर >48 घंटे और कोई active slot न हो) अगर आप और इंतज़ार नहीं करना चाहते, तो आप app के through अपनी booking cancel भी कर सकते हैं। अगर आपने कोई charges जमा किए हैं, तो उनका refund process कर दिया जाएगा।", "backend": "Wiom Hub में Booking/Installation status और Slot Confirmation check करें; Kapture में Installation Delay complaint ticket create करें; 48 घंटे से ज़्यादा और कोई active slot न होने पर Repeated Delay Escalation में flag करें।"}, {"type": "step", "step": "6. Technician Unresponsive Pre-Visit", "subCategory": "Technician Unresponsive Pre-Visit", "hindi": "हमें खेद है कि technician अभी तक आपसे संपर्क नहीं कर पाए हैं। हो सकता है कि वो इस समय किसी और set up में व्यस्त हों। आम तौर पर technician दिन के अंत तक आपसे संपर्क कर लेते हैं। अगर आपके slot से पहले technician आपसे contact न करें, तो कृपया हमें बताएं। हम आपकी सहायता करेंगे।", "backend": "1- Booking/Installation status\n2- Partner Slot Confirmation status \n3- Booking age (time since booking)\n4. Current State (Installation Journey)\n5. Connection State (Installation Journey) \n6. Installation Date (Logic Current Date > Installation date by 48 hrs) \n7. Booking Date \n8. Customer Slot confirmed \n9. Technician Assigned\n10. LCO ID/CSP ID \n11. Any prior Ticket on Kapture which is within 48 hrs\n12. Technician Contact Details \n13. Customer Name"}, {"type": "step", "step": "7. Installation Slot Missed by CS - Reassignment", "subCategory": "Installation Slot Missed by CS - Reassignment", "hindi": "हमें खेद है कि technician के confirm करने के बाद भी घर का नेट set up नहीं हो पाया। इस असुविधा के लिए हम माफ़ी चाहते हैं। हम आपके लिए दोबारा visit arrange कर रहे हैं। अक्सर इस process में 12-24 घंटे लग जाते हैं। फिलहाल आपको कुछ करने की ज़रूरत नहीं है। इस दौरान के updates आपको app के through मिल जाएंगे।\n\n(दूसरा response, अगर >48 घंटे और कोई active slot न हो) अगर आप और इंतज़ार नहीं करना चाहते, तो आप app के through अपनी booking cancel भी कर सकते हैं। अगर आपने कोई charges जमा किए हैं, तो उनका refund process कर दिया जाएगा।", "backend": "1. Booking Date \n2. Booking Amount \n3. Slot confirmed by Customer \n4. Customer Name \n5. Customer Number \n6. LCO ID/CSP ID \n7. Partner Slot Confirmation\n8. Technician Assigned \n9.Open ticket on Kapture in last 48 hrs"}, {"type": "step", "step": "8. Technician Visit Missed by Customer", "subCategory": "Technician Visit Missed by Customer", "hindi": "कोई बात नहीं। अगर technician के आने के समय आप घर पर नहीं थे, तो चिंता की बात नहीं है। हम आपके लिए दोबारा visit arrange कर रहे हैं। अक्सर इस process में 12-24 घंटे लग जाते हैं। फिलहाल आपको कुछ करने की ज़रूरत नहीं है। नए slot की जानकारी आपको आपके App में दिख जाएगी।", "backend": "Wiom Hub/Kapture में customer-absence missed-visit log करें; 12-24 घंटे में नया visit slot assign करें।"}, {"type": "step", "step": "9. Missed Technician Phone Call", "subCategory": "Missed Technician Phone Call", "hindi": "अगर technician का call miss हो गया है, तो चिंता की बात नहीं है। आप app में technician का number देख सकते हैं और उन्हें एक बार वापस call करने की कोशिश करें। आम तौर पर technician दोबारा भी संपर्क करते हैं। कृपया अपना phone पास रखें और अनजान number से आने वाली calls का भी जवाब दें। अगर दिन के अंत तक technician का call या message न आए, तो कृपया हमें बताएं। हम आपकी सहायता करेंगे।", "backend": "ज़रूरत पड़ने पर app में technician का contact number दिखाएं; दिन के अंत तक कोई संपर्क न होने पर escalate करें।"}, {"type": "step", "step": "10. Repeated Delay Escalation (>48 hrs, no active slot)", "subCategory": "Repeated Delay Escalation (>48 hrs, no active slot)", "hindi": "हमें खेद है कि आपको इतना इंतज़ार करना पड़ा। हम समझते हैं कि यह वो अनुभव नहीं है जिसकी आपने उम्मीद की थी। कुछ कारणों की वजह से हमें आपके area में घर का नेट set up करने में उम्मीद से ज़्यादा समय लग रहा है। हम पूरी कोशिश कर रहे हैं कि अगले 1-2 दिनों के अंदर आपका set up हो जाए।\n\nअगर आप और इंतज़ार नहीं करना चाहते, तो आप app के through अपनी booking cancel भी कर सकते हैं। अगर आपने कोई charges जमा किए हैं, तो उनका refund process कर दिया जाएगा।", "backend": "Wiom Hub में booking age और delay history confirm करें; area installation के लिए priority case के रूप में escalate करें।"}, {"type": "banner", "text": "SUB-CATEGORY: Cancellation & Refund (revised policy - depends on fee, booking age, AND slot confirmation status)"}, {"type": "step", "step": "11. Cx Request Cancellation — booking fee <₹100, <48 hrs, no active slot", "subCategory": "Cx Request Cancellation — booking fee <₹100, <48 hrs, no active slot", "hindi": "हमें अफ़सोस है कि आप अपनी booking cancel करना चाहते हैं। फिलहाल आपकी booking को 48 घंटे से कम समय हुआ है और हम आपका घर का नेट set up करने की प्रक्रिया में हैं। इसलिए अगर इस समय booking आपकी तरफ से cancel की जाती है, तो refund नहीं दिया जाता। अगर हम 48 घंटों के अंदर आपका घर का नेट set up नहीं कर पाते, तो आप cancel कर सकते हैं और आपके जमा किए गए charges refund कर दिए जाएंगे।", "backend": "1- Booking Fee amount x\n2. Booking Fee Date & Time \n3. Customer Name \n4. Customer Registered number \n5. Partner LCO ID/CSP \n6. Current State \n7. Connection State \n8. Booking Status\n9. Booking Cancelled by (Incase it is cancelled Already) \n10. Booking amount Refundable (If time has exceeded)\n11. Booking Fee Refund Status \n12. any open Ticket on Kapture in last 48 hrs"}, {"type": "step", "step": "12. Cx Cancellation - Active Slot Confirmed (No Refund)", "subCategory": "Cx Cancellation - Active Slot Confirmed (No Refund)", "hindi": "हमें अफ़सोस है कि आप अपनी booking cancel करना चाहते हैं। फिलहाल आपकी booking के लिए अगला step तय हो चुका है। अगर इस stage पर booking cancel की जाती है, तो अगर आपने कोई charges जमा किए हैं, उनका refund नहीं दिया जाता।", "backend": "Wiom Hub में active slot/technician assignment confirm करें; Kapture में cancellation request log करें (no-refund status)।"}, {"type": "step", "step": "13. Cx Request Cancellation — booking fee >₹100, slot not confirmed", "subCategory": "Cx Request Cancellation — booking fee >₹100, slot not confirmed", "hindi": "हमें अफ़सोस है कि आप अपनी booking cancel करना चाहते हैं। आप app के through अपनी booking cancel कर सकते हैं। अगर आपने कोई charges जमा किए हैं, तो उनका refund 3-5 दिन में process कर दिया जाएगा।", "backend": "1- Booking Fee amount x\n2. Booking Fee Date & Time \n3. Customer Name \n4. Customer Registered number \n5. Partner LCO ID/CSP \n6. Current State \n7. Connection State \n8. Booking Status\n9. Booking Cancelled by (Incase it is cancelled Already) \n10. Booking amount Refundable (If time has exceeded)\n11. Booking Fee Refund Status \n12. any open Ticket on Kapture in last 48 hrs"}, {"type": "banner", "text": "SUB-CATEGORY: Booking Related — Other Scenarios"}, {"type": "step", "step": "14. Installation Timeline Inquiry", "subCategory": "Installation Timeline Inquiry", "hindi": "Booking के बाद installation की सारी updates आपको WIOM app पर ही मिलती रहेंगी। अगर status में \"Technical team will connect\" दिख रहा है, तो इसका मतलब है हमारी team इस पर काम कर रही है — exact timing नहीं बता सकता/सकती, लेकिन app पर update आता रहेगा।", "backend": "1- Booking Amount \n2. Booking Date \n3- Customer Status (Installed Customer / Active Customer)\n4. Customer name\n5. Customer Registered number \n6. Ping Details (If any) \n7. Installation Slot \n8. Booking Status (Installed/Pending/Cancelled), \n9. Booking Cancelled By, Booking \n10. Cancellation Date-Time.\n11. Partner LCO ID/CSP ID , Slot \n12. Technician Assigned \n13. Booking Fee Refund Date &time \n14. Booking Fee amount\n15. Any open Ticket on Kapture in last 48 hrs  \n16. Connection Status (Installation Journey) \n17. Current State (Installation Journey)"}, {"type": "step", "step": "15. Installation Expediting Request", "subCategory": "Installation Expediting Request", "hindi": "आपकी urgency समझ आ रही है। अगर WIOM app में engineer का number दिख रहा है, तो आप उन्हें सीधे call करके status पूछ भी सकते हैं। मैं आपकी priority request log कर रहा/रही हूँ, आपको app पर अगला update मिल जाएगा।", "backend": "1- Booking Amount \n2. Booking Date & Time \n3- Customer Status (Installed Customer / Active Customer/Pending etc)\n4. Customer name\n5. Customer Registered number \n6. Ping Details (If any) = Null \n7. Booking Status (Installed/Pending/Cancelled), \n8. Booking Cancelled By\n9 Booking Cancellation Date-Time.\n11. Partner LCO ID/CSP ID \n12. Booking Fee Refund Date &time \n13. Booking Fee amount\n14. Booking Fee Refund Status \n15. Any open Ticket on Kapture in last 48 hrs\n16.Customer Address \n17. Technician Assigned \n28. Technician Assignement Date"}, {"type": "step", "step": "16. App Issue", "subCategory": "App Issue", "hindi": "मुझे खेद है कि booking करते समय आपको app में दिक्कत आ रही है। कृपया एक बार app को पूरी तरह बंद करके दोबारा खोलें। अगर फिर भी error आ रहा है, तो WIOM app को long-press करें → App Info → Clear Data और Clear Cache करें। समस्या बनी रहने पर screenshot 8880322222 पर भेज दें।", "backend": "1- No CX info  referenced – purely verbal product explanation by agent\n2. Any previous whatsapp Ticket with screenshot \n3. Customer Name \n4. Booking Details \n5. Customer Registered number"}, {"type": "step", "step": "17. Partner Misbehaviour", "subCategory": "Partner Misbehaviour", "hindi": "आपको हुई इस परेशानी के लिए मुझे बहुत खेद है, और मैं इसे बहुत गंभीरता से ले रहा/रही हूँ। कृपया मुझे बताइए कि visit किस दिन और किस समय हुई थी, और वहाँ क्या हुआ। मैं आपकी शिकायत को log करके तुरंत escalate कर रहा/रही हूँ।", "backend": "1. Booking Date \n2. Booking Amount \n3. Connection State \n4. Current Statue \n5. LCO ID \n6. Customer Name \n7. Customer Registered Number \n8. Device ID \n9. Installation Date & Time \n10. SD Amount \n11.  Booking Cancelled by : Partner \n12. ticket in last 48 hrs  on Kapture"}, {"type": "step", "step": "18. Incomplete Installation", "subCategory": "Incomplete Installation", "hindi": "समझ आ रहा है कि setup अभी अधूरा है — इसके लिए हमें खेद है। मैं आपकी app status check कर रहा/रही हूँ। यह issue हमारे system में note हो गया है, आपको app पर अगला update मिल जाएगा।", "backend": "1. Booking Date \n2. Booking Amount \n3. Connection State \n4. Current Statue \n5. LCO ID \n6. C ustomer Name \n7. Customer Registered Number \n8. Device ID \n9. Installation Date & Time \n10. SD Amount \n11.  Booking Cancelled by : Partner \n12. ticket in last 48 hrs  on Kapture\n13. Current Ping Status \n14. Installation Date \n15. Installation Amount paid \n16. Booking address"}, {"type": "banner", "text": "COMMON CLOSING — applies to every sub-category in this tab"}, {"type": "step", "step": "Offer Further Help", "subCategory": "", "hindi": "क्या मैं आपकी और कोई सहायता कर सकता/सकती हूँ, \"Customer Name\"?", "backend": "—"}, {"type": "step", "step": "Call Closure", "subCategory": "", "hindi": "आपका feedback हमारे लिए बहुत महत्वपूर्ण है। मैं आपकी call IVR पर transfer कर रहा/रही हूँ। कृपया 1 से 5 के बीच rating दें, जिसमें 5 सर्वोत्तम है। WIOM को call करने के लिए धन्यवाद। आपका दिन शुभ हो।", "backend": "—"}]}, {"name": "Internet Issues", "title": "CATEGORY: Internet Issues", "subtitle": "Covers all connectivity/quality complaints. Ask what the customer is experiencing first, then route to the matching sub-category below. Mandatory: whenever you create a ticket in Kapture for any Internet Issues sub-category, mention the Ping delay in the ticket notes.", "items": [{"type": "banner", "text": "COMMON OPENING — applies to every sub-category in this tab"}, {"type": "step", "step": "1. Call Greeting", "subCategory": "", "hindi": "नमस्कार, call करने के लिए धन्यवाद। WIOM से मैं [Name] बात कर रहा/रही हूँ। मैं आपकी कैसे सहायता कर सकता/सकती हूँ?\n\n(customer को पूरी समस्या बताने दें, समय-समय पर \"जी\", \"ठीक है\", \"मैं समझ रहा/रही हूँ\" से acknowledge करें)", "backend": "—"}, {"type": "step", "step": "2. Apology & Acknowledgement", "subCategory": "", "hindi": "आपको हुई असुविधा के लिए humein khed hai। मैं आपकी समस्या को पूरी तरह से हल कराने में आपकी मदद करूँगा/करूँगी।", "backend": "—"}, {"type": "step", "step": "3. Customer Verification (Registered)", "subCategory": "", "hindi": "मैं आपके details check कर रहा/रही हूँ। मैं देख पा रहा/रही हूँ कि यह Recharge Wala Ghar Ka Net \"Customer Name\" के नाम पर registered है। क्या मैं उन्हीं से बात कर रहा/रही हूँ?", "backend": "Agent Wiom Hub में registered number या device ID से ग्राहक विवरण check करेगा।"}, {"type": "step", "step": "3.1 Customer Verification (Not Registered)", "subCategory": "", "hindi": "आप जिस number से call कर रहे हैं, उससे मैं details check नहीं कर पा रहा/रही हूँ। क्या आप कृपया अपना registered number या device ID बता सकते हैं?", "backend": "—"}, {"type": "step", "step": "3.1.1 Verification After Details Received", "subCategory": "", "hindi": "जानकारी देने के लिए धन्यवाद। मैं आपके Ghar Ka Net की जानकारी check कर रहा/रही हूँ। यह Recharge Wala Ghar Ka Net \"Customer Name\" के नाम पर registered है। क्या मैं \"Customer Name\" से ही बात कर रहा/रही हूँ?\n\n(Female → First Name + जी, Male → Last Name + जी)", "backend": "Wiom Hub में details check करना।"}, {"type": "banner", "text": "SUB-CATEGORY: Internet Supply Down"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Internet Supply Down", "hindi": "मैं समझ सकता/सकती हूँ \"[Customer Name]\" कि आपका नेट काम नहीं कर रहा है।", "backend": "Ping delay check करें + Recharge validity देखें"}, {"type": "step", "step": "5. Troubleshooting Intro", "subCategory": "Internet Supply Down", "hindi": "क्या मैं आपसे कुछ जानकारी ले सकता/सकती हूँ?", "backend": "Troubleshooting शुरू करें"}, {"type": "step", "step": "5.1 Restart Check", "subCategory": "Internet Supply Down", "hindi": "क्या आपने Net Box को restart किया है?\n\nIf No: कोई बात नहीं। कृपया Net Box को power switch से बंद करें और 30 seconds बाद चालू करें। मैं call पर ही बना/बनी हुई हूँ।", "backend": "—"}, {"type": "step", "step": "5.2 Device Type Check (If Required)", "subCategory": "Internet Supply Down", "hindi": "क्या आपके घर पर एक Net Box है या दो Net Box लगे हैं?", "backend": "—"}, {"type": "step", "step": "5.3 Router Light Check", "subCategory": "Internet Supply Down", "hindi": "क्या आपके Net Box में लाल light जल रही है?", "backend": "—"}, {"type": "step", "step": "5.4 CRM Additional Information (Mandatory before Ticket Creation)", "subCategory": "Internet Supply Down", "hindi": "Ticket create करने से पहले Kapture में यह जानकारी confirm करें (Internet Supply Down Additional Information):\n• Net box pe red light on hai kya? *\n• Netbox restart kiya? *", "backend": "Kapture ticket form → \"Internet Supply Down Additional Information\" के तीनों mandatory (*) dropdown fields भरें, तभी ticket save होगा।"}, {"type": "step", "step": "6. If Internet NOT Working After Restart", "subCategory": "Internet Supply Down", "hindi": "आपके सहयोग के लिए धन्यवाद। Hum ne आपकी शिकायत दर्ज कर lee hai।\n\nकृपया हमें 24 घंटे तक का समय दें। सामान्यतः हमारी team 24 घंटे में समस्या का समाधान कर देती है।\n\nअगर आप समाधान से संतुष्ट नहीं हैं तो apne Wiom App se ticket को reopen कर सकते हैं।", "backend": "Kapture में Ticket Create करें (Open रखें) — TAT: 24 घंटे\nKapture ticket notes में Ping delay mention करना mandatory है।"}, {"type": "step", "step": "7. If Internet Works After Restart (On-Call Resolve)", "subCategory": "Internet Supply Down", "hindi": "जानकारी के लिए धन्यवाद।\n\nक्या मैं आपकी ticket On-Call Resolve कर दूँ?", "backend": "Kapture में \"On Call Resolve\" + Ameyo portal update"}, {"type": "banner", "text": "SUB-CATEGORY: Recharge Done but Internet Not Working"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Recharge Done but Internet Not Working", "hindi": "मैं समझ सकता/सकती हूँ \"[Customer Name]\" कि आपका नेट काम नहीं कर रहा है।", "backend": "Agent portal में check करें कि recharge amount receive हुआ है या नहीं।"}, {"type": "step", "step": "5. Troubleshooting Intro", "subCategory": "Recharge Done but Internet Not Working", "hindi": "क्या मैं आपसे कुछ जानकारी ले सकता/सकती हूँ?", "backend": "—"}, {"type": "step", "step": "Q1. Restarted Net Box?", "subCategory": "Recharge Done but Internet Not Working", "hindi": "क्या आपने Net Box को restart किया है?", "backend": "—"}, {"type": "step", "step": "If CX says NO", "subCategory": "Recharge Done but Internet Not Working", "hindi": "कोई बात नहीं \"Customer Name\", कृपया अपने Net Box को power switch से बंद करें और 30 seconds बाद फिर से चालू करें। मैं call पर ही आपके साथ हूँ।", "backend": "—"}, {"type": "step", "step": "CRM Additional Information (Mandatory before Ticket Creation)", "subCategory": "Recharge Done but Internet Not Working", "hindi": "Ticket create करने से पहले Kapture में यह जानकारी confirm करें (RDNI Additional Information):\n• Netbox restart kiya? *\n• Comment (कोई अतिरिक्त जानकारी हो तो लिखें)", "backend": "Kapture ticket form → \"RDNI Additional Information\" में mandatory (*) dropdown भरें + Comment (optional) डालें।"}, {"type": "step", "step": "If Net Still Not Working", "subCategory": "Recharge Done but Internet Not Working", "hindi": "आपकी शिकायत WIOM expert team को भेज दी गई है। आप इसे WIOM app में भी देख सकते हैं। कृपया हमें शाम 9 बजे तक का समय दें। हमारी team आपकी समस्या का समाधान कर देगी। यदि आप समाधान से संतुष्ट नहीं हैं तो ticket को reopen कर सकते हैं।", "backend": "Kapture में ticket creation — TAT: उसी दिन शाम 9 बजे तक\nKapture ticket notes में Ping delay mention करना mandatory है।"}, {"type": "step", "step": "If Net Starts Working", "subCategory": "Recharge Done but Internet Not Working", "hindi": "आपका नेट अब चालू हो चुका है। क्या मैं आपकी ticket को On Call Resolve mark कर दूँ?", "backend": "Agent Kapture और Ameyo दोनों में \"On Call Resolve\" mark करेगा।"}, {"type": "banner", "text": "SUB-CATEGORY: Frequent Disconnection"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Frequent Disconnection", "hindi": "मैं समझ सकता/सकती हूँ \"[Customer Name]\" कि आपका नेट काम नहीं कर रहा है।", "backend": "Agent portal में check करें कि recharge amount receive हुआ है या नहीं।"}, {"type": "step", "step": "5. Troubleshooting Intro", "subCategory": "Frequent Disconnection", "hindi": "क्या मैं आपसे कुछ जानकारी ले सकता/सकती हूँ?", "backend": "—"}, {"type": "step", "step": "Q1. Restarted Net Box?", "subCategory": "Frequent Disconnection", "hindi": "क्या आपने Net Box को restart किया है?", "backend": "—"}, {"type": "step", "step": "If CX says NO", "subCategory": "Frequent Disconnection", "hindi": "कोई बात नहीं \"Customer Name\", कृपया अपने Net Box को power switch से बंद करें और 30 seconds बाद दुबारा चालू करें। मैं call पर ही आपके साथ हूँ।", "backend": "—"}, {"type": "step", "step": "5.1 Troubleshooting Questions", "subCategory": "Frequent Disconnection", "hindi": "1. क्या आप Net Box के पास से नेट चला रहे हैं या दूर से?\n2. क्या आपके और Net Box के बीच कोई बड़ी दीवार है?\n3. आपको किस काम/app का इस्तेमाल करते समय नेट में दिक्कत हो रही है? (Options दें)\n4. आप किस signal से जुड़े हैं—2.4G या 5G? (NOT TO BE ASKED IN BAND STEERING = ON CUSTOMERS)", "backend": "—"}, {"type": "step", "step": "Ticket Confirmation", "subCategory": "Frequent Disconnection", "hindi": "आपके सहयोग के लिए धन्यवाद \"Customer Name\"। आपकी शिकायत WIOM expert team को भेज दी गई है। आप अपनी शिकायत WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें। Team आपकी समस्या का समाधान 24 घंटे में कर देगी। यदि आप समाधान से संतुष्ट नहीं हैं, तो ticket को reopen कर सकते हैं।", "backend": "Kapture ticket creation — TAT: 24 घंटे\nKapture ticket notes में Ping delay mention करना mandatory है।"}, {"type": "banner", "text": "SUB-CATEGORY: Slow Speed/Range Issues"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Slow Speed/Range Issues", "hindi": "मैं समझ सकता/सकती हूं \"[Customer Name]\" कि आपको नेट की speed को लेकर परेशानी हो रही है।", "backend": "—"}, {"type": "step", "step": "5. Restart Check", "subCategory": "Slow Speed/Range Issues", "hindi": "क्या आपने अपना Net Box restart किया है?\n\nIf No: कोई बात नहीं \"Customer Name\", कृपया Net Box को power switch से बंद करें और 30 seconds बाद फिर से on करें। मैं call पर ही आपके साथ हूं।", "backend": "—"}, {"type": "step", "step": "6. Check Optical Power", "subCategory": "Slow Speed/Range Issues", "hindi": "—", "backend": "WIOM Hub में Optical Power check करें ताकि connectivity से जुड़े issues पहचाने जा सकें।"}, {"type": "step", "step": "7. Run Live Speed Test", "subCategory": "Slow Speed/Range Issues", "hindi": "मैं अभी आपके connection की real-time speed check कर रहा/रही हूं, कृपया एक-दो minutes line पर बने रहें।", "backend": "WIOM Hub में Live Speed Test चलाएं — Run button सिर्फ एक बार दबाएं ताकि reading सही और consistent रहे। Test में सामान्यतः 1-2 minutes लगते हैं, कुछ मामलों में 3-4 minutes भी लग सकते हैं। एक बार पूरा हो चुका result अगले 6 घंटे तक valid रहता है।"}, {"type": "step", "step": "8. If Speed ≥80 Mbps (OCR)", "subCategory": "Slow Speed/Range Issues", "hindi": "आपकी speed अभी सही आ रही है और हमारे standard के अनुसार है। मैं आपको बता देता/देती हूं कि Wi-Fi performance distance, दीवारों और आसपास के obstacles से कैसे प्रभावित होती है, ताकि आपको बेहतर अनुभव मिले।", "backend": "FAQ 1 (distance/interference/band placement) का इस्तेमाल करके customer को educate करें → OCR / On-Call Resolve mark करें।"}, {"type": "step", "step": "9. If Speed <80 Mbps (Raise Ticket)", "subCategory": "Slow Speed/Range Issues", "hindi": "आपके सहयोग के लिए धन्यवाद। मैंने आपकी speed जांच ली है और इसे हमारी Partner team के पास आगे भेज रहा/रही हूं।\n\nकृपया हमें 24 घंटे का समय दें। यदि आप समाधान से संतुष्ट नहीं हैं तो ticket को reopen कर सकते हैं।", "backend": "Kapture में ticket raise करें — actual live speed, date और time ticket notes में दर्ज करें। अगर customer ≥80 Mbps पर है लेकिन 8880322222 पर screenshot भेजता है या call पर Ookla speed <80 confirm करता है, तो customer-claimed speed भी notes में लिखें। TAT: 24 घंटे — Partner/PFT intervention।\nKapture ticket notes में Ping delay mention करना mandatory है।"}, {"type": "step", "step": "10. Kapture Questions (Mandatory before Ticket Creation)", "subCategory": "Slow Speed/Range Issues", "hindi": "—", "backend": "Ticket create करने से पहले Kapture में यह जानकारी confirm करें: • Live Speed in Wiom Hub (Mandatory) • बेहतर Wi-Fi इस्तेमाल की जानकारी दी गई (Yes/No) (Mandatory) • CS Claimed Current Speed from Ookla (Non-Mandatory)"}, {"type": "step", "step": "11. Customer Confirmation Before Closing", "subCategory": "Slow Speed/Range Issues", "hindi": "क्या अभी भी आपको speed को लेकर कोई दिक्कत महसूस हो रही है?", "backend": "ग्राहक से पुष्टि करने के बाद ही case resolve/close करें।"}, {"type": "banner", "text": "Slow Speed/Range Issues — Situational FAQ Scripts (use as needed based on the customer’s question)"}, {"type": "step", "step": "FAQ 1. Distance, Interference & Band Placement", "subCategory": "Slow Speed/Range Issues", "hindi": "(Band Steering OFF)\nSir/Ma’am, Net Box की performance distance और दीवारों की वजह से प्रभावित हो सकती है। जितना आप NetBox से दूर जाते हैं, या बीच में जितनी ज्यादा दीवारें या रुकावटें होती हैं, Wi-Fi signal उतना ही कमज़ोर हो सकता है और speed कम मिल सकती है। 5 GHz band Net Box के पास बेहतर speed के लिए सही है, और 2.4 GHz band लंबी दूरी और दीवारों के पार बेहतर coverage देता है। इसलिए Net Box को घर की central और खुली जगह पर रखना और ज़रूरत के अनुसार 2.4 GHz या 5 GHz band इस्तेमाल करना recommended है।\n\n(Band Steering ON)\nSir/Ma’am, NetBox की performance distance और दीवारों की वजह से प्रभावित हो सकती है। Wiom आपकी location और signal के हिसाब से अपने आप best network choose करता है, इसलिए आपको बार-बार खुद network switch करने की ज़रूरत नहीं है।", "backend": "—"}, {"type": "step", "step": "FAQ 2. \"Plan mein 100 Mbps hai but 20-30 Mbps bhi nahi milta\"", "subCategory": "Slow Speed/Range Issues", "hindi": "Sir/Ma’am, आपके plan की speed Wi-Fi पर distance, interference और connected devices की वजह से बदल सकती है। सबसे पहले हम Net Box के पास speed check करेंगे। अगर Net Box के पास भी speed 20–30 Mbps ही आ रही है, तो हम connection या netbox-related issue को आगे check करेंगे।", "backend": "—"}, {"type": "step", "step": "FAQ 3. \"Netbox ke paas speed theek hai but doosre kamre mein nahi aata\"", "subCategory": "Slow Speed/Range Issues", "hindi": "Band Steering OFF\n\nSir/Ma’am, NetBox से दूर जाने या बीच में दीवारें होने पर Wi-Fi signal कम हो सकता है। 5 GHz NetBox के पास अच्छी speed देता है, और 2.4 GHz ज्यादा दूर तक बेहतर signal देता है। अगर आप दूसरे कमरे में हैं, तो 2.4 GHz Wi-Fi से connect करके check करें। NetBox को घर के बीच में और खुली जगह पर रखने से भी signal बेहतर मिल सकता है।\n\nBand Steering ON\n\nSir/Ma’am, NetBox से दूर जाने या बीच में दीवारें होने पर Wi-Fi signal कम हो सकता है। आपका NetBox signal के हिसाब से अपने आप best connection choose करता है, इसलिए आपको खुद से कुछ change करने की ज़रूरत नहीं है। NetBox को घर के बीच में और खुली जगह पर रखने से signal बेहतर मिल सकता है। अगर आपको speed की दिक्कत आ रही है, तो मैं आपकी complaint दर्ज कर देता/देती हूं।", "backend": "—"}, {"type": "step", "step": "FAQ 4. \"Raat ko speed acchi hoti hai din mein gir jaati hai\"", "subCategory": "Slow Speed/Range Issues", "hindi": "Sir/Ma’am, दिन के समय अगर घर में ज्यादा devices Wi-Fi से connected हैं और सब पर एक साथ internet चल रहा है, तो हर device पर speed थोड़ी कम आ सकती है।", "backend": "—"}, {"type": "step", "step": "FAQ 5. Troubleshooting Already Done Multiple Times", "subCategory": "Slow Speed/Range Issues", "hindi": "Okay sir, जैसा कि मैं देख पा रहा/रही हूं आपने troubleshooting कर लिया है। मैं इस issue को अपनी team को escalate करके आपका issue जल्द solve करवाने की कोशिश करूंगा/करूंगी।", "backend": "—"}, {"type": "step", "step": "FAQ 6. Wi-Fi Not Reaching a Room/Floor", "subCategory": "Slow Speed/Range Issues", "hindi": "Band Steering OFF\n\nSir/Ma’am, NetBox से दूर जाने या बीच में दीवारें/floor होने पर Wi-Fi signal कम हो सकता है। 5 GHz NetBox के पास अच्छा चलता है, और 2.4 GHz ज्यादा दूर तक बेहतर signal देता है। अगर दूसरे room या floor पर signal नहीं आ रहा है, तो 2.4 GHz Wi-Fi से connect करके check करें। NetBox को घर के बीच में और खुली जगह पर रखने से भी signal बेहतर मिल सकता है। अगर फिर भी दूसरे room या floor पर Wi-Fi नहीं आ रहा है, तो मैं आपकी complaint दर्ज कर देता/देती हूं।\n\nBand Steering ON\n\nSir/Ma’am, NetBox से दूर जाने या बीच में दीवारें/floor होने पर Wi-Fi signal कम हो सकता है। आपका NetBox signal के हिसाब से अपने आप best connection choose करता है, इसलिए आपको खुद से कुछ change करने की ज़रूरत नहीं है। NetBox को घर के बीच में और खुली जगह पर रखने से signal बेहतर मिल सकता है। अगर फिर भी दूसरे room या floor पर Wi-Fi नहीं आ रहा है, तो मैं आपकी complaint दर्ज कर देता/देती हूं।", "backend": "—"}, {"type": "step", "step": "FAQ 7. Technician Visited, No Fault Found, Still Slow", "subCategory": "Slow Speed/Range Issues", "hindi": "Sir/Ma’am, हमें खेद है कि technician visit के बाद भी issue continue हो रहा है। अगर technician को connection में कोई fault नहीं मिला और problem अभी भी आ रही है, तो हम आपके issue को आगे की जांच के लिए भेज रहे हैं।", "backend": "—"}, {"type": "step", "step": "FAQ 8. Buffering Despite Good Speed Test", "subCategory": "Slow Speed/Range Issues", "hindi": "Sir/Ma’am, speed test में speed normal आने के बाद भी buffering हो सकती है। कभी-कभी ज्यादा devices एक साथ connected होने, आपके device की connectivity, या जिस app/website का आप इस्तेमाल कर रहे हैं उसमें problem होने की वजह से buffering हो सकती है।", "backend": "—"}, {"type": "step", "step": "FAQ 9. Repeat Complaint — Not Resolved Since Last Call", "subCategory": "Slow Speed/Range Issues", "hindi": "हमें खेद है कि बार-बार issue होने के बाद भी यह resolve नहीं हुआ। मैं आपके लिए एक और request raise कर रहा/रही हूं। हमारा technician आपके घर आकर issue को check करेगा और इसे पूरी तरह resolve करेगा।", "backend": "—"}, {"type": "step", "step": "FAQ 10. Speed Drops Near Recharge Renewal", "subCategory": "Slow Speed/Range Issues", "hindi": "Sir/Ma’am, अभी आपके हिसाब से speed कितनी मिल रही है? मैं आपकी complaint raise कर देता/देती हूं। हमारी concerned team आपसे connect करके issue को आगे check करेगी और आपको resolution देगी।", "backend": "—"}, {"type": "step", "step": "FAQ 11. \"2 Band Show Nahi Ho Rahe / 5G Nahi Aa Raha\" (Band Steering ON)", "subCategory": "Slow Speed/Range Issues", "hindi": "अब Wiom में आपको एक ही signal दिखेगा — यह नया setup है जो बेहतर performance के लिए design किया गया है। पहले अलग-अलग signal होते थे, लेकिन अब Wiom automatically best network choose करता है, इसलिए आपको खुद से बार-बार switch करने की ज़रूरत नहीं है। आप बस इसी signal से connect रखिए — घर का नेट smoothly चलेगा।", "backend": "—"}, {"type": "step", "step": "FAQ 12. \"Bhai ke ghar 2 band dikhte hain, speed better hai\"", "subCategory": "Slow Speed/Range Issues", "hindi": "जी, हर area में setup थोड़ा अलग हो सकता है। आपके घर पर जो नेट का setup है, वो आपके area के हिसाब से सही है — इससे नेट ज्यादा stable और smooth चलता है।", "backend": "—"}, {"type": "step", "step": "FAQ 13. \"Mere bhi 2 band kar do\"", "subCategory": "Slow Speed/Range Issues", "hindi": "अभी आपका जो नेट setup है, वो आपके area के हिसाब से सही है। इसमें आपको कुछ भी change करने की ज़रूरत नहीं है।", "backend": "—"}, {"type": "banner", "text": "Slow Speed/Range Issues — PFT Handling (Partner Follow-up Team, for escalated tickets)"}, {"type": "step", "step": "PFT-1. Check Ticket History", "subCategory": "Slow Speed/Range Issues", "hindi": "—", "backend": "Kapture में customer की पूरी ticket history check करें।"}, {"type": "step", "step": "PFT-2. Run Speed Test Before Calling", "subCategory": "Slow Speed/Range Issues", "hindi": "—", "backend": "ग्राहक को call करने से पहले WIOM Hub में real-time speed test चलाएं — Run button सिर्फ एक बार दबाएं। Test में सामान्यतः 1-2 minutes, कुछ मामलों में 5-6 minutes तक लग सकते हैं। पूरा हो चुका result अगले 6 घंटे तक valid रहता है।"}, {"type": "step", "step": "PFT-3. Post Speed Test Action", "subCategory": "Slow Speed/Range Issues", "hindi": "(अगर speed ≥80 Mbps) Sir/Ma’am, मैंने आपके connection की speed check की है और यह हमारे standard के अनुसार सही आ रही है। (FAQ 1 का इस्तेमाल करके distance/interference/band placement समझाएं)\n\n(अगर speed <80 Mbps) मैं समझ सकता/सकती हूं कि आपको अभी भी दिक्कत हो रही है। मैं हमारी Partner team को आपके घर visit के लिए भेज रहा/रही हूं।", "backend": "≥80 Mbps → FAQ scripts follow करके customer को educate करें, case Solved mark करें। <80 Mbps → Kapture में ticket raise करें, Partner को customer के घर visit / issue sort करने के लिए भेजें।"}, {"type": "banner", "text": "SUB-CATEGORY: Optical Power Out of Range"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Optical Power Out of Range", "hindi": "मैं समझ सकता/सकती हूँ \"[Customer Name]\" कि आपका नेट काम नहीं कर रहा है। नेट न होने से ज़रूरी काम रुक जाते हैं।", "backend": "WIOM Hub में RX Power check करें।\n\n1. यदि RX Power -8 to -25 (Standard Range) के बीच है: Partner side से सब ठीक है → ग्राहक की शिकायत (VOC) के अनुसार ticket बनाएँ।\n2. यदि RX Power Standard Range से बाहर है: Ticket Type चुनें — \"Optical Power Out of Range\""}, {"type": "step", "step": "5. Ticket Confirmation", "subCategory": "Optical Power Out of Range", "hindi": "आपकी शिकायत WIOM expert team को भेज दी गई है। आप अपनी शिकायत WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें। हमारी team आपकी समस्या को 24 घंटे के भीतर सुलझा देगी।\n\nअगर आप दिए गए समाधान से संतुष्ट नहीं हैं, तो ticket को reopen कर सकते हैं।", "backend": "Kapture में Ticket Creation — TAT: 24 घंटे\nKapture ticket notes में Ping delay mention करना mandatory है।"}, {"type": "banner", "text": "COMMON CLOSING — applies to every sub-category in this tab"}, {"type": "step", "step": "Offer Further Help", "subCategory": "", "hindi": "क्या मैं आपकी और कोई सहायता कर सकता/सकती हूँ, \"Customer Name\"?", "backend": "—"}, {"type": "step", "step": "Call Closure", "subCategory": "", "hindi": "आपका feedback हमारे लिए बहुत महत्वपूर्ण है। मैं आपकी call IVR पर transfer कर रहा/रही हूँ। कृपया 1 से 5 के बीच rating दें, जिसमें 5 सर्वोत्तम है। WIOM को call करने के लिए धन्यवाद। आपका दिन शुभ हो।", "backend": "—"}, {"type": "step", "step": "If Customer Not Satisfied with TAT", "subCategory": "", "hindi": "हम आपसे 24 घंटे का समय चाहते हैं, लेकिन हम पूरी कोशिश करेंगे कि आपकी समस्या इससे पहले ही हल हो जाए।", "backend": "—"}]}, {"name": "Shifting", "title": "CATEGORY: Shifting", "subtitle": "Reference tab for this whole workbook. One shared opening + closing, and each shifting scenario is its own scripted branch below.", "items": [{"type": "banner", "text": "COMMON OPENING — applies to every sub-category in this tab"}, {"type": "step", "step": "1. Call Greeting", "subCategory": "", "hindi": "नमस्कार, call करने के लिए धन्यवाद। WIOM से मैं [Name] बात कर रहा/रही हूँ। मैं आपकी कैसे सहायता कर सकता/सकती हूँ?\n\n(customer को पूरी समस्या बताने दें, समय-समय पर \"जी\", \"ठीक है\", \"मैं समझ रहा/रही हूँ\" से acknowledge करें)", "backend": "—"}, {"type": "step", "step": "2. Apology & Acknowledgement", "subCategory": "", "hindi": "आपको हुई असुविधा के लिए humein khed hai। मैं आपकी समस्या को पूरी तरह से हल कराने में आपकी मदद करूँगा/करूँगी।", "backend": "—"}, {"type": "step", "step": "3. Customer Verification (Registered)", "subCategory": "", "hindi": "मैं आपके details check कर रहा/रही हूँ। मैं देख पा रहा/रही हूँ कि यह Recharge Wala Ghar Ka Net \"Customer Name\" के नाम पर registered है। क्या मैं उन्हीं से बात कर रहा/रही हूँ?", "backend": "Agent Wiom Hub में registered number या device ID से ग्राहक विवरण check करेगा।"}, {"type": "step", "step": "3.1 Customer Verification (Not Registered)", "subCategory": "", "hindi": "आप जिस number से call कर रहे हैं, उससे मैं details check नहीं कर पा रहा/रही हूँ। क्या आप कृपया अपना registered number या device ID बता सकते हैं?", "backend": "—"}, {"type": "step", "step": "3.1.1 Verification After Details Received", "subCategory": "", "hindi": "जानकारी देने के लिए धन्यवाद। मैं आपके Ghar Ka Net की जानकारी check कर रहा/रही हूँ। यह Recharge Wala Ghar Ka Net \"Customer Name\" के नाम पर registered है। क्या मैं \"Customer Name\" से ही बात कर रहा/रही हूँ?\n\n(Female → First Name + जी, Male → Last Name + जी)", "backend": "Wiom Hub में details check करना।"}, {"type": "banner", "text": "SUB-CATEGORY: Ask About Shifting"}, {"type": "step", "step": "4. Ask Reason for Shift", "subCategory": "Ask About Shifting", "hindi": "\"Customer Name\", क्या मैं जान सकता/सकती हूँ कि आप अपना Ghar Ka Net shift क्यों कराना चाहते हैं?", "backend": "—"}, {"type": "step", "step": "4.1 Assurance Pitch — Ask About Shifting", "subCategory": "Ask About Shifting", "hindi": "\"Customer Name\", बताना चाहूँगा/चाहूँगी कि shifting के लिए हमें नए पते की जानकारी चाहिए होती है, ताकि यह पता किया जा सके कि आपकी नई location पर WIOM की service उपलब्ध है या नहीं।\n\nआपसे अनुरोध है कि नया पता confirm करके हमें दोबारा call करें, ताकि हम आपकी shifting में बेहतर तरीके से मदद कर सकें।", "backend": "—"}, {"type": "banner", "text": "SUB-CATEGORY: Shift Within My Home"}, {"type": "step", "step": "4.3 Assurance Pitch — Shift Within My Home", "subCategory": "Shift Within My Home", "hindi": "\"Customer Name\", आपकी shifting request—चाहे Net Box को (एक floor से दूसरे floor) / (एक कमरे से दूसरे कमरे) / (एक ही कमरे में दूसरी दीवार पर)—पूरी कर दी जाएगी।\n\nमैं आपकी request expert team को भेज रहा/रही हूँ। Team 2-3 din के अंदर shifting पूरी कर देगी।", "backend": "Shifting request दर्ज करें — TAT: 2-3 दिन"}, {"type": "banner", "text": "SUB-CATEGORY: Shift to New Address"}, {"type": "step", "step": "4. Collect New Address", "subCategory": "Shift to New Address", "hindi": "\"Customer Name\", बताना चाहूँगा/चाहूँगी कि shifting के लिए हमें नए पते की जानकारी चाहिए होती है, ताकि यह पता किया जा सके कि आपकी नई location पर WIOM की service उपलब्ध है या नहीं।\n\nAddress:\nLandmark:\nPincode:\n\nAgent (Map पर check करते समय): \"मैं देख पा रहा/रही हूँ कि आपके बताए पते के पास 'XYZ Landmark' है। क्या यह सही है?\"\n• Customer Yes → आगे बढ़ें\n• Customer No → दूसरा landmark पूछें", "backend": "Shifting portal पर नई location check करें + Partner <200m उपलब्धता check करें (same partner)"}, {"type": "step", "step": "4.1 Assurance Pitch — Same Partner Serviceable (<200m)", "subCategory": "Shift to New Address", "hindi": "\"Customer Name\", बताना चाहूँगा/चाहूँगी कि shifting के लिए हमें नए पते की जानकारी चाहिए होती है, ताकि यह पता किया जा सके कि आपकी नई location पर WIOM की service उपलब्ध है या नहीं।\n\nAgent: \"जी, यहाँ पास में आपकी बताई location दिख रही है। यहाँ shifting संभव है। मैं आपकी shifting request बना रहा/रही हूँ। आपकी request WIOM app में दिख जाएगी। हमारी team 2-3 दिनों में Net Box को नई location पर shift कर देगी।\"", "backend": "Shifting portal पर नई location check करें + Partner <200m उपलब्धता check करें — TAT: 2-3 दिन"}, {"type": "step", "step": "Partner Remark (Mandatory)", "subCategory": "Shift to New Address", "hindi": "\"कृपया Ghar Ka Net को नई location पर shift करें। यह कार्य 48 घंटे में पूरा होना चाहिए और Optical Power -8 से -25 dBm के बीच सुनिश्चित करें। इस shifting के लिए company ₹200 का भुगतान करेगी।\"", "backend": "Partner को remark note के साथ task assign करें"}, {"type": "banner", "text": "SUB-CATEGORY: Shift to New Address (Service Available)"}, {"type": "step", "step": "4. Eligibility Check — Different Partner Within 200m", "subCategory": "Shift to New Address (Service Available)", "hindi": "ग्राहक को नए पते पर WIOM service उपलब्ध है, लेकिन वही (पुराना) Partner वहाँ service नहीं दे सकता — कोई दूसरा WIOM Partner 200m के दायरे में उपलब्ध है।", "backend": "Shifting portal पर नई location check करें — same partner नहीं, पर दूसरा partner <200m उपलब्ध है"}, {"type": "step", "step": "4.1 Assurance Pitch — Guide to New Connection + Refund", "subCategory": "Shift to New Address (Service Available)", "hindi": "\"Customer Name\", माफ़ी चाहता/चाहती हूँ—आपके नए पते पर आपके मौजूदा Partner से shifting संभव नहीं है, लेकिन वहाँ किसी दूसरे WIOM Partner से नया Ghar Ka Net लगाया जा सकता है।\n\nCustomer: 'जब नया लग सकता है तो पुराना क्यों नहीं?'\n\nAgent: \"सर/मैडम, आपका वर्तमान Net Box एक विशेष WIOM Partner से जुड़ा है। नई location पर अलग Partner से नया connection मिलेगा, इसलिए पुराना Net Box shift नहीं किया जा सकता। मैं आपको नए पते पर नया connection book करने में मदद करता/करती हूँ, और आपके मौजूदा plan की बची हुई राशि का refund policy के अनुसार शुरू कर दिया जाएगा। मैं आपके पुराने Net Box को हटाने की request भी दर्ज कर रहा/रही हूँ। Team 7 दिनों में pickup कर लेगी।\"", "backend": "नए पते पर नया connection book करें + Plan & Billing में remaining plan amount का refund initiate करें + Old Net Box pickup request दर्ज करें — TAT: 7 दिन pickup"}, {"type": "banner", "text": "SUB-CATEGORY: Shift to New Address (Not Serviceable)"}, {"type": "step", "step": "4. Assurance Pitch — No Partner Within 200m", "subCategory": "Shift to New Address (Not Serviceable)", "hindi": "\"\"Customer Name\", बताना चाहूँगा/चाहूँगी कि shifting के लिए हमें नए पते की जानकारी चाहिए होती है, ताकि यह पता किया जा सके कि आपकी नई location पर WIOM की service उपलब्ध है या नहीं                                आपकी नई location पर WIOM की सेवाएँ उपलब्ध नहीं हैं (200m के दायरे में कोई भी WIOM Partner serviceable नहीं है), इसलिए हम Ghar Ka Net shift नहीं कर सकते। मुझे खेद है। मैं Net Box हटाने की request दर्ज कर रहा/रही हूँ। Team 7 दिनों में pickup कर लेगी।", "backend": "Shifting portal पर नई location check करें — कोई भी Partner <200m उपलब्ध नहीं — TAT: 7 दिन pickup"}, {"type": "banner", "text": "COMMON CLOSING — applies to every
