egistered)", "subCategory": "", "hindi": "मैं आपके details check कर रहा/रही हूँ। मैं देख पा रहा/रही हूँ कि यह Recharge Wala Ghar Ka Net \"Customer Name\" के नाम पर registered है। क्या मैं उन्हीं से बात कर रहा/रही हूँ?", "backend": "Agent Wiom Hub में registered number या device ID से ग्राहक विवरण check करेगा।"}, {"type": "step", "step": "3.1 Customer Verification (Not Registered)", "subCategory": "", "hindi": "आप जिस number से call कर रहे हैं, उससे मैं details check नहीं कर पा रहा/रही हूँ। क्या आप कृपया अपना registered number या device ID बता सकते हैं?", "backend": "—"}, {"type": "step", "step": "3.1.1 Verification After Details Received", "subCategory": "", "hindi": "जानकारी देने के लिए धन्यवाद। मैं आपके Ghar Ka Net की जानकारी check कर रहा/रही हूँ। यह Recharge Wala Ghar Ka Net \"Customer Name\" के नाम पर registered है। क्या मैं \"Customer Name\" से ही बात कर रहा/रही हूँ?\n\n(Female → First Name + जी, Male → Last Name + जी)", "backend": "Wiom Hub में details check करना।"}, {"type": "banner", "text": "SUB-CATEGORY: TV/Camera Issue"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "TV/Camera Issue", "hindi": "मैं क्षमा चाहता/चाहती हूँ कि आपको यह समस्या का सामना करना पड़ा। मैं समझ सकता/सकती हूँ कि TV या Camera में नेट न चलने की वजह से आपको कितनी परेशानी हो रही है।", "backend": "—"}, {"type": "step", "step": "4.1 Troubleshoot", "subCategory": "TV/Camera Issue", "hindi": "Doosre devices par internet chal raha hai?                                                                        Specific error message TV/Camera app mein aa raha hai?", "backend": ""}, {"type": "step", "step": "5. Complaint Confirmation", "subCategory": "TV/Camera Issue", "hindi": "आपकी शिकायत WIOM expert team को दर्ज कर दी गई है। आप अपनी शिकायत WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें। हमारी team आपकी समस्या को 24 घंटे के भीतर सुलझा देगी। यदि समाधान संतोषजनक न लगे, तो ticket को reopen कर सकते हैं।", "backend": "Kapture Ticket Creation — TAT: 24 घंटे"}, {"type": "banner", "text": "SUB-CATEGORY: Adapter Issue"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Adapter Issue", "hindi": "मैं क्षमा चाहता/चाहती हूँ कि आपको यह समस्या का सामना करना पड़ा। मैं समझ सकता/सकती हूँ कि Net सही से काम न करने की वजह से आपको कितनी परेशानी हुई होगी।", "backend": "—"}, {"type": "step", "step": "4.1 Troubleshoot", "subCategory": "Adapter Issue", "hindi": "Net box light on/blinking hai?                                                                                           Adapter doosre socket mein try kiya?", "backend": ""}, {"type": "step", "step": "5. Complaint Registration", "subCategory": "Adapter Issue", "hindi": "आपकी शिकायत WIOM expert team को दर्ज कर दी गई है। आप अपनी शिकायत WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें। हमारी team आपकी समस्या को 24 घंटे के भीतर सुलझा देगी। यदि समाधान संतोषजनक न लगे, तो ticket को reopen कर सकते हैं।", "backend": "Kapture Ticket Creation — TAT: 24 घंटे (verify if required)"}, {"type": "banner", "text": "SUB-CATEGORY: Improper Installation"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "improper Installation", "hindi": "मुझे खेद है \"Customer Name\" कि आपके Ghar Ka Net की installation ठीक तरीके से नहीं की गई। मैं समझ सकता/सकती हूँ कि इससे आपको कितनी असुविधा हुई होगी।", "backend": "ग्राहक से पूछें कि installation में क्या समस्या है — cable exposed, box placement, earthing आदि।"}, {"type": "step", "step": "4.1 Troubleshoot", "subCategory": "improper Installation", "hindi": "Exactly kya galat hai — placement/wiring/kuch aur? Wires bahar latak rahe hain?", "backend": ""}, {"type": "step", "step": "5. Complaint Confirmation", "subCategory": "improper Installation", "hindi": "आपकी शिकायत WIOM expert team को दर्ज कर दी गई है। आप अपनी शिकायत WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें। हमारी team आपकी समस्या को 24 घंटे के भीतर सुलझा देगी। यदि समाधान संतोषजनक न लगे, तो ticket को reopen कर सकते हैं।", "backend": "Kapture Ticket Creation — Partner को re-installation के लिए assign करें — TAT: 24 घंटे"}, {"type": "banner", "text": "SUB-CATEGORY: Other"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Other", "hindi": "मुझे खेद है \"Customer Name\" कि आपको यह असुविधा हुई। कृपया मुझे अपनी समस्या विस्तार से बताएं ताकि मैं सही team तक इसे पहुँचा सकूँ।", "backend": "ग्राहक की समस्या को ध्यान से सुनें और VOC (Voice of Customer) के अनुसार सही category में ticket tag करें।"}, {"type": "step", "step": "5. Complaint Confirmation", "subCategory": "Other", "hindi": "आपकी शिकायत WIOM expert team को दर्ज कर दी गई है। आप अपनी शिकायत WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें। हमारी team आपकी समस्या को 24 घंटे के भीतर सुलझा देगी। यदि समाधान संतोषजनक न लगे, तो ticket को reopen कर सकते हैं।", "backend": "Kapture Ticket Creation — TAT: 24 घंटे"}, {"type": "banner", "text": "SUB-CATEGORY: Invoice Requested"}, {"type": "step", "step": "4. Assurance Pitch + Invoice Ask", "subCategory": "Invoice Requested", "hindi": "Steps to download invoice from Wiom App:\n\n1. Open the Wiom App\n2. Click on the three dots (menu)\n3. Go to Payment History\n4. Can see available bills\n5. Click on the Download option on the right-hand side", "backend": "Agent WIOM Hub से Invoice download करे और Supervisor से ग्राहक को WhatsApp पर भेजने के लिए कहे"}, {"type": "step", "step": "5. On-Call Resolution Confirmation", "subCategory": "Invoice Requested", "hindi": "उम्मीद करता/करती हूँ कि इस call में मैं आपकी पूरी सहायता कर पाया/पाई। क्या मैं आपकी ticket को On Call Resolve mark कर दूँ?", "backend": "Kapture में Ticket Create करें और Status = On Call Resolve (Kapture + Ameyo दोनों में)"}, {"type": "banner", "text": "SUB-CATEGORY: Router Issue and Replacement"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Router Issue and Replacement", "hindi": "मुझे खेद है \"Customer Name\" कि आपके Net Box/Router में समस्या आ रही है। मैं समझ सकता/सकती हूँ कि इससे आपका नेट इस्तेमाल करना मुश्किल हो गया होगा।", "backend": "Net Box की condition, power light, physical damage आदि के बारे में पूछें।"}, {"type": "step", "step": "4.1 Troubleshoot", "subCategory": "Router Issue and Replacement", "hindi": "Net box power on ho raha hai?                                                                                           Baar-baar heat/off ho raha hai?                                                                                                 Switch on/off karke try kiya?", "backend": ""}, {"type": "step", "step": "5. Replacement Confirmation", "subCategory": "Router Issue and Replacement", "hindi": "आपकी शिकायत WIOM expert team को दर्ज कर दी गई है। यदि जांच में device खराब पाया जाता है तो हमारी team आपका Net Box/Router बदल देगी। आप अपनी शिकायत WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें।", "backend": "Kapture Ticket Creation — Ticket Type: Router Issue/Replacement — TAT: 24 घंटे"}, {"type": "banner", "text": "SUB-CATEGORY: App Not Working"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "App not working", "hindi": "मुझे खेद है \"Customer Name\" कि आपको WIOM app इस्तेमाल करने में दिक्कत आ रही है। मैं आपकी मदद करने की पूरी कोशिश करूँगा/करूँगी।", "backend": "पूछें: app crash हो रहा है / open नहीं हो रहा / login नहीं हो रहा / कोई feature काम नहीं कर रहा?"}, {"type": "step", "step": "4.1 Basic Troubleshooting", "subCategory": "App not working", "hindi": "कृपया ये steps try करें:\n1. app को पूरी तरह बंद करके दोबारा खोलें\n2. phone को restart करें\n3. Play Store/App Store से app को Update करें\n4. app का Cache clear करें (Settings → Apps → Wiom → Storage → Clear Cache)", "backend": "—"}, {"type": "step", "step": "5. Complaint Confirmation (If Issue Persists)", "subCategory": "App not working", "hindi": "आपकी शिकायत WIOM expert team को दर्ज कर दी गई है। आप अपनी शिकायत WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें। हमारी team आपकी समस्या को 24 घंटे के भीतर सुलझा देगी। यदि समाधान संतोषजनक न लगे, तो ticket को reopen कर सकते हैं।", "backend": "Kapture Ticket Creation — Ticket Type: App Not Working — TAT: 24 घंटे"}, {"type": "banner", "text": "SUB-CATEGORY: Recharges Expired (Service Issue)"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Recharge Expired ( Service Issue)", "hindi": "मुझे खेद है \"Customer Name\" कि आपको यह समस्या हो रही है। मैं समझ सकता/सकती हूँ — भले ही आपका recharge expire हो चुका है, अगर कोई service fault (जैसे टूटी हुई wire या physical line issue) है, तो हम उसे ठीक करने में आपकी मदद करेंगे।", "backend": "पहले check करें कि recharge active है या नहीं। अगर recharge expired है और साथ में wire टूटी/physical line issue है, तभी complaint दर्ज करें (Plan active/recharged होने पर यह tag लागू नहीं होता)।"}, {"type": "step", "step": "4.1Confirmation", "subCategory": "Recharge Expired ( Service Issue)", "hindi": "आपकी शिकायत WIOM expert team को दर्ज कर दी गई है। आप इसे WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें — हमारी Partner team आपकी wire/line की समस्या ठीक करेगी। इसके बाद कृपया अपना recharge पूरा करना न भूलें ताकि आपकी सेवा जारी रहे। यदि समाधान संतोषजनक न लगे, तो आप ticket को reopen कर सकते हैं।", "backend": "apture Ticket Creation — Sub\nCategory: Recharges Expired \n(Service Issue) \nTAT = 24 Hours | Non-FCR | \nAssigned To: Partner"}, {"type": "banner", "text": "COMMON CLOSING — applies to every sub-category in this tab"}, {"type": "step", "step": "Offer Further Help", "subCategory": "", "hindi": "क्या मैं आपकी और कोई सहायता कर सकता/सकती हूँ, \"Customer Name\"?", "backend": "—"}, {"type": "step", "step": "Call Closure", "subCategory": "", "hindi": "आपका feedback हमारे लिए बहुत महत्वपूर्ण है। मैं आपकी call IVR पर transfer कर रहा/रही हूँ। कृपया 1 से 5 के बीच rating दें, जिसमें 5 सर्वोत्तम है। WIOM को call करने के लिए धन्यवाद। आपका दिन शुभ हो।", "backend": "—"}]}, {"name": "Partner Misbehavior", "title": "CATEGORY: Partner Misbehavior", "subtitle": "Sensitive category — always apologize first, capture full incident detail for the field-partner action team, and never argue on be ै। मैं समझ सकता/सकती हूँ कि Net न चलने से कितनी परेशानी होती है। कृपया हमें एक और मौका दें। मैं आपकी _____ समस्या का समाधान जल्द से जल्द करवाऊँगा/करवाऊँगी।", "backend": "—"}, {"type": "step", "step": "4.1 Customer Agrees (Raise Ticket for Same Issue)", "subCategory": "Service Issue", "hindi": "मैंने आपकी शिकायत WIOM expert team को भेज दी है। यह शिकायत आपको WIOM app में भी दिखाई देगी। कृपया हमें 24 घंटे का समय दें—हमारी team आपकी समस्या का समाधान 24 घंटे में कर देगी। अगर समाधान संतोषजनक न लगे तो ticket को reopen कर सकते हैं।", "backend": "Kapture Ticket Creation — TAT: 24 घंटे"}, {"type": "step", "step": "4.2 Customer Says No — Wants Disconnection", "subCategory": "Service Issue", "hindi": "मैंने आपकी शिकायत बना दी है। यही शिकायत आपको WIOM app में भी दिखेगी। कृपया हमें 24 घंटे का समय दें—team आपकी समस्या का समाधान 24 घंटे में कर देगी। अगर समाधान संतोषजनक न लगे तो ticket को reopen कर सकते हैं।", "backend": "Kapture Ticket Creation — TAT: 24 घंटे"}, {"type": "step", "step": "5. If Customer Asks About Refund", "subCategory": "Service Issue", "hindi": "Refund की अवधि 7 दिन है। हमारी team आपकी शिकायत पर 24 घंटे के भीतर कार्रवाई शुरू कर देगी।", "backend": "Refund ticket tag करें — TAT: 7 दिन"}, {"type": "banner", "text": "SUB-CATEGORY: Double Payment"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Double Payment", "hindi": "\"Customer Name\", मुझे खेद है कि आपसे एक ही recharge के लिए दो बार payment कट गया है। मैं समझ सकता/सकती हूँ कि इससे आपको कितनी असुविधा हुई होगी। मैं आपकी पूरी मदद करूँगा/करूँगी।", "backend": "WIOM Hub/Payment Gateway में दोनों transaction check करें — amount, date, transaction ID match करें"}, {"type": "step", "step": "4.1 Required Screenshots", "subCategory": "Double Payment", "hindi": "आपकी समस्या का समाधान जल्दी करने के लिए हमें कुछ जानकारी चाहिए:\n• दोनों payment के screenshot\n• दोनों transaction ID\n• आपका registered number (लिखकर)\n\nकृपया ये जानकारी 8880322222 पर भेज दें। इससे आपकी समस्या जल्दी solve होगी।", "backend": "ग्राहक लिए धन्यवाद। यह connection 'Customer Name' के नाम पर registered है। क्या मैं 'Customer Name' से ही बात कर रहा/रही हूँ?\"\n\n(Female → First Name + जी, Male → Last Name + जी)", "backend": "Wiom Hub में details confirm करें"}, {"type": "banner", "text": "SUB-CATEGORY: Change Name or Mobile Number"}, {"type": "step", "step": "4.1 Registered Mobile Number Change (Customer Agrees)", "subCategory": "Change Name or Mobile Number", "hindi": "Change of Registered Mobile Number\nमैं आपको registered mobile number बदलने की प्रक्रिया बता रहा/रही हूँ। कृपया ये steps follow करें:\n• 3 dots पर click करें - Help\n• Mobile number badley\n• नया mobile number दर्ज करें\n• OTP डालकर number verify करें\n\nIf customer does not have access to the registered number:\nAsk the customer to log in using their User ID and password.\n\nIf customer does not know the password:\nAsk the customer to connect to WiFi using any mobile device → Click on the WiFi icon → Select the connected Wiom network → Tap on the \"i\" (info) button on the right side → Click on the Scan / QR option to view the password", "backend": "System में number update / OTP verification confirm करें"}, {"type": "step", "step": "4.2 Customer Unable to Change Number (Self-Service Issue)", "subCategory": "Change Name or Mobile Number", "hindi": "कोई समस्या नहीं। मैं आपकी सहायता के लिए एक ticket बना रहा/रही हूँ ताकि हमारी team आपकी request process कर सके।", "backend": "Kapture में ticket create करें – Change Registered Number"}, {"type": "step", "step": "5. Customer Name Change Request", "subCategory": "Change Name or Mobile Number", "hindi": "\"नाम बदलने के लिए आपको एक Name Change Form भरना होगा। मैं यह form आपको अभी भेज रहा/रही हूँ.\"", "backend": "Kapture के माध्यम से Name Change Form भेजें"}, {"type": "step", "step": "5.1 Name Change Processing", "subCategory": "Change Name or Mobile Number", "hindi": "\"form submit होने के बाद हमारी team आपकी request verify करेगी और नाम update कर देगी.\"", "backend": "L2 team के लिए ticket create करें – Name Change Request"}, {"type": "step", "step": "6. TAT Communication", "subCategory": "Change Name or Mobile Number", "hindi": "\"आपकी request 24–48 घंटे के भीतर process कर दी जाएगी। आपको update SMS / app के ज़रिए मिल जाएगा.\"", "backend": "Correct TAT tag करें — TAT: 24-48 घंटे"}, {"type": "banner", "text": "SUB-CATEGORY: Change Plan"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Change Plan", "hindi": "\"Customer Name\", मैं आपको अपना recharge plan बदलने में पूरी सहायता करूँगा/करूँगी। कृपया बताएं कि आप कौन सा plan लेना चाहते हैं?\"", "backend": "WIOM Hub में उपलब्ध plans/rate card check करें"}, {"type": "step", "step": "4.1 Self-Service Steps", "subCategory": "Change Plan", "hindi": "Steps:\n1. WIOM app खोलें\n2. \"bill भरें\"/\"Recharge\" पर click करें\n3. उपलब्ध Plans की list में से अपनी पसंद का नया plan चुनें\n4. भुगतान पूरा करते ही नया plan अगली recharge cycle से लागू हो जाएगा", "backend": "On-call guidance"}, {"type": "step", "step": "4.2 Customer Unable to Change Plan (Self-Service Issue)", "subCategory": "Change Plan", "hindi": "कोई समस्या नहीं। मैं आपकी सहायता के लिए एक ticket बना रहा/रही हूँ ताकि हमारी team आपकी plan change request process कर सके।", "backend": "Kapture में ticket create करें – Change Plan"}, {"type": "step", "step": "5. On Call Resolution Confirmation", "subCategory": "Change Plan", "hindi": "आशा करता/करती हूँ कि इस call में मैं आपकी सहायता कर पाया/पाई। क्या मैं आपकी ticket को On Call Resolve mark कर दूँ?", "backend": "Kapture + Ameyo में On Call Resolve mark करें"}, {"type": "banner", "text": "SUB-CATEGORY: Wifi Name/Password"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Wifi Name/Password", "hindi": "\"Customer Name\", मैं आपको अपना WiFi नाम (SSID) या password बदलने में पूरी सहायता करूँगा/करूँगी।\"", "backend": "—"}, {"type": "step", "step": "4.1 Self-Service Steps", "subCategory": "Wifi Name/Password", "hindi": "Steps:\n1. WIOM app खोलें\n2. \"My Network\"/\"WiFi Settings\" पर click करें\n3. Network Name (SSID) या Password edit करें\n4. नया नाम/password डालकर \"Save\" करें\n5. Net Box कुछ seconds में अपने आप restart होकर नई setting लागू कर देगा", "backend": "On-call guidance"}, {"type": "step", "step": "4.2 Customer Unable to Change (Self-Service Issue)", "subCategory": "Wifi Name/Password", "hindi": "कोई समस्या नहीं। मैं आपकी सहायता के लिए एक ticket बना रहा/रही हूँ ताकि हमारी team आपकी request process कर सके।", "backend": "Kapture में ticket create करें – WiFi Name/Password Change"}, {"type": "step", "step": "5. On Call Resolution Confirmation", "subCategory": "Wifi Name/Password", "hindi": "आशा करता/करती हूँ कि इस call में मैं आपकी सहायता कर पाया/पाई। क्या मैं आपकी ticket को On Call Resolve mark कर दूँ?", "backend": "Kapture + Ameyo में On Call Resolve mark करें"}, {"type": "banner", "text": "COMMON CLOSING — applies to every sub-category in this tab"}, {"type": "step", "step": "7. Offer Further Help", "subCategory": "", "hindi": "\"Customer Name, क्या मैं आपकी और किसी सहायता में मदद कर सकता/सकती हूँ?\"", "backend": "—"}, {"type": "step", "step": "8. Call Closure", "subCategory": "", "hindi": "\"आपका feedback हमारे लिए बहुत महत्वपूर्ण है। मैं आपकी call IVR पर transfer कर रहा/रही हूँ। कृपया 1 से 5 के बीच rating दें, जहाँ 5 सर्वोत्तम है। WIOM को call करने के लिए धन्यवाद। आपका दिन शुभ हो.\"", "backend": "—"}]}], "policies": [{"name": "Ticket Update Rules", "complianceNote": "Please ensure these guidelines are followed strictly. Any deviation from the above process will be treated as a process compliance issue.", "sections": [{"heading": "Half Tickets (CC Queue)", "items": [{"text": "Agents can update only same-day open half tickets (tickets currently in the CC Queue)."}, {"text": "Open half tickets created before the current day must not be updated by agents. Half tickets automatically close after 2 hours if they are not updated, so only active same-day half tickets are eligible for updates."}, {"text": "Closed half tickets must not be reopened or updated under any circumstances."}, {"text": "If no eligible half ticket is available for updating, the agent must create a new ticket."}]}, {"heading": "Full Tickets", "items": [{"text": "Agents can update an open ticket or reopen a closed ticket only when the customer reports the same issue and the issue belongs to the same ticket folder."}, {"text": "If a ticket has been closed for more than 48 hours, it must not be reopened. The system will also prevent agents from reopening such tickets."}, {"text": "Ticket folders must not be changed under any circumstances. Once a ticket is created, its folder is fixed. If the customer reports a different issue, agents must create a new ticket in the appropriate folder instead of changing the existing ticket's folder.", "examples": ["A WhatsApp folder ticket must not be converted into a Service ticket.", "A Disconnect folder ticket must not be converted into a Service ticket."]}, {"text": "Agents can update tickets only within the relevant ticket folder based on the customer's issue. Agents must not update tickets created under unrelated folders such as WhatsApp, Wiom Net, or any other non-relevant category."}, {"text": "If the issue belongs to a different issue, a new ticket must be created / updated in the correct folder."}]}]}], "wiomNetSop": {"sourceUrl": "https://sajaljain-cpu.github.io/SOP_Wiom_Net_V2F/", "pages": [{"key": "flow", "title": "WiomNet — Flow & Quick Reference", "steps": [{"code": "A", "kind": "step", "title": "Customer connects to WiomNet", "body": "On the customer’s phone/laptop Wi-Fi list, they tap the network named \"wiom net\" (secondary SSID) and connect."}, {"code": "B", "kind": "step", "title": "Phone shows a message", "body": "One of these 3 things happens on the customer’s screen:\n\n1️⃣ \"Connected, no internet\" → Tell customer: open any browser (Chrome) and try to visit any website (e.g. google.com). This will trigger the login page to pop up.\n2️⃣ \"Connected, tap to sign in to network\" → Tell customer: tap that notification directly — it opens the login page.\n3️⃣ Login page (captive portal) opens on its own → No action needed, move straight to the next step."}, {"code": "?", "kind": "decision", "title": "Is this the customer’s first time on WiomNet?", "body": "Yes → go to Step C.  |  No → system already knows their number, skip to “User has active recharge?”"}, {"code": "C", "kind": "step", "title": "First-time user enters mobile number", "body": "Customer types their mobile number into the portal. System then checks if this number has an active recharge."}, {"code": "?", "kind": "decision", "title": "Does the user have an active recharge?", "body": "Yes → go to Step I (OTP login).  |  No → go to Step D (buy a recharge)."}, {"code": "I", "kind": "step", "title": "OTP login (customer already has a recharge)", "body": "OTP page opens, OTP sent to the customer’s number. Customer enters the OTP.\n\n❌ Wrong OTP → let them retry, no limit on attempts.\n✅ Correct OTP + recharge still active → Internet connects."}, {"code": "✓", "kind": "success", "title": "Internet Connected 🎉", "body": "Customer is online. Case closed."}, {"code": "D", "kind": "step", "title": "Recharge selection page (if no active recharge)", "body": "Customer sees available WiomNet recharges and picks one."}, {"code": "E", "kind": "step", "title": "Payment link sent via SMS", "body": "System sends a payment link by SMS to the customer’s device."}, {"code": "?", "kind": "decision", "title": "Does the customer have mobile data to open the link?", "body": "No → go to Step F.  |  Yes → go to Step G."}, {"code": "F", "kind": "step", "title": "No mobile data — temporary free recharge", "body": "Customer is assigned a temporary free recharge. Internet connects, usable up to 3 times a day."}, {"code": "G", "kind": "step", "title": "Payment page", "body": "Customer pays for the recharge on this page.\n\n❌ Payment failed → let them retry, no limit on attempts."}, {"code": "H", "kind": "step", "title": "Payment successful", "body": "Two outcomes depending on whether the customer’s device is still on wiom net:\n\n✅ Still connected to wiom net → Internet connects.\n⚠️ Not connected to wiom net → Recharge is assigned, but did not connect — customer must reconnect and try via OTP (back to Step I)."}, {"code": "✓", "kind": "success", "title": "Internet Connected 🎉", "body": "Customer is online. Case closed."}], "quickRef": [{"situation": "Phone says \"Connected, no internet\"", "doThis": "Guide customer to open a browser and visit any website to trigger the login page.", "sayThis": "\"Please open Chrome and type google.com — the login page should pop up.\""}, {"situation": "Phone says \"Tap to sign in to network\"", "doThis": "Tell customer to tap that notification directly.", "sayThis": "\"You’ll see a notification saying ‘tap to sign in’ — please tap on it.\""}, {"situation": "Captive portal doesn’t open at all", "doThis": "Ask customer to forget the WiomNet network and reconnect. If still stuck, escalate.", "sayThis": "\"Let’s forget the wiom net network on your phone and reconnect fresh.\""}, {"situation": "Wrong OTP entered", "doThis": "Let the customer retry — there’s no limit on attempts. Confirm the number is correct.", "sayThis": "\"No worries, let’s try entering the OTP again.\""}, {"situation": "Payment failed on Step G", "doThis": "Let the customer retry payment — unlimited attempts allowed.", "sayThis": "\"That didn’t go through, let’s try the payment once more.\""}, {"situation": "Payment successful but internet still not working", "doThis": "Check if the customer’s device is still connected to wiom net. If not, ask them to reconnect and log in again via OTP.", "sayThis": "\"Your recharge is active — please reconnect to wiom net, and the portal will send an OTP for you to log in with.\""}, {"situation": "No mobile data to open payment link", "doThis": "Assign the temporary free recharge (usable up to 3 times a day) so the customer has internet while they sort out payment.", "sayThis": "\"I’ve given you a free temporary connection for now — let’s get your recharge sorted.\""}]}, {"key": "troubleshooting", "title": "Troubleshooting Matrix", "tags": ["No internet on router", "wiom net signal not showing", "Captive portal does not open", "Payment SMS link not received", "Free recharge limit exhausted", "Payment Unsuccessful", "Payment successful, could not connect", "Payment successful, asking for payment again", "OTP not received", "OTP not working/OTP limit exhausted", "General Enquiry"], "howAgentsUse": "First find out if the customer’s WiomNet recharge is currently active (from Step 1 flow / Wiom Hub). Then follow the matching diagram below to know what to ask next. Once you reach an end box, look up that exact situation in the table underneath to get the issue tag to log the case under, and the advice to give the customer.", "activeFlow": ["Recharge is ACTIVE → Check device ping", "Ping active? Yes → Ask customer to reconnect, do OTP flow on call", "Ping active? No → Down more than 2 hrs?", "Down > 2 hrs → Refund", "Down < 2 hrs → Give extension (goodwill)"], "notActiveFlow": ["Recharge NOT active → wiom net connected?", "Not connected → wiom net signal not available", "Connected → Recharge selection done?", "Selection not done → General enquiry / escalate", "Selection done → SMS link received?", "SMS link not received → SMS link issue (retry/resend)", "SMS link received → Made payment?", "Payment not made → Guide for payment — stay on wiom net, use SMS link", "Payment made → Verify payment — reconnect, select recharge, retry with new link"], "refund": {"activeRule": ["Device ping has been down for more than 2 hours, OR", "Wiom Hub shows the customer as \"Refund Eligible\" (see Wiom Hub screenshot reference on the source site)"], "notActiveRule": "Customer is visibly very upset and specifically disputes/complains about the recharge amount — refund as resolution.", "hubNote": "Wiom Hub → Wiom Net → Plan Extension. When a customer qualifies, the panel shows an orange \"Refund Eligible\" banner: \"This customer’s plan is eligible for a refund. Plan extension is disabled while a refund is pending.\" Extension is blocked automatically while a refund is pending — don’t try to extend in this state, process the refund instead."}, "matrix": [{"n": 1, "situation": "No internet on router", "chain": ["wiom net connected? → No", "Hub: device ping active? → No"], "notActive": "Try after some time", "active": "Extend/Refund"}, {"n": 2, "situation": "wiom net signal not showing", "chain": ["wiom net connected? → No", "Hub: device ping active? → Yes"], "notActive": "Try after some time", "active": "Extend"}, {"n": 3, "situation": "Captive portal does not open", "chain": ["wiom net connected? → Yes", "Hub: device ping active? → Yes"], "notActive": "Try after some time", "active": "Extend"}, {"n": 4, "situation": "Payment SMS link not received", "chain": ["wiom net connected? → Yes", "Hub: active recharge for this number? → No", "Hub: device ping active? → Yes", "Payment SMS link received? → No", "Recharge selection done? → Yes", "Using old/previous SMS link? → No"], "notActive": "Try after some time", "active": "Not applicable"}, {"n": 5, "situation": "Free recharge limit exhausted", "chain": ["wiom net connected? → Yes", "Hub: active recharge for this number? → No", "Hub: device ping active? → Yes", "Payment SMS link received? → Yes", "Using mobile data? → No"], "notActive": "Try payment from SMS link with mobile data on, (stay connected to wiom net)", "active": "Not applicable"}, {"n": 6, "situation": "Payment Unsuccessful", "chain": ["wiom net connected? → Yes", "Hub: active recharge for this number? → No", "Hub: device ping active? → Yes", "Payment SMS link received? → Yes"], "notActive": "Reconnect to wiom net, select recharge, use new sms link, with mobile data on if possible, (stay connected to wiom net)", "active": "Not applicable"}, {"n": 7, "situation": "Payment successful, could not connect", "chain": ["wiom net connected? → Yes", "Hub: device ping active? → Yes", "Payment SMS link received? → Yes"], "notActive": "Investigate, refund if true", "active": "Reconnect to wiom net, enter OTP"}, {"n": 8, "situation": "Payment successful, asking for payment again", "chain": ["wiom net connected? → Yes", "Hub: device ping active? → Yes", "Payment SMS link received? → Yes"], "notActive": "Investigate, refund if true", "active": "Reconnect to wiom net, enter OTP"}, {"n": 9, "situation": "OTP not received", "chain": ["wiom net connected? → Yes", "Hub: active recharge for this number? → Yes", "Hub: device ping active? → Yes", "Payment SMS link received? → Yes"], "notActive": "Not applicable", "active": "Try after some time"}, {"n": 10, "situation": "OTP not working/OTP limit exhausted", "chain": ["wiom net connected? → Yes", "Hub: active recharge for this number? → Yes", "Hub: device ping active? → Yes", "Payment SMS link received? → Yes"], "notActive": "Try after some time", "active": "Try after some time"}, {"n": 11, "situation": "General Enquiry", "chain": ["No specific answers needed — general case"], "notActive": "—", "active": "—"}]}, {"key": "masterCall", "title": "Master Call Reference", "rows": [{"n": 1, "situation": "wiom net hotspot at the location isn’t providing internet at all (device ping down). WiomNet is public wiom net — the customer has no router of their own.", "ask": "Are you able to see ‘wiom net’ in your Wi-Fi list at all? Are you at a spot where wiom net is normally available?", "tag": "No internet on router", "trigger": "None — ask customer to retry after some time", "notes": "If recharge turns out to be active once the hotspot is back up, give an extension or refund depending on downtime."}, {"n": 2, "situation": "wiom net not connecting, but the wiom hotspot at that location is online (device ping active).", "ask": "Can you see ‘wiom net’ in your Wi-Fi list? Try moving a little closer to where the wiom net point usually is and check again.", "tag": "wiom net signal not showing", "trigger": "None — ask customer to retry after some time", "notes": "If recharge is active, give an extension for the downtime."}, {"n": 3, "situation": "Customer is connected to wiom net, but the login/captive portal page won’t open.", "ask": "You’re connected to wiom net, right? Please try opening any website like google.com — does a sign-in page pop up?", "tag": "Captive portal does not open", "trigger": "None — ask customer to retry after some time", "notes": "If recharge is active, give an extension for the downtime."}, {"n": 4, "situation": "Customer selected a recharge but never received the payment SMS link.", "ask": "Did you select a recharge on the page? Have you received an SMS with a payment link? Please check your messages.", "tag": "Payment SMS link not received", "trigger": "Guide customer to reselect the recharge on the portal — this triggers a fresh SMS link automatically", "notes": "Confirm customer is not opening an old/previous SMS link before guiding them to reselect."}, {"n": 5, "situation": "No active recharge, no mobile data available, and the free temporary recharge already used up for the day.", "ask": "Do you currently have mobile data turned on? Have you already used the free temporary connection today?", "tag": "Free recharge limit exhausted", "trigger": "Ask customer to turn on mobile data and retry payment via the SMS link, staying connected to wiom net", "notes": "Not applicable if recharge is already active."}, {"n": 6, "situation": "Customer received the SMS link, attempted payment, but it failed.", "ask": "Did the payment go through completely? Any error message shown on screen?", "tag": "Payment Unsuccessful", "trigger": "Ask customer to reconnect to wiom net, select the recharge again, and use a fresh SMS link (mobile data on if possible)", "notes": "Not applicable if recharge is already active."}, {"n": 7, "situation": "Payment went through successfully, but the customer’s internet still isn’t working.", "ask": "Did the payment complete successfully on your end? Are you still connected to wiom net right now?", "tag": "Payment successful, could not connect", "trigger": "Investigate — refund if confirmed true", "notes": "Ask customer to reconnect to wiom net and enter the OTP to complete login."}, {"n": 8, "situation": "Customer already paid once, but the portal is asking them to pay again.", "ask": "Have you already made a payment for this recharge? Is it asking you to pay again right now?", "tag": "Payment successful, asking for payment again", "trigger": "Investigate — refund if confirmed true", "notes": "Ask customer to reconnect to wiom net and enter the OTP to complete login."}, {"n": 9, "situation": "Customer has an active recharge and is connected, but the OTP never arrived.", "ask": "Is the mobile number showing correct? Have you received any OTP SMS in the last few minutes?", "tag": "OTP not received", "trigger": "None — ask customer to retry after some time", "notes": "Not applicable if recharge is not active."}, {"n": 10, "situation": "Customer has an active recharge, is connected, but OTP keeps failing or resend limit is hit.", "ask": "How many times have you tried entering the OTP? Is there any specific error message showing?", "tag": "OTP not working/OTP limit exhausted", "trigger": "None — ask customer to retry after some time", "notes": "Applies whether or not recharge is active — cooldown period needed either way."}, {"n": 11, "situation": "None of the above — customer has a general question about their WiomNet recharge, pricing, or usage.", "ask": "What would you like to know about your WiomNet connection or recharge?", "tag": "General Enquiry", "trigger": "None — handle as standard enquiry", "notes": "Use this tag only when no technical issue matches any other case above."}]}, {"key": "hindiPitch", "title": "Agent Pitch (Hindi)", "cards": [{"n": 1, "situation": "No internet on router", "chain": ["wiom net connected? → No", "Hub: device ping active? → No"], "hindi": "नमस्ते, समझ गया कि आपको internet नहीं मिल रहा। क्या आप अपनी Wi-Fi list में 'wiom net' नाम का network देख पा रहे हैं? आप जिस जगह पर हैं वहाँ आमतौर पर wiom Wi-Fi मिलता है ना? कृपया थोड़ी देर बाद एक बार फिर कोशिश करें, हम इसे जल्द ठीक करवाते हैं।"}, {"n": 2, "situation": "Wifi signal not showing", "chain": ["wiom net connected? → No", "Hub: device ping active? → Yes"], "hindi": "क्या आप 'wiom net' network अपनी Wi-Fi list में देख पा रहे हैं? कृपया जहाँ आमतौर पर wiom Wi-Fi point होता है, उसके थोड़ा और पास जाकर एक बार फिर check करें।"}, {"n": 3, "situation": "Captive portal does not open", "chain": ["wiom net connected? → Yes", "Hub: device ping active? → Yes"], "hindi": "आप wiom net से connect तो हो गए हैं ना? कृपया कोई भी website खोलने की कोशिश करें, जैसे google.com — क्या login वाला page खुल रहा है?"}, {"n": 4, "situation": "Payment SMS link not received", "chain": ["wiom net connected? → Yes", "Hub: active recharge for this number? → No", "Hub: device ping active? → Yes", "Payment SMS link received? → No", "Recharge selection done? → Yes", "Using old/previous SMS link? → No"], "hindi": "क्या आपने recharge select किया था? क्या आपके message (SMS) में payment link आया है? कृपया एक बार अपने message check करके बताएं। अगर नहीं आया है, तो कृपया portal पर जाकर एक बार फिर से recharge select करें — इससे नया link अपने आप आ जाएगा।"}, {"n": 5, "situation": "Free plan limit exhausted", "chain": ["wiom net connected? → Yes", "Hub: active recharge for this number? → No", "Hub: device ping active? → Yes", "Payment SMS link received? → Yes", "Using mobile data? → No"], "hindi": "क्या अभी आपका mobile data on है? क्या आप आज पहले से मुफ़्त connection इस्तेमाल कर चुके हैं? कृपया अपना mobile data on करें और SMS में आए link से payment करने की कोशिश करें, इस दौरान wiom Wi-Fi से जुड़े रहें।"}, {"n": 6, "situation": "Payment Unsuccessful", "chain": ["wiom net connected? → Yes", "Hub: active recharge for this number? → No", "Hub: device ping active? → Yes", "Payment SMS link received? → Yes"], "hindi": "क्या payment पूरी तरह से हो गया था, या बीच में कोई error आया? कृपया दोबारा wiom Wi-Fi से जुड़ें, recharge फिर से चुनें, और नए SMS link से payment करने की कोशिश करें। हो सके तो mobile data on रखें।"}, {"n": 7, "situation": "Payment successful, could not connect", "chain": ["wiom net connected? → Yes", "Hub: device ping active? → Yes", "Payment SMS link received? → Yes"], "hindi": "क्या आपका payment सफलतापूर्वक हो गया था? क्या आप अभी भी wiom net से जुड़े हुए हैं? कृपया एक बार दोबारा wiom net से जुड़ें और OTP डालें। मैं आपके payment की जांच करता/करती हूं, अगर payment हुआ है तो refund की व्यवस्था करेंगे।"}, {"n": 8, "situation": "Payment successful, asking for payment again", "chain": ["wiom net connected? → Yes", "Hub: device ping active? → Yes", "Payment SMS link received? → Yes"], "hindi": "क्या आपने पहले ही एक बार payment कर दिया था? और अभी दोबारा payment मांगा जा रहा है? परेशान मत होइए, मैं इसकी जांच कर रहा/रही हूं। कृपया एक बार दोबारा wiom Wi-Fi से जुड़ें और OTP डालकर देखें।"}, {"n": 9, "situation": "OTP not received", "chain": ["wiom net connected? → Yes", "Hub: active recharge for this number? → Yes", "Hub: device ping active? → Yes", "Payment SMS link received? → Yes"], "hindi": "क्या आपका mobile number सही दिख रहा है? क्या आपको OTP वाला message (SMS) आया? कृपया थोड़ी देर रुककर एक बार फिर कोशिश करें।"}, {"n": 10, "situation": "OTP not working/OTP limit exhausted", "chain": ["wiom net connected? → Yes", "Hub: active recharge for this number? → Yes", "Hub: device ping active? → Yes", "Payment SMS link received? → Yes"], "hindi": "आपने कितनी बार OTP डालने की कोशिश की? कोई खास error message दिख रहा है क्या? कृपया थोड़ी देर रुककर दोबारा कोशिश करें, कुछ minutes बाद यह ठीक हो जाना चाहिए।"}, {"n": 11, "situation": "General Enquiry", "chain": ["No specific answers needed — general case"], "hindi": "जी बताइए, आप अपने wiom net connection या recharge के बारे में क्या जानना चाहेंगे? मैं आपकी पूरी मदद करूंगा/करूंगी।"}]}]}}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById('portalData').textContent);

  var CALLTYPE_BADGE = {
    'Complaint': 'b-bad', 'Query': 'b-info', 'Request': 'b-plum'
  };

  function fcrBadgeClass(fcr) {
    var f = (fcr || '').toLowerCase();
    if (f.indexOf('non') === 0 || f.indexOf('non -') === 0 || f.indexOf('non-') === 0) return 'b-warn';
    if (f.indexOf('partial') === 0) return 'b-warn';
    if (f.indexOf('fcr') !== -1) return 'b-good';
    return 'b-neutral';
  }

  function esc(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function highlight(text, term) {
    var e = esc(text);
    if (!term) return e;
    try {
      var re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      return e.replace(re, '<mark>$1</mark>');
    } catch (err) { return e; }
  }

  function slug(s) {
    return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  /* ---------------- theme ---------------- */
  var root = document.documentElement;
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('wiom-cx-theme'); } catch (e) {}
  if (savedTheme) root.setAttribute('data-theme', savedTheme);
  function currentTheme() {
    if (root.getAttribute('data-theme')) return root.getAttribute('data-theme');
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.getElementById('themeToggle').addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('wiom-cx-theme', next); } catch (e) {}
  });

  /* ---------------- mobile nav ---------------- */
  var navEl = document.getElementById('nav');
  document.getElementById('menuToggle').addEventListener('click', function () {
    navEl.classList.toggle('open');
  });

  /* ---------------- build nav ---------------- */
  function buildNav() {
    var html = '';
    html += '<div class="nav-section-label">Overview</div>';
    html += navItem('home', '', 'Home', '');

    if (DATA.policies && DATA.policies.length) {
      html += '<div class="nav-divider"></div>';
      html += '<div class="nav-section-label">Policies</div>';
      DATA.policies.forEach(function (p) {
        html += navItem('policy', p.name, p.name, '');
      });
    }

    html += '<div class="nav-divider"></div>';
    html += '<div class="nav-section-label">Tagging Matrix</div>';
    DATA.categories.forEach(function (c) {
      html += navItem('tagging', c.name, c.name, c.rows.length);
    });

    html += '<div class="nav-divider"></div>';
    html += '<div class="nav-section-label">Call Scripts</div>';
    DATA.scriptTabs.forEach(function (t) {
      var stepCount = t.items.filter(function (i) { return i.type === 'step'; }).length;
      html += navItem('script', t.name, t.name, stepCount);
    });

    if (DATA.wiomNetSop && DATA.wiomNetSop.pages.length) {
      html += '<div class="nav-divider"></div>';
      html += '<div class="nav-section-label">Wiom Net SOP</div>';
      DATA.wiomNetSop.pages.forEach(function (p) {
        html += navItem('wiomnet', p.key, p.title, '');
      });
    }
    navEl.innerHTML = html;
  }
  function navItem(view, key, label, count) {
    return '<button class="nav-item" data-view="' + view + '" data-key="' + esc(key) + '">' +
      '<span class="label">' + esc(label) + '</span>' +
      (count !== '' ? '<span class="count">' + count + '</span>' : '') +
      '</button>';
  }
  buildNav();

  navEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.nav-item');
    if (!btn) return;
    navigate(btn.getAttribute('data-view'), btn.getAttribute('data-key'));
    navEl.classList.remove('open');
  });

  /* ---------------- routing ---------------- */
  var state = { view: 'home', key: '' };

  function setActiveNav() {
    var items = navEl.querySelectorAll('.nav-item');
    items.forEach(function (it) {
      it.classList.toggle('active', it.getAttribute('data-view') === state.view && it.getAttribute('data-key') === state.key);
    });
  }

  function navigate(view, key, pushHash) {
    state = { view: view, key: key || '' };
    if (pushHash !== false) {
      location.hash = '#' + view + (key ? '/' + encodeURIComponent(key) : '');
    }
    document.getElementById('globalSearch').value = '';
    document.getElementById('searchClear').classList.remove('show');
    render();
    document.getElementById('main').scrollTop = 0;
    setActiveNav();
  }

  function parseHash() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return { view: 'home', key: '' };
    var parts = h.split('/');
    return { view: parts[0] || 'home', key: parts[1] ? decodeURIComponent(parts[1]) : '' };
  }

  window.addEventListener('hashchange', function () {
    state = parseHash();
    render();
    setActiveNav();
  });

  /* ---------------- renderers ---------------- */
  var mainInner = document.getElementById('mainInner');

  function render() {
    if (state.view === 'home') return renderHome();
    if (state.view === 'policy') return renderPolicy(state.key);
    if (state.view === 'tagging') return renderTagging(state.key);
    if (state.view === 'script') return renderScript(state.key);
    if (state.view === 'wiomnet') return renderWiomNet(state.key);
    if (state.view === 'search') return; // handled by search input
    renderHome();
  }

  function sourceLinkHtml(url) {
    return '<div class="source-link-row"><a class="source-link" href="' + esc(url) + '" target="_blank" rel="noopener">' +
      'View original source <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></a></div>';
  }

  function renderWiomNet(key) {
    var sop = DATA.wiomNetSop;
    if (!sop) { renderHome(); return; }
    var page = sop.pages.find(function (p) { return p.key === key; });
    if (!page) { page = sop.pages[0]; }
    var html = '<div class="page-head"><div class="eyebrow">Wiom Net SOP</div><h1>' + esc(page.title) + '</h1></div>';
    html += sourceLinkHtml(sop.sourceUrl);

    if (page.key === 'flow') {
      html += '<div class="flow-timeline">' + page.steps.map(function (s) {
        return '<div class="flow-step ' + esc(s.kind) + '"><div class="fs-code">' + esc(s.code) + '</div>' +
          '<div><div class="fs-title">' + esc(s.title) + '</div><div class="fs-body">' + esc(s.body) + '</div></div></div>';
      }).join('') + '</div>';

      html += '<div class="page-head"><h1 style="font-size:15px;" class="eyebrow">Quick Reference — Situation → What To Do</h1></div>';
      html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Situation</th><th>What the agent should do</th><th>Say this to the customer</th></tr></thead><tbody>';
      html += page.quickRef.map(function (q) {
        return '<tr><td>' + esc(q.situation) + '</td><td>' + esc(q.doThis) + '</td><td>' + esc(q.sayThis) + '</td></tr>';
      }).join('');
      html += '</tbody></table></div>';
    }

    if (page.key === 'troubleshooting') {
      html += '<div class="tag-chip-row">' + page.tags.map(function (t) { return '<span class="tag-chip">' + esc(t) + '</span>'; }).join('') + '</div>';
      html += '<div class="field full" style="margin-bottom:20px;"><div class="flabel">How Agents Use This</div><div class="fvalue">' + esc(page.howAgentsUse) + '</div></div>';

      html += '<div class="flow-columns">';
      html += '<div class="field"><div class="flabel">1. If the Recharge IS Active</div><ul class="clean fvalue">' + page.activeFlow.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>';
      html += '<div class="field"><div class="flabel">2. If the Recharge is NOT Active</div><ul class="clean fvalue">' + page.notActiveFlow.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>';
      html += '</div>';

      html += '<div class="flow-columns">';
      html += '<div class="field eligible"><div class="flabel">3. Refund Conditions — If Recharge Active</div><ul class="clean fvalue">' + page.refund.activeRule.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>';
      html += '<div class="field eligible"><div class="flabel">Refund Conditions — If Recharge NOT Active</div><div class="fvalue">' + esc(page.refund.notActiveRule) + '</div></div>';
      html += '</div>';
      html += '<div class="field full" style="margin-bottom:20px;"><div class="flabel">Wiom Hub Reference</div><div class="fvalue">' + esc(page.refund.hubNote) + '</div></div>';

      html += '<div class="page-head"><h1 style="font-size:15px;" class="eyebrow">4. Full Decision Matrix</h1></div>';
      html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>Situation</th><th>Question Chain</th><th>If Not Active</th><th>If Active</th></tr></thead><tbody>';
      html += page.matrix.map(function (m) {
        return '<tr><td class="num">' + m.n + '</td><td class="emphasis">' + esc(m.situation) + '</td>' +
          '<td><ul class="chain-list">' + m.chain.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></td>' +
          '<td>' + esc(m.notActive) + '</td><td>' + esc(m.active) + '</td></tr>';
      }).join('');
      html += '</tbody></table></div>';
    }

    if (page.key === 'masterCall') {
      html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>Situation</th><th>What to Ask</th><th>CRM Tag</th><th>Trigger / Action</th><th>Notes</th></tr></thead><tbody>';
      html += page.rows.map(function (r) {
        return '<tr><td class="num">' + r.n + '</td><td>' + esc(r.situation) + '</td><td>' + esc(r.ask) + '</td>' +
          '<td class="emphasis">' + esc(r.tag) + '</td><td>' + esc(r.trigger) + '</td><td>' + esc(r.notes) + '</td></tr>';
      }).join('');
      html += '</tbody></table></div>';
    }

    if (page.key === 'hindiPitch') {
      html += page.cards.map(function (c, i) {
        var card = '<div class="script-card"><div class="sc-head"><div><div class="sc-step">' + c.n + '. ' + esc(c.situation) + '</div>' +
          '<div class="sc-sub">' + esc(c.chain.join(' · ')) + '</div></div>' +
          '<button class="copybtn" data-wn-copy="' + i + '"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</button></div>' +
          '<div class="sc-hindi">' + esc(c.hindi) + '</div></div>';
        return card;
      }).join('');
    }

    mainInner.innerHTML = html;

    if (page.key === 'hindiPitch') {
      mainInner.querySelectorAll('[data-wn-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var idx = +btn.getAttribute('data-wn-copy');
          var text = page.cards[idx].hindi;
          var done = function () {
            btn.classList.add('copied');
            btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>Copied';
            setTimeout(function () {
              btn.classList.remove('copied');
              btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy';
            }, 1400);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, done); } else { done(); }
        });
      });
    }
  }

  function renderPolicy(key) {
    var policy = (DATA.policies || []).find(function (p) { return p.name === key; });
    if (!policy) { renderHome(); return; }
    var html = '';
    html += '<div class="page-head"><div class="eyebrow">Policy</div><h1>' + esc(policy.name) + '</h1></div>';
    if (policy.complianceNote) {
      html += '<div class="compliance-banner">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
        '<div><strong>Strict compliance required.</strong> ' + esc(policy.complianceNote) + '</div></div>';
    }
    policy.sections.forEach(function (section) {
      html += '<div class="policy-section"><h2>' + esc(section.heading) + '</h2>';
      section.items.forEach(function (item) {
        html += '<div class="policy-rule"><span class="pr-mark"></span><div class="pr-text">' + esc(item.text);
        if (item.examples && item.examples.length) {
          html += '<div class="policy-examples"><div class="pe-label">Examples</div><ul>' +
            item.examples.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>';
        }
        html += '</div></div>';
      });
      html += '</div>';
    });
    mainInner.innerHTML = html;
  }

  function renderHome() {
    var totalRows = DATA.categories.reduce(function (a, c) { return a + c.rows.length; }, 0);
    var totalSteps = DATA.scriptTabs.reduce(function (a, t) { return a + t.items.filter(function (i) { return i.type === 'step'; }).length; }, 0);
    var html = '';
    html += '<div class="home-hero">';
    html += '<div class="eyebrow">CX Operations · Tagging &amp; Call Scripts</div>';
    html += '<h1>Wiom CX Console</h1>';
    html += '<p>One reference for how to tag a ticket and what to say on the call — the ticket-tagging matrix (eligibility, TAT, FCR, ownership) and the verbatim Hindi call scripts for every category, kept in sync.</p>';
    html += '<div class="stat-row">';
    html += '<div class="stat"><div class="num">' + DATA.categories.length + '</div><div class="lbl">Tagging categories</div></div>';
    html += '<div class="stat"><div class="num">' + totalRows + '</div><div class="lbl">Sub-categories tagged</div></div>';
    html += '<div class="stat"><div class="num">' + DATA.scriptTabs.length + '</div><div class="lbl">Script tabs</div></div>';
    html += '<div class="stat"><div class="num">' + totalSteps + '</div><div class="lbl">Scripted steps</div></div>';
    html += '</div></div>';

    if (DATA.policies && DATA.policies.length) {
      html += '<div class="page-head"><h1 style="font-size:15px;margin-bottom:10px;" class="eyebrow">Policies</h1></div>';
      html += '<div class="grid-cards">';
      DATA.policies.forEach(function (p) {
        var ruleCount = p.sections.reduce(function (a, s) { return a + s.items.length; }, 0);
        html += '<button class="home-card" data-view="policy" data-key="' + esc(p.name) + '">' +
          '<div class="hc-kicker">Policy</div>' +
          '<div class="hc-title">' + esc(p.name) + '</div>' +
          '<div class="hc-meta">' + ruleCount + ' rules · ' + p.sections.length + ' sections</div></button>';
      });
      html += '</div>';
    }

    html += '<div class="page-head" style="margin-top:26px;"><h1 style="font-size:15px;margin-bottom:10px;" class="eyebrow">Jump to a tagging category</h1></div>';
    html += '<div class="grid-cards">';
    DATA.categories.forEach(function (c) {
      html += '<button class="home-card" data-view="tagging" data-key="' + esc(c.name) + '">' +
        '<div class="hc-kicker">Tagging</div>' +
        '<div class="hc-title">' + esc(c.name) + '</div>' +
        '<div class="hc-meta">' + c.rows.length + ' sub-categories</div></button>';
    });
    html += '</div>';

    html += '<div class="page-head" style="margin-top:26px;"><h1 style="font-size:15px;margin-bottom:10px;" class="eyebrow">Jump to a call script</h1></div>';
    html += '<div class="grid-cards">';
    DATA.scriptTabs.forEach(function (t) {
      var stepCount = t.items.filter(function (i) { return i.type === 'step'; }).length;
      html += '<button class="home-card" data-view="script" data-key="' + esc(t.name) + '">' +
        '<div class="hc-kicker">Script</div>' +
        '<div class="hc-title">' + esc(t.name) + '</div>' +
        '<div class="hc-meta">' + stepCount + ' scripted steps</div></button>';
    });
    html += '</div>';

    if (DATA.wiomNetSop && DATA.wiomNetSop.pages.length) {
      html += '<div class="page-head" style="margin-top:26px;"><h1 style="font-size:15px;margin-bottom:10px;" class="eyebrow">Jump to Wiom Net SOP</h1></div>';
      html += '<div class="grid-cards">';
      DATA.wiomNetSop.pages.forEach(function (p) {
        html += '<button class="home-card" data-view="wiomnet" data-key="' + esc(p.key) + '">' +
          '<div class="hc-kicker">Wiom Net</div>' +
          '<div class="hc-title">' + esc(p.title) + '</div>' +
          '<div class="hc-meta">Public Wi-Fi hotspot SOP</div></button>';
      });
      html += '</div>';
    }

    mainInner.innerHTML = html;
    bindCardNav();
  }

  function bindCardNav() {
    mainInner.querySelectorAll('[data-view]').forEach(function (el) {
      el.addEventListener('click', function () {
        navigate(el.getAttribute('data-view'), el.getAttribute('data-key'));
      });
    });
  }

  function renderTagging(key) {
    var cat = DATA.categories.find(function (c) { return c.name === key; });
    if (!cat) { renderHome(); return; }
    var html = '';
    html += '<div class="page-head"><div class="eyebrow">Tagging Matrix</div><h1>' + esc(cat.name) + '</h1>' +
      '<p class="desc">' + cat.rows.length + ' sub-categories. Expand a row for the full eligibility, SLA, script pointer, and information-to-capture detail.</p></div>';

    cat.rows.forEach(function (row, idx) {
      html += renderRowCard(row, cat.name, idx);
    });
    mainInner.innerHTML = html;
    bindPitchLinks();
  }

  function renderRowCard(row, catName, idx, openAll) {
    var callBadge = CALLTYPE_BADGE[row.callType] || 'b-neutral';
    var html = '<details class="row-card" id="row-' + slug(catName) + '-' + idx + '"' + (openAll ? ' open' : '') + '>';
    html += '<summary>';
    html += '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>';
    html += '<span class="subcat-name">' + esc(row.subCategory) + '</span>';
    html += '<span class="badges">';
    if (row.callType) html += '<span class="badge ' + callBadge + '">' + esc(row.callType) + '</span>';
    if (row.fcr) html += '<span class="badge ' + fcrBadgeClass(row.fcr) + '">' + esc(row.fcr) + '</span>';
    if (row.tat) html += '<span class="badge b-neutral">TAT ' + esc(row.tat) + '</span>';
    html += '</span></summary>';

    html += '<div class="row-body">';
    if (row.definition) {
      html += '<div class="field full" style="margin-top:12px;"><div class="flabel">Definition</div><div class="fvalue">' + esc(row.definition) + '</div></div>';
    }

    html += '<div class="field-grid">';
    if (row.tagEligible) html += '<div class="field eligible"><div class="flabel">Eligibility criteria</div><div class="fvalue">' + esc(row.tagEligible) + '</div></div>';
    if (row.tagNonEligible) html += '<div class="field noneligible"><div class="flabel">Non-eligibility criteria</div><div class="fvalue">' + esc(row.tagNonEligible) + '</div></div>';
    html += '</div>';

    html += '<div class="field-grid" style="margin-top:14px;">';
    html += '<div class="field"><div class="flabel">Queue → Ownership</div><div class="fvalue">' + esc(row.queue) + (row.ownership ? ' → ' + esc(row.ownership) : '') + '</div></div>';
    html += '<div class="field"><div class="flabel">Call Script Pitch</div><div class="fvalue"><a class="pitch-link" href="#" data-pitch="' + esc(row.inboundPitch) + '">' + esc(row.inboundPitch || '—') +
      ' <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></a></div></div>';
    html += '</div>';

    if (row.callObjective) {
      html += '<div class="field full" style="margin-top:14px;"><div class="flabel">Call Handling Objective</div><div class="fvalue">' + esc(row.callObjective) + '</div></div>';
    }
    if (row.troubleshoot) {
      html += '<div class="field full" style="margin-top:14px;"><div class="flabel">Troubleshooting Steps</div><div class="fvalue">' + esc(row.troubleshoot) + '</div></div>';
    }

    if (row.queriesHi.length || row.queriesEn.length) {
      html += '<div class="lang-pair" style="margin-top:14px;">';
      html += '<div class="field hi"><div class="flabel">Top Customer Queries (Hindi)</div><ul class="clean fvalue">' + row.queriesHi.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul></div>';
      html += '<div class="field en"><div class="flabel">English Translation</div><ul class="clean fvalue">' + row.queriesEn.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul></div>';
      html += '</div>';
    }

    if (row.resolutionPath) {
      var steps = row.resolutionPath.split(/→/).map(function (s) { return s.trim(); }).filter(Boolean);
      html += '<div style="margin-top:14px;"><div class="flabel" style="font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;">Current Resolution Path</div>';
      html += '<div class="resolution-path">' + steps.map(function (s, i) {
        return '<div class="rp-step"><span class="rp-n">' + (i + 1) + '</span><span class="fvalue">' + esc(s) + '</span></div>';
      }).join('') + '</div></div>';
    }

    html += '<div class="field-grid" style="margin-top:14px;">';
    if (row.infoRetrieved.length) html += '<div class="field"><div class="flabel">Information Retrieved</div><ul class="clean fvalue">' + row.infoRetrieved.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul></div>';
    if (row.questions.length) html += '<div class="field"><div class="flabel">Questions to be Asked</div><ul class="clean fvalue">' + row.questions.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul></div>';
    html += '</div>';

    html += '</div></details>';
    return html;
  }

  function bindPitchLinks() {
    mainInner.querySelectorAll('[data-pitch]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var pitch = a.getAttribute('data-pitch');
        var target = DATA.scriptTabs.find(function (t) { return t.name === pitch; }) ||
          DATA.scriptTabs.find(function (t) { return t.items.some(function (i) { return i.subCategory === pitch; }); });
        if (target) navigate('script', target.name);
      });
    });
  }

  function renderScript(key) {
    var tab = DATA.scriptTabs.find(function (t) { return t.name === key; });
    if (!tab) { renderHome(); return; }
    var stepCount = tab.items.filter(function (i) { return i.type === 'step'; }).length;
    var html = '';
    html += '<div class="page-head"><div class="eyebrow">Call Script</div><h1>' + esc(tab.title || tab.name) + '</h1>' +
      '<p class="desc">' + esc(tab.subtitle) + '</p></div>';

    tab.items.forEach(function (item, i) {
      if (item.type === 'banner') {
        var isSubcat = /^SUB-CATEGORY:/i.test(item.text.trim());
        html += '<div class="script-banner' + (isSubcat ? ' subcat' : '') + '">' + esc(item.text) + '</div>';
      } else {
        html += '<div class="script-card" data-hindi-idx="' + i + '">';
        html += '<div class="sc-head"><div><div class="sc-step">' + esc(item.step) + '</div>' +
          (item.subCategory && item.subCategory !== item.step.replace(/^\d+\.\s*/, '') ? '' : '') + '</div>' +
          '<button class="copybtn" data-copy="' + i + '"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</button>';
        html += '</div>';
        html += '<div class="sc-hindi">' + esc(item.hindi) + '</div>';
        if (item.backend && item.backend !== '—') {
          html += '<div class="sc-backend"><div class="flabel">Agent Backend Action</div>' + esc(item.backend) + '</div>';
        }
        html += '</div>';
      }
    });
    mainInner.innerHTML = html;

    mainInner.querySelectorAll('[data-copy]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = +btn.getAttribute('data-copy');
        var item = tab.items[idx];
        var text = item.hindi;
        var done = function () {
          btn.classList.add('copied');
          btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>Copied';
          setTimeout(function () {
            btn.classList.remove('copied');
            btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy';
          }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, done);
        } else { done(); }
      });
    });
  }

  /* ---------------- global search ---------------- */
  var searchInput = document.getElementById('globalSearch');
  var searchClear = document.getElementById('searchClear');
  var lastNonSearchView = { view: 'home', key: '' };

  searchInput.addEventListener('input', function () {
    var term = searchInput.value.trim();
    searchClear.classList.toggle('show', !!term);
    if (!term) {
      render();
      return;
    }
    if (state.view !== 'search') { lastNonSearchView = { view: state.view, key: state.key }; }
    runSearch(term);
  });
  searchClear.addEventListener('click', function () {
    searchInput.value = '';
    searchClear.classList.remove('show');
    navigate(lastNonSearchView.view, lastNonSearchView.key);
  });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { searchClear.click(); searchInput.blur(); }
  });

  function runSearch(term) {
    var lower = term.toLowerCase();
    var results = [];

    (DATA.policies || []).forEach(function (policy) {
      policy.sections.forEach(function (section) {
        section.items.forEach(function (item) {
          var hay = [section.heading, item.text].concat(item.examples || []).join(' • ');
          if (hay.toLowerCase().indexOf(lower) !== -1) {
            results.push({ kind: 'Policy · ' + policy.name, title: section.heading, snippet: snippetAround(hay, lower), go: function () { navigate('policy', policy.name); } });
          }
        });
      });
    });

    DATA.categories.forEach(function (cat) {
      cat.rows.forEach(function (row) {
        var hay = [row.subCategory, row.definition, row.tagEligible, row.tagNonEligible, row.callObjective,
          row.troubleshoot, row.resolutionPath].concat(row.queriesHi, row.queriesEn, row.infoRetrieved, row.questions).join(' • ');
        if (hay.toLowerCase().indexOf(lower) !== -1) {
          results.push({ kind: 'Tagging · ' + cat.name, title: row.subCategory, snippet: snippetAround(hay, lower), go: function () { navigate('tagging', cat.name); setTimeout(function(){ var el=document.getElementById('row-'+slug(cat.name)+'-'+cat.rows.indexOf(row)); if(el){el.open=true; el.scrollIntoView({block:'center'});} }, 30); } });
        }
      });
    });

    DATA.scriptTabs.forEach(function (tab) {
      tab.items.forEach(function (item) {
        if (item.type !== 'step') return;
        var hay = [item.step, item.subCategory, item.hindi, item.backend].join(' • ');
        if (hay.toLowerCase().indexOf(lower) !== -1) {
          results.push({ kind: 'Script · ' + tab.name, title: item.step, snippet: snippetAround(hay, lower), go: function () { navigate('script', tab.name); } });
        }
      });
    });

    if (DATA.wiomNetSop) {
      DATA.wiomNetSop.pages.forEach(function (page) {
        var chunks = [];
        if (page.steps) page.steps.forEach(function (s) { chunks.push([s.title, s.body, s.title]); });
        if (page.quickRef) page.quickRef.forEach(function (q) { chunks.push([q.situation, q.situation, q.doThis + ' ' + q.sayThis]); });
        if (page.matrix) page.matrix.forEach(function (m) { chunks.push([m.situation, m.situation, m.chain.join(' ') + ' ' + m.notActive + ' ' + m.active]); });
        if (page.rows) page.rows.forEach(function (r) { chunks.push([r.situation, r.situation, r.ask + ' ' + r.tag + ' ' + r.trigger + ' ' + r.notes]); });
        if (page.cards) page.cards.forEach(function (c) { chunks.push([c.situation, c.situation, c.hindi]); });
        if (page.tags) chunks.push(['CRM Tags', 'CRM Tags', page.tags.join(' ')]);
        chunks.forEach(function (chunk) {
          var title = chunk[1], hay = chunk[0] + ' • ' + chunk[2];
          if (hay.toLowerCase().indexOf(lower) !== -1) {
            results.push({ kind: 'Wiom Net · ' + page.title, title: title, snippet: snippetAround(hay, lower), go: function () { navigate('wiomnet', page.key); } });
          }
        });
      });
    }

    renderSearchResults(term, results);
  }

  function snippetAround(hay, lower) {
    var idx = hay.toLowerCase().indexOf(lower);
    if (idx === -1) return hay.slice(0, 140);
    var start = Math.max(0, idx - 50);
    var end = Math.min(hay.length, idx + lower.length + 90);
    return (start > 0 ? '…' : '') + hay.slice(start, end) + (end < hay.length ? '…' : '');
  }

  function renderSearchResults(term, results) {
    var html = '<div class="page-head"><div class="eyebrow">Search</div><h1>' + results.length + ' result' + (results.length === 1 ? '' : 's') + ' for "' + esc(term) + '"</h1></div>';
    if (!results.length) {
      html += '<div class="empty-state">No matches. Try a shorter term, or search in Hindi / English.</div>';
      mainInner.innerHTML = html;
      return;
    }
    results.slice(0, 120).forEach(function (r, i) {
      html += '<div class="result-item" data-ridx="' + i + '"><div class="ri-path">' + esc(r.kind) + '</div>' +
        '<div class="ri-title">' + highlight(r.title, term) + '</div>' +
        '<div class="ri-snippet">' + highlight(r.snippet, term) + '</div></div>';
    });
    mainInner.innerHTML = html;
    mainInner.querySelectorAll('.result-item').forEach(function (el, i) {
      el.addEventListener('click', function () { results[i].go(); });
    });
  }

  /* ---------------- init ---------------- */
  state = parseHash();
  render();
  setActiveNav();
})();
</script>
