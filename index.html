p": "6. Repeat Call — Ticket Already Exists", "subCategory": "Frequent Disconnection", "hindi": "(Ticket TAT के अंदर है) \"Customer Name\", मैं देख पा रहा/रही हूँ कि आपकी इस समस्या का ticket पहले से बना हुआ है। हमारी team इस पर काम कर रही है, कृपया (remaining TAT) तक का समय दें।\n\n(TAT cross हो चुका है) \"Customer Name\", हमें खेद है कि दिए गए समय में आपकी समस्या हल नहीं हो पाई। हमारी team इस पर काम कर रही है। मैं इसे priority पर हमारी team के पास भेज रहा/रही हूँ।", "backend": "Troubleshooting दोबारा न करें\nKapture में same issue का ticket और उसके comments check करें\nनया ticket न बनाएँ — existing ticket में notes update करें"}, {"type": "banner", "text": "SUB-CATEGORY: Slow Speed/Range Issues"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Slow Speed/Range Issues", "hindi": "मैं समझ सकता/सकती हूं \"[Customer Name]\" कि आपको नेट की speed को लेकर परेशानी हो रही है।", "backend": "—"}, {"type": "step", "step": "5. Restart Check", "subCategory": "Slow Speed/Range Issues", "hindi": "क्या आपने अपना Net Box restart किया है?\n\nIf No: कोई बात नहीं \"Customer Name\", कृपया Net Box को power switch से बंद करें और 30 seconds बाद फिर से on करें। मैं call पर ही आपके साथ हूं।", "backend": "—"}, {"type": "step", "step": "6. Check Optical Power", "subCategory": "Slow Speed/Range Issues", "hindi": "—", "backend": "WIOM Hub में Optical Power check करें ताकि connectivity से जुड़े issues पहचाने जा सकें।"}, {"type": "step", "step": "7. Run Live Speed Test", "subCategory": "Slow Speed/Range Issues", "hindi": "मैं अभी आपके connection की real-time speed check कर रहा/रही हूं, कृपया एक-दो minutes line पर बने रहें।", "backend": "WIOM Hub में Live Speed Test चलाएं — Run button सिर्फ एक बार दबाएं ताकि reading सही और consistent रहे। Test में सामान्यतः 1-2 minutes लगते हैं, कुछ मामलों में 3-4 minutes भी लग सकते हैं। एक बार पूरा हो चुका result अगले 6 घंटे तक valid रहता है।"}, {"type": "step", "step": "8. If Speed ≥80 Mbps (OCR)", "subCategory": "Slow Speed/Range Issues", "hindi": "आपकी speed अभी सही आ रही है और हमारे standard के अनुसार है। मैं आपको बता देता/देती हूं कि Wi-Fi performance distance, दीवारों और आसपास के obstacles से कैसे प्रभावित होती है, ताकि आपको बेहतर अनुभव मिले।", "backend": "FAQ 1 (distance/interference/band placement) का इस्तेमाल करके customer को educate करें → OCR / On-Call Resolve mark करें।"}, {"type": "step", "step": "9. If Speed <80 Mbps (Raise Ticket)", "subCategory": "Slow Speed/Range Issues", "hindi": "आपके सहयोग के लिए धन्यवाद। मैंने आपकी speed जांच ली है और इसे हमारी CSP team के पास आगे भेज रहा/रही हूं।\n\nकृपया हमें 24 घंटे का समय दें। यदि आप समाधान से संतुष्ट नहीं हैं तो ticket को reopen कर सकते हैं।", "backend": "Kapture में ticket raise करें — actual live speed, date और time ticket notes में दर्ज करें। अगर customer ≥80 Mbps पर है लेकिन 8880322222 पर screenshot भेजता है या call पर Ookla speed <80 confirm करता है, तो customer-claimed speed भी notes में लिखें। TAT: 24 घंटे — CSP/PFT intervention।\nKapture ticket notes में Ping delay mention करना mandatory है।"}, {"type": "step", "step": "10. Kapture Questions (Mandatory before Ticket Creation)", "subCategory": "Slow Speed/Range Issues", "hindi": "—", "backend": "Ticket create करने से पहले Kapture में यह जानकारी confirm करें: • Live Speed in Wiom Hub (Mandatory) • बेहतर Wi-Fi इस्तेमाल की जानकारी दी गई (Yes/No) (Mandatory) • CS Claimed Current Speed from Ookla (Non-Mandatory)"}, {"type": "step", "step": "11. Customer Confirmation Before Closing", "subCategory": "Slow Speed/Range Issues", "hindi": "क्या अभी भी आपको speed को लेकर कोई दिक्कत महसूस हो रही है?", "backend": "ग्राहक से पुष्टि करने के बाद ही case resolve/close करें।"}, {"type": "step", "step": "12. Repeat Call — Ticket Already Exists", "subCategory": "Slow Speed/Range Issues", "hindi": "(Ticket TAT के अंदर है) \"Customer Name\", मैं देख पा रहा/रही हूँ कि आपकी इस समस्या का ticket पहले से बना हुआ है। हमारी team इस पर काम कर रही है, कृपया (remaining TAT) तक का समय दें।\n\n(TAT cross हो चुका है) \"Customer Name\", हमें खेद है कि दिए गए समय में आपकी समस्या हल नहीं हो पाई। हमारी team इस पर काम कर रही है। मैं इसे priority पर हमारी team के पास भेज रहा/रही हूँ।", "backend": "Troubleshooting दोबारा न करें\nKapture में same issue का ticket और उसके comments check करें\nनया ticket न बनाएँ — existing ticket में notes update करें"}, {"type": "banner", "text": "Slow Speed/Range Issues — Situational FAQ Scripts (use as needed based on the customer’s question)"}, {"type": "step", "step": "FAQ 1. Distance, Interference & Band Placement", "subCategory": "Slow Speed/Range Issues", "hindi": "(Band Steering OFF)\nSir/Ma’am, Net Box की performance distance और दीवारों की वजह से प्रभावित हो सकती है। जितना आप NetBox से दूर जाते हैं, या बीच में जितनी ज्यादा दीवारें या रुकावटें होती हैं, Wi-Fi signal उतना ही कमज़ोर हो सकता है और speed कम मिल सकती है। 5 GHz band Net Box के पास बेहतर speed के लिए सही है, और 2.4 GHz band लंबी दूरी और दीवारों के पार बेहतर coverage देता है। इसलिए Net Box को घर की central और खुली जगह पर रखना और ज़रूरत के अनुसार 2.4 GHz या 5 GHz band इस्तेमाल करना recommended है।\n\n(Band Steering ON)\nSir/Ma’am, NetBox की performance distance और दीवारों की वजह से प्रभावित हो सकती है। Wiom आपकी location और signal के हिसाब से अपने आप best network choose करता है, इसलिए आपको बार-बार खुद network switch करने की ज़रूरत नहीं है।", "backend": "—"}, {"type": "step", "step": "FAQ 2. \"Plan mein 100 Mbps hai but 20-30 Mbps bhi nahi milta\"", "subCategory": "Slow Speed/Range Issues", "hindi": "Sir/Ma’am, आपके plan की speed Wi-Fi पर distance, interference और connected devices की वजह से बदल सकती है। सबसे पहले हम Net Box के पास speed check करेंगे। अगर Net Box के पास भी speed 20–30 Mbps ही आ रही है, तो हम connection या netbox-related issue को आगे check करेंगे।", "backend": "—"}, {"type": "step", "step": "FAQ 3. \"Netbox ke paas speed theek hai but doosre kamre mein nahi aata\"", "subCategory": "Slow Speed/Range Issues", "hindi": "Band Steering OFF\n\nSir/Ma’am, NetBox से दूर जाने या बीच में दीवारें होने पर Wi-Fi signal कम हो सकता है। 5 GHz NetBox के पास अच्छी speed देता है, और 2.4 GHz ज्यादा दूर तक बेहतर signal देता है। अगर आप दूसरे कमरे में हैं, तो 2.4 GHz Wi-Fi से connect करके check करें। NetBox को घर के बीच में और खुली जगह पर रखने से भी signal बेहतर मिल सकता है।\n\nBand Steering ON\n\nSir/Ma’am, NetBox से दूर जाने या बीच में दीवारें होने पर Wi-Fi signal कम हो सकता है। आपका NetBox signal के हिसाब से अपने आप best connection choose करता है, इसलिए आपको खुद से कुछ change करने की ज़रूरत नहीं है। NetBox को घर के बीच में और खुली जगह पर रखने से signal बेहतर मिल सकता है। अगर आपको speed की दिक्कत आ रही है, तो मैं आपकी complaint दर्ज कर देता/देती हूं।", "backend": "—"}, {"type": "step", "step": "FAQ 4. \"Raat ko speed acchi hoti hai din mein gir jaati hai\"", "subCategory": "Slow Speed/Range Issues", "hindi": "Sir/Ma’am, दिन के समय अगर घर में ज्यादा devices Wi-Fi से connected हैं और सब पर एक साथ internet चल रहा है, तो हर device पर speed थोड़ी कम आ सकती है।", "backend": "—"}, {"type": "step", "step": "FAQ 5. Troubleshooting Already Done Multiple Times", "subCategory": "Slow Speed/Range Issues", "hindi": "Okay sir, जैसा कि मैं देख पा रहा/रही हूं आपने troubleshooting कर लिया है। मैं इस issue को अपनी team को escalate करके आपका issue जल्द solve करवाने की कोशिश करूंगा/करूंगी।", "backend": "—"}, {"type": "step", "step": "FAQ 6. Wi-Fi Not Reaching a Room/Floor", "subCategory": "Slow Speed/Range Issues", "hindi": "Band Steering OFF\n\nSir/Ma’am, NetBox से दूर जाने या बीच में दीवारें/floor होने पर Wi-Fi signal कम हो सकता है। 5 GHz NetBox के पास अच्छा चलता है, और 2.4 GHz ज्यादा दूर तक बेहतर signal देता है। अगर दूसरे room या floor पर signal नहीं आ रहा है, तो 2.4 GHz Wi-Fi से connect करके check करें। NetBox को घर के बीच में और खुली जगह पर रखने से भी signal बेहतर मिल सकता है। अगर फिर भी दूसरे room या floor पर Wi-Fi नहीं आ रहा है, तो मैं आपकी complaint दर्ज कर देता/देती हूं।\n\nBand Steering ON\n\nSir/Ma’am, NetBox से दूर जाने या बीच में दीवारें/floor होने पर Wi-Fi signal कम हो सकता है। आपका NetBox signal के हिसाब से अपने आप best connection choose करता है, इसलिए आपको खुद से कुछ change करने की ज़रूरत नहीं है। NetBox को घर के बीच में और खुली जगह पर रखने से signal बेहतर मिल सकता है। अगर फिर भी दूसरे room या floor पर Wi-Fi नहीं आ रहा है, तो मैं आपकी complaint दर्ज कर देता/देती हूं।", "backend": "—"}, {"type": "step", "step": "FAQ 7. Technician Visited, No Fault Found, Still Slow", "subCategory": "Slow Speed/Range Issues", "hindi": "Sir/Ma’am, हमें खेद है कि technician visit के बाद भी issue continue हो रहा है। अगर technician को connection में कोई fault नहीं मिला और problem अभी भी आ रही है, तो हम आपके issue को आगे की जांच के लिए भेज रहे हैं।", "backend": "—"}, {"type": "step", "step": "FAQ 8. Buffering Despite Good Speed Test", "subCategory": "Slow Speed/Range Issues", "hindi": "Sir/Ma’am, speed test में speed normal आने के बाद भी buffering हो सकती है। कभी-कभी ज्यादा devices एक साथ connected होने, आपके device की connectivity, या जिस app/website का आप इस्तेमाल कर रहे हैं उसमें problem होने की वजह से buffering हो सकती है।", "backend": "—"}, {"type": "step", "step": "FAQ 9. Repeat Complaint — Not Resolved Since Last Call", "subCategory": "Slow Speed/Range Issues", "hindi": "हमें खेद है कि बार-बार issue होने के बाद भी यह resolve नहीं हुआ। मैं आपके लिए एक और request raise कर रहा/रही हूं। हमारा technician आपके घर आकर issue को check करेगा और इसे पूरी तरह resolve करेगा।", "backend": "—"}, {"type": "step", "step": "FAQ 10. Speed Drops Near Recharge Renewal", "subCategory": "Slow Speed/Range Issues", "hindi": "Sir/Ma’am, अभी आपके हिसाब से speed कितनी मिल रही है? मैं आपकी complaint raise कर देता/देती हूं। हमारी concerned team आपसे connect करके issue को आगे check करेगी और आपको resolution देगी।", "backend": "—"}, {"type": "step", "step": "FAQ 11. \"2 Band Show Nahi Ho Rahe / 5G Nahi Aa Raha\" (Band Steering ON)", "subCategory": "Slow Speed/Range Issues", "hindi": "अब Wiom में आपको एक ही signal दिखेगा — यह नया setup है जो बेहतर performance के लिए design किया गया है। पहले अलग-अलग signal होते थे, लेकिन अब Wiom automatically best network choose करता है, इसलिए आपको खुद से बार-बार switch करने की ज़रूरत नहीं है। आप बस इसी signal से connect रखिए — घर का नेट smoothly चलेगा।", "backend": "—"}, {"type": "step", "step": "FAQ 12. \"Bhai ke ghar 2 band dikhte hain, speed better hai\"", "subCategory": "Slow Speed/Range Issues", "hindi": "जी, हर area में setup थोड़ा अलग हो सकता है। आपके घर पर जो नेट का setup है, वो आपके area के हिसाब से सही है — इससे नेट ज्यादा stable और smooth चलता है।", "backend": "—"}, {"type": "step", "step": "FAQ 13. \"Mere bhi 2 band kar do\"", "subCategory": "Slow Speed/Range Issues", "hindi": "अभी आपका जो नेट setup है, वो आपके area के हिसाब से सही है। इसमें आपको कुछ भी change करने की ज़रूरत नहीं है।", "backend": "—"}, {"type": "banner", "text": "Slow Speed/Range Issues — PFT Handling (CSP Follow-up Team, for escalated tickets)"}, {"type": "step", "step": "PFT-1. Check Ticket History", "subCategory": "Slow Speed/Range Issues", "hindi": "—", "backend": "Kapture में customer की पूरी ticket history check करें।"}, {"type": "step", "step": "PFT-2. Run Speed Test Before Calling", "subCategory": "Slow Speed/Range Issues", "hindi": "—", "backend": "ग्राहक को call करने से पहले WIOM Hub में real-time speed test चलाएं — Run button सिर्फ एक बार दबाएं। Test में सामान्यतः 1-2 minutes, कुछ मामलों में 5-6 minutes तक लग सकते हैं। पूरा हो चुका result अगले 6 घंटे तक valid रहता है।"}, {"type": "step", "step": "PFT-3. Post Speed Test Action", "subCategory": "Slow Speed/Range Issues", "hindi": "(अगर speed ≥80 Mbps) Sir/Ma’am, मैंने आपके connection की speed check की है और यह हमारे standard के अनुसार सही आ रही है। (FAQ 1 का इस्तेमाल करके distance/interference/band placement समझाएं)\n\n(अगर speed <80 Mbps) मैं समझ सकता/सकती हूं कि आपको अभी भी दिक्कत हो रही है। मैं हमारी CSP team को आपके घर visit के लिए भेज रहा/रही हूं।", "backend": "≥80 Mbps → FAQ scripts follow करके customer को educate करें, case Solved mark करें। <80 Mbps → Kapture में ticket raise करें, CSP को customer के घर visit / issue sort करने के लिए भेजें।"}, {"type": "banner", "text": "SUB-CATEGORY: Optical Power Out of Range"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Optical Power Out of Range", "hindi": "मैं समझ सकता/सकती हूँ \"[Customer Name]\" कि आपका नेट काम नहीं कर रहा है। नेट न होने से ज़रूरी काम रुक जाते हैं।", "backend": "WIOM Hub में RX Power check करें।\n\n1. यदि RX Power -8 to -25 (Standard Range) के बीच है: CSP side से सब ठीक है → ग्राहक की शिकायत (VOC) के अनुसार ticket बनाएँ।\n2. यदि RX Power Standard Range से बाहर है: Ticket Type चुनें — \"Optical Power Out of Range\""}, {"type": "step", "step": "5. Ticket Confirmation", "subCategory": "Optical Power Out of Range", "hindi": "आपकी शिकायत WIOM expert team को भेज दी गई है। आप अपनी शिकायत WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें। हमारी team आपकी समस्या को 24 घंटे के भीतर सुलझा देगी।\n\nअगर आप दिए गए समाधान से संतुष्ट नहीं हैं, तो ticket को reopen कर सकते हैं।", "backend": "Kapture में Ticket Creation — TAT: 24 घंटे\nKapture ticket notes में Ping delay mention करना mandatory है।"}, {"type": "step", "step": "6. Repeat Call — Ticket Already Exists", "subCategory": "Optical Power Out of Range", "hindi": "(Ticket TAT के अंदर है) \"Customer Name\", मैं देख पा रहा/रही हूँ कि आपकी इस समस्या का ticket पहले से बना हुआ है। हमारी team इस पर काम कर रही है, कृपया (remaining TAT) तक का समय दें।\n\n(TAT cross हो चुका है) \"Customer Name\", हमें खेद है कि दिए गए समय में आपकी समस्या हल नहीं हो पाई। हमारी team इस पर काम कर रही है। मैं इसे priority पर हमारी team के पास भेज रहा/रही हूँ।", "backend": "Troubleshooting दोबारा न करें\nKapture में same issue का ticket और उसके comments check करें\nनया ticket न बनाएँ — existing ticket में notes update करें"}, {"type": "banner", "text": "COMMON CLOSING — applies to every sub-category in this tab"}, {"type": "step", "step": "Offer Further Help", "subCategory": "", "hindi": "क्या मैं आपकी और कोई सहायता कर सकता/सकती हूँ, \"Customer Name\"?", "backend": "—"}, {"type": "step", "step": "Call Closure", "subCategory": "", "hindi": "आपका feedback हमारे लिए बहुत महत्वपूर्ण है। मैं आपकी call IVR पर transfer कर रहा/रही हूँ। कृपया 1 से 5 के बीच rating दें, जिसमें 5 सर्वोत्तम है। WIOM को call करने के लिए धन्यवाद। आपका दिन शुभ हो।", "backend": "—"}, {"type": "step", "step": "If Customer Not Satisfied with TAT", "subCategory": "", "hindi": "हम आपसे 24 घंटे का समय चाहते हैं, लेकिन हम पूरी कोशिश करेंगे कि आपकी समस्या इससे पहले ही हल हो जाए।", "backend": "—"}]}, {"name": "Shifting", "title": "CATEGORY: Shifting", "subtitle": "Reference tab for this whole workbook. One shared opening + closing, and each shifting scenario is its own scripted branch below.", "items": [{"type": "banner", "text": "COMMON OPENING — applies to every sub-category in this tab"}, {"type": "step", "step": "1. Call Greeting", "subCategory": "", "hindi": "नमस्कार, call करने के लिए धन्यवाद। WIOM से मैं [Name] बात कर रहा/रही हूँ। मैं आपकी कैसे सहायता कर सकता/सकती हूँ?\n\n(customer को पूरी समस्या बताने दें, समय-समय पर \"जी\", \"ठीक है\", \"मैं समझ रहा/रही हूँ\" से acknowledge करें)", "backend": "—"}, {"type": "step", "step": "2. Acknowledgement", "subCategory": "", "hindi": "जी, मैं आपकी shifting की बात समझ गया/गई हूँ। इसमें मैं आपकी पूरी मदद करूँगा/करूँगी।", "backend": "Apology एक अलग parameter है — shifting एक request है, service failure नहीं, इसलिए यहाँ सिर्फ acknowledgement दें।"}, {"type": "step", "step": "3. Customer Verification (Registered)", "subCategory": "", "hindi": "मैं आपके details check कर रहा/रही हूँ। मैं देख पा रहा/रही हूँ कि यह Recharge Wala Ghar Ka Net \"Customer Name\" के नाम पर registered है। क्या मैं उन्हीं से बात कर रहा/रही हूँ?", "backend": "Agent Wiom Hub में registered number या device ID से ग्राहक विवरण check करेगा।"}, {"type": "step", "step": "3.1 Customer Verification (Not Registered)", "subCategory": "", "hindi": "आप जिस number से call कर रहे हैं, उससे मैं details check नहीं कर पा रहा/रही हूँ। क्या आप कृपया अपना registered number या device ID बता सकते हैं?", "backend": "—"}, {"type": "step", "step": "3.1.1 Verification After Details Received", "subCategory": "", "hindi": "जानकारी देने के लिए धन्यवाद। मैं आपके Ghar Ka Net की जानकारी check कर रहा/रही हूँ। यह Recharge Wala Ghar Ka Net \"Customer Name\" के नाम पर registered है। क्या मैं \"Customer Name\" से ही बात कर रहा/रही हूँ?\n\n(Female → First Name + जी, Male → Last Name + जी)", "backend": "Wiom Hub में details check करना।"}, {"type": "banner", "text": "SUB-CATEGORY: Ask About Shifting"}, {"type": "step", "step": "4. Ask Reason for Shift", "subCategory": "Ask About Shifting", "hindi": "\"Customer Name\", क्या मैं जान सकता/सकती हूँ कि आप अपना Ghar Ka Net shift क्यों कराना चाहते हैं?", "backend": "—"}, {"type": "step", "step": "4.1 Assurance Pitch — Ask About Shifting", "subCategory": "Ask About Shifting", "hindi": "\"Customer Name\", बताना चाहूँगा/चाहूँगी कि shifting के लिए हमें नए पते की जानकारी चाहिए होती है, ताकि यह पता किया जा सके कि आपकी नई location पर WIOM की service उपलब्ध है या नहीं।\n\nआपसे अनुरोध है कि नया पता confirm करके हमें दोबारा call करें, ताकि हम आपकी shifting में बेहतर तरीके से मदद कर सकें।", "backend": "—"}, {"type": "banner", "text": "SUB-CATEGORY: Shift Within My Home"}, {"type": "step", "step": "4.3 Assurance Pitch — Shift Within My Home", "subCategory": "Shift Within My Home", "hindi": "\"Customer Name\", आपकी shifting request—चाहे Net Box को (एक floor से दूसरे floor) / (एक कमरे से दूसरे कमरे) / (एक ही कमरे में दूसरी दीवार पर)—पूरी कर दी जाएगी।\n\nमैं आपकी request expert team को भेज रहा/रही हूँ। Team 3-4 din के अंदर shifting पूरी कर देगी।", "backend": "Shifting request दर्ज करें — TAT: 3-4 दिन"}, {"type": "banner", "text": "SUB-CATEGORY: Shift to New Address"}, {"type": "step", "step": "4. Collect New Address", "subCategory": "Shift to New Address", "hindi": "\"Customer Name\", बताना चाहूँगा/चाहूँगी कि shifting के लिए हमें नए पते की जानकारी चाहिए होती है, ताकि यह पता किया जा सके कि आपकी  यह जानकारी confirm करें (Non-WIOM Connection Additional Info):\n• Aap kaunsa netbox use kar rahe hain? *\n• Aap apne Net connection ke liye abhi kis company ko payment kar rahe hain?\n• CSP ne aapko Non-WIOM connection lene ke liye kya reason diya tha?", "backend": "Kapture ticket form → \"Non-WIOM Connection Additional Info\" का mandatory (*) dropdown भरें + बाकी details note करें।"}, {"type": "step", "step": "5. Complaint Confirmation & TAT", "subCategory": "Trying to Install Non-Wiom Connection", "hindi": "आपकी शिकायत हमारी WIOM expert team को भेज दी गई है। आप इसे WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें—team आपकी समस्या का समाधान 24 घंटे के भीतर कर देगी।\n\nयदि समाधान संतोषजनक न लगे तो आप ticket को reopen कर सकते हैं।", "backend": "Kapture Ticket Creation — TAT: 24 घंटे"}, {"type": "banner", "text": "SUB-CATEGORY: Took Extra Cash"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Took Extra Cash", "hindi": "मैं माफ़ी चाहता/चाहती हूँ \"Customer Name\", कि तकनीशियन ने आपसे \"___ रुपये\" extra लिए। मैं समझ सकता/सकती हूँ कि इससे आपको कितनी असुविधा हुई होगी।", "backend": "ग्राहक से पूछें: • तकनीशियन ने कितनी राशि ली? • किस कारण से ली?"}, {"type": "step", "step": "4.1 CRM Additional Information (Mandatory before Ticket Creation)", "subCategory": "Took Extra Cash", "hindi": "Ticket create करने से पहले Kapture में यह जानकारी confirm करें (Took Extra Cash):\n1. Aapne booking ke 100 rupees kaise pay kare? *\n2. Aapne security deposit ke 300 rupees kaise pay kare? *\n3. Aapne recharge ke paise kaise pay kare? *\n4. Aapne kitna amount extra pay kiya? *\n5. CSP ne extra paise maangne ka kya reason bataya? *\n6. Jis person ne extra cash liya, unka naam kya hai?\n7. Kya yeh voluntary tip thi?", "backend": "Kapture ticket form → \"Took Extra Cash\" के mandatory (*) fields 1-5 अनिवार्य रूप से भरें, 6-7 उपलब्ध जानकारी अनुसार भरें।"}, {"type": "step", "step": "5. Complaint Confirmation & TAT", "subCategory": "Took Extra Cash", "hindi": "आपकी शिका  "step", "step": "4.2 Scenario 3 — AutoPay से पैसा Deduct नहीं हुआ", "subCategory": "Autopay Issue", "hindi": "Autopay से राशि debit नहीं हुई, इसके लिए हमें खेद है। मैं आपको AutoPay Deduction Schedule समझाता/समझाती हूँ:\n\nAutoPay Deduction Logic (Example):\nRecharge Overdate = 28 May, 17:00\n• 1st Attempt: 12 घंटे पहले\n• 2nd Attempt: 24 घंटे बाद\n• 3rd Attempt: अगले 24 घंटे बाद\n\nइसलिए हम आपसे Request करते हैं कि कृपया AutoPay Attempt का इंतज़ार करें।", "backend": "Kapture Ticket Creation"}, {"type": "step", "step": "4.2.1 If Customer Does NOT Want to Wait", "subCategory": "Autopay Issue", "hindi": "\"Customer Name\", आप तुरंत WIOM app से जाकर manual recharge भी कर सकते हैं।", "backend": "—"}, {"type": "step", "step": "5. On Call Resolve (Scenario 1 & 2)", "subCategory": "Autopay Issue", "hindi": "आशा करता/करती हूँ कि इस call में मैं आपकी सहायता कर पाया/पाई। क्या मैं आपकी ticket को On Call Resolve mark कर दूँ?", "backend": "Kapture + Ameyo में On Call Resolve mark करें"}, {"type": "step", "step": "6. Complaint Confirmation (Scenario 3)", "subCategory": "Autopay Issue", "hindi": "मैंने आपकी शिकायत WIOM expert team को भेज दी है। आप अपनी शिकायत WIOM app में भी देख सकते हैं। कृपया हमें 24 घंटे का समय दें—team आपकी समस्या का समाधान 24 घंटे में कर देगी। यदि समाधान संतोषजनक न लगे तो ticket को reopen कर सकते हैं।", "backend": "Kapture Ticket Creation — TAT: 24 घंटे"}, {"type": "banner", "text": "SUB-CATEGORY: Unable to Pay via App"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Unable to Pay via App", "hindi": "मैं समझ सकता/सकती हूँ \"Customer Name\" कि आप WIOM app से payment पूरा नहीं कर पा रहे। कृपया चिंता न करें, मैं आपकी पूरी सहायता करूँगा/करूँगी।", "backend": "Recharge की स्थिति check करें (Amount received / not received)"}, {"type": "step", "step": "4.1 Required Screenshots", "subCategory": "Unable to Pay via App", "hindi": "आपकी समस्या का समाधान जल्दी करने के लिए हमें कुछ जानकारी चाहिए:\n• Payment का screenshot\n• Transaction ID का screenshot\n• connected Wiom network → Tap on the \"i\" (info) button on the right side → Click on the Scan / QR option to view the password", "backend": "System में number update / OTP verification confirm करें"}, {"type": "step", "step": "4.2 Customer Unable to Change Number (Self-Service Issue)", "subCategory": "Change Name or Mobile Number", "hindi": "कोई समस्या नहीं। मैं आपकी सहायता के लिए एक ticket बना रहा/रही हूँ ताकि हमारी team आपकी request process कर सके।", "backend": "Kapture में ticket create करें – Change Registered Number"}, {"type": "step", "step": "5. Customer Name Change Request", "subCategory": "Change Name or Mobile Number", "hindi": "\"नाम बदलने के लिए आपको एक Name Change Form भरना होगा। मैं यह form आपको अभी भेज रहा/रही हूँ.\"", "backend": "Kapture के माध्यम से Name Change Form भेजें"}, {"type": "step", "step": "5.1 Name Change Processing", "subCategory": "Change Name or Mobile Number", "hindi": "\"form submit होने के बाद हमारी team आपकी request verify करेगी और नाम update कर देगी.\"", "backend": "L2 team के लिए ticket create करें – Name Change Request"}, {"type": "step", "step": "6. TAT Communication", "subCategory": "Change Name or Mobile Number", "hindi": "\"आपकी request 24–48 घंटे के भीतर process कर दी जाएगी। आपको update SMS / app के ज़रिए मिल जाएगा.\"", "backend": "Correct TAT tag करें — TAT: 24-48 घंटे"}, {"type": "banner", "text": "SUB-CATEGORY: Change Plan"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Change Plan", "hindi": "\"Customer Name\", मैं आपको अपना recharge plan बदलने में पूरी सहायता करूँगा/करूँगी। कृपया बताएं कि आप कौन सा plan लेना चाहते हैं?\"", "backend": "WIOM Hub में उपलब्ध plans/rate card check करें"}, {"type": "step", "step": "4.1 Self-Service Steps", "subCategory": "Change Plan", "hindi": "Steps:\n1. WIOM app खोलें\n2. \"bill भरें\"/\"Recharge\" पर click करें\n3. उपलब्ध Plans की list में से अपनी पसंद का नया plan चुनें\n4. भुगतान पूरा करते ही नया plan अगली recharge cycle से लागू हो जाएगा", "backend": "On-call guidance"}, {"type": "step", "step": "4.2 Customer Unable to Change Plan (Self-Service Issue)", "subCategory": "Change Plan", "hindi": "कोई समस्या नहीं। मैं आपकी सहायता के लिए एक ticket बना रहा/रही हूँ ताकि हमारी team आपकी plan change request process कर सके।", "backend": "Kapture में ticket create करें – Change Plan"}, {"type": "step", "step": "5. On Call Resolution Confirmation", "subCategory": "Change Plan", "hindi": "आशा करता/करती हूँ कि इस call में मैं आपकी सहायता कर पाया/पाई। क्या मैं आपकी ticket को On Call Resolve mark कर दूँ?", "backend": "Kapture + Ameyo में On Call Resolve mark करें"}, {"type": "banner", "text": "SUB-CATEGORY: Wifi Name/Password"}, {"type": "step", "step": "4. Assurance Pitch", "subCategory": "Wifi Name/Password", "hindi": "\"Customer Name\", मैं आपको अपना WiFi नाम (SSID) या password बदलने में पूरी सहायता करूँगा/करूँगी।\"", "backend": "—"}, {"type": "step", "step": "4.1 Self-Service Steps", "subCategory": "Wifi Name/Password", "hindi": "Steps:\n1. WIOM app खोलें\n2. \"My Network\"/\"WiFi Settings\" पर click करें\n3. Network Name (SSID) या Password edit करें\n4. नया नाम/password डालकर \"Save\" करें\n5. Net Box कुछ seconds में अपने आप restart होकर नई setting लागू कर देगा", "backend": "On-call guidance"}, {"type": "step", "step": "4.2 Customer Unable to Change (Self-Service Issue)", "subCategory": "Wifi Name/Password", "hindi": "कोई समस्या नहीं। मैं आपकी सहायता के लिए एक ticket बना रहा/रही हूँ ताकि हमारी team आपकी request process कर सके।", "backend": "Kapture में ticket create करें – WiFi Name/Password Change"}, {"type": "step", "step": "5. On Call Resolution Confirmation", "subCategory": "Wifi Name/Password", "hindi": "आशा करता/करती हूँ कि इस call में मैं आपकी सहायता कर पाया/पाई। क्या मैं आपकी ticket को On Call Resolve mark कर दूँ?", "backend": "Kapture + Ameyo में On Call Resolve mark करें"}, {"type": "banner", "text": "COMMON CLOSING — applies to every sub-category in this tab"}, {"type": "step", "step": "7. Offer Further Help", "subCategory": "", "hindi": "\"Customer Name, क्या मैं आपकी और किसी सहायता में मदद कर सकता/सकती हूँ?\"", "backend": "—"}, {"type": "step", "step": "8. Call Closure", "subCategory": "", "hindi": "\"आपका feedback हमारे लिए बहुत महत्वपूर्ण है। मैं आपकी call IVR पर transfer कर रहा/रही हूँ। कृपया 1 से 5 के बीच rating दें, जहाँ 5 सर्वोत्तम है। WIOM को call करने के लिए धन्यवाद। आपका दिन शुभ हो.\"", "backend": "—"}]}], "policies": [{"name": "Ticket Update Rules", "complianceNote": "Please ensure these guidelines are followed strictly. Any deviation from the above process will be treated as a process compliance issue.", "sections": [{"heading": "Half Tickets (CC Queue)", "items": [{"text": "Agents can update only same-day open half tickets (tickets currently in the CC Queue)."}, {"text": "Open half tickets created before the current day must not be updated by agents. Half tickets automatically close after 2 hours if they are not updated, so only active same-day half tickets are eligible for updates."}, {"text": "Closed half tickets must not be reopened or updated under any circumstances."}, {"text": "If no eligible half ticket is available for updating, the agent must create a new ticket."}]}, {"heading": "Full Tickets", "items": [{"text": "Agents can update an open ticket or reopen a closed ticket only when the customer reports the same issue and the issue belongs to the same ticket folder."}, {"text": "If a ticket has been closed for more than 48 hours, it must not be reopened. The system will also prevent agents from reopening such tickets."}, {"text": "Ticket folders must not be changed under any circumstances. Once a ticket is created, its folder is fixed. If the customer reports a different issue, agents must create a new ticket in the appropriate folder instead of changing the existing ticket's folder.", "examples": ["A WhatsApp folder ticket must not be converted into a Service ticket.", "A Disconnect folder ticket must not be converted into a Service ticket."]}, {"text": "Agents can update tickets only within the relevant ticket folder based on the customer's issue. Agents must not update tickets created under unrelated folders such as WhatsApp, Wiom Net, or any other non-relevant category."}, {"text": "If the issue belongs to a different issue, a new ticket must be created / updated in the correct folder."}]}]}, {"name": "Downtime Compensation", "complianceNote": "", "sections": [{"heading": "How the validity extension works", "items": [{"text": "If a customer complains about Internet Supply Down or Recharge done but internet not working (RDNI), the system automatically calculates the service downtime from the PING status (down/up)."}, {"text": "Once the issue is fixed, a plan extension is provided based on the service downtime hours."}, {"text": "The customer is informed through the WIOM app. The first message assures them that the hours without net will be added to their recharge validity, along with extra net access to make up for the downtime."}, {"text": "After the issue is resolved, a follow-up message confirms the resolution and shares the extension details: outage duration (for example, 3 hours), extended validity, and the new expiry date and time."}]}, {"heading": "Where to check (Wiom Hub)", "items": [{"text": "Extension details: the customer’s “Plan & Billing” section."}, {"text": "Extension communication sent to the customer: the “Customer Chat” section."}]}, {"heading": "What the agent should do", "items": [{"text": "If a customer asks about compensation for the downtime, check the Plan & Billing section, share the extension details, and update the ticket notes."}, {"text": "If the issue is still ongoing and a team is working on it, inform the customer that compensation against the downtime will be provided once the issue is successfully resolved."}]}, {"heading": "Compensation kab milta hai (simple rule)", "items": [{"text": "Customer ko compensation sirf utne time ka milta hai jitna internet band (downtime) tha, aur wo time in dono ke andar aata ho: (1) ticket open tha (ticket raise hone se close hone tak), aur (2) customer ka plan active tha (recharge chalu tha, expire nahi hua tha)."}, {"text": "Matlab: Compensation = ticket open duration mein, plan active time ke andar jitna downtime hua."}, {"text": "Count nahi hota: ticket raise hone se pehle ka downtime."}, {"text": "Count nahi hota: ticket close hone ke baad ka downtime."}, {"text": "Count nahi hota: jab plan expired tha (recharge nahi tha), us time ka downtime."}]}, {"heading": "Examples", "items": [{"text": "Example 1 – Plan poore time active", "examples": ["Ticket open: 10 Nov, 10 AM; close: 13 Nov, 10 AM (3 din)", "Plan active: 1 Nov se 30 Nov", "Internet poore 3 din band raha", "➡️ Compensation = 3 din"]}, {"text": "Example 2 – Beech mein plan expire ho gaya", "examples": ["Ticket open: 10 Nov, 10 AM; close: 13 Nov, 10 AM (3 din)", "Plan expire: 11 Nov, 10 AM; customer ne dobara recharge kiya: 12 Nov, 10 AM", "Internet poore 3 din band raha", "10 Nov 10 AM → 11 Nov 10 AM: plan active ✅ — 1 din count hoga", "11 Nov 10 AM → 12 Nov 10 AM: plan expired ❌ — 0", "12 Nov 10 AM → 13 Nov 10 AM: plan active ✅ — 1 din count hoga", "➡️ Compensation = 2 din, 3 nahi. Jis din plan expired tha, wo din count nahi hoga."]}, {"text": "Example 3 – Downtime ticket se pehle shuru hua", "examples": ["Internet band hua: 8 Nov", "Ticket open: 10 Nov, close: 12 Nov", "Plan poore time active", "➡️ Compensation = 2 din, sirf 10 se 12 Nov tak. 8 aur 9 Nov count nahi honge kyunki tab ticket open nahi tha."]}]}]}, {"name": "Repeat Call Handling", "complianceNote": "", "sections": [{"heading": "Internet Issues — what to do on a repeat call", "items": [{"text": "A repeat call is when the customer calls again about the same internet issue and a ticket already exists. Check Kapture for it right after customer verification."}, {"text": "Do not troubleshoot again."}, {"text": "Read the existing ticket comments and inform the customer accordingly."}, {"text": "Do not create a duplicate ticket; update the notes on the existing ticket."}]}, {"heading": "Scenarios", "items": [{"text": "Open ticket, within TAT: tell the customer our team is working on it and share the remaining time."}, {"text": "Open ticket, TAT crossed: apologise, tell the customer our team is working on it and that you are sending it to the team on priority."}]}, {"heading": "Compensation — Internet Supply Down and RDNI tickets", "items": [{"text": "Inform the customer that compensation against the downtime will be provided once the issue is resolved."}, {"text": "Check the Plan & Billing section in Wiom Hub for extension details and update the ticket notes (see Downtime Compensation)."}]}]}, {"name": "Status Queue Rules", "complianceNote": "", "sections": [{"heading": "Pitch rules", "items": [{"text": "Refund rule: Customer App se booking kisi bhi stage par cancel kar sakta hai (booking ke 2 ghante baad bhi) – poori booking fee refund, 3–5 working din mein. '48 ghante se pehle cancel par refund nahi' wala purana pitch use NAHI karna."}, {"text": "Refund rule: Agar Wiom system booking cancel karta hai, toh refund apne-aap aata hai – zyada se zyada booking ke 14 din ke andar (details: section 4)."}, {"text": "Security deposit: Net box ka security deposit ₹250 hai (₹300 purana tha – use NAHI karna). Yeh refundable hai – service band karke net box return hone par ₹250 wapas milte hain."}, {"text": "Security deposit: Sirf tab batayein jab customer khud poochhe (total kitna lagega / koi alag security deposit hai kya)."}, {"text": "Ticket flow: FCR tickets call par hi close. Installation Delay, Incomplete Installation aur Refund related ke Non-FCR tickets Booking Queue mein rehte hain – Service L2 (Social Media Escalation team, in-house, 10 AM–7 PM) inhe close karta hai. CSP Misbehaviour ke tickets PX Queue mein jaate hain – PFT team resolve karti hai."}, {"text": "NA BOLEIN: Connection, Bandwidth, Network fluctuate karega, Plan, Guaranteed speed, 2 din free milega, OTT"}, {"text": "BOLEIN: Recharge wala ghar ka net, Net lagana / Set up, Saath-saath chalna, Roz ka use, App mein dikhega, 2 din ka demo milega"}]}, {"heading": "Connection State check (Wiom Hub › Installation Journey › Connection overview) – Installation Delay only", "items": [{"text": "REQUESTED — Ticket: Yes", "examples": ["Meaning: Lead is still circulating among CSPs; no CSP has shown interest.", "Agent action: Raise Installation Delay ticket if booking > 48 hrs (no slot) or slot passed.", "Definition: The lead is still being circulated among available CSPs and no CSP has shown interest yet. If the customer does not wish to wait, they can cancel the booking through the Wiom App and receive a full refund. Otherwise, the system will automatically refund the booking fee / first recharge after 7 days.", "Can it be installed: Yes – installation still in progress", "Ticket to be created: Yes – Installation Delay", "Detailed agent action: Create an Installation Delay ticket only if the booking is more than 48 hours old with no slot assigned, OR the scheduled slot has passed. If the customer does not wish to wait, guide them to cancel from the Wiom App for a full refund."], "examplesLabel": "Details"}, {"text": "PENDING_INSTALL — Ticket: Yes", "examples": ["Meaning: CSP has accepted the lead and is completing the set-up.", "Agent action: Raise Installation Delay ticket if booking > 48 hrs (no slot) or slot passed.", "Definition: The CSP has accepted the lead and is currently completing the setup.", "Can it be installed: Yes – installation still in progress", "Ticket to be created: Yes – Installation Delay", "Detailed agent action: Create an Installation Delay ticket only if the booking is more than 48 hours old with no slot assigned, OR the scheduled slot has passed."], "examplesLabel": "Details"}, {"text": "ACTIVE — Ticket: No", "examples": ["Meaning: Installation completed.", "Agent action: Installed customer – follow Inbound SOP.", "Definition: The installation has been completed.", "Can it be installed: Already installed", "Ticket to be created: No", "Detailed agent action: Installation is complete. Handle the customer as an installed customer and follow the Inbound SOP."], "examplesLabel": "Details"}, {"text": "DEACTIVATED — Ticket: No", "examples": ["Meaning: Installation could not be completed – can't be installed (cancelled by system).", "Agent action: Refund pitch – refund comes automatically, max 14 days from booking.", "Definition: The installation could not be completed. Can't be installed.", "Can it be installed: No", "Ticket to be created: No", "Detailed agent action: Do not create a ticket. Inform the customer that they can cancel the booking from the Wiom App to receive a full refund; otherwise, the system will refund the booking fee automatically within a maximum of 14 days from the booking date."], "examplesLabel": "Details"}, {"text": "PENDING_DEACTIVATION — Ticket: No", "examples": ["Meaning: Cancelled by customer after technician assigned – can't be installed.", "Agent action: Refund pitch – 3–5 working days from cancellation.", "Definition: Cancelled by the customer after a technician was assigned. Can't be installed.", "Can it be installed: No", "Ticket to be created: No", "Detailed agent action: Do not create a ticket. Inform the customer that the full booking fee will be refunded within 3–5 working days from the date of cancellation."], "examplesLabel": "Details"}, {"text": "Note: This stage rule applies ONLY to Installation Delay. Incomplete Installation and CSP Misbehaviour tickets are not gated by Connection State."}, {"text": "Lead allocation (system): Lead goes to available CSPs one by one, best-rated first; each CSP gets it in 2 rounds. Once accepted, CSP gets 3 days to install; if not installed, the cycle restarts (max 2 cycles). Service L2 nudges CSP at Technician Assigned stage (6-hr rule)."}]}, {"heading": "Refund timelines", "items": [{"text": "Customer cancels from App: Full booking fee refund in 3–5 working days (any stage, any time). Ticket only if not received after 5 working days."}, {"text": "Wiom system cancels within 7 days of booking: Refund by 7th day from booking date. (e.g. cancelled on day 3 → refund by day 7)"}, {"text": "Wiom system cancels after 7 days of booking: Refund by 14th day from booking date – 14 days is the maximum. (e.g. cancelled on day 10 → refund in next 4 days)"}]}, {"heading": "Status dispositions with NO Kapture ticket", "items": [{"text": "Installation Timeline Inquiry — Customer needs clarification about the booking process, installation timeline, pricing, recharge options, or other general enquiries that require no further action and can be resolved with an explanation.", "examples": ["Example: \"Status kya hai mere installation ka?\" / \"Kitne din lagenge?\"", "Owner: Inbound (FCR)"], "examplesLabel": "Details"}, {"text": "Installation Expediting Request — Customer wants faster set-up before the slot date (intent = speed up, not status).", "examples": ["Example: \"Aaj hi laga do\" / \"Please prioritize my request\"", "Owner: Inbound (FCR)"], "examplesLabel": "Details"}, {"text": "Product / pricing / booking queries — Use Revised Script responses (Product Explanation, Speed/Range, Recharge & Pricing, Booking Process & Charges etc.)", "examples": ["Example: \"Speed kitni aati hai?\"", "Owner: Inbound (FCR)"], "examplesLabel": "Details"}]}]}, {"name": "Current Plans", "complianceNote": "", "sections": [{"heading": "Plan pricing — only for visibility", "items": [{"text": "1 day — ₹23.00 (old price ₹23.00)"}, {"text": "2 days — ₹45.00 (old price ₹45.00)"}, {"text": "7 days — ₹155.00 (old price ₹155.00)"}, {"text": "14 days — ₹305.00 (old price ₹305.00)"}, {"text": "28 days — ₹550.00 (old price ₹565.00)"}, {"text": "56 days — ₹1,050.00 (old price ₹1,050.00)"}, {"text": "84 days — ₹1,480.00 (old price ₹1,500.00)"}]}]}], "wiomNetSop": {"sourceUrl": "https://sajaljain-cpu.github.io/SOP_Wiom_Net_V2F/", "pages": [{"key": "flow", "title": "WiomNet — Flow & Quick Reference", "steps": [{"code": "A", "kind": "step", "title": "Customer connects to WiomNet", "body": "On the customer’s phone/laptop Wi-Fi list, they tap the network named \"wiom net\" (secondary SSID) and connect."}, {"code": "B", "kind": "step", "title": "Phone shows a message", "body": "One of these 3 things happens on the customer’s screen:\n\n1️⃣ \"Connected, no internet\" → Tell customer: open any browser (Chrome) and try to visit any website (e.g. google.com). This will trigger the login page to pop up.\n2️⃣ \"Connected, tap to sign in to network\" → Tell customer: tap that notification directly — it opens the login page.\n3️⃣ Login page (captive portal) opens on its own → No action needed, move straight to the next step."}, {"code": "?", "kind": "decision", "title": "Is this the customer’s first time on WiomNet?", "body": "Yes → go to Step C.  |  No → system already knows their number, skip to “User has active recharge?”"}, {"code": "C", "kind": "step", "title": "First-time user enters mobile number", "body": "Customer types their mobile number into the portal. System then checks if this number has an active recharge."}, {"code": "?", "kind": "decision", "title": "Does the user have an active recharge?", "body": "Yes → go to Step I (OTP login).  |  No → go to Step D (buy a recharge)."}, {"code": "I", "kind": "step", "title": "OTP login (customer already has a recharge)", "body": "OTP page opens, OTP sent to the customer’s number. Customer enters the OTP.\n\n❌ Wrong OTP → let them retry, no limit on attempts.\n✅ Correct OTP + recharge still active → Internet connects."}, {"code": "✓", "kind": "success", "title": "Internet Connected 🎉", "body": "Customer is online. Case closed."}, {"code": "D", "kind": "step", "title": "Recharge selection page (if no active recharge)", "body": "Customer sees available WiomNet recharges and picks one."}, {"code": "E", "kind": "step", "title": "Payment link sent via SMS", "body": "System sends a payment link by SMS to the customer’s device."}, {"code": "?", "kind": "decision", "title": "Does the customer have mobile data to open the link?", "body": "No → go to Step F.  |  Yes → go to Step G."}, {"code": "F", "kind": "step", "title": "No mobile data — temporary free recharge", "body": "Customer is assigned a temporary free recharge. Internet connects, usable up to 3 times a day."}, {"code": "G", "kind": "step", "title": "Payment page", "body": "Customer pays for the recharge on this page.\n\n❌ Payment failed → let them retry, no limit on attempts."}, {"code": "H", "kind": "step", "title": "Payment successful", "body": "Two outcomes depending on whether the customer’s device is still on wiom net:\n\n✅ Still connected to wiom net → Internet connects.\n⚠️ Not connected to wiom net → Recharge is assigned, but did not connect — customer must reconnect and try via OTP (back to Step I)."}, {"code": "✓", "kind": "success", "title": "Internet Connected 🎉", "body": "Customer is online. Case closed."}], "quickRef": [{"situation": "Phone says \"Connected, no internet\"", "doThis": "Guide customer to open a browser and visit any website to trigger the login page.", "sayThis": "\"Please open Chrome and type google.com — the login page should pop up.\""}, {"situation": "Phone says \"Tap to sign in to network\"", "doThis": "Tell customer to tap that notification directly.", "sayThis": "\"You’ll see a notification saying ‘tap to sign in’ — please tap on it.\""}, {"situation": "Captive portal doesn’t open at all", "doThis": "Ask customer to forget the WiomNet network and reconnect. If still stuck, escalate.", "sayThis": "\"Let’s forget the wiom net network on your phone and reconnect fresh.\""}, {"situation": "Wrong OTP entered", "doThis": "Let the customer retry — there’s no limit on attempts. Confirm the number is correct.", "sayThis": "\"No worries, let’s try entering the OTP again.\""}, {"situation": "Payment failed on Step G", "doThis": "Let the customer retry payment — unlimited attempts allowed.", "sayThis": "\"That didn’t go through, let’s try the payment once more.\""}, {"situation": "Payment successful but internet still not working", "doThis": "Check if the customer’s device is still connected to wiom net. If not, ask them to reconnect and log in again via OTP.", "sayThis": "\"Your recharge is active — please reconnect to wiom net, and the portal will send an OTP for you to log in with.\""}, {"situation": "No mobile data to open payment link", "doThis": "Assign the temporary free recharge (usable up to 3 times a day) so the customer has internet while they sort out payment.", "sayThis": "\"I’ve given you a free temporary connection for now — let’s get your recharge sorted.\""}]}, {"key": "troubleshooting", "title": "Troubleshooting Matrix", "tags": ["No internet on router", "wiom net signal not showing", "Captive portal does not open", "Payment SMS link not received", "Free recharge limit exhausted", "Payment Unsuccessful", "Payment successful, could not connect", "Payment successful, asking for payment again", "OTP not received", "OTP not working/OTP limit exhausted", "General Enquiry"], "howAgentsUse": "First find out if the customer’s WiomNet recharge is currently active (from Step 1 flow / Wiom Hub). Then follow the matching diagram below to know what to ask next. Once you reach an end box, look up that exact situation in the table underneath to get the issue tag to log the case under, and the advice to give the customer.", "activeFlow": ["Recharge is ACTIVE → Check device ping", "Ping active? Yes → Ask customer to reconnect, do OTP flow on call", "Ping active? No → Down more than 2 hrs?", "Down > 2 hrs → Refund", "Down < 2 hrs → Give extension (goodwill)"], "notActiveFlow": ["Recharge NOT active → wiom net connected?", "Not connected → wiom net signal not available", "Connected → Recharge selection done?", "Selection not done → General enquiry / escalate", "Selection done → SMS link received?", "SMS link not received → SMS link issue (retry/resend)", "SMS link received → Made payment?", "Payment not made → Guide for payment — stay on wiom net, use SMS link", "Payment made → Verify payment — reconnect, select recharge, retry with new link"], "refund": {"activeRule": ["Device ping has been down for more than 2 hours, OR", "Wiom Hub shows the customer as \"Refund Eligible\" (see Wiom Hub screenshot reference on the source site)"], "notActiveRule": "Customer is visibly very upset and specifically disputes/complains about the recharge amount — refund as resolution.", "hubNote": "Wiom Hub → Wiom Net → Plan Extension. When a customer qualifies, the panel shows an orange \"Refund Eligible\" banner: \"This customer’s plan is eligible for a refund. Plan extension is disabled while a refund is pending.\" Extension is blocked automatically while a refund is pending — don’t try to extend in this state, process the refund instead."}, "matrix": [{"n": 1, "situation": "No internet on router", "chain": ["wiom net connected? → No", "Hub: device ping active? → No"], "notActive": "Try after some time", "active": "Extend/Refund"}, {"n": 2, "situation": "wiom net signal not showing", "chain": ["wiom net connected? → No", "Hub: device ping active? → Yes"], "notActive": "Try after some time", "active": "Extend"}, {"n": 3, "situation": "Captive portal does not open", "chain": ["wiom net connected? → Yes", "Hub: device ping active? → Yes"], "notActive": "Try after some time", "active": "Extend"}, {"n": 4, "situation": "Payment SMS link not received", "chain": ["wiom net connected? → Yes", "Hub: active recharge for this number? → No", "Hub: device ping active? → Yes", "Payment SMS link received? → No", "Recharge selection done? → Yes", "Using old/previous SMS link? → No"], "notActive": "Try after some time", "active": "Not applicable"}, {"n": 5, "situation": "Free recharge limit exhausted", "chain": ["wiom net connected? → Yes", "Hub: active recharge for this number? → No", "Hub: device ping active? → Yes", "     var props = [], decs = {};

    WF.decisionDocs.forEach(function (d) {
      var items = (d.data && d.data.items) || {};
      Object.keys(items).forEach(function (cid) {
        var x = items[cid];
        if (!x || !x.makerId || (x.decision !== 'approved' && x.decision !== 'rejected')) return;
        var ok = (d.id === cid0 && x.makerId !== d.id) || (d.id === ownerId && cid0 && x.makerId === cid0 && x.makerId !== d.id);
        if (!ok) return;
        decs[cid] = Object.assign({ deciderId: d.id }, x);
      });
    });

    WF.changeDocs.forEach(function (d) {
      var items = (d.data && d.data.items) || {};
      Object.keys(items).forEach(function (cid) {
        var it = items[cid];
        if (!it || !it.path) return;
        var p = Object.assign({ cid: cid, makerId: d.id }, it);
        p.authorised = managers.indexOf(d.id) !== -1 || d.id === ownerId;
        var dec = decs[cid];
        if (dec && dec.makerId === d.id) {
          p.decision = dec;
          p.status = dec.decision;
          p.edited = !sameVal(dec.newValue, it.newValue);        // proposal text changed after the decision
        } else if (it.withdrawn) { p.status = 'withdrawn'; }

    });
    // decisions whose proposal doc is missing (kept for the trail; checker is the authority)
    Object.keys(decs).forEach(function (cid) {

      var x = decs[cid];
      props.push({ cid: cid, makerId: x.makerId, path: x.path, label: x.label, oldValue: x.oldValue, newValue: x.newValue,
        note: '', createdAt: x.createdAt || x.decidedAt, authorised: true, decision: x, status: x.decision, missing: true });
    });
    props.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    WF.proposals = props;

    // effective data = baseline + approved decisions made after the baseline was built, in decision order
    var eff = JSON.parse(JSON.stringify(BASE)), errs = [];
    props.filter(function (p) { return p.status === 'approved' && (p.decision.decidedAt || 0) > BASE_BUILT_AT; })
      .sort(function (a, b) { return a.decision.decidedAt - b.decision.decidedAt; })
      .forEach(function (p) {

    WF.applyErrors = errs;
    DATA = eff;

    var pk = {}, count = 0;

      pk[key] = (pk[key] || 0) + 1;

    var ids = [].concat(managers, [cid0, ownerId], props.map(function (p) { return p.makerId; }), props.map(function (p) { return p.decision && p.decision.deciderId; }),
      (roles.log || []).map(function (l) { return l.by; }), (roles.log || []).map(function (l) { return l.target; }), [WF.me && WF.me.id]).filter(Boolean);

  }

  /* ---------- writes ---------- */
  function newId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function serverNow() {
    return WF.db.doc('clock/' + WF.me.id).acquire({ holder: WF.me.id, ttlMs: 1000 }).then(function (r) {
      var t = r && r.acquired && r.expiresAt ? Date.parse(r.expiresAt) : NaN;
      return isNaN(t) ? { t: Date.now(), src: 'device' } : { t: t - 1000, src: 'server' };
    }, function () { return { t: Date.now(), src: 'device' }; });
  }
  function putItem(coll, cid, item) {
    var ref = WF.db.doc(coll + '/' + WF.me.id);
    return ref.get().then(function (snap) {
      var body = { items: {} }; body.items[cid] = item;
      return snap.exists ? ref.update(body) : ref.set(body);
    });
  }
  function submitProposal(sp, oldV, newV, note) {
    if (!canPropose()) return Promise.reject({ message: 'Only managers can propose changes.' });
    return enqueue(function () {
      return serverNow().then(function (ts) {
        var cid = newId();
        return putItem('changes', cid, { path: sp, label: specLabel(sp), oldValue: oldV === undefined ? '' : oldV, newValue: newV, note: note || '', createdAt: ts.t, createdAtSrc: ts.src });
      });
    });
  }
  function withdrawProposal(p) {
    return enqueue(function () {
      return serverNow().then(function (ts) { return putItem('changes', p.cid, { withdrawn: true, withdrawnAt: ts.t }); });
    }).then(function () { toast('Withdrawn.'); }, function (e) { toast('Could not withdraw: ' + ((e && e.message) || 'retry'), true); });
  }
  function decideProposal(p, decision, reason) {
    if (!canDecide(p)) { toast('You cannot decide this change.', true); return Promise.resolve(); }
    return enqueue(function () {
      return serverNow().then(function (ts) {
        return putItem('decisions', p.cid, {
          cid: p.cid, makerId: p.makerId, path: p.path, label: p.label, oldValue: p.oldValue, newValue: p.newValue,
          createdAt: p.createdAt, decision: decision, reason: reason || '', decidedAt: ts.t, decidedAtSrc: ts.src,
          baseValueAtDecision: getVal(DATA, p.path) === undefined ? '' : getVal(DATA, p.path)
        });
      });
    }).then(function () { toast(decision === 'approved' ? 'Approved — it is live now for signed-in staff.' : 'Rejected.'); },
      function (e) { toast('Could not save the decision: ' + ((e && e.message) || 'retry'), true); });
  }
  /* mutate(current) -> {managers, checker} or null for "nothing to do"; always applied to the freshly read roles doc */
  function saveRoles(mutate, logEntry) {
    if (!WF.isOwner) return Promise.reject({ message: 'Only the owner can change roles.' });
    return enqueue(function () {
      var ref = WF.db.doc('config/roles');
      return Promise.all([ref.get(), serverNow()]).then(function (r) {
        var prev = r[0].exists ? r[0].data() : { managers: [], checker: null, log: [] }, ts = r[1];
        var next = mutate({ managers: (prev.managers || []).slice(), checker: prev.checker || null });
        if (!next) return 'noop';
        if (next.managers.indexOf(WF.me.id) === -1) next.managers.unshift(WF.me.id);   // the owner is always a maker too
        var entries = [].concat(logEntry).map(function (e, k) { return Object.assign({ at: ts.t + k, by: WF.me.id }, e); });
        var log = (prev.log || []).concat(entries).slice(-200);
        return ref.set({ managers: next.managers, checker: next.checker || null, ownerId: WF.me.id, log: log });
      });
    });
  }

  /* ---------- live connection ---------- */
  function initWorkflow() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    Promise.all([window.claude.use('user'), window.claude.use('db')]).then(function (r) {
      var user = r[0], db = r[1];
      if (!user || !db) return null;
      return user.me().then(function (me) { return me && me.id ? { user: user, db: db, me: me } : null; });
    }).then(function (ctx) {
      if (!ctx) return;
      WF.user = ctx.user; WF.db = ctx.db; WF.me = ctx.me; WF.isOwner = !!ctx.me.isOwner; WF.ready = true;
      WF.names[ctx.me.id] = ctx.me.name || ''; WF.avatars[ctx.me.id] = ctx.me.avatarUrl || '';
      var timer = setTimeout(function () { WF.slow = true; renderChrome(); }, 10000);
      function got(k) { WF.got[k] = true; clearTimeout(timer); WF.slow = false; }
      function fail(e) { WF.error = (e && e.message) || 'The change log is unavailable.'; renderChrome(); }
      ctx.db.doc('config/roles').onSnapshot(function (s) { got('roles'); WF.roles = s.exists ? s.data() : null; recompute(); afterLive(); }, fail);
      ctx.db.collection('changes').onSnapshot(function (q) { got('changes'); WF.changeDocs = q.docs.map(function (d) { return { id: d.id, data: d.data() }; }); recompute(); afterLive(); }, fail);
      if (WF.isOwner) ctx.db.collection('requests').onSnapshot(function (q) { WF.requestDocs = q.docs.map(function (d) { return { id: d.id, data: d.data() }; }); afterLive(); }, function () {});
      else ctx.db.doc('requests/' + ctx.me.id).get().then(function (s) { WF.myRequest = s.exists ? s.data() : null; }, function () {});
      ctx.db.collection('decisions').onSnapshot(function (q) { got('decisions'); WF.decisionDocs = q.docs.map(function (d) { return { id: d.id, data: d.data() }; }); recompute(); afterLive(); }, fail);
      buildNav(); setActiveNav(); renderChrome();
    }).catch(function () { /* no workflow available in this view (public page / signed out) */ });
  }

    var html = '<div class="page-head"><div class="eyebrow">Review</div><h1>Pending approvals</h1><p class="desc">' +

  function renderHistory() {

    var list = WF.proposals.filter(function (p) {

      if (txt) {

        if (hay.indexOf(txt) === -1) return false;

    });
    var chips = ['all', 'pending', 'approved', 'rejected', 'withdrawn'].map(function (s) {
      return '<button class="chip-filter' + (st === s ? ' active' : '') + '" data-hs="' + s + '">' + (s === 'all' ? 'All' : s[0].toUpperCase() + s.slice(1)) + '</button>';
    }).join('');
    var html = '<div class="page-head"><div class="eyebrow">Review</div><h1>History &amp; audit trail</h1><p class="desc">Every change: who proposed it, who decided, when, and exactly what changed. Entries cannot be edited or deleted by managers.</p></div>' + connectNote();
    html += '<div class="rv-filter"><div class="filterbar">' + chips + '</div><input id="histText" class="rv-search" placeholder="Filter by field, person or note…" value="' + esc(WF.histText) + '"></div>';
    if (f) { var sp = null; try { sp = JSON.parse(f); } catch (e) {} html += '<div class="rv-note">Showing history for one field <button class="btn" id="histClear">Show all</button></div>'; }

  var ARROW_SVG = '<svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="5" x2="14" y2="5"/><polyline points="10 1 14 5 10 9"/></svg>';
  function arrowDown(cls, label) {
    return '<div class="flow-arrow' + (cls ? ' ' + cls : '') + '">' + (label ? '<span class="fa-label">' + esc(label) + '</span>' : '') + '</div>';
  }

  /* resolution path text ("Step 1: ... \u2192 Step 2: ...") -> flow nodes */
  function parseFlowSteps(text) {
    var parts = text.split(/\u2192/).map(function (s) { return s.trim(); }).filter(Boolean);
    return parts.map(function (raw, i) {
      var label = String(i + 1), cond = '', body = raw;
      var m = raw.match(/^Step\s*(\d+[a-z]?)\s*(?:\(([^)]*)\))?\s*[:.\-\u2013]?\s*/i);
      if (m) { label = m[1]; cond = m[2] || ''; body = raw.slice(m[0].length); }
      var decision = !!cond || /[a-z]$/i.test(label);
      var im = body.match(/^(If|When|In case)\s+([^,:]+?)\s*[,:]\s*(.+)$/i);
      if (im) { decision = true; cond = cond || im[2]; body = im[3]; }
      else if (/^(If|When|In case)\b/i.test(body)) { decision = true; }
      return { label: label, cond: cond, body: body, decision: decision, raw: raw };
    });
  }
  function shortLabel(t) {
    var w = t.replace(/^[^A-Za-z\u0900-\u097F0-9]+/, '').split(/\s+/).slice(0, 4).join(' ');
    return w.length > 30 ? w.slice(0, 29) + '\u2026' : w;
  }
  /* consecutive branch steps (3a, 3b, ...) are alternatives: group them as "choose one" */
  function groupFlow(steps) {
    var out = [];
    for (var i = 0; i < steps.length; i++) {
      var m = steps[i].label.match(/^(\d+)[a-z]$/i);
      if (!m) { out.push({ one: steps[i] }); continue; }
      var grp = [steps[i]];
      while (i + 1 < steps.length) {
        var n = steps[i + 1].label.match(/^(\d+)[a-z]$/i);
        if (n && n[1] === m[1]) { grp.push(steps[i + 1]); i++; } else break;
      }
      out.push(grp.length > 1 ? { group: grp } : { one: grp[0] });
    }
    return out;
  }
  function nodeHtml(s, cls, cap) {
    return '<div class="rf-node' + cls + '"><span class="rp-n">' + esc(s.label) + '</span><div class="rf-body">' +
      (s.cond ? '<div class="rf-cond"><span class="rf-tag">IF</span>' + esc(s.cond) + '</div>' : '') +
      '<span class="fvalue">' + esc(s.body) + '</span></div>' + (cap ? '<span class="rf-cap">' + cap + '</span>' : '') + '</div>';
  }
  function chipHtml(s, cls) {
    return '<span class="rf-chip' + cls + '">' + esc(s.label) + ' \u00b7 ' + esc(shortLabel(s.cond ? 'If ' + s.cond : s.body)) + '</span>';
  }
  function flowHtml(text) {
    var steps = parseFlowSteps(text);
    if (!steps.length) return '';
    var segs = groupFlow(steps);
    var html = '<div class="rf-map">' + segs.map(function (g, i) {
      var chips = g.group
        ? g.group.map(function (s) { return chipHtml(s, ' decision'); }).join('<span class="rf-or">or</span>')
        : chipHtml(g.one, g.one.decision ? ' decision' : (i === 0 ? ' start' : ''));
      return (i ? '<span class="rf-sep">' + ARROW_SVG + '</span>' : '') + chips;
    }).join('') + '</div>';
    html += '<div class="rf">' + segs.map(function (g, i) {
      var first = i === 0, last = i === segs.length - 1;
      if (g.group) {
        return (i ? arrowDown('', 'depends on the case') : '') +
          '<div class="rf-group"><div class="rf-group-cap">CHOOSE ONE \u00b7 based on the case</div><div class="rf-branches">' +
          g.group.map(function (s) { return nodeHtml(s, ' decision', ''); }).join('') + '</div></div>';
      }
      var s = g.one;
      var cls = s.decision ? ' decision' : (first ? ' start' : (last ? ' end' : ''));
      var cap = first ? 'START' : (last ? 'END' : '');
      return (i ? arrowDown('', s.decision ? 'if needed' : (segs[i - 1].group ? 'then' : '')) : '') + nodeHtml(s, cls, cap);
    }).join('') + '</div>';
    return html;
  }
  function miniFlowHtml(items) {
    return '<div class="mini-flow">' + items.map(function (t, i) {
      var cls = i === 0 ? ' first' : (i === items.length - 1 ? ' last' : '');
      return (i ? arrowDown('small') : '') + '<div class="mf-node' + cls + '">' + esc(t) + '</div>';
    }).join('') + '</div>';
  }
  function branchHtml(body) {
    var parts = body.split('|').map(function (x) { return x.trim(); }).filter(Boolean);
    if (parts.length < 2 || !parts.every(function (x) { return /^(Yes|No)\b/i.test(x); })) return '';
    return '<div class="fs-branches">' + parts.map(function (x) {
      var yes = /^Yes/i.test(x);
      return '<div class="fs-branch ' + (yes ? 'yes' : 'no') + '"><b>' + (yes ? 'YES' : 'NO') + '</b>' + esc(x.replace(/^(Yes|No)\s*\u2192?\s*/i, '')) + '</div>';
    }).join('') + '</div>';
  }

  function renderScript(key) {
    var tab = DATA.scriptTabs.find(function (t) { return t.name === key; });

      '<p class="desc">' + esc(tab.subtitle) + '</p></div>';

    /* call-flow overview: opening -> pick the matching sub-category -> closing */
    var opening = null, closing = null, secs = [];
    tab.items.forEach(function (item, i) {
      if (item.type !== 'banner') return;
      var t = item.text.trim();
      var n = 0;
      for (var k = i + 1; k < tab.items.length && tab.items[k].type !== 'banner'; k++) n++;
      if (/^COMMON OPENING/i.test(t)) opening = { i: i, n: n };
      else if (/^COMMON CLOSING/i.test(t)) closing = { i: i, n: n };
      else if (/^SUB-CATEGORY:/i.test(t)) secs.push({ i: i, label: t.replace(/^SUB-CATEGORY:\s*/i, '') });
    });
    if (secs.length) {
      html += '<div class="sflow">';

      if (closing) html += arrowDown('center') + '<button class="sf-node close" data-jump="sec-' + closing.i + '">Common closing<small>' + closing.n + ' steps \u00b7 every call</small></button>';

          ed({ k: 'script', tab: tab.name, i: i, step: item.step, f: 'hindi' }) + '</div>' +
          (item.subCategory && item.subCategory !== item.step.replace(/^\d+\.\s*/, '') ? '' : '') + '</div>' +
          '<button class="copybtn" data-copy="' + i + '"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</button>';
        html += '</div>';
        html += '<div class="sc-hindi">' + esc(item.hindi) + '</div>';
        if ((item.backend && item.backend !== '—') || EDIT_ON) {
          html += '<div class="sc-backend"><div class="flabel">Agent Backend Action' + ed({ k: 'script', tab: tab.name, i: i, step: item.step, f: 'backend' }) + '</div>' + esc(item.backend || '') + '</div>';
        }
        html += '</div>';
        if (linked) html += arrowDown('');
      }
    });
    mainInner.innerHTML = html;

    mainInner.querySelectorAll('[data-jump]').forEach(function (b) {
      b.addEventListener('click', function () {
        var el = document.getElementById(b.getAttribute('data-jump'));
        if (el) el.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      });
    });

    mainInner.querySelectorAll('[data-copy]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = +btn.getAttribute('data-copy');
        var item = tab.items[idx];
        var text = item.hindi;
        var done = function () {
          btn.classList.add('copied');
          btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>Copied';
          setTimeout(function () {
            btn.classList.remove('copied');
            btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy';
          }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, done);
        } else { done(); }
      });
    });
  }

  /* ---------------- global search ---------------- */
  var searchInput = document.getElementById('globalSearch');
  var searchClear = document.getElementById('searchClear');
  var lastNonSearchView = { view: 'home', key: '' };

  searchInput.addEventListener('input', function () {
    var term = searchInput.value.trim();
    searchClear.classList.toggle('show', !!term);
    if (!term) {
      render();
      return;
    }
    if (state.view !== 'search') { lastNonSearchView = { view: state.view, key: state.key }; }
    runSearch(term);
  });
  searchClear.addEventListener('click', function () {
    searchInput.value = '';
    searchClear.classList.remove('show');
    navigate(lastNonSearchView.view, lastNonSearchView.key);
  });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { searchClear.click(); searchInput.blur(); }
  });

  function runSearch(term) {
    var lower = term.toLowerCase();
    var results = [];

    (DATA.policies || []).forEach(function (policy) {
      policy.sections.forEach(function (section) {
        section.items.forEach(function (item) {
          var hay = [section.heading, item.text].concat(item.examples || []).join(' • ');
          if (hay.toLowerCase().indexOf(lower) !== -1) {
            results.push({ kind: 'Policy · ' + policy.name, title: section.heading, snippet: snippetAround(hay, lower), go: function () { navigate('policy', policy.name); } });
          }
        });
      });
    });

    DATA.categories.forEach(function (cat) {
      cat.rows.forEach(function (row) {
        var hay = [row.subCategory, row.definition, row.tagEligible, row.tagNonEligible, row.callObjective,
          row.troubleshoot, row.resolutionPath, row.pitchScript, row.l2Scripts, row.ameyoDisposition, row.kaptureTicket].concat(row.queriesHi, row.queriesEn, row.infoRetrieved, row.questions).join(' • ');
        if (hay.toLowerCase().indexOf(lower) !== -1) {
          results.push({ kind: 'Tagging · ' + cat.name, title: row.subCategory, snippet: snippetAround(hay, lower), go: function () { navigate('tagging', cat.name); setTimeout(function(){ var el=document.getElementById('row-'+slug(cat.name)+'-'+cat.rows.indexOf(row)); if(el){el.open=true; el.scrollIntoView({block:'center'});} }, 30); } });
        }
      });
    });

    DATA.scriptTabs.forEach(function (tab) {
      tab.items.forEach(function (item) {
        if (item.type !== 'step') return;
        var hay = [item.step, item.subCategory, item.hindi, item.backend].join(' • ');
        if (hay.toLowerCase().indexOf(lower) !== -1) {
          results.push({ kind: 'Script · ' + tab.name, title: item.step, snippet: snippetAround(hay, lower), go: function () { navigate('script', tab.name); } });
        }
      });
    });

    if (DATA.wiomNetSop) {
      DATA.wiomNetSop.pages.forEach(function (page) {
        var chunks = [];
        if (page.steps) page.steps.forEach(function (s) { chunks.push([s.title, s.body, s.title]); });
        if (page.quickRef) page.quickRef.forEach(function (q) { chunks.push([q.situation, q.situation, q.doThis + ' ' + q.sayThis]); });
        if (page.matrix) page.matrix.forEach(function (m) { chunks.push([m.situation, m.situation, m.chain.join(' ') + ' ' + m.notActive + ' ' + m.active]); });
        if (page.rows) page.rows.forEach(function (r) { chunks.push([r.situation, r.situation, r.ask + ' ' + r.tag + ' ' + r.trigger + ' ' + r.notes]); });
        if (page.cards) page.cards.forEach(function (c) { chunks.push([c.situation, c.situation, c.hindi]); });
        if (page.tags) chunks.push(['CRM Tags', 'CRM Tags', page.tags.join(' ')]);
        chunks.forEach(function (chunk) {
          var title = chunk[1], hay = chunk[0] + ' • ' + chunk[2];
          if (hay.toLowerCase().indexOf(lower) !== -1) {
            results.push({ kind: 'Wiom Net · ' + page.title, title: title, snippet: snippetAround(hay, lower), go: function () { navigate('wiomnet', page.key); } });
          }
        });
      });
    }

    renderSearchResults(term, results);
  }

  function snippetAround(hay, lower) {
    var idx = hay.toLowerCase().indexOf(lower);
    if (idx === -1) return hay.slice(0, 140);
    var start = Math.max(0, idx - 50);
    var end = Math.min(hay.length, idx + lower.length + 90);
    return (start > 0 ? '…' : '') + hay.slice(start, end) + (end < hay.length ? '…' : '');
  }

  function renderSearchResults(term, results) {
    var html = '<div class="page-head"><div class="eyebrow">Search</div><h1>' + results.length + ' result' + (results.length === 1 ? '' : 's') + ' for "' + esc(term) + '"</h1></div>';
    if (!results.length) {
      html += '<div class="empty-state">No matches. Try a shorter term, or search in Hindi / English.</div>';
      mainInner.innerHTML = html;
      return;
    }
    results.slice(0, 120).forEach(function (r, i) {
      html += '<div class="result-item" data-ridx="' + i + '"><div class="ri-path">' + esc(r.kind) + '</div>' +
        '<div class="ri-title">' + highlight(r.title, term) + '</div>' +
        '<div class="ri-snippet">' + highlight(r.snippet, term) + '</div></div>';
    });
    mainInner.innerHTML = html;
    mainInner.querySelectorAll('.result-item').forEach(function (el, i) {
      el.addEventListener('click', function () { results[i].go(); });
    });
  }

  /* ---------------- init ---------------- */
  state = parseHash();
  render();
  setActiveNav();
  initWorkflow();
})();
</script>
