<title>Wiom CX Console — Tagging &amp; Call Script Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ink: #12181f;
    --ink-dim: #5b6472;
    --ink-faint: #8991a1;
    --paper: #f4f5f8;
    --surface: #ffffff;
    --surface-raised: #ffffff;
    --line: #e2e5ea;
    --line-strong: #cdd2db;
    --brand: #1d3aae;
    --brand-ink: #ffffff;
    --brand-soft: #eaeefb;
    --brand-soft-line: #c8d2f4;
    --good: #157a4f;
    --good-soft: #e6f4ee;
    --warn: #9a5b00;
    --warn-soft: #fbeedc;
    --bad: #b3271a;
    --bad-soft: #fbe9e6;
    --info: #1f5f9e;
    --info-soft: #e8f1fa;
    --plum: #6a3fa0;
    --plum-soft: #f0e9f7;
    --subcat-bg: #ffc000;
    --subcat-ink: #3d2f00;
    --subcat-line: #d1a000;
    --shadow: 0 1px 2px rgba(20, 25, 35, 0.04), 0 8px 24px -12px rgba(20, 25, 35, 0.16);
    --radius: 10px;
    --font-ui: -apple-system, "Segoe UI", "Noto Sans", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Roboto Mono", monospace;
    --font-hi: "Noto Sans Devanagari", "Nirmala UI", "Kohinoor Devanagari", "Mangal", var(--font-ui);
  }

  :root[data-theme="dark"] {
    --ink: #e7eaf0;
    --ink-dim: #9aa4b6;
    --ink-faint: #6c7688;
    --paper: #0b0f16;
    --surface: #121926;
    --surface-raised: #16202f;
    --line: #232e3f;
    --line-strong: #33415a;
    --brand: #7b95ff;
    --brand-ink: #0b0f16;
    --brand-soft: #1a2340;
    --brand-soft-line: #33427a;
    --good: #4fd095;
    --good-soft: #10291f;
    --warn: #f0b64c;
    --warn-soft: #2e230d;
    --bad: #f28b7d;
    --bad-soft: #331815;
    --info: #7cc0f5;
    --info-soft: #0f2436;
    --plum: #c9a6f0;
    --plum-soft: #241a34;
    --subcat-bg: #a97600;
    --subcat-ink: #fff3d6;
    --subcat-line: #d1a000;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e7eaf0;
      --ink-dim: #9aa4b6;
      --ink-faint: #6c7688;
      --paper: #0b0f16;
      --surface: #121926;
      --surface-raised: #16202f;
      --line: #232e3f;
      --line-strong: #33415a;
      --brand: #7b95ff;
      --brand-ink: #0b0f16;
      --brand-soft: #1a2340;
      --brand-soft-line: #33427a;
      --good: #4fd095;
      --good-soft: #10291f;
      --warn: #f0b64c;
      --warn-soft: #2e230d;
      --bad: #f28b7d;
      --bad-soft: #331815;
      --info: #7cc0f5;
      --info-soft: #0f2436;
      --plum: #c9a6f0;
      --plum-soft: #241a34;
      --subcat-bg: #a97600;
      --subcat-ink: #fff3d6;
      --subcat-line: #d1a000;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--brand-soft-line); }
  a { color: var(--brand); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ---------- Shell layout ---------- */
  #shell {
    display: grid;
    grid-template-columns: 264px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "topbar topbar"
      "nav main";
    height: 100vh;
  }
  @media (max-width: 860px) {
    #shell {
      grid-template-columns: 1fr;
      grid-template-areas:
        "topbar"
        "main";
    }
    #nav { display: none; position: fixed; inset: 56px 0 0 0; z-index: 40; }
    #nav.open { display: block; }
  }

  /* ---------- Top bar ---------- */
  #topbar {
    grid-area: topbar;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: relative;
    z-index: 30;
  }
  #brandmark {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 700;
    font-size: 14.5px;
    white-space: nowrap;
    color: var(--ink);
    flex-shrink: 0;
  }
  #brandmark .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
    flex-shrink: 0;
  }
  #menuToggle {
    display: none;
    background: none; border: 1px solid var(--line); border-radius: 8px;
    width: 34px; height: 34px; cursor: pointer; color: var(--ink);
    align-items: center; justify-content: center;
  }
  @media (max-width: 860px) { #menuToggle { display: inline-flex; } }

  #searchWrap { position: relative; flex: 1; max-width: 560px; }
  #globalSearch {
    width: 100%;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    padding: 0 34px 0 34px;
    font-size: 13.5px;
  }
  #searchWrap svg.icon-search {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--ink-faint); pointer-events: none;
  }
  #searchClear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--ink-faint); cursor: pointer;
    width: 24px; height: 24px; border-radius: 6px; display: none;
    align-items: center; justify-content: center;
  }
  #searchClear.show { display: inline-flex; }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .iconbtn {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    width: 34px; height: 34px; cursor: pointer; color: var(--ink-dim);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .iconbtn:hover { color: var(--ink); border-color: var(--line-strong); }


  /* ---------- Review workflow ---------- */
  .who-chip { display: inline-flex; align-items: center; gap: 8px; padding: 3px 10px 3px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .who-chip[hidden], .btn-edit[hidden] { display: none; }
  .who-txt { display: flex; flex-direction: column; line-height: 1.15; }
  .who-txt b { font-size: 12px; } .who-txt small { font-size: 10.5px; color: var(--ink-faint); font-family: var(--font-mono); }
  .who-warn { color: var(--warn); font-size: 10px; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--brand-soft); }
  .avatar.ph { display: inline-block; border: 1px solid var(--line); }
  .btn-edit { border: 1px solid var(--brand); background: var(--surface); color: var(--brand); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn-edit.on { background: var(--brand); color: var(--brand-ink); }
  .edit-btn { display: none; border: 1px solid var(--line); background: var(--surface); color: var(--brand); border-radius: 6px; width: 24px; height: 22px; margin-left: 6px; cursor: pointer; font-size: 13px; line-height: 1; vertical-align: middle; padding: 0; text-transform: none; letter-spacing: 0; }
  .edit-btn.hist { color: var(--ink-faint); }
  body.editing .edit-btn { display: inline-block; }
  .edit-btn:hover { border-color: var(--brand); background: var(--brand-soft); }
  .edit-banner { background: var(--brand-soft); border: 1px solid var(--brand-soft-line); color: var(--ink); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
  .edit-meta { display: none; flex-wrap: wrap; gap: 6px 16px; margin: 12px 0 0; font-size: 12.5px; color: var(--ink-dim); }
  body.editing .edit-meta { display: flex; }
  .pend { display: inline-block; font-family: var(--font-mono); font-size: 10px; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 1px 8px; margin-left: 8px; }
  .btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 13px; font-size: 13px; cursor: pointer; }
  .btn:hover { border-color: var(--brand); }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
  .btn.danger { color: var(--bad); border-color: var(--bad); }
  .btn:disabled { opacity: .55; cursor: default; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(10, 14, 22, .55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow); width: min(680px, 100%); max-height: 92vh; overflow: auto; padding: 20px 22px; }
  .modal h3 { margin: 0 0 2px; font-size: 18px; }
  .mod-loc { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); margin-bottom: 12px; }
  .modal label { display: block; font-size: 12.5px; font-weight: 600; margin: 12px 0 5px; }
  .modal .hint { font-weight: 400; color: var(--ink-faint); }
  .modal textarea, .modal input[type=text], .rv-search, .rv-reason { width: 100%; border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 9px 11px; font: inherit; font-size: 14px; }
  .modal textarea { resize: vertical; font-family: var(--font-hi); line-height: 1.55; }
  .mod-flow { margin-top: 12px; font-size: 12.5px; color: var(--ink-dim); background: var(--paper); border-radius: 8px; padding: 8px 11px; }
  .mod-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 80; box-shadow: var(--shadow); transition: opacity .35s; max-width: 90vw; }
  .toast.bad { background: var(--bad); color: #fff; } .toast.out { opacity: 0; }
  .rv-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .rv-card.slim { padding: 9px 14px; margin-bottom: 8px; }
  .rv-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .rv-loc { font-weight: 650; font-size: 14px; }
  .rv-meta { font-size: 12.5px; color: var(--ink-dim); margin: 4px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .rv-dec { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 10px; }
  .rv-note { font-size: 13px; color: var(--ink-dim); margin: 6px 0; font-style: italic; }
  .rv-warn { font-size: 12.5px; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 7px 10px; margin: 8px 0; }
  .rv-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .rv-actions .rv-reason { flex: 1 1 220px; width: auto; }
  .rv-filter { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .rv-filter .filterbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .rv-filter .rv-search { flex: 1 1 220px; width: auto; }
  .rv-h2 { font-size: 15px; margin: 24px 0 10px; }
  .who { display: inline-flex; align-items: center; gap: 6px; }
  .pill { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 2px 9px; }
  .p-pending { background: var(--warn-soft); color: var(--warn); } .p-approved { background: var(--good-soft); color: var(--good); }
  .p-rejected { background: var(--bad-soft); color: var(--bad); } .p-withdrawn, .p-ignored { background: var(--paper); color: var(--ink-faint); }
  .tag-ok { color: var(--good); } .tag-live { color: var(--info); }
  .diff { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  @media (max-width: 720px) { .diff { grid-template-columns: 1fr; } }
  .diff-h { font-family: var(--font-mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px; }
  .diff-b { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; white-space: pre-wrap; font-size: 13px; font-family: var(--font-hi); overflow-wrap: anywhere; }
  .diff-b del { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
  .diff-b ins { background: var(--good-soft); color: var(--good); text-decoration: none; font-weight: 600; }
  .role-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .role-row:first-of-type { border-top: 0; }
  .role-btns { display: inline-flex; gap: 6px; }
  .sugg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .muted { color: var(--ink-faint); }
  @media (max-width: 720px) { .who-txt { display: none; } .who-chip { padding: 3px; } .btn-edit { padding: 6px 9px; } }
  .rv-ign summary { cursor: pointer; color: var(--ink-faint); font-size: 13px; margin: 14px 0; }

  /* ---------- Nav rail ---------- */
  #nav {
    grid-area: nav;
    background: var(--surface);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 14px 10px 24px;
  }
  .nav-section-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 14px 10px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 8px 10px; border-radius: 8px;
    color: var(--ink-dim);
    font-size: 13.3px;
    line-height: 1.3;
  }
  .nav-item:hover { background: var(--paper); color: var(--ink); }
  .nav-item.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .nav-item .label { flex: 1; }
  .nav-item .count {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint);
    background: var(--paper); border-radius: 5px; padding: 1px 6px;
  }
  .nav-item.active .count { color: var(--brand); background: var(--surface); }
  .nav-divider { height: 1px; background: var(--line); margin: 10px 4px; }

  /* ---------- Main ---------- */
  #main { grid-area: main; overflow-y: auto; }
  #mainInner { max-width: 980px; margin: 0 auto; padding: 28px 24px 80px; }

  .page-head { margin-bottom: 20px; }
  .page-head h1 {
    font-size: 22px; margin: 4px 0 6px; text-wrap: balance; letter-spacing: -0.01em;
  }
  .page-head p.desc { color: var(--ink-dim); margin: 0; max-width: 68ch; }
  .page-head .filterbar {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px;
  }
  .chip-filter {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim);
    border-radius: 999px; padding: 5px 11px; cursor: pointer;
  }
  .chip-filter.active { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

  /* ---------- Tagging cards ---------- */
  .row-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 10px; overflow: hidden;
  }
  .row-card > summary {
    list-style: none; cursor: pointer; padding: 13px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .row-card > summary::-webkit-details-marker { display: none; }
  .row-card .chev {
    color: var(--ink-faint); flex-shrink: 0; transition: transform 0.15s ease;
  }
  .row-card[open] .chev { transform: rotate(90deg); }
  .row-card .subcat-name { font-weight: 600; font-size: 14.5px; flex: 1 1 240px; min-width: 0; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.02em;
    padding: 3px 8px; border-radius: 6px; white-space: nowrap; font-weight: 600;
  }
  .badge.b-good { background: var(--good-soft); color: var(--good); }
  .badge.b-warn { background: var(--warn-soft); color: var(--warn); }
  .badge.b-bad { background: var(--bad-soft); color: var(--bad); }
  .badge.b-info { background: var(--info-soft); color: var(--info); }
  .badge.b-plum { background: var(--plum-soft); color: var(--plum); }
  .badge.b-neutral { background: var(--paper); color: var(--ink-dim); border: 1px solid var(--line); }

  .row-body { padding: 4px 16px 18px; border-top: 1px solid var(--line); }
  .field-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; margin-top: 14px;
  }
  @media (max-width: 640px) { .field-grid { grid-template-columns: 1fr; } }
  .field-grid.full { grid-template-columns: 1fr; }
  .field {
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  .field .flabel {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 5px;
  }
  .field .fvalue { white-space: pre-line; color: var(--ink); }
  .field.eligible .fvalue { color: var(--good); }
  .field.noneligible .fvalue { color: var(--bad); }
  .field ul.clean { margin: 0; padding-left: 18px; }
  .field ul.clean li { margin-bottom: 3px; }

  .resolution-path { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
  .rp-step {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px;
  }
  .rp-step .rp-n {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--brand);
    background: var(--brand-soft); border-radius: 6px; width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }

  /* ---------- Arrow flows ---------- */
  .flow-arrow {
    position: relative; height: 26px; width: 2px; background: var(--brand); margin: 0 0 0 21px; flex-shrink: 0;
  }
  .flow-arrow::after {
    content: ""; position: absolute; left: -5px; bottom: -2px;
    border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 9px solid var(--brand);
  }
  .flow-arrow.center { margin-left: auto; margin-right: auto; }
  .flow-arrow.small { height: 14px; margin-left: 13px; }
  .flow-arrow .fa-label {
    position: absolute; left: 12px; top: 4px; white-space: nowrap;
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
  }

  .rf-map { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 3px; margin-bottom: 14px; }
  .rf-chip {
    font-family: var(--font-mono); font-size: 11px; padding: 4px 9px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand); border: 1px solid var(--brand-soft-line); white-space: nowrap;
  }
  .rf-chip.decision { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
  .rf-chip.start { background: var(--good-soft); color: var(--good); border-color: var(--good); }
  .rf-sep { color: var(--brand); display: inline-flex; }

  .rf { display: flex; flex-direction: column; margin-top: 2px; }
  .rf-node {
    display: flex; gap: 12px; align-items: flex-start; background: var(--paper);
    border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px;
  }
  .rf-node .rp-n {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--brand); background: var(--brand-soft);
    border-radius: 7px; min-width: 26px; height: 26px; padding: 0 5px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .rf-node.start { border-color: var(--good); }
  .rf-node.start .rp-n { background: var(--good-soft); color: var(--good); }
  .rf-node.end { border-color: var(--brand); border-width: 2px; }
  .rf-node.decision { border: 1px dashed var(--warn); background: var(--warn-soft); }
  .rf-node.decision .rp-n { background: var(--warn); color: var(--paper); }
  .rf-body { flex: 1; min-width: 0; }
  .rf-body .fvalue { white-space: pre-line; }
  .rf-cond { font-weight: 600; margin-bottom: 3px; }
  .rf-tag {
    display: inline-block; font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
    padding: 2px 6px; border-radius: 5px; background: var(--warn); color: var(--paper); margin-right: 6px; vertical-align: 1px;
  }

n drop hota hai, bahut problem ho rahi hai kaam mein", "Raat ko internet aata hai din ko chala jaata hai, aisa kyun ho raha hai?", "Internet itni baar aata jaata hai ki koi kaam nahi kar pa raha - please technician bhejo ek baar"], "queriesEn": ["The internet keeps disconnecting every 10-15 minutes, and it's causing a lot of problems with my work.", "The internet works at night but goes down during the day. Why is this happening?", "The connection drops so frequently that I can't get any work done. Please send an engineer to check it."], "resolutionPath": "Step 0: If repeat call (ticket already exists for the same issue), do not troubleshoot again: read the open ticket comments, inform the customer accordingly and update the ticket notes (otherwise continue with the steps below) → Step 1: Restart the modem/net box → Step 2: Educate customer about 2.4 GHz vs 5 GHz bands and guide on optimal band → Step 3: Explain how distance, interference, and obstacles affect Wi-Fi → Step 4: Check optical power in Wiom Hub to identify connectivity issues → Step 5: Raise complaint ticket with CSP queue if unresolved, and mention the Ping delay in the Kapture ticket notes (mandatory) → Step 6: Communicate 24-hour TAT", "infoRetrieved": ["Within 48hr Closed Kapture  Ticket", "Plan Status", "Plan Expiry Date and Last Paid on", "Ping Delay (mention in Kapture ticket notes – Mandatory)", "RX power", "2.4 GHz Connected Devices", "5 GHz Connected Devices", "Band Steering", "Fluctuation Usage in Current Cycle & for those days", "Customer Name", "CSP Name", "Device ID", "CSP Zone", "Customer Mobile Number", "Address", "Outage Status", "LCO ID/CSP ID", "18 Flappin or Session count", "Plan Start date", "Open ticket Comments"], "questions": []}, {"subCategory": "Slow Speed/Range Issues", "definition": "Internet is available, but the speed or Wi-Fi range is below the expected or promised level.", "tagEligible": "• Internet is working, however the customer is consistently complaining about slow speed \n• Wi-Fi range is weak in certain areas of the home", "tagNonEligible": "• Internet is fully down (route to Internet Supply Down) \n• Frequent disconnections are happening (route to Frequent Disconnection)", "callType": "Complaint", "tat": "On-call Resolution if live speed ≥80 Mbps (OCR); if <80 Mbps (or customer disputes an ≥80 Mbps reading with Ookla proof), 24 hrs after CSP/PFT ticket is raised", "fcr": "FCR if real-time speed ≥80 Mbps (OCR) · Non-FCR if real-time speed <80 Mbps, or ≥80 Mbps but customer shares a screenshot/confirms on call an Ookla reading <80 Mbps (mention customer-claimed speed in ticket notes)", "queue": "CSP / PFT", "ownership": "CSP follow up team", "callObjective": "1. Acknowledge & Empathize - Show understanding of the issue and build trust.\n\n2. Test, Educate & Document - Run a live speed test via Wiom Hub, educate the customer on distance/interference/band placement, and document the actual live speed, date, and time in the ticket.\n\n3. Reassure Ownership - Explain next steps and the 24-hour TAT clearly if escalated to CSP/PFT, ensuring the case is tracked.", "inboundPitch": "Internet Issues", "troubleshoot": "REPEAT CALL (same issue, ticket already exists): do not troubleshoot again. Read the open ticket comments, inform the customer accordingly and update the ticket notes.\n\n1. Restart the modem/NetBox.\n2. Check optical power in Wiom Hub to identify connectivity issues.\n3. Run a Live Speed Test in Wiom Hub - press the Run button only ONCE to avoid inconsistent readings (test takes ~1-2 min, up to 3-4 min in some cases; a completed result stays valid for 6 hours).\n4. If speed ≥80 Mbps: treat as OCR - educate the customer on distance/interference/band placement and resolve on call.\n5. If speed <80 Mbps (or ≥80 Mbps but customer disputes with an Ookla screenshot/on-call confirmation <80 Mbps): raise a ticket for CSP/PFT intervention.\n6. Document the actual live speed, date, and time of the test in the ticket, and mention the Ping delay in the Kapture ticket notes (mandatory).\n7. Confirm with the customer whether the issue is still being experienced before resolving/closing the case.", "queriesHi": ["Speed bahut slow aa rahi hai, plan mein 100 Mbps hai but 20-30 Mbps bhi nahi milta", "Netbox ke paas speed theek hai but doosre kamre mein bilkul nahi aata - kyu?", "Raat ko speed acchi hoti hai din mein ekdum gir jaati hai - ye kyun hota hai?", "Upar floor tak Wi-Fi nahi pahunch raha / ek room se dusre room mein range nahi hai", "Speed test mein speed normal aane ke baad bhi buffering ho rahi hai", "Jab bhi recharge khatam hone wala hota hai, speed apne aap kam ho jaati hai"], "queriesEn": ["Speed is very slow, my plan is 100 Mbps but I'm not even getting 20-30 Mbps", "Speed is fine near the netbox but doesn't reach the other room at all - why?", "Speed is good at night but drops sharply during the day - why does this happen?", "Wi-Fi doesn't reach the floor above / doesn't reach from one room to another", "Buffering happens even after the speed test looks normal", "Speed automatically drops whenever the recharge is about to expire"], "resolutionPath": "Step 0: If repeat call (ticket already exists for the same issue), do not troubleshoot again: read the open ticket comments, inform the customer accordingly and update the ticket notes (otherwise continue with the steps below) → Step 1: Acknowledge & empathize with the customer → Step 2: Restart the modem/NetBox → Step 3: Check optical power in Wiom Hub → Step 4: Run a Live Speed Test in Wiom Hub (press Run once; result valid for 6 hours) → Step 5: If speed ≥80 Mbps, treat as OCR - educate the customer on distance/interference/band placement and resolve on call → Step 6: If speed <80 Mbps (or customer disputes an ≥80 Mbps reading with Ookla proof), raise a ticket for CSP/PFT intervention with the live speed, date, time and Ping delay recorded in the Kapture ticket notes (Ping delay is mandatory) → Step 7: Confirm with the customer whether the issue is still being experienced before closing", "infoRetrieved": ["Live Speed in Wiom Hub (Mandatory)", "Information about better Wi-Fi usage given (Yes/No) (Mandatory)", "CS Claimed Current Speed from Ookla (Non-Mandatory)", "Ping Delay (mention in Kapture ticket notes – Mandatory)", "Open ticket Comments"], "questions": ["Customer Mobile Number", "Live speed test reading from Wiom Hub", "Is the customer's Wi-Fi Band Steering ON or OFF (determines which explanation script to use)", "Which room/floor, or how far from the NetBox, is the issue occurring"]}, {"subCategory": "Optical Power Out of Range", "definition": "Customer is facing slow speed and frequent disconnections. System shows optical power out of range: -8 to -25", "tagEligible": "• Optical power reading is less than -25 or more than -8 \n• Customer reports speed fluctuation or disconnection \n• Issue confirmed in system", "tagNonEligible": "• Optical power is within range \n\n• Temporary speed issue without optical alert", "callType": "Complaint", "tat": "24 hrs", "fcr": "Non - FCR", "queue": "CSP", "ownership": "CSP follow up team", "callObjective": "", "inboundPitch": "Internet Issues", "troubleshoot": "REPEAT CALL (same issue, ticket already exists): do not troubleshoot again. Read the open ticket comments, inform the customer accordingly and update the ticket notes.\n\nIn all such cases, optical power should always be checked first.\n1. Customer is unable to use the internet despite ping up \n2. Customer is facing slow internet speed.\n3..Customer is experiencing frequent disconnections.\n\nNote: while creating the ticket in Kapture, mention the Ping delay in the ticket notes (mandatory).", "queriesHi": ["Device pe red light aa rahi hai, koi bol raha hai optical power out of range hai - matlab?", "Green light ki jagah red blink ho rahi hai - internet totally dead ho gayi hai"], "queriesEn": ["Device is showing red light, and I was told the optical power is out of range. What does that mean?", " ntact, new address, shifting date) and log ticket.\n4. Reassure Ownership → Communicate next steps, ETA of 3-4 days, and assure team will execute the shift.", "inboundPitch": "Shifting", "troubleshoot": "1. Understand the purpose of the call and provide the customer with relevant shifting information, clarifying that a shifting request can be raised when they are ready to move.\n\n2. Advise the customer to call back at the time of shifting so the request can be processed.\n\n3. Create a ticket for shifting inquiry and close by marking it as resolved.", "queriesHi": ["Shifting ke baare mein puchna tha - kya process hai aur kitna time lagta hai?", "Doosri jagah shift karna chahta hoon, kya same plan chal sakta hai naye ghar mein?", "Shifting ka charge kitna hoga aur security deposit transfer hoti hai kya?"], "queriesEn": ["I would like to know about the connection shifting process. How does it work, and how long does it take?", "I want to move to a different location. Can I continue using the same plan at my new home?", "What are the charges for shifting, and will my security deposit be transferred as well?"], "resolutionPath": "Step 1: Understand purpose of call – confirm customer is only enquiring, not ready to shift → Step 2: Provide relevant shifting information and explain the process → Step 3: Advise customer to call back when ready to initiate shifting → Step 4: Create a ticket for shifting inquiry → Step 5: Close ticket marking as resolved on-call", "infoRetrieved": ["Within48hr closed kapture ticket", "Plan Status", "Plan Expiry Date and Last Paid on", "Ping Delay", "RX power", "Customer Name", "CSP Name", "Device ID", "CSP Zone", "Customer Mobile Number", "Customer Address VS New address", "Check coordinates for new address", "Feasibility check (same CSP within 200m) - Map Tool: https://web-production-27094.up.railway.app/", "LCO ID/CSP ID", "Open ticket Comments"], "questions": []}, {"subCategory": "Shifting Request | Shift Within My Home", "definition": "C ting request been approved? When will the technician visit my new address?"], "resolutionPath": "Step 1: Collect correct shifting address from customer → Step 2: Obtain coordinates using a reliable map → Step 3: Check feasibility in Wiom Hub – different Wiom CSP available within 200m → Step 4: Guide customer to book a new connection at new address → Step 5: Initiate refund of remaining plan amount as per policy → Step 6: Resolve on-call", "infoRetrieved": ["Within48hr closed kapture ticket", "Plan Status", "Plan Expiry Date and Last Paid on", "Transaction ( Transaction ID, Transaction time, Transaction Status)", "Refund status", "Bug logged for Product team (Slack)", "Ping Delay", "RX power", "Map Tool: https://web-production-27094.up.railway.app/", "Current Address VS New Add Address", "LCO/CSP ID", "Open ticket Comments"], "questions": []}, {"subCategory": "Shifting Request | Shift to New Address (Not Serviceable)", "definition": "There is no Wiom CSP in a 200m range", "tagEligible": "• New address is outside current premises \n• Distance is not within feasible range (≤200m) of any Wiom CSP as per Shifting portal\n\nhttps://web-production-27094.up.railway.app/", "tagNonEligible": "Any Wiom CSP is serviceable", "callType": "Request", "tat": "On-call Resolution", "fcr": "FCR", "queue": "CC Queue", "ownership": "NA", "callObjective": "", "inboundPitch": "Shifting", "troubleshoot": "1.Collect the correct shifting address from the customer.\n2.Obtain the coordinates using a reliable map.\n3.Check feasibility in the system: if no Wiom CSP is available, clearly inform the customer that Wiom is not serviceable at the new location, apologise for the inconvenience, and guide them on next steps including connection closure, if required.", "queriesHi": ["Naye address pe shift ho raha hoon but bola gaya Wiom available nahi hai wahan - kya koi option hai?", "New area mein service nahi hai toh connection band karna hoga kya - security deposit wapas milegi?", "Kab tak naye area mein Wiom aayega, koi timeline hai kya expansion ka?"], "queriesEn": ["I am moving to a new address, but I have been informed that Wiom service is not available there. What are my options?", "If service is unavailable in my new area, will I have to disconnect my connection? Will I get my security deposit back?", "When will Wiom service be available in my new area? Is there any expansion timeline?"], "resolutionPath": "Step 1: Collect correct shifting address from customer → Step 2: Obtain coordinates using a reliable map → Step 3: Check feasibility in Wiom Hub – confirm no Wiom CSP within 200m → Step 4: Clearly inform customer that Wiom is NOT serviceable at new location → Step 5: Apologize for inconvenience → Step 6: Guide customer on next steps including connection closure and refund if required → Step 7: Resolve on-call", "infoRetrieved": ["Within48hr closed kapture ticket", "Plan Status", "Plan Expiry Date and Last Paid on", "Ping Delay", "RX power", "Customer Name", "CSP Name", "Device ID", "CSP Zone", "Customer Mobile Number", "Current Address", "Map Tool: https://web-production-27094.up.railway.app/", "LCO/CSP ID", "Open ticket Comments"], "questions": []}]}, {"name": "Others", "rows": [{"subCategory": "TV/Camera issue", "definition": "Customer reports they are unable to use TV or camera devices with Wiom internet.", "tagEligible": "• Internet is working on other devices \n• Issue is specific to TV / camera \n• App or device shows no connectivity", "tagNonEligible": "• Internet is down on all devices \n• Issue is due to device configuration/app \n• Speed-only complaints", "callType": "Complaint", "tat": "24HR", "fcr": "Non - FCR", "queue": "CSP", "ownership": "CSP follow up team", "callObjective": "Acknowledge & Confirm → Listen & confirm the issue (TV/Camera, Adapter, Installation, Invoice).\n\nEducate & Guide → Explain basic steps / process and set clear expectations. charges if applicable.\n\nCollect Details → Record customer info and log the ticket.\n\nRea le": "• App shows error / payment failed • Payment page not loading or crashing • Issue is app-specific (All scenarios will be tagged under this tagging as QR code & payment link are also redirecting customer to WIOM application to complete their recharge)", "tagNonEligible": "• Issue with UPI/bank outside app • Customer prefers cash/offline payment", "callType": "Complaint", "tat": "24 Hr", "fcr": "Partial - FCR", "queue": "L2 service team", "ownership": "L2 service team", "callObjective": "", "inboundPitch": "Payment Issues", "troubleshoot": "", "queriesHi": ["App se payment karne ki koshish ki but error aa raha hai baar baar - kya karu?", "UPI se pay kiya, OTP bhi aaya but transaction fail ho gayi - paisa bhi gaya aur recharge nahi hua", "App mein payment page hi nahi khul raha, koi aur tarika batao payment ka", "Recharge successful ho gaya, lekin app mein update nahi hua."], "queriesEn": ["I am trying to make a payment through the app, but it keeps showing an error. What should I do?", "I paid using UPI and even received the OTP, but the transaction failed. The money was deducted, and the recharge wasn't completed.", "The payment page in the app isn't loading at all. Is there any other way to make the payment?", "My recharge was successful, but it hasn't been updated in the app yet"], "resolutionPath": "Step 1: Ask customer to describe the app issue → Step 2: Guide customer: Long-press Wiom app > App Info > Clear Data & Clear Cache (Android; on iPhone delete the app and reinstall it from App Store) → Step 3: If issue persists, guide to Uninstall and Reinstall app → Step 4: Request screenshot/video on 8880322222 → Step 5: If error visible, fill Slack Bug Front form → Step 6: CX TL/Supervisor to update resolution on sheet → Step 7: CC Team calls customer to close issue", "infoRetrieved": ["Within48hr closed kapture ticket and check  whatsapp screenshot collection", "Plan Status", "Plan Expiry Date and Last Paid on", "PayG status", "PayG Migrated", "Bills and Trans istory", "Whatsapp screenshot collection", "Plan Type", "Plan Status", "Plan Expiry Date and Last Paid on", "PayG status", "PayG Migrated", "Bills and Transaction", "Customer Name", "CSP Name", "Device ID", "CSP Zone", "Customer Mobile Number", "Address", "Transaction Details (view in Transactions section): Transaction ID, Transaction Time, Amount, Refund Status, Payment Mode, Transaction Status, Details (Click on Details), Payment Gateway Transaction ID, Purpose of Transaction, Payment Mode – auto-refund verification, Autopay (Enabled/Disabled)", "Open ticket Comments"], "questions": []}, {"subCategory": "Help in renewal", "definition": "Customer needs assistance with renewing their existing plan.", "tagEligible": "• Customer wants help/guidance to renew • Customer asks for steps / link • Renewal blocked due to system or app issue", "tagNonEligible": "• Customer wants to change plan • Payment failure or refund request • New connection enquiry", "callType": "Complaint", "tat": "24 Hr", "fcr": "Partial - FCR", "queue": "L2 service team", "ownership": "L2 service team", "callObjective": "", "inboundPitch": "Payment Issues", "troubleshoot": "If the customer’s plan is expired for more than 15 days: probe for LOS.\n• LOS green/blue: advise recharge, then wait 30 mins.\n• LOS red: advise netbox return and registering a new connection.", "queriesHi": ["Mera plan expire ho raha hai, renewal kaise karu aur konsa plan sahi rahega mere liye?", "App se renew karne ki koshish ki but payment karna nahi aa raha hai, aap karwa do please", "Kitna paisa lagega renewal mein aur koi offer ya discount hai kya abhi?", "Mujhe ₹500 wala plan chahiye, lekin ₹565 dikh raha hai. Kya karun?"], "queriesEn": ["My plan is about to expire. How can I renew it, and which plan would be best for me?", "I am trying to renew my plan through the app, but unable to do it. Could you please help me with the renewal?", "How much will the renewal cost, and are there any offers or discounts available right now?", "I want the ₹500 plan, but only the ₹565 plan is showing. What should I do?"], "resolutionPath": "Step 1: Check CSP status (Delisted/Blocked/Active) → Step 2: If the plan is expired for more than 15 days, probe for LOS → Step 2a: If LOS is green/blue, advise recharge, then wait 30 mins → Step 2b: If LOS is red, advise netbox return and registering a new connection → Step 3: If Active, guide customer to renew via Wiom App > Open app > Log in > Type recharge → Step 4: Alternatively, share Payment Link or inform about QR code on net box → Step 5: Raise ticket if system/app issue blocking renewal", "infoRetrieved": ["Within48hr closed kapture ticket 2whatsapp screenshot collection", "Plan Status", "Plan Type", "Plan Expiry Date and Last Paid on", "PayG Status", "PayG Migrated", "Bills and Transaction", "CSP Status Check (Delisted/Blocked/Active)", "Customer Name", "CSP Name", "Device ID", "CSP Zone", "Customer Mobile Number", "Address", "Payment Link to be sent (of any)", "LCI ID /CSP ID", "Open ticket Comments"], "questions": []}]}, {"name": "Remove Connection - Talk to Customer", "rows": [{"subCategory": "Wiom Service Issue", "definition": "Customer wants to disconnect due to Wiom service-related problems.", "tagEligible": "• Customer explicitly cites Wiom service problems \n• Mentions frequent outages, slow speed, no internet, poor support \n• Dissatisfaction is clearly service-related", "tagNonEligible": "• Customer is shifting location \n• Customer has no usage requirement \n• Disconnection requested for non-service reasons", "callType": "Complaint", "tat": "On call resolved", "fcr": "FCR", "queue": "L2 service team", "ownership": "L2 service team", "callObjective": "Listen & empathize with the customer’s frustration.\n\nPerform basic troubleshooting based on their issue (restart net box, check LOS, device load, 2.4/5 GHz band).\n\nCheck CRM for recent complaints or open issues.\n\nOffer resolution support:\nRaise complaint ticket\nAssure priority handling\n\nMake a retention attempt:\nOfferdiscount (if applicable)\n\n\n\nGuide the customer to generate the ticket through app", "inboundPitch": "Remove Connection - Talk to Customer", "troubleshoot": "Acknowledge & Confirm → Listen carefully and empathize with the customer.\n\nEducate & Guide → Guid the customer to self generate the tix\n\nCollect Details → Capture account info, reason, and any special instructions; log in the ticket.\n\nReassure Ownership → Communicate next steps, TAT, and assure the customer the team will follow up.", "queriesHi": ["Service bahut kharab ho gayi hai, baar baar problem aati hai - main connection band karna chahta hoon", "Itne paisa dete hain lekin service zero hai, engineer aate hain but theek nahi hota - kya karu?", "Pichle mahine se same issue hai, koi permanent solution nahi mila - refund ya disconnect chahiye"], "queriesEn": ["The service has become very poor, and I keep facing issues. I want to disconnect my connection.", "I am paying so much, but the service quality is extremely poor. Engineers visit, but the problem never gets resolved. What should I do?", "I have been facing the same issue for the past month, and there has been no permanent solution. I would like a refund or disconnection."], "resolutionPath": "Step 1: Listen & empathize with the customer's frustration → Step 2: Perform basic troubleshooting (restart net box, check LOS, check device load, 2.4/5 GHz band) → Step 3: Check CRM for recent complaints or open issues → Step 4: Offer resolution support: raise complaint ticket → Step 5: Make retention attempt – ask to apply discount coupon if available in account → Step 6: Guide customer to generate ticket through app → Step 7: Communicate TAT on call", "infoRetrieved": ["Within 48hr Closed Kapture Ticket", "Plan Status", "Plan Expiry Date and Last Paid on", "PayG", "Customer Name", "CSP Name", "Device ID", "CSP Zone", "Customer Mobile Number", "Address", "Ping Delay", "RX power", "LCO ID/CSP ID", "Current Usage (Internet not working on which days)", "Net-Box Return – Active Requests: List of active return tickets with Ticket ID and Active count badge", "Net-Box Return – Net-Box Refund Details: Eligible Refund Amount, Net-Box Pickup Charges, Late Fee Charges (with +Waive Fee), Total Refund (Expected), UPI Added? (Yes/No with Send UPI Reminder), Refund Status (Not started/In progress/Done)", "Net-Box Return – Ticket & Collection Status: Ticket Status (RESOLVED/SEND TO WIOM/etc.), Ticket Created At, CSP Collected Net-Box (Yes/No), CSP Collection Date", "Open ticket Comments"], "questions": []}, {"subCategory": "Other reasons", "definition": "Customer wants to disconnect due to reasons other than service issues.", "tagEligible": "• Reason is personal or external (shifting, no need, cost, temporary use) \n• Customer does not blame service quality \n• Disconnection is a choice, not a complaint", "tagNonEligible": "• Customer complains about Wiom service quality \n• Issue can be resolved via troubleshooting or shifting \n• Customer is open to continue after resolution", "callType": "Complaint", "tat": "On call resolved", "fcr": "FCR", "queue": "L2 service team", "ownership": "L2 service team", "callObjective": "Other Reasons (Not related to Wiom service)\n\nAsk the customer for the actual reason (relocation, low usage, cost issue, shifting provider, personal reason).\n\nEmpathize and acknowledge their situation.\n\nAttempt retention based on reason:\n\nFor relocation → offer relocation support\nFor low usage → offer sachet/low-cost plans\nFor cost issue → offer economical plan/duration\nRaise complaint ticket\n\n\nGuide the customer to generate the ticket through app", "inboundPitch": "Remove Connection - Talk to Customer", "troubleshoot": "", "queriesHi": ["Kuch personal kaam ki wajah se connection band karna hai, process kya hai?", "Abhi zaroorat nahi hai service ki, temporarily ya permanently band kar do", "Koi aur reason hai band karne ka - agent se baat karni hai detail mein"], "queriesE  agrees to continue • Refund requested for non-service reasons", "callType": "Complaint", "tat": "24 Hr", "fcr": "Non - FCR", "queue": "L2 service team", "ownership": "L2 service team", "callObjective": "Listen to the customer and empathize for the inconvenience.\n\nCheck CRM for:\nService downtime\nComplaint history\nRecent technical issues\n\nValidate if customer’s issue was genuine and unresolved.\nInform the customer about refund TAT.\nRaise complaint ticket", "inboundPitch": "Refund", "troubleshoot": "Acknowledge & Confirm → Listen carefully, confirm the refund reason, and empathize with the customer.\n\nEducate & Guide → Explain refund eligibility, process, and timelines clearly.\n\nCollect Details → Capture account info, payment/transaction details, and log in the ticket.\n\nReassure Ownership → Communicate next steps, TAT and assure the team will call for this.", "queriesHi": ["Service itni kharab thi pichle mahine ki ki refund chahiye mujhe us period ka", "Kaafi din internet nahi chala, us time ka paisa wapas milna chahiye - refund process karo", "SLA ke hisaab se downtime bahut zyada raha, compensation ya refund ka kya policy hai?"], "queriesEn": ["The service was extremely poor last month, and I would like a refund for that period.", "My internet was unavailable for several days. I believe I should receive a refund for the downtime. Please process it.", "The downtime exceeded the SLA limits. What is your policy regarding compensation or refunds?"], "resolutionPath": "Step 1: Listen & empathize with customer → Step 2: Check CRM for service downtime, complaint history, recent technical issues → Step 3: Validate if customer's issue was genuine and unresolved → Step 4: Offer coupon/retention to customer (L2 team attempt) → Step 5: If customer agrees to retention, cancel refund request → Step 6: If customer does not agree, fill out Refund Form → CX TL/Supervisor initiates refund within 1 hour → Step 7: Inform customer refund will be processed within 5–7 working days", "infoRetrieved": ["Within48hr closed kapture ticket", "Chat Section (Customer App)", "Plan Status", "Plan Expiry Date", "Last Paid on", "Billing", "Transaction details (ID, Time, Amount, Refund Status, Payment Mode, Status, Payment  Gateway, Purpose of the transactions )", "Customer Name", "CSP Name", "Device ID", "CSP Zone", "Customer Mobile Number", "Address", "LCO ID /CSP ID", "Ping Delay", "Internet not working on which days", "Open ticket Comments"], "questions": []}, {"subCategory": "Double payment", "definition": "Customer paid twice and requests refund for extra payment.", "tagEligible": "• Two successful payments are visible in system • Payments are for same account / plan / period • Customer requests refund of excess amount", "tagNonEligible": "• One payment is failed / pending • Payment made for different accounts or plans • Customer is asking only for invoice or adjustment, not refund", "callType": "Complaint", "tat": "24 Hr", "fcr": "Non - FCR", "queue": "L2 service team", "ownership": "L2 service team", "callObjective": "Ask customer to share for UTR/transaction ID of both payments on 8880322222.\nRaise complaint ticket", "inboundPitch": "Refund", "troubleshoot": "", "queriesHi": ["Galti se do baar mayment kr diye - Refund chiye ek payment ka.", "Mere do baar payment ho gyi hai app mai , ek payemnt refund kro"], "queriesEn": ["I accidentally made the payment twice. Please refund one of the payments", "My payment was processed twice in the app. Please refund one of the payments."], "resolutionPath": "Step 1: Ask customer to share UTR/transaction ID of both payments on 8880322222 → Step 2: Check Wiom Hub (Plan & Billing > Transaction) to verify if auto-refund already processed → Step 3: If not found, fill Slack Refund Form with payment details → Step 4: CX TL/Supervisor posts in Product Slack channel for review → Step 5: Product team provides update → CX TL/Supervisor updates Refund Sheet → Step 6: Refund is initiated → Inform customer → Mark ticket complete → Communicate 24-hour TAT", "infoRetrieved": ["Within48hr closed kapture ticket", "Chat Section (Customer App)", "Plan Status", "Plan Expiry Date", "Last Paid on", "Billing", "Transaction details (ID, Time, Amount, Refund Status, Payment Mode, Refund Status, Payment  Gateway, Purpose of the transation)", "Customer Name", "CSP Name", "Device ID", "CSP Zone", "Customer Mobile Number", "Address", "Open ticket Comments"], "questions": []}, {"subCategory": "Service not available in new area (shifting)", "definition": "Customer shifted to a location where service is unavailable and requests refund.", "tagEligible": "• Shifting request confirmed • New address is non-serviceable • Customer opts for refund instead of continuation", "tagNonEligible": "• Customer has not shifted yet (only enquiry) • Service is available and shifting is feasible • Refund requested due to other reasons", "callType": "Request", "tat": "24 Hr", "fcr": "Non - FCR", "queue": "L2 service team", "ownership": "L2 service team", "callObjective": "Confirm relocation details from customer.\nCheck in CRM if Wiom service is available in the new address.\n\nIf service is unavailable:\nExplain this politely\n\n\nIf service is unavailable: Raise refund ticket", "inboundPitch": "Refund", "troubleshoot": "", "queriesHi": ["मैंने नया घर लिया है, लेकिन वहां Wiom की सेवा उपलब्ध नहीं है।", "शिफ्टिंग के बाद मेरे नए एरिया में Wiom कनेक्शन नहीं मिल रहा है।", "सेवा उपलब्ध न होने के कारण मुझे रिफंड चाहिए।"], "queriesEn": ["I have shifted to a new house, but Wiom service is not available there.", "After shifting, Wiom service is not available in my new area.", "I want a refund because the service is unavailable in the new location."], "resolutionPath": "Step 1: Listen & empathize with customer - Step 2:Verify the customer's new address and service availability. - Step3-Confirm that Wiom service is unavailable at the new location and process the request under the Service Not Available (Shifting) refund policy ation.\nUpdate CRM: New Plan + Reason + Customer Consent.\nSubmit the plan change request.\nInform the customer: “You will receive a confirmation via SMS/WhatsApp.", "inboundPitch": "Change Request", "troubleshoot": "", "queriesHi": ["Current plan upgrade karna hai, zyada speed chahiye - konsa plan recommend karoge?", "Plan downgrade karna hai, abhi ka plan mehenga pad raha hai - sasta option hai?", "Plan change karne ke liye kya karna hoga aur kab se effective hoga?"], "queriesEn": ["I want to upgrade my current plan because I need higher internet speed. Which plan would you recommend?", "I want to downgrade my plan because my current one is too expensive. Is there a more affordable option?", "What is the process for changing my plan, and when will the new plan become effective?"], "resolutionPath": "Only applicable for Non-PayG plan till allowed.\nStep 1: Ask customer which plan they want to switch to (note: only upgrade is possible) → Step 2: Ask reason for plan change → Step 3: Explain new plan charges and benefits clearly → Step 4: Take verbal confirmation from customer → Step 5: Update CRM with new plan, reason, and customer consent → Step 6: Submit plan change request on Wiom Hub → Step 7: Inform customer they will receive confirmation via SMS/WhatsApp → Communicate TAT on call", "infoRetrieved": ["Within 48hr Closed Kapture  Ticket", "Customer Name", "CSP Name", "Device ID", "CSP Zone", "Customer Mobile Number", "Address", "Current Plan", "Plan Amount", "Plan Status", "Plan Expiry", "Open ticket Comments"], "questions": []}, {"subCategory": "Wifi Name/Password", "definition": "Customer requests changing Wi-Fi SSID or password.", "tagEligible": "• Customer asks to change Wi-Fi name and/or password • net box is online and reachable • Change is done via remote or guided steps", "tagNonEligible": "• Internet is not working • net box or adapter is faulty • Issue is related to speed or range", "callType": "Request", "tat": "On call resolved", "fcr": "FCR", "queue" onnection, billing, or a technical issue.", "callType": "Query", "tat": "On-call Resolution", "fcr": "FCR", "queue": "Sales Team", "ownership": "Sales Team", "callObjective": "1. Welcome & Build Interest - Greet warmly and gauge what the customer already knows.\n\n2. Explain Simply - Use the mobile-recharge analogy to make the model instantly relatable.\n\n3. Offer Next Step - Invite the customer to check serviceability or ask further questions.", "inboundPitch": "Product Explanation", "troubleshoot": "N/A - informational/pre-sales query, no technical troubleshooting required.", "queriesHi": ["Wiom kya hai?", "Recharge-wala ghar ka net kya hai", "Yeh kaise kaam karta hai?", "Kya ye mobile recharge jaisa hai ?"], "queriesEn": ["What is Wiom?", "What is this daily recharge home internet service?", "How does it work?", "Is it like a mobile recharge?"], "resolutionPath": "Step 1: Acknowledge & welcome the customer → Step 2: Explain Wiom: 'Wiom ek recharge-wala ghar ka net hai — poora ghar ek hi net se chalta hai: TV, mobile laptop wagehra sab saath-saath. Isse aap jitne din chahiye utne din recharge karke chala sakte hain. 1 din, 7 din, 14 din ya jitna bhi.' → Step 3: If customer compares it with mobile recharge, 'Sir, Wiom mein ghar ka net recharge karne ka tareeka mobile recharge jaisa hai. Lekin farq yeh hai ki ek hi service se poora ghar chal sakta hai—8-12 mobile, TV aur laptop sab ek saath. Aap jitni zarurat ho utna use kar sakte ho, aur apni convenience ke hisaab se 1 din, 7 din ya 14 din ka recharge choose kar sakte ho.' → Step 4: Offer to help with booking or answer further questions", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent", "This is not an existing customer"], "questions": []}, {"subCategory": "How it is different (recharge vs monthly)", "definition": "Customer wants to understand how Wiom's day-wise recharge model differs from a traditional fixed monthly broadband plan, and whether it is genuinely better value for their household.", "tagEligible": "Customer asks how Wiom's recharge model compares with a fixed monthly plan, or what benefit it offers over competitors.", "tagNonEligible": "Customer is disputing an already-paid recharge amount or a billing discrepancy (route to Payment Issues).", "callType": "Query", "tat": "On-call Resolution", "fcr": "FCR", "queue": "Sales Team", "ownership": "Sales Team", "callObjective": "1. Acknowledge the Comparison - Show that this is a fair question customers commonly ask.\n\n2. Explain the Difference - Flexibility of recharge duration vs lock-in of monthly plans.\n\n3. Share Indicative Pricing - Quote current recharge rates and direct to the app for the full list.", "inboundPitch": "Product Explanation", "troubleshoot": "N/A - informational/pre-sales query, no technical troubleshooting required.", "queriesHi": ["Monthly fixed plan nahi hai kya?", "Mujhe isse kya fayda milega", "Jio se better kaise hai"], "queriesEn": ["Is there a monthly fixed plan available?", "What benefits will I get from this service?", "How is it better than Jio?"], "resolutionPath": "Step 1: Acknowledge the comparison → Step 2: Explain similarity: 'Wiom mein recharge karne ka tarika mobile recharge jaisa hai' → Step 3: Explain key difference: 'Lekin farq yeh hai ki ek hi service se poora ghar chal sakta hai — 8–12 mobile, TV aur laptop sab ek saath' → Step 4: Reinforce flexibility: 'Aap apni convenience ke hisaab se 1 din, 7 din ya 28 din ka recharge choose kar sakte ho' → Step 5: Share pricing: '28 din ka recharge ₹550 ka padta hai; 1 din ₹23 se shuru hota hai. Baaki options app mein milte hain'", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent", "Dynamic Recharge plan prices ( pick current plans or offers from backend system)"], "questions": []}, {"subCategory": "Area serviceable check", "definition": "Customer wants to confirm whether Wiom is available at their specific address before proceeding further.", "tagEligible": "Customer asks whether Wiom is serviceable at their address/area/city.", "tagNonEligible": "Customer already has an active Wiom connection and is reporting a service outage (route to Internet Issues).", "callType": "Query", "tat": "On-call Resolution", "fcr": "FCR", "queue": "Sales Team", "ownership": "Sales Team", "callObjective": "1. Acknowledge Interest - Confirm the customer wants a serviceability check.\n\n2. Guide to App - Walk the customer through checking their address in the Wiom App.\n\n3. Confirm Next Step - If serviceable, guide towards booking; if not, set expectations.", "inboundPitch": "Serviceability / Area Check", "troubleshoot": "N/A - informational query; serviceability is a database lookup, not a technical issue.", "queriesHi": ["Mere area mein milega kya?", "Mere address par connection lag jayega?", "Mere city mein available hai kya?", "Kaise pata chalega service available hai?"], "queriesEn": ["Is Wiom available in my area?", "Can the connection be installed at my address?", "Is it available in my city?", "How can I check if the service is available?"], "resolutionPath": "Step 1: Ask customer to download the Wiom App from Play Store (Android) or App Store (iPhone) → Step 2: Guide them to enter their address/location in the app → Step 3: App will show serviceability instantly → Step 4: If serviceable, guide customer to proceed with booking → Step 5: If not serviceable, inform politely and advise to check back as coverage expands", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent", "Servicability check basis - Customer location if customer has already entered details"], "questions": []}, {"subCategory": "Non-serviceable area", "definition": "Customer's address is currently outside Wiom's service area, and wants to know when it will become available.", "tagEligible": "Customer's area shows non-serviceable in the app and they are asking about expansion timelines.", "tagNonEligible": "Customer's address is actually serviceable and the query is about booking, not availability.", "callType": "Query", "tat": "On-call Resolution", "fcr": "FCR", "queue": "Sales Team", "ownership": "Sales Team", "callObjective": "1. Acknowledge & Empathize - Recognize the customer's interest despite non-availability.\n\n2. Explain Status - Clarify the area is not yet live.\n\n3. Capture Demand - Note the request so the customer can be notified when the area goes live.", "inboundPitch": "Serviceability / Area Check", "troubleshoot": "N/A - informational query, no technical troubleshooting required.", "queriesHi": ["App mein area non-serviceable dikh raha hai", "Mere area mein kab tak available hoga?"], "queriesEn": ["The app is showing that my area is non-serviceable.", "When will it be available in my area?"], "resolutionPath": "Step 1: Acknowledge & empathize → Step 2: Explain: 'Wiom ka net aapke area mein milta hai ya nahi, yeh app par hi dikh jaata hai. Agar abhi dikh raha hai ki Wiom aapke ilake mein uplabdh nahi hai, toh iska matlab hai ki aapke bataye pate par abhi Wiom aaya nahi hai. Jaise hi availability hogi, app mein update dikh jaayega.' → Step 3: Advise customer to check the app periodically for updates", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent"], "questions": []}, {"subCategory": "Recharge Options / Price", "definition": "Customer wants clarity on the available recharge plans, their pricing (including GST), and which plan suits their usage.", "tagEligible": "Customer asks about plan options, pricing, GST inclusion, or which plan fits their needs.", "tagNonEligible": "Customer has already recharged and is disputing the amount deducted (route to Payment Issues).", "callType": "Query", "tat": "On-call Resolution", "fcr": "FCR", "queue": "Sales Team", "ownership": "Sales Team", "callObjective": "1. Acknowledge Inquiry - Confirm the customer wants pricing information.\n\n2. Explain Pricing Model - Day-wise recharge, starting price, and GST inclusion.\n\n3. Direct to App - Guide the customer to the app for the full, current list of options.", "inboundPitch": "Recharge & Pricing", "troubleshoot": "N/A - informational/pre-sales query, no technical troubleshooting required.", "queriesHi": ["Kaun-kaun se plans available hain?", "Mahine ka kitna?", "Mere liye Kaunsa plan sahi hai \"Roz ka recharge matlab kya", "Unlimited plan hai kya?", "GST included hai?", "Extra charges toh nahi lagenge?", "Recharge ki validity kya hoti hai?"], "queriesEn": ["What are the available plans?", "How much does it cost per month?", "Which plan would be the best for me? What does \"daily recharge\" mean?", "Is there an unlimited plan?", "Is GST included?", "Will there be any additional charges?", "What is the validity of the recharge?"], "resolutionPath": "Step 1: Acknowledge inquiry → Step 2: If customer asks the price, 'Fixed amount nahi hota — jitne din chahiye utna recharge. Jaise agar aap mahine mein ek din use karte ho toh ₹23, 7 din karte ho toh ₹155, 28 din karte ho toh ₹550. Aur bhi options hai jaise 2 din, 14 din, 56 din aur 84 din - Kya aapko kisi particular recharge ke baare mein aur jaankari chahiye?' → Step 3: If customer asks the monthly cost, 'Wiom mein mahine ka fixed price nahi hota. Aap din ke hisaab se recharge kar sakte ho—jitne din chaho utna. Aap mahine mein 28 din ka istemaal karna chahte ho, toh recharge ₹550 ka padta hai. Baaki options aap App mein dekh sakte ho.' → Step 4: If customer asks for a monthly fixed plan, 'Koi fixed recharge nahi hota. Wiom mein aap jitne din chaho utna recharge choose kar sakte ho. 28 din ka option bhi hota hai jo ₹550 ka padta hai. Baaki saare options app mein mil jaate hain.' → Step 5: If customer asks for the old plan, 'Pehle ka offer abhi nahi hai, Wiom recharge wala ghar ka net hi available hai. App mein jo recharge options dikhte hain, wahi uplabdh options hote hain.' → Step 6: If customer saw a different amount or speed option on a pamphlet, 'Pamphlet mein dikhaya gaya pehle ka offer ka ho sakta hai. Filhaal Wiom Recharge wala Ghar Ka Net available hai, aur app mein jo recharge options dikhte hain wahi uplabdh hain. Latest recharge options ki jaankari aapko app mein mil jayegi.' → Step 7: If customer wants to see recharges before booking, 'Ji... . Booking amount pay karne se pehle App mein 'Recharge ke vikalp' par recharge options dekh sakte hain.'", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent"], "questions": []}, {"subCategory": "Recharge Duration", "definition": "Customer wants to understand the available recharge durations and exactly what happens once a recharge expires.", "tagEligible": "Customer asks about available recharge durations, expiry behaviour, or auto-renewal.", "tagNonEligible": "Customer's recharge has already expired and internet has stopped (route to Internet Issues / Payment Issues as applicable).", "callType": "Query", "tat": "On-call Resolution", "fcr": "FCR", "queue": "Sales Team", "ownership": "Sales Team", "callObjective": "1. Acknowledge - Confirm the query on recharge duration.\n\n2. Explain Duration Options - 1/7/14/28-day recharge choices.\n\n3. Clarify Expiry Behaviour - What happens to the connection when a recharge lapses.", "inboundPitch": "Recharge & Pricing", "troubleshoot": "N/A - informational/pre-sales query, no technical troubleshooting required.", "queriesHi": ["Kitne din ka recharge karwa sakta hu", "1 din ka recharge hota hai?", "30 din ka recharge kar sakta hoon?", "Recharge expire hone ke baad kya hoga?", "Auto-renewal hota hai kya?"], "queriesEn": ["How many days does a recharge last?", "Is there a 1-day recharge option?", "Can I recharge for 30 days?", "What happens after the recharge expires?", "Is auto-renewal available?"], "resolutionPath": "Step 1: Acknowledge → Step 2: Explain: 'Jitne din ka recharge karte hain, utne din ghar ka net chalta hai. Recharge khatam hone par net ruk jaata hai. Dobara recharge karte hi net fir chalu ho jaata hai.' → Step 3: If customer asks the available durations, 'Ji, Wiom mein koi fixed recharge nahi hai. Aap apni zarurat ke hisaab se jitne din ka recharge karwana chahein, utne din ka recharge choose kar sakte hain. Hamare Recharge options hain: 1 din – ₹23 2 din – ₹45 7 din – ₹155 14 din – ₹305 28 din – ₹550 56 din - ₹1,050 84 din - ₹1,480'", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent"], "questions": []}, {"subCategory": "How to book / process?", "definition": "Customer wants step-by-step guidance on how to book a new Wiom connection through the app.", "tagEligible": "Customer asks how to book, what the booking process involves, or how to raise an installation request.", "tagNonEligible": "Customer has already booked and is asking about installation status (route to Status/Booking).", "callType": "Request", "tat": "On-call Resolution", "fcr": "FCR", "queue": "Sales Team", "ownership": "Sales Team", "callObjective": "1. Explain the Product Briefly - One-line reminder of what Wiom is.\n\n2. Guide Through Booking - Step-by-step app navigation for location check and booking.\n\n3. Set Post-Booking Expectations - What the customer will see in the app after booking.", "inboundPitch": "Booking Process & Charges", "troubleshoot": "N/A - guided walkthrough of the app booking flow, no technical troubleshooting required.", "queriesHi": ["Booking karnay ka liya kya karna hoga", "Booking ka process kya hai?", "App se booking kaise karte hain?", "Booking ke baad kya hota hai?", "Installation request kaise raise karun?", "Koi documents lagenge?", "Booking cancel kar sakte hain?"], "queriesEn": ["What do I need to do?", "What is the process?", "How do I book through the app?", "What happens after the booking is completed?", "How can I raise an installation request?", "Will any documents be required?", "Can I cancel the booking?"], "resolutionPath": "Step 1: Explain Wiom and guide to the app: 'Bilkul, aapki sahayta ki jayegi. Wiom ghar ka net hai jisme aap apni zarurat ke hisaab se 1 din, 7 din, 28 din jitna aap chaho utne din ka recharge choose kar sakte ho. Booking ke liye aap Wiom App Play Store ya App Store se download karke apna location check kar sakte hai aur booking kar sakte hai. Details app mein mil jaayengi. Agar aap abhi karna chahein, toh main aapki booking mein sahayta kar sakta/sakti hu.' → Step 2: If customer asks whether the app is necessary, 'Haan. Recharge wala ghar ka net App ke through hi book aur manage hota hai. Saari jankari App mein hi dikhti hai.' → Step 3: If customer wants another connection, 'Agar aapko ek aur booking karni hai, toh Wiom App download karke ek naya mobile number add karna hoga. Har number par ek hi service book hoti hai.'", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent"], "questions": []}, {"subCategory": "Deferred", "definition": "Customer is not ready to decide/book right now and wants to think it over before proceeding.", "tagEligible": "Customer explicitly says they want to decide later / are not ready to book now.", "tagNonEligible": "Customer has already decided against Wiom, or is asking a specific product/pricing question (route to the relevant sub-category).", "callType": "Query", "tat": "On-call Resolution", "fcr": "FCR", "queue": "Sales Team", "ownership": "Sales Team", "callObjective": "1. Acknowledge & Respect the Decision - Don't pressure the customer.\n\n2. Leave the Door Open - Confirm they can decide anytime via the app.\n\n3. Offer Further Help - Answer any other questions before ending the call.", "inboundPitch": "Booking Process & Charges", "troubleshoot": "N/A - informational/pre-sales query, no technical troubleshooting required.", "queriesHi": ["Abhi decide nahi karna, baad mein dekh lenge?"], "queriesEn": ["I don't want to decide right now, I'll think about it later."], "resolutionPath": "Step 1: Acknowledge the customer’s decision to wait → Step 2: Reassure: 'Bilkul. Aap jab chahein, App par jaakar decide kar sakte hain.' → Step 3: Offer to answer any other questions before ending the call", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent", "Servicability check basis - Customer location if customer has already entered details"], "questions": []}, {"subCategory": "Booking fee & Security deposit", "definition": "Customer wants to understand what is paid to start the service (booking amount, first recharge, security deposit) and when it is refunded.", "tagEligible": "Customer asks about connection cost, booking fee, security deposit, or why charges differ from what they expected/heard.", "tagNonEligible": "Customer has exited/returned the device and is disputing a refund that was already denied or delayed (route to Refund).", "callType": "Query", "tat": "On-call Resolution", "fcr": "FCR", "queue": "Sales Team", "ownership": "Sales Team", "callObjective": "1. Acknowledge the Charges Question - Confirm the customer wants clarity on cost.\n\n2. Explain - Starting payment, first recharge and the refundable NetBox security deposit where applicable.\n\n3. Direct to App - Ask the customer to treat the information shown in the app as correct.", "inboundPitch": "Booking Process & Charges", "troubleshoot": "N/A - informational/pre-sales query, no technical troubleshooting required.", "queriesHi": ["Wiom mein connection kitne ka lagta hai?", "Booking fee kyu hai?", "Kya booking fee refundable hai?", "Net lagane ke paise hain? Dono alag kyun hain? 250 kyun dene hote hain? Kab waapis milte hai?", "Aap bata kyu nahi rahe ho ki kya process hai?", "Pehle xx amount kyu dena padega?"], "queriesEn": ["How much does a Wiom connection cost?", "Why is there a booking fee?", "Is the booking fee refundable?", "Why are there two separate charges? Why do I have to pay extra? When do I get it back?", "Why aren't you telling me what the process is?", "Why do I have to pay this amount upfront?"], "resolutionPath": "Step 1: If customer asks the connection cost, 'Wiom ghar ka net shuru karne ke liye shuruaat mein ₹25 tak ka payment karna hota hai. Aapke area aur applicable offer ke hisaab se aage ka payment aur booking process app mein booking ke dauraan dikh jaayega. Net lagne ke baad aap apni zarurat ke hisaab se jitne din chahein, utne din ka recharge karke net chala sakte hain. Kripya app mein dikh rahi jaankaari ko hi sahi maane. (Agar customer security deposit ke baare mein poochta hai) Kuch offers mein NetBox ke liye refundable security deposit bhi shamil hoti hai. Agar security deposit applicable hogi, toh service band karne aur NetBox return karne par woh waapas mil jaati hai.' → Step 2: If customer asks about charges or the security deposit, 'Wiom ek recharge-wala ghar ka net hai. Service shuru karne ke liye pehla recharge karna hota hai. Wiom mein alag-alag offers ho sakte hain. Aapke liye jo offer applicable hai, uske hisaab se refundable security deposit aur baaki payment app mein booking ke dauraan dikh jaayenge. Kripya app mein diye gayi jaankaari ko hi sahi maane. (if customer talks about security deposit) Agar aapke offer mein ₹250 ki refundable security deposit shamil hogi, toh service band karne aur NetBox return karne par woh poori tarah waapas mil jaati hai.' → Step 3: If customer asks why there is a booking fee, 'Booking fee isliye hoti hai kyunki ismein engineer ka home visit confirm hota hai. Agar kisi bhi karan se net nahi lag pata toh yeh waapis ki jaati hai.' → Step 4: If customer asks whether the booking fee is refundable, 'Haan, agar kisi bhi wajah se engineer nahi aa paate hai, toh aapki booking fee refund ho jaata hai.' → Step 5: If app and field communication do not match, 'Wiom ek recharge-wala ghar ka net hai. Service shuru karne ke liye aapko apna pehla recharge karna hota hai aur NetBox ke liye refundable security deposit deni hoti hai Security deposit service band karne aur NetBox return karne par waapas mil jaati hai. Aage ke payment aur set up se judi saari jaankari app mein dikh jaayegi. Kripya app mein diye gayi information ko hi sahi maane - kabhi-kabhi Wiom ke taraf se kuch offers hote hai jo hamaari ground team ko turant pata nahi hote.'", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent", "Booking Fee (If visible to customer)", "SD(If visible to customer)"], "questions": []}, {"subCategory": "Payment Options", "definition": "Customer wants to know which payment methods are accepted for booking or recharge.", "tagEligible": "Customer asks which payment modes (UPI/card/cash) are accepted, or how to pay if they lack a compatible method.", "tagNonEligible": "Customer's payment has failed or been deducted without confirmation (route to Payment Issues).", "callType": "Query", "tat": "On-call Resolution", "fcr": "FCR", "queue": "Sales Team", "ownership": "Sales Team", "callObjective": "1. Acknowledge - Confirm the query on payment methods.\n\n2. List Accepted Methods - UPI and card via the Wiom App.\n\n3. Offer Alternatives - Assisted payment via a family member/shopkeeper's device if the customer has no UPI/card.", "inboundPitch": "Booking Process & Charges", "troubleshoot": "N/A - informational/pre-sales query, no technical troubleshooting required.", "queriesHi": ["Cash de sakte hain?", "Payment kaise karni hai", "UPI accept hota hai?", "Credit card se payment ho jayegi?", "Debit card use kar sakte hain?"], "queriesEn": ["Can I pay in cash?", "How can I make the payment?", "Is UPI accepted?", "Can I make the payment using a credit card?", "Can I use a debit card?"], "resolutionPath": "Step 1: Acknowledge → Step 2: Explain: 'Wiom ka net sirf Wiom App se recharge hota hai, cash ka option nahi hota. Agar aapke paas UPI ya card nahi hai, toh aap kisi dost, parivaar ke member ya paas ki dukaan se Wiom App ka QR scan karva kar recharge kara sakte hain.'", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent"], "questions": []}, {"subCategory": "Speed", "definitio 48 hrs on kapture", "Customer Name", "Customer Registered Mobile"], "questions": []}, {"subCategory": "Wants help to book / interested", "definition": "Customer is ready to book but wants guided, step-by-step help to complete the process confidently.", "tagEligible": "Customer explicitly asks for help completing a booking or expresses clear intent to book but needs hand-holding.", "tagNonEligible": "Customer is only asking general product questions with no stated intent to book yet (route to Product Explanation).", "callType": "Request", "tat": "On-call Resolution", "fcr": "FCR", "queue": "Sales Team", "ownership": "Sales Team", "callObjective": "1. Welcome & Confirm Interest - Acknowledge the customer is ready to proceed.\n\n2. Check Serviceability - Confirm the address is serviceable before charges are discussed.\n\n3. Guide Through Booking - Walk through charges, recharge pricing, and app steps to complete booking.", "inboundPitch": "Booking Interest (Warm Lead)", "troubleshoot": "N/A - guided walkthrough of the app booking flow, no technical troubleshooting required.", "queriesHi": ["Booking mein madad chahiye", "Kya aap book kar sakte hai", "Booking kaisey karey"], "queriesEn": ["I need help with the booking process.", "Can you help me book a connection?", "How can I make a booking?"], "resolutionPath": "Step 1: Welcome the customer and confirm their interest → Step 2: Check serviceability: 'Pehle app mein apna area check karein — agar available hai, booking shuru kar sakte hain' → Step 3: Share charges (if applicable): booking amount +  refundable security deposit at setup → Step 4: Explain recharge: '1 din ₹23 se shuru; 28 din ₹550. App mein saare options available hain' → Step 5: Guide to book: 'Wiom App → Location enter karein → Book karein' → Step 6: Offer assistance: 'Koi bhi sawaal ho toh batayein — sahayta ki jayegi'", "infoRetrieved": ["No CX info  referenced – purely verbal product explanation by agent", "Customer Name", "Customer Registered Mobile"], "questions": []}]}, {"name": "Status/Booking", "rows": [{"subCategory": "Installation Delay", "definition": "Customer's net set-up has not happened within the expected timeline.\nTicket is created ONLY when Connection State on Wiom Hub (Installation Journey → Connection overview) is:\n1. REQUESTED – lead is still circulating among CSPs, no CSP has accepted / one declined and others not responding.\n2. PENDING_INSTALL – CSP accepted the lead but set-up is not completed (slot breached).", "tagEligible": "BOTH conditions must be true:\nCondition 1 – Wiom Hub/Booking Look-up Stage = REQUESTED or PENDING_INSTALL\nCondition 2 – Booking age > 48 hrs and no slot given, OR the slot has passed\n\nScenarios:\n• No CSP has accepted the lead and booking > 48 hrs\n• Slot confirmed but set-up did not happen (slot breach by CSP)\n• Technician confirmed but did not arrive\n• Technician refused to do the set-up (technician comes only after slot is given; capture reason if given)\n• Customer missed the slot (was not at home) and wants a re-visit / reschedule\n• Repeated delays, booking > 48 hrs and no active slot\"", "tagNonEligible": "", "callType": "Complaint", "tat": "24–48 hrs", "fcr": "Non - FCR", "queue": "Booking Queue", "ownership": "Service L2 (Social Media Escalation team – in-house)", "callObjective": "1. Acknowledge & Apologize – Accept the delay, apologize for the inconvenience.\n\n2. Verify – Check booking age, Connection overview stage and slot status on Wiom Hub.\n\n3. Set Expectation – Share re-visit / arrangement timeline; updates will come on the App.\n\n4. Give Choice – If customer does not want to wait, inform they can cancel from App anytime with full booking fee refund.\n\n5. Raise Ticket in Booking Queue & Reassure Ownership.", "inboundPitch": "Status - Booking", "troubleshoot": "1. Check booking date & booking age (hrs) on Wiom Hub.\n2. Check Connection overview stage – Request or Install Pending.\n3. Check slot date/time and whether it is breached.\n4. Check
